lass triptych floats overhead, and Meta leases most of the surrounding building as offices."},{"name":"Morgan Library & Museum","lat":40.749268,"lon":-73.981465,"blurb":"To dodge U.S. import taxes, financier J.P. Morgan kept his fine art in England but stashed his rare books in his New York basement, until by 1900 the hoard outgrew the house and he built this palazzo library, finished in 1906. Its first librarian, Belle da Costa Greene, ran it for more than four decades. Morgan chased trophies like Walter Scott's original manuscript of Guy Mannering; his son opened the collection to the public in 1924, per his father's will."},{"name":"Professional Children's School","lat":40.770384,"lon":-73.98607,"blurb":"Founded in 1914 so that kids working the New York stage, the vaudeville circuit, and touring 'the road' could still get an education, this school still bends its schedule around young performers, offering remote work for students out on tour. Its co-founders started it after realizing child entertainers were shut out of ordinary classrooms. Alumni range across the arts, including fashion designer Vera Wang."},{"name":"Roosevelt Island Tramway","lat":40.759273,"lon":-73.959181,"blurb":"Opened in 1976 as a stopgap until a delayed subway arrived, this was the first commuter aerial tramway in the United States, its Swiss-built cabins hailed as the 'Cadillac of tramways.' It was almost routed to 72nd Street, but wealthy Manhattanites objected, so planners shifted it beside the bridge where, as one official put it, 'no prominent people lived.' Two major breakdowns in the mid-2000s forced a full rebuild in 2010."},{"name":"Madison Square and Madison Square Park","lat":40.742187,"lon":-73.987872,"blurb":"Organized baseball traces here: on a vacant sandlot at 27th and Madison in the 1840s, the Knickerbocker club's Alexander Cartwright urged his players to write down rules for the game. The area later gave the world Theodore Roosevelt, Edith Wharton, and Winston Churchill's mother Jennie Jerome, all born nearby, and lent its name to Madison Square Garden. The Fifth Avenue Hotel here, mocked as 'Eno's Folly,' opened the nation's first passenger elevator."},{"name":"Saint Ann's School (Brooklyn)","lat":40.792663,"lon":-73.939811,"blurb":"At this famously grade-free Brooklyn school, high school juniors and seniors design their own curriculum, and a 2004 Wall Street Journal survey ranked it number one in the country for sending graduates to Ivy League and other elite colleges. It began in 1965 with 63 students in the basement of an Episcopal church. Its mystique reaches far: memoirist Claire Dederer recalled that at Oberlin, 'all the coolest girls' had gone to Saint Ann's and once dated the Beastie Boys."},{"name":"3 World Trade Center","lat":40.710978,"lon":-74.011646,"blurb":"This 1,079-foot tower by British architect Richard Rogers rose on the footprint of the Marriott World Trade Center, the hotel crushed when the Twin Towers fell on 9/11, killing 40 people inside it. Its own construction stalled for years at just a few stories because it lacked an anchor tenant, resuming only after ad giant GroupM signed on in 2014; it opened in 2018. The block was once part of Radio Row, Manhattan's dense strip of electronics shops."},{"name":"Metropolitan Correctional Center","lat":40.713206,"lon":-74.001536,"blurb":"Nicknamed the 'Guantanamo of New York,' this since-closed federal jail held a who's-who of infamy: John Gotti, drug kingpin Frank Lucas, Ponzi schemer Bernie Madoff, Jeffrey Epstein, and Mexican cartel lord El Chapo. Opened in 1975 as the first high-rise federal prison, it was linked to the courthouse by a footbridge. In its notorious 10-South wing, inmates sat in single cells 23 hours a day with the lights never off. It shut in 2021 as the building crumbled."},{"name":"Macy's Herald Square","lat":40.750815,"lon":-73.989168,"blurb":"Macy's white star logo traces back to a red star that founder Rowland Macy tattooed on himself as a teenager working a Nantucket whaling ship. His first four dry-goods stores all flopped, and his New York shop rang up just $11.08 on its opening day in 1858. When a rival bought a small corner lot to block the flagship from claiming 'world's largest store,' Macy's simply built around it, and that stubborn holdout, the 'Million Dollar Corner,' still wears the Macy's sign today."},{"name":"Rao's","lat":40.793923,"lon":-73.934267,"blurb":"This East Harlem red-sauce institution has run since 1896 and is so exclusive the New York Post calls it one of the hardest tables in the city, since regulars essentially 'own' their standing weekly seats. Diners have included John Gotti, Rudy Giuliani, and Robert De Niro. Jay-Z filmed the video for 'D.O.A.' here, Woody Allen based Broadway Danny Rose's Tina Vitale on Mrs. Rao, and a real 2003 shooting inside inspired a Law & Order episode."},{"name":"New York Institute of Technology","lat":40.769838,"lon":-73.982953,"blurb":"NYIT's Computer Graphics Lab, founded in 1974, was regarded as the best animation research group in the world and the launchpad for the people who would build Pixar and Lucasfilm, including Turing Award winner Edwin Catmull, making it the birthplace of fully 3D CGI film. The university's Manhattan home was the former Pythian Temple, and at its 1958 awards gala, keynote speaker Lyndon Johnson shared the bill with honoree Wernher von Braun."},{"name":"Christopher Street","lat":40.734112,"lon":-73.999427,"blurb":"The 1969 riots at the Stonewall Inn here ignited the modern gay rights movement, so completely that pride marches in Berlin, Cologne, and other German cities are still called 'Christopher Street Days.' Technically the oldest street in the West Village, it's named for Charles Christopher Amos. Stonewall became the first NYC site landmarked for its LGBT history in 2015 and the first U.S. national monument to LGBTQ rights in 2016. Writer Anais Nin once worked at a bookshop at number 45."},{"name":"The Spiral","lat":40.75525,"lon":-73.999582,"blurb":"Outdoor gardens climb this Hudson Yards tower in one continuous green ribbon, spiraling up all 66 floors of Bjarke Ingels's 2023 design. It started life as a far taller scheme, the 1,800-foot Hudson Spire, briefly marketed as the tallest building in the Western Hemisphere. To clear the site, developer Tishman Speyer paid two men living in a four-story holdout building $25 million to move out. Tenants now include Pfizer, HSBC, and Debevoise & Plimpton."},{"name":"Ogilvy (agency)","lat":40.76352,"lon":-73.995911,"blurb":"David Ogilvy bought an eyepatch on the way to a photo shoot, creating the iconic 'Man in the Hathaway Shirt' campaign that boosted sales by 160 percent."},{"name":"Knickerbocker Club","lat":40.765883,"lon":-73.971432,"blurb":"Founded in 1871 by Union Club members upset about declining standards, it took three generations of Rockefellers to finally crack this aristocratic citadel."},{"name":"Fashion Institute of Technology","lat":40.747209,"lon":-73.994979,"blurb":"This SUNY fashion college, founded in 1944, started out inside the Central High School of Needle Trades with free tuition, backed by both management and labor from the garment industry. In 1967 its faculty and staff won the first higher-education union contract in New York State. It's the only SUNY community college that grants bachelor's and master's degrees, and Joyce F. Brown served as its first woman and first African American president for over 27 years."},{"name":"IBM Watson","lat":40.730111,"lon":-73.990246,"blurb":"On Jeopardy! in 2011, IBM's Watson famously blurted 'What is Toronto?????' to a clue in the U.S. Cities category, yet still crushed champions Ken Jennings and Brad Rutter for the $1 million prize. Named after IBM founder Thomas J. Watson, it ran on 90 servers with all its data loaded into 16 terabytes of RAM. Its later healthcare venture was a costly flop: built for $4 billion, the Watson Health division was sold off for just $1 billion."},{"name":"Whitney Museum of American Art","lat":40.739633,"lon":-74.008938,"blurb":"Sculptor and socialite Gertrude Vanderbilt Whitney founded this museum in 1930 after the Metropolitan Museum snubbed her gift of some 500 American artworks and MoMA leaned toward European modernism. She had already amassed nearly 700 pieces through her Whitney Studio Club. Today it holds the world's largest trove of Edward Hopper's work. Its first director opened the doors declaring, 'There may be pictures here that you do not like, but they are here to stay.'"},{"name":"Umbertos Clam House","lat":40.718448,"lon":-73.997624,"blurb":"Just two months after this Little Italy clam house opened in 1972, gangster 'Crazy Joe' Gallo was gunned down here during an early-morning snack, hours after celebrating his 43rd birthday at the Copacabana. Bob Dylan immortalized it in 'Joey': 'One day they blew him down / In a clam bar in New York.' The place was secretly owned by mobster Matthew 'Matty the Horse' Ianniello, who dove into the kitchen when the shooting started. Scorsese restaged the hit in The Irishman."},{"name":"Brill Building","lat":40.761128,"lon":-73.984651,"blurb":"By 1962 this 1931 office block held 165 music businesses, a hit factory where a songwriter could write, publish, record, and promote a song without ever leaving the building. Its name comes from Maurice Brill, a haberdasher whose ground-floor store predated his purchase of the whole building. Carole King recalled cramming into cubbyholes with just a piano and bench while Don Kirshner pitted writers against each other to churn out the next smash for acts like Bobby Vee."},{"name":"Rucker Park","lat":40.829198,"lon":-73.936118,"blurb":"Holcombe Rucker, a teacher and playground director, founded New York's first summer basketball tournament here in 1950 to keep kids off the streets. By the 1960s and 70s, NBA royalty like Kareem Abdul-Jabbar and Julius Erving were turning up to test themselves against playground legends; Dr. J is often credited with sharpening his signature moves here and carrying streetball's flash into the pros, and Wilt Chamberlain first played the park in 1957. Reborn in 1982 as the Entertainers Basketball Classic, it drew teams owned by Fat Joe and Jay-Z, and the court was renamed for EBC founder Greg Marius in 2017."},{"name":"Per Se (restaurant)","lat":40.768255,"lon":-73.982852,"blurb":"Thomas Keller's Per Se has held three Michelin stars since New York's first guide in 2006, part of what makes Keller the only American-born chef to hold multiple three-star ratings. The blue door at the entrance is modeled on the one at his Napa flagship, The French Laundry. But this temple of $425 tasting menus took a famous beating in 2016, when Times critic Pete Wells stripped it from four stars to two, calling it 'respectably dull at best' and 'disappointingly flat-footed at worst.'"},{"name":"The San Remo","lat":40.778008,"lon":-73.975152,"blurb":"Emery Roth's 1930 San Remo was the first building on Central Park West to sport twin towers, a 27-story silhouette topped with round colonnaded 'temples' that helped define the skyline. It opened to media fanfare, then almost immediately tumbled into receivership when the Bank of United States, which held its mortgage, collapsed. It limped through financial trouble all through the 1930s before an investment syndicate bought it in 1940, and it converted to a co-op in 1972. Over the years its apartments have drawn directors, actors, and musicians."},{"name":"Collegiate School","lat":40.773732,"lon":-73.990663,"blurb":"This all-boys school claims to be the oldest in America, a title it seized in 1984 after the New-York Historical Society surfaced a 1628 letter from Dutch minister Jonas Michaelius describing his teaching efforts, predating Boston Latin (1635) and Harvard (1636). The claim is contested; a state-funded school on this footing actually opened in 1638 under Adam Roelantsen. Tied to the Dutch Reformed Church, it clung to its Dutch identity for generations, teaching classes exclusively in Dutch until 1773 and fending off a 1705 takeover attempt by the English colonial governor, Lord Cornbury."},{"name":"Le Bernardin","lat":40.761395,"lon":-73.981691,"blurb":"The name comes from a folk song that siblings Gilbert and Maguy Le Coze's father sang them as children, 'Les Moines de St. Bernardin,' about monks who loved life, the good life especially. They opened the original in Paris in 1972 and moved it to New York in 1986. When Gilbert died of a heart attack in 1994, chef Eric Ripert took the helm and became co-owner. The seafood temple has held a four-star New York Times rating since 1986, the only NYC restaurant to keep four stars for over 35 years, on top of three Michelin stars."},{"name":"Tavern on the Green","lat":40.772194,"lon":-73.977565,"blurb":"Central Park's Tavern on the Green sits in the old sheepfold built in 1870 for the flock that grazed neighboring Sheep Meadow, until Parks commissioner Robert Moses evicted the sheep in 1934. Warner LeRoy took over in 1974 and added the glass-enclosed Crystal Room, and by 2007 the place grossed $38 million, the second-highest-grossing independent restaurant in the country. After it went bankrupt in 2009, a judge ruled that the city, not the LeRoys, owned the name, finding Warner LeRoy had trademarked 'Tavern on the Green' fraudulently in 1981."},{"name":"New York Friars Club","lat":40.760793,"lon":-73.972564,"blurb":"At a 1958 Friars Club roast for Lucille Ball and Desi Arnaz, comedian Parkyakarkus (Harry Einstein) collapsed and died of a heart attack onstage, so singer Tony Martin coolly launched into 'There's No Tomorrow' while the body was carried off. The showbiz club, founded in 1904 out of a press agents' group, has deep music roots: Irving Berlin wrote 'Alexander's Ragtime Band' for its 1911 Frolics, and Walter Donaldson knocked out 'My Blue Heaven' one afternoon waiting for a billiard table. Its officers carry monastic titles like Abbot, and Liza Minnelli became its first female member in 1988."},{"name":"ProPublica","lat":40.725366,"lon":-74.004903,"blurb":"In 2010, ProPublica became the first online news source to win a Pulitzer Prize, for Sheri Fink's harrowing 'The Deadly Choices at Memorial,' about the life-and-death decisions exhausted doctors made at a New Orleans hospital cut off by Hurricane Katrina's floodwaters. The nonprofit newsroom was the brainchild of former Golden West Financial chiefs Herbert and Marion Sandler, who pledged $10 million a year and hired ex-Wall Street Journal editor Paul Steiger to run it. It has since collected a string of Pulitzers, partnering with more than 90 news organizations."},{"name":"Kosciuszko Foundation","lat":40.76776,"lon":-73.969082,"blurb":"This Polish-American cultural foundation is named for Tadeusz Kosciuszko, the Polish general who fought in the American Revolution; it was founded in 1925, on the eve of the 150th anniversary of his enlistment in the American cause. Its home is a 1917 limestone neo-Renaissance mansion designed by Harry Allan Jacobs for James J. Van Alen, whose Astor in-laws lived just down the block. The second-story ballroom now doubles as a gallery and recital hall, and the foundation runs an annual Chopin Piano Competition for young talent."},{"name":"Bank of America Tower","lat":40.755558,"lon":-73.984715,"blurb":"Also known as 1 Bryant Park, this 1,200-foot Midtown tower opened in 2009 with a LEED Platinum green-building certification, yet by the early 2020s its heavy energy use had it exceeding the city's own emissions limits. Bank of America wanted the building tied to the park, so it applied for '1 Bryant Park' as a 'vanity address,' since the city does not consider Bryant Park a real street. Developer Douglas Durst spent decades assembling the site, and the tower's base incorporates the landmarked Stephen Sondheim Theatre, originally Henry Miller's Theatre. It cost about $1 billion to build."},{"name":"Federal Reserve Bank of New York","lat":40.708366,"lon":-74.008687,"blurb":"The most powerful of the twelve Federal Reserve Banks, the New York Fed is the custodian of the world's largest gold storage reserve and the only Reserve Bank with a permanent seat on the committee that sets U.S. monetary policy, its president traditionally serving as vice chairman. Its first leader, Benjamin Strong Jr., was so influential that one historian said he 'invented the modern central banker,' quietly abandoning the gold standard in 1922 to pursue open-market operations. Opened in 1914, the bank moved into its Liberty Street home in 1924, designed by contest-winning architects York and Sawyer."},{"name":"The Ansonia","lat":40.780153,"lon":-73.982262,"blurb":"This Beaux-Arts pile on Broadway opened around 1904 with as many as 2,500 rooms, its own power plant, pneumatic tubes, and even a small farm on the roof. Built by the eccentric William Earle Dodge Stokes, who called himself 'architect-in-chief' and demoted his actual French architect to draftsman, it housed a parade of conductors, opera singers, and baseball players. Its basement swimming pool led an especially wild second life: in the late 20th century it became the gay bathhouse Continental Baths and later the notorious swingers' club Plato's Retreat."},{"name":"1211 Avenue of the Americas","lat":40.758672,"lon":-73.982542,"blurb":"Originally the Celanese Building, this 45-story slab is the 'Z' of Rockefeller Center's 1970s 'XYZ Buildings,' a trio whose letters ranked their heights, with the shortest and youngest being this one, finished in 1973. It became the global headquarters of Rupert Murdoch's News Corporation, founded in 1980, and still houses Fox Corporation, the present-day News Corp, The Wall Street Journal, and the New York Post. The main Fox News studios broadcast from here, and its streetside plaza is known as Fox Square."},{"name":"1 Police Plaza","lat":40.7122,"lon":-74.001852,"blurb":"The NYPD's headquarters is a brooding brutalist block shaped like an inverted pyramid, designed by Gruzen and Partners and dedicated in 1973. Inside, the second-floor Real Time Crime Center is essentially a giant police search engine and data warehouse, while the commissioner works from a 13th-floor office known simply as the 'Thirteenth Floor'; a cramped press room called 'the Shack' housed reporters until 2024. Since 2001 the NYPD has kept Park Row, a historic artery to Chinatown, closed to traffic against a truck-bomb threat, infuriating nearby residents who say it chokes the neighborhood."},{"name":"McSorley's Old Ale House","lat":40.728761,"lon":-73.989702,"blurb":"New York's oldest Irish saloon poured 'Good Ale, Raw Onions and No Ladies' as a men-only bar until 1970, when a National Organization for Women lawsuit forced it to serve women; it took another 16 years to install a ladies' room. Nothing has come off the walls since 1910, including a pair of Houdini's handcuffs shackled to the bar rail and a cluster of dusty wishbones hung by young men shipping off to World War I, meant to be taken down on their return, so the ones still hanging belong to those who never came back. It even outlasted Prohibition by serving legal 'near beer.'"},{"name":"740 Eighth Avenue","lat":40.75929,"lon":-73.987714,"blurb":"Rising over Midtown, this 1,067-foot supertall hotel, nicknamed The Torch, will be crowned by a 500-foot spiraling glass structure modeled on the flame of the Statue of Liberty, and includes a 260-foot drop-tower thrill ride and a 360-degree observation deck. Designed by Eran Chen's firm ODA, it stalled in March 2024 amid lawsuits and unpaid bills, with developer Extell reportedly owing a steel company over $2 million, to the relief of neighbors sick of the noise. Construction restarted in June 2025, and the tower has been climbing ever since."},{"name":"Tom's Restaurant","lat":40.805451,"lon":-73.965416,"blurb":"This Morningside Heights diner has two claims to pop-culture fame: its exterior stood in for the fictional Monk's Cafe where Jerry and the gang endlessly convened on 'Seinfeld,' and it inspired Barnard alum Suzanne Vega's 1987 hit 'Tom's Diner.' The interior on the show, though, was a Los Angeles set that looked nothing like the real place, and later episodes cropped the neon sign to show only 'RESTAURANT.' Founded in the 1940s and run for decades by the Greek-American Zoulis family, it drew Columbia students including a young Barack Obama, and Senator John McCain when he visited his daughter."},{"name":"Port Authority Bus Terminal","lat":40.756881,"lon":-73.991708,"blurb":"The world's busiest bus terminal handles about 8,000 buses and 225,000 people on an average weekday, more than 65 million a year. Before it opened in 1950, intercity buses departed from a scatter of terminals tucked into Midtown hotels, like the Dixie Bus Center on the ground floor of the Dixie Hotel. It was built near the mouth of the Lincoln Tunnel after Mayor Fiorello La Guardia tried to ban commuter buses from congested Midtown streets, a plan a state judge blocked as unreasonable. A second wing was added in 1979, and it has been bursting at the seams ever since."},{"name":"South Street Seaport","lat":40.705751,"lon":-74.002906,"blurb":"On February 22, 1784, the Empress of China sailed from this East River wharf to Guangzhou and returned with tea and porcelain, opening trade between the newly independent United States and Qing China. The seaport traces back to a Dutch West India Company pier of 1625, and by the mid-19th century it was the beating heart of the world's busiest port, its slips crowded with clipper ships whose bowsprits reached clear across South Street. It was long home to the Fulton Fish Market, founded in 1822, and today holds the city's largest concentration of restored early-19th-century commercial buildings."},{"name":"The Pierre","lat":40.765079,"lon":-73.971664,"blurb":"The Pierre is named for Charles Pierre Casalasco, a Corsican busboy from his father's restaurant in Ajaccio who worked his way up to become one of New York society's favorite restaurateurs before opening this hotel in 1930. Its top floors mimic Mansart's Royal Chapel at Versailles, and Auguste Escoffier, 'the father of French chefs,' cooked its opening gala. Bankrupt by 1932, it was snapped up by oilman J. Paul Getty for $2.35 million in 1938. In 1972 the Lucchese crime family pulled off the $27 million Pierre Hotel robbery, for a time the Guinness record for the largest, most successful hotel heist in history."},{"name":"Winter Garden Theatre","lat":40.761615,"lon":-73.983423,"blurb":"For 31 years straight, from 1982 to 2013, this Broadway house ran just two shows: first 'Cats,' then 'Mamma Mia!' Fittingly for a theater that hosts stampedes of tourists, it was carved out of the old American Horse Exchange, a thoroughbred marketplace built by William K. Vanderbilt whose earlier building burned down in 1896, killing nearly a hundred horses. The Shubert brothers leased the structure and opened it as a theater in 1911; it even moonlighted as a Warner Bros. movie house from 1928 to 1933. Today its 1,600 seats make it a favorite for big musicals."},{"name":"Central Synagogue","lat":40.759586,"lon":-73.970566,"blurb":"One of the oldest synagogues in continuous use in the country, Central's dramatic Moorish Revival sanctuary, brownstone with octagonal towers and a geometric rose window, was designed by Henry Fernbach and completed in 1872. A devastating fire tore through it in 1998, and it was painstakingly rebuilt over the next three years. The Reform congregation was formed in 1898 by merging two older synagogues founded by German and Bohemian Jewish immigrants on the Lower East Side. Since 2014 it has been led by Angela Buchdahl, a widely followed senior rabbi."},{"name":"NoHo","lat":40.725875,"lon":-73.993957,"blurb":"Short for 'North of Houston,' NoHo was once so fashionable that John Jacob Astor built an upper-class enclave here in the 1820s on the site of the old Vauxhall Gardens pleasure resort, with the Marquis de Lafayette christening Lafayette Street in 1825. Astor and Vanderbilt mansions lined the blocks, and authors Washington Irving, Charles Dickens, and William Makepeace Thackeray all stayed in the neighborhood. After manufacturers fled the city following World War II, artists moved into the cast-iron loft buildings, among them Robert Mapplethorpe, Chuck Close, Jean-Michel Basquiat, and Andy Warhol, and the name NoHo caught on to echo nearby SoHo."},{"name":"One57","lat":40.76554,"lon":-73.979042,"blurb":"The tower that kicked off Manhattan's 'Billionaires' Row,' One57 wraps a Park Hyatt hotel beneath 92 condos behind a facade of blue glass that its architect, Christian de Portzamparc, likened to a Gustav Klimt painting. Toward the end of construction in 2012, its crane snapped and dangled precariously over West 57th Street, forcing evacuations of nearby buildings. On completion in 2014 it set city records with apartments selling for $100.5 million and $91.5 million, the priciest homes in New York at the time, though luxury prices sagged later in the decade."},{"name":"Lenox Hill Hospital","lat":40.773642,"lon":-73.960862,"blurb":"Lenox Hill began in 1857 as the German Dispensary, founded to give medical advice 'in their own tongue' to New York's German-speaking immigrants; among its founders was Abraham Jacobi, often called the father of American pediatrics. Known as the German Hospital until 1918, it dropped the name to distance itself from America's World War I enemy, when reportedly about 95 percent of its staff still spoke German. In December 1931, Winston Churchill was treated here after being struck by a car on Fifth Avenue, having looked the wrong way, right instead of left, before stepping off the curb."},{"name":"Solow Building","lat":40.763835,"lon":-73.974953,"blurb":"Sheldon Solow's 1974 tower at 9 West 57th Street, marked by a giant red sculpture of the digit '9' out front, has north and south walls of gray glass that curve inward from the street up to the 18th floor before rising straight to the top, making it 64 feet narrower up there than at ground level. Designed by Gordon Bunshaft of SOM, it was the first major New York building with a sloped facade; the initial, rejected version of that design was recycled into the near-identical W.R. Grace Building. Solow, who named the building after himself, ran it until his 2020 death and was famously combative, tangling with tenants in lawsuit after lawsuit."},{"name":"Friends Seminary","lat":40.734031,"lon":-73.985294,"blurb":"Founded in 1786 through a $10,000 bequest from wealthy merchant Robert Murray, Friends Seminary is the oldest continuously coeducational school in New York City, still rooted in the Quaker values of the Religious Society of Friends. It was an early adopter of progressive education, among the first schools to open a kindergarten (1878) and the first private co-ed school to hire a full-time psychologist (1925). Its alumni include filmmaker Lena Dunham, chef Wylie Dufresne, and writer Caleb Carr. In 2024 it unveiled a James Turrell 'Skyspace,' the first attached to a K-12 school."},{"name":"Nederlander Theatre","lat":40.755497,"lon":-73.988302,"blurb":"Broadway's southernmost theater has worn many names since opening in 1921 as the National, including the Billy Rose and the Trafalgar, before being christened in 1980 for impresario David T. Nederlander. Its relative isolation kept it underused until 'Rent' arrived in 1996 and became its longest-running production, during which the facade was covered in fake graffiti. It has also hosted plays like 'Who's Afraid of Virginia Woolf?' and live performances by Lena Horne. One quirk: with no dedicated stage door, every performer enters through the main lobby."},{"name":"Helmsley Building","lat":40.754394,"lon":-73.976103,"blurb":"Cars actually drive through this building: the golden-topped 1929 tower straddles the Park Avenue Viaduct, with traffic ramping through two portals in its base as it skirts Grand Central Terminal. Built as the New York Central Building, it was the last major piece of 'Terminal City,' the complex raised over the terminal's buried rail yards, in ornate Beaux-Arts style by Warren and Wetmore. A 9-foot clock crowns the base, flanked by figures of Mercury and Ceres, and the pyramidal roof wears an ornate cupola. It is so grand it has its own ZIP code, 10169, and took the Helmsley name in 1978."},{"name":"NYU Langone Health","lat":40.742034,"lon":-73.973676,"blurb":"NYU Langone traces to the Medical College of New York University, founded in 1841; its original faculty included the renowned surgeon Valentine Mott and John Revere, youngest son of the patriot Paul Revere. In 1898 it consolidated with Bellevue Hospital Medical College, beginning a long tie to Bellevue, America's oldest public hospital, founded in 1736. The system made national headlines in 2018 when NYU Grossman School of Medicine became the first top-ranked U.S. medical school to offer full-tuition scholarships to every student; it had launched a three-year MD track back in 2013."},{"name":"Firehouse, Hook & Ladder Company 8","lat":40.719557,"lon":-74.006619,"blurb":"This working Tribeca firehouse is world-famous as the Ghostbusters' headquarters, picked for the 1984 film reportedly because writer-actor Dan Aykroyd knew the area and liked the building, though the interiors were shot in Los Angeles. Built in 1903 in Beaux-Arts style, it was literally cut in half in 1913 when Varick Street was widened. Its firefighters were among the first responders on 9/11, and when the city moved to close the company in 2011, a public campaign backed by actor and former FDNY firefighter Steve Buscemi saved it. A full-size Ghostbusters sign now hangs over the door year-round."},{"name":"New York Supreme Court","lat":40.714275,"lon":-74.001569,"blurb":"New York is the only state where the 'Supreme Court' is not the top court but a trial court; the actual court of last resort is the Court of Appeals. It is a quirk of history: the colonial 'Supreme Court of Judicature' was established by a 1691 statute giving it the same powers as England's Courts of King's Bench, Common Pleas, and Exchequer, and the name simply stuck. A branch of the court sits in each of the state's 62 counties, treated as 'a single great tribunal of general state-wide jurisdiction.' Its Appellate Division serves as the highest intermediate appellate court."},{"name":"Gagosian Gallery","lat":40.749442,"lon":-74.005944,"blurb":"Larry Gagosian's mega-gallery grew so dominant that in May 2011 alone, half of all works for evening sale at New York's major auction houses were by artists it represented, on estimated annual sales near $1 billion. Gagosian opened his first space in LA in 1980 showing a young Jean-Michel Basquiat, and in 1996 mounted the first American exhibition of Damien Hirst's animals suspended in formaldehyde tanks. The Madison Avenue flagship had once been Sotheby's Parke-Bernet."},{"name":"Central Park Zoo","lat":40.767702,"lon":-73.971699,"blurb":"The menagerie that became this zoo opened in 1864 as the first public zoo in New York. Robert Moses rebuilt it with WPA labor into a proper city zoo in 1934, and after a $35 million overhaul it reopened in 1988 with the old cages swapped for naturalistic habitats housing snow leopards, grizzlies and king penguins. Its Intelligence Garden takes its name from a rare-animal menagerie created by China's King Wen of Zhou around 1100 B.C."},{"name":"Million Dollar Corner","lat":40.750136,"lon":-73.988157,"blurb":"On December 6, 1911, this little five-story holdout sold for a record $1 million (about $34.6 million today) in a scheme to keep Macy's from becoming the world's largest store. The buyer, thought to be acting for rival Siegel-Cooper, was outmaneuvered: Macy's simply built its Herald Square colossus around the plot, then leased its face for the giant 'shopping bag' billboard proclaiming the 'world's largest store.' In 2021 Macy's sued to keep a suspected Amazon sign off it; the billboard came down in 2026."},{"name":"Comedy Cellar","lat":40.730194,"lon":-74.000565,"blurb":"Dubbed the 'Harvard of comedy clubs,' it gave early stage time to Dave Chappelle, Louis C.K., Amy Schumer, and Jon Stewart."},{"name":"American Radiator Building","lat":40.752833,"lon":-73.983941,"blurb":"Raymond Hood clad this 1924 tower in black brick with gold-tinted pinnacles so it would evoke a glowing lump of coal for the American Radiator Company. Critics hailed it as the first true Art Deco skyscraper silhouette, its massing borrowed from Eliel Saarinen's losing entry for Chicago's Tribune Tower. It now houses the Bryant Park Hotel, while its annex, once the Katharine Gibbs secretarial school, became CUNY's Guttman Community College."},{"name":"Chapin School","lat":40.773899,"lon":-73.945842,"blurb":"This all-girls Upper East Side school opened in 1901 as 'Miss Chapin's School for Girls and Kindergarten for Boys and Girls'; the last boys left in 1917. Its commencement has gone unchanged for a century: students stand together in white dresses, no academic awards are given, and there has never been a Chapin valedictorian. Since 1912 girls join green or gold teams in fourth grade, often the same team their mother or grandmother once competed on."},{"name":"660 Fifth Avenue","lat":40.760371,"lon":-73.976724,"blurb":"When it opened in 1957 as the Tishman Building, a giant red neon '666' glowed from its top, visible across the city, above an aluminum curtain wall embossed to resemble medieval armor and a lobby waterfall by sculptor Isamu Noguchi. The site had held William K. Vanderbilt mansions. Jared Kushner's family bought it as 666 Fifth in 2007 and nearly went under financing it; a gut renovation finished in 2022 renumbered the tower 660."},{"name":"Belvedere Castle","lat":40.779322,"lon":-73.968893,"blurb":"This Gothic-Romanesque folly, designed by Calvert Vaux and Jacob Wrey Mould in 1867, has housed Central Park's official weather station since 1919, making it the source of the city's benchmark temperatures. Its name is Italian for 'beautiful view,' fitting since it caps Vista Rock, a 130-foot schist outcrop that is the park's second-highest point. Built of Manhattan schist quarried in the park itself, it now serves as a visitor center."},{"name":"56 Leonard Street","lat":40.717656,"lon":-74.006259,"blurb":"Nicknamed the 'Jenga Building' for its stack of cantilevered glass boxes, this 2017 Tribeca tower was designed by Herzog & de Meuron, who called it 'houses stacked in the sky.' A mirror-polished Anish Kapoor sculpture, cousin to his Chicago 'Cloud Gate' bean, sits at its base. In September 2022 Gustavo Arnal, chief financial officer of the collapsing Bed Bath & Beyond, jumped to his death from his 18th-floor apartment. A penthouse here once sold for $47 million."},{"name":"Hearst Tower","lat":40.766574,"lon":-73.983635,"blurb":"William Randolph Hearst built this six-story Art Deco base in 1928 as the pedestal for a tower he never got to raise, the sole survivor of a grand entertainment complex he envisioned for Columbus Circle before the Depression killed it. The tower finally arrived nearly 80 years later, in 2006, when Norman Foster crowned the old base with a triangulated glass 'diagrid' that doubles as the structure's frame. It is a certified green building."},{"name":"262 Fifth Avenue","lat":40.745273,"lon":-73.98725,"blurb":"This needle-thin residential tower rises 860 feet on a footprint barely 45 feet wide, a roughly 19-to-1 ratio that makes it a true 'pencil tower.' It is the first US building by Russian firm Meganom. Critic Christopher Bonanos of Curbed joked that its consulting architect must have been the Eberhard Faber pencil company. Neighbors were furious that it blots out the Empire State Building from Madison Square Park, long a favorite tourist vantage point."},{"name":"John Jay College of Criminal Justice","lat":40.770705,"lon":-73.989257,"blurb":"The only US liberal-arts college built around criminal justice, John Jay is named for the first chief justice of the Supreme Court. In 1970 Professor Abe Blumberg criticized the FBI and J. Edgar Hoover in a graduate class; a student who was himself an FBI agent, Jack Shaw, wrote a thesis conceding some points, and when it reached Hoover he forced Shaw to resign and barred agents from enrolling while the tenured Blumberg stayed. Agents only returned after Hoover died in 1972."},{"name":"Hunter College High School","lat":40.785923,"lon":-73.954143,"blurb":"For its first 105 years this ultra-selective magnet was all-girls, officially 'Hunter College High School for Intellectually Gifted Young Ladies.' It began admitting boys in 1974 after a lawsuit, prompting the Daily News headline 'Girlie High Gets 1st Freshboys.' Students, called Hunterites, are said to represent the top one-quarter of one percent of New York City test-takers. Its windowless, armory-inspired building has earned the nickname 'The Brick Prison.'"},{"name":"New York Life Building","lat":40.742747,"lon":-73.985582,"blurb":"Cass Gilbert, architect of the Woolworth Building, gave New York Life this Gothic-crowned tower in 1928, its six-story gilded pyramidal roof making it unmistakable on the skyline; he said he drew on England's Salisbury Cathedral. Fittingly for a spot with a sporting past, it rose on the exact site of the old Madison Square Garden. It was the last great insurance-company 'home office' built in New York and Gilbert's final major Manhattan skyscraper."},{"name":"Carlyle Hotel","lat":40.774387,"lon":-73.96299,"blurb":"Opened in 1930 and named for Scottish author Thomas Carlyle, this Art Deco apartment hotel became a discreet haunt of celebrities, politicians and royalty. Its Cafe Carlyle showcased pianist Bobby Short for decades, and the corner of 76th and Madison is co-named Bobby Short Way in his honor; Bemelmans Bar opened in 1947. Builder Moses Ginsberg, grandfather of novelist Rona Jaffe, lost the hotel to foreclosure within two years of its opening."},{"name":"520 Fifth Avenue","lat":40.754482,"lon":-73.980624,"blurb":"This Midtown supertall rises on ground with a grim past: it was the site of the Colored Orphans Asylum, which a white mob burned down during the 1863 Draft Riots. For decades afterward the plot held three modest buildings, including an office for the Spanish airline Iberia. After a string of developers failed to build here, Mickey Rabina finally broke ground, and apartments began selling in 2024 from $1.7 million."},{"name":"92nd Street Y","lat":40.783044,"lon":-73.952766,"blurb":"Founded in 1874 as the Young Men's Hebrew Association, a secular Jewish social club, the Y was transformed by director William Kolodney, who argued the arts were central to Jewish learning and opened its acoustically superb concert hall to nonmembers, putting it on the map as a performing-arts venue. Poet Emma Lazarus once taught English to immigrants at its downtown branch, and executive Henry Timms launched GivingTuesday here."},{"name":"CBS Building","lat":40.761253,"lon":-73.978782,"blurb":"Nicknamed 'Black Rock' for its dark gray granite, this 1964 tower is the only skyscraper Eero Saarinen ever designed; he called it his 'simplest skyscraper statement in New York' but died in 1961 before it was built. Angled granite piers make it read as a single continuous slab. It served as CBS's headquarters and, until the early 1990s, the home of CBS Records, later Sony Music. Its reinforced-concrete superstructure was unusual for a tower of its height."},{"name":"Al Hirschfeld Theatre","lat":40.759253,"lon":-73.989201,"blurb":"Opened in 1924 as the Martin Beck Theatre, this was the only Broadway house designed in a lavish Byzantine and Moorish style, and famously the only one its builder owned outright, without a mortgage. It is also the westernmost Broadway theater, the sole one west of Eighth Avenue. In 2003 it was renamed for beloved caricaturist Al Hirschfeld. Long runs here have included Into the Woods and Kinky Boots."},{"name":"Temple of Dendur","lat":40.780447,"lon":-73.962644,"blurb":"Emperor Augustus had this sandstone temple to the goddess Isis built in Nubia around 15 BCE. When the Aswan High Dam threatened to drown it, Egypt gave it to the United States in 1965 to thank the country for helping rescue Nubian monuments. Cities competed fiercely to house it in a contest the press dubbed the 'Dendur Derby'; President Johnson awarded it to the Met in 1967. It arrived in New York as 661 crated blocks weighing 640 tons."},{"name":"One Liberty Plaza","lat":40.709737,"lon":-74.010857,"blurb":"This black steel slab rose in 1973 on the graves of two lost giants, the Singer Building, the world's tallest from 1908 to 1909, and the City Investing Building, both demolished to clear the block. Each of its floors offers almost a full acre of office space. After the nearby World Trade Center collapsed on 9/11, a rumor spread that One Liberty Plaza was about to fall too, which the city repeatedly denied; the building was structurally sound."},{"name":"Bleecker Street","lat":40.727508,"lon":-73.997832,"blurb":"Named for banker Anthony Lispenard Bleecker, through whose family farm it once ran, this Greenwich Village strip became a temple of nightlife, home to The Bitter End, the Village Gate and Cafe Au Go Go. John Belushi lived at 376 Bleecker in 1975. At number 58, a house built in 1823 for FDR's great-grandfather, Elizabeth Blackwell, America's first female physician, opened a clinic with her sister. John's of Bleecker Street has slung coal-fired pizza since 1929."},{"name":"Congregation Rodeph Sholom","lat":40.783898,"lon":-73.971496,"blurb":"Founded in 1842 by German-Jewish immigrants, this Upper West Side congregation is among the oldest synagogues in the United States, and in 1970 it opened the first Reform movement Jewish day school in the country. Its member rolls have included comedian Jerry Seinfeld, sex therapist Dr. Ruth Westheimer, and Joshua Lionel Cowen, the inventor who co-founded the Lionel model-train company."},{"name":"Beacon Theatre","lat":40.78049,"lon":-73.981131,"blurb":"Opened in 1929 as a movie palace, the Beacon was built as a shrunken version of the lavish Roxy Theatre by the same showman, Samuel 'Roxy' Rothafel, and one critic called its exotic interior 'a true bit of Bagdad on Broadway.' The Allman Brothers Band made it a second home, playing a near-annual residency and closing out their career here on October 28, 2014, after 238 concerts. Its orchestra pit still holds a Wurlitzer organ."},{"name":"Lyceum Theatre (Broadway)","lat":40.757883,"lon":-73.984494,"blurb":"Opened in 1903, the Lyceum is the oldest continuously operating legitimate theater in New York City, built in Beaux-Arts style for impresario Daniel Frohman. Frohman kept an apartment above the lobby, with a peephole through which he could reportedly watch the stage; it now houses the Shubert Archives. After he lost the theater to foreclosure in the Depression, a syndicate of George S. Kaufman, Max Gordon and Moss Hart bought it in 1940. Six carved stone faces of comedy and tragedy peer down from its facade."},{"name":"Morris–Jumel Mansion","lat":40.834468,"lon":-73.93858,"blurb":"Built in 1765 by British officer Roger Morris, this is the oldest surviving house in Manhattan. For one month in the fall of 1776 George Washington used it as his Revolutionary War headquarters, after which British and Hessian officers moved in until 1783; it even did a stint as a tavern. Perched atop Coogan's Bluff, it once looked down on the Polo Grounds ballfield, and the Jumel family boasted they could see seven counties from its windows."},{"name":"Andrew Carnegie Mansion","lat":40.784289,"lon":-73.957761,"blurb":"Steel magnate Andrew Carnegie moved into this 64-room Georgian Revival mansion in 1902, splitting his year between here and Skibo Castle in Scotland. He packed it with early technology: a steel frame, elevators, and its own heating and cooling systems. Carnegie's decision to build so far up Fifth Avenue drew other tycoons uptown and gave the neighborhood its name, Carnegie Hill, though he preferred to call it 'the Highlands of Fifth Avenue.' Since 1976 it has housed the Cooper-Hewitt design museum."},{"name":"Equitable Building","lat":40.708225,"lon":-74.010514,"blurb":"Completed in 1915 as the largest office building in the world by floor area, the Equitable Building rose straight up with no setbacks, casting a shadow so vast over the surrounding streets that it helped provoke New York's first zoning law, the 1916 Zoning Resolution that reshaped every skyscraper built afterward. Viewed from above it forms a giant letter H. It replaced an earlier Equitable headquarters that burned down in 1912."},{"name":"Audubon Ballroom","lat":40.839236,"lon":-73.940621,"blurb":"Malcolm X was assassinated here on February 21, 1965, mid-speech at a meeting of his Organization of Afro-American Unity. The 1912 theater was built by film producer William Fox, later of Fox Film Corporation, and designed by prolific movie-palace architect Thomas W. Lamb, who slyly worked brown foxes into the terra-cotta facade to flatter his patron, crowned by a 3-D statue of Neptune. Most of it was demolished in 1992, but two-thirds of the facade survives; a Malcolm X memorial opened in the lobby in 2005."},{"name":"Museum of Sex","lat":40.744037,"lon":-73.987358,"blurb":"Before it even opened in 2002, the Catholic League's William Donohue branded it a 'museum of smut,' and New York's Board of Regents denied it non-profit status, sniffing that a sex museum made 'a mockery' of the concept. Founder Daniel Gluck pressed on, refusing pornography-industry money. Since opening it has drawn no religious protest and even hosted 'Faith in Latex,' an interfaith event uniting Catholic, Pentecostal, Episcopalian, Buddhist, and Jewish leaders. Unlike adult venues, the city let it sit within 500 feet of a church or school."},{"name":"Castle Clinton","lat":40.703461,"lon":-74.016771,"blurb":"More than 7.5 million immigrants passed through this circular sandstone fort between 1855 and 1890, decades before Ellis Island existed. Built 1808-1811 as the West Battery on an artificial island, it bristled with 28 cannons but never fired a shot in war. It reinvented itself endlessly: a 6,000-seat entertainment hall called Castle Garden (where 6,000 people feted General Lafayette in 1824), then the first New York Aquarium from 1896 to 1941. Robert Moses tried to demolish it for the Brooklyn-Battery Tunnel in the 1940s."},{"name":"Wollman Rink","lat":40.767742,"lon":-73.97447,"blurb":"Donald Trump loved to boast that he rescued this Central Park rink, finishing a botched 1986 rebuild in four months, two months early and $750,000 under budget. But the city had already sunk $12.9 million and six bungled years into it, and Parks official Adrian Benepe noted the work was largely done and the city, not Trump, paid the contractors; a 2007 audit found Trump had underreported rink revenue by $106,608. It was originally funded in 1949 by Kate Wollman, great-aunt of the founders of H&R Block."},{"name":"One Worldwide Plaza","lat":40.762235,"lon":-73.98695,"blurb":"This 778-foot tower with its copper pyramid roof rises on the footprint of New York's third Madison Square Garden, demolished in 1968 in a neighborhood the Times once called 'best known for pornography and cheap bars.' David Childs of SOM designed it as anchor for a full-block complex whose original tenants were ad giant Ogilvy & Mather and law firm Cravath, Swaine & Moore. Its materials were a global shopping trip: structural steel from Luxembourg, granite from Brazil, marble from Italy."},{"name":"Broadway Theatre (53rd Street)","lat":40.763403,"lon":-73.983374,"blurb":"One of the very few Broadway houses that actually sit on Broadway, it opened on Christmas Day 1924 not as a playhouse but as B.S. Moss's Colony Theatre, a movie palace leased to Universal Pictures. Reborn for live shows in 1930 and bought by the Shubert family in 1940, it went on to host the long-running blockbusters Evita, Les Miserables, and Miss Saigon. A 1990 office tower now cantilevers directly over the auditorium on massive trusses."},{"name":"Koreatown","lat":40.747642,"lon":-73.986516,"blurb":"This dense strip of 32nd Street, nicknamed Korea Way, is known as the 'Korean Times Square,' with Hangul signage everywhere and restaurants, karaoke bars, and spas stacked several stories high. It grew from almost nothing: in the 1980s a single Korean bookstore and a handful of restaurants opened in the old Garment District, and their success pulled in banks, businesses, and a wave of immigration. Some restaurants now run 24/7 to keep up, and the world's largest Korean Pride Festival launched here in October 2022."},{"name":"Asia Society","lat":40.769838,"lon":-73.964291,"blurb":"Founded in 1956 by John D. Rockefeller 3rd, who later donated 300 objects of Asian art worth up to $15 million, this Park Avenue institution has more recently been described as a participant in the Chinese Communist Party's diplomatic 'backchannel.' Its red-granite headquarters was designed by Edward Larrabee Barnes, with a semicircular window and varied stone finishes meant to evoke Asian cultures. Its leadership reads like a diplomatic roster: former Australian prime minister Kevin Rudd returned as its CEO in 2026."},{"name":"Vivian Beaumont Theater","lat":40.773677,"lon":-73.984802,"blurb":"The only Broadway theater outside the Times Square district, this Lincoln Center house was one of the last buildings designed by modernist master Eero Saarinen, who died before it opened in 1965. Its bold flexible stage, extendable with a thrust of varying length, backfired: early audiences complained bitterly about the sightlines and acoustics. It is named for heiress and actress Vivian Beaumont Allen, who gave $3 million toward it in 1958 but died before it was finished, and it shares its building with the performing-arts library."},{"name":"Sardi's","lat":40.757762,"lon":-73.987611,"blurb":"The walls of this 1927 theater-district institution hold over a thousand caricatures of Broadway stars, a gimmick that began when founder Vincent Sardi Sr. hired penniless Russian refugee Alex Gard to draw them in exchange for free meals. It became the definitive spot for opening-night parties and pre- and post-show suppers, and the idea for the Tony Award was hatched right here. Founded by Sardi and his wife Jenny Pallera after the Shuberts lured them to a new building down the block, it was sold to the Shubert Organization in 2026."},{"name":"Lotte New York Palace Hotel","lat":40.757987,"lon":-73.974918,"blurb":"Tucked beneath the grand staircase is a bar called Trouble's Trust, named for the trust fund left to the dog of hotel magnate Harry Helmsley's wife, Leona. The hotel wraps around the Villard Houses, an 1880s McKim, Mead & White landmark, behind a 51-story tower that opened as the Helmsley Palace in 1981. Its owners have been a globe-trotting cast: after Helmsley came bankruptcy, then the Sultan of Brunei, and finally Korea's Lotte, which renamed it in 2015."},{"name":"Weill Cornell Medicine","lat":40.764752,"lon":-73.954912,"blurb":"In 2019 a $160 million gift from the Starr Foundation made attendance free for every Weill Cornell student who qualifies for financial aid, wiping out tuition debt for much of the class. Cornell planted its medical school in Manhattan in 1898 because Ithaca was deemed too small for real clinical training, backed by an endowment from Col. Oliver H. Payne. A 1927 gift from William Payne Whitney built its renowned Payne Whitney Psychiatric Clinic, and in 2001 it opened a full branch campus in Qatar."},{"name":"Mulberry Street","lat":40.714209,"lon":-73.999576,"blurb":"The heart of Little Italy was once known as 'Slaughter-house Street,' after Nicholas Bayard's slaughterhouse that stood at Mulberry and Bayard until 1784. Its sharp 'Bend' was laid out to skirt the wetlands around the old Collect Pond, and Mulberry Bend formed part of the notorious Five Points slum, the intersection that gave the neighborhood its name. Today the street runs from Italian restaurants and bakeries in the north straight down into Chinatown, where its east side is lined with funeral homes."},{"name":"General Motors Building","lat":40.763539,"lon":-73.972251,"blurb":"This 50-story tower of white Georgia marble rose in 1968 on the site of the demolished Savoy-Plaza Hotel, and critics like Ada Louise Huxtable and Paul Goldberger promptly panned it. Its ground-floor lobby has cycled through icons of retail, from a GM car showroom to an FAO Schwarz, and its once-sunken Fifth Avenue plaza is now home to Apple's glass-cube entrance. In 2008 it sold for a staggering $2.8 billion to a venture including SoHo China's Zhang Xin, years after Donald Trump had co-owned it."},{"name":"David H. Koch Theater","lat":40.771792,"lon":-73.983768,"blurb":"In 1966 Irving Berlin personally revised his classic Annie Get Your Gun here for its original star, Ethel Merman, during a run of lavish Broadway revivals staged by a company Richard Rodgers headed. Built with state money for the 1964 World's Fair and designed by Philip Johnson and John Burgee, it opened in 1964 as the New York State Theater, home to the New York City Ballet ever since and to the City Opera until 2011. It took its current name after David Koch pledged $100 million toward it in 2008."},{"name":"Russ & Daughters","lat":40.722583,"lon":-73.988192,"blurb":"Founder Joel Russ, a Polish Jewish immigrant, got his start around 1905 hauling Polish mushrooms on his shoulders, then a pushcart, before opening this appetizing shop in 1914. In 1933 he made daughters Hattie, Anne, and Ida partners and renamed it 'Russ & Daughters,' a twist on the usual 'and Sons' since he had no boys. He was no feminist, though; as he put it, it was a matter of parnosa, of making a living, and the girls had gutted herring from the pickle barrels since age eight. It has stood at 179 East Houston since 1920."},{"name":"St. Patrick's Old Cathedral","lat":40.723587,"lon":-73.995193,"blurb":"Jacqueline Kennedy Onassis was baptized and confirmed in this church and returned for her funeral on May 23, 1994; JFK and Jackie were parishioners, and Grace Kelly worshipped here too. Built on farmland and a cemetery between 1809 and 1815 by Joseph-Francois Mangin, co-designer of City Hall, it served as the archdiocese's cathedral until Midtown's St. Patrick's opened in 1879. Pope Benedict XVI declared it a minor basilica on St. Patrick's Day 2010, and Logan Roy's funeral in Succession was filmed here in 2023."},{"name":"Gershwin Theatre","lat":40.762329,"lon":-73.985229,"blurb":"Broadway's biggest house, with roughly 1,933 seats, opened in 1972 as the Uris and promptly flopped with its first show, the ill-fated Via Galactica. Equipped with a computerized Hydra-Float rigging system, it was renamed in 1983 for brothers George and Ira Gershwin and has been the home of Wicked since 2003. Its lobby holds the American Theater Hall of Fame, inscribed with the names of over 500 theatrical greats."},{"name":"The Belnord","lat":40.78833,"lon":-73.975453,"blurb":"When it opened in October 1909, this full-block Italian Renaissance Revival pile was hailed as the largest apartment building in the United States, its 175 Louis XVI-style apartments wrapped around a garden courtyard reached through grand arches, with horse stables in the basement. Its glory faded, and from the 1970s to the 1990s tenants waged war on owner Lillian Seril, many withholding rent for years over the building's decay. Robert A.M. Stern oversaw its 2010s conversion to luxury condos."},{"name":"Houston Street","lat":40.719327,"lon":-73.977,"blurb":"Despite the spelling, New Yorkers say 'HOW-stun,' because the street honors William Houstoun, a Georgia delegate to the Continental Congress, and not Sam Houston of Texas fame. It was christened by Nicholas Bayard, whose daughter Mary married Houstoun in 1788 and whose family owned the land. The street carries real weight in the city's geometry: Manhattan's numbered grid, born of the 1811 Commissioners' Plan, begins immediately to its north with 1st Street at Avenue A."},{"name":"Church of St. Ignatius Loyola","lat":40.778953,"lon":-73.958955,"blurb":"Jacqueline Kennedy Onassis was baptized and confirmed in this Jesuit church and returned for her funeral in 1994; JFK and Jackie were parishioners, Grace Kelly worshipped here, and Aaliyah's funeral was held here in 2001. Founded in 1851 as St. Lawrence O'Toole's, it changed its patron to St. Ignatius of Loyola in 1898. The complex anchors elite schooling, including the all-scholarship Regis High School, and its confessional appeared in Gossip Girl while Logan Roy's Succession funeral was filmed on-site in 2023."},{"name":"Crack Is Wack","lat":40.804735,"lon":-73.931839,"blurb":"Keith Haring painted this bold anti-drug mural in 1986 without any permission at all, on the wall of an abandoned handball court at 2nd Avenue and East 128th Street, and was promptly arrested for vandalism. He made it in honor of his studio assistant and friend Benny, whose crack addiction Haring had tried and failed to help him beat. Haring, who called crack 'a businessman's drug' that made users aggressive and broke, created it amid a national epidemic that swelled to some 5.8 million regular users by 1989."},{"name":"New York Yacht Club","lat":40.755578,"lon":-73.98156,"blurb":"This club held the America's Cup from 1851 to 1983, a 132-year grip that stands as the longest winning streak in the history of all sports, defending the trophy 24 times in a row before finally losing to Australia II of the Royal Perth Yacht Club. Founded in 1844 by nine prominent sportsmen, it remains invitation-only, with roughly 3,000 members. Its landmark clubhouse on West 44th Street is famous for limestone windows carved to look like the sterns of galleons."},{"name":"Strand Bookstore","lat":40.73328,"lon":-73.99094,"blurb":"Lithuanian immigrant Benjamin Bass founded the Strand in 1927 with just $300 of his own savings and $300 borrowed, naming it for a London street and sleeping on a cot in the shop early on. It survived the Depression partly thanks to his landlord, the last of the storied Stuyvesant family, who carried the store through lean years when Bass couldn't make rent. Its slogan boasts '18 Miles of Books,' though it now claims to hold 23, and its clerks have included Patti Smith and Tom Verlaine."},{"name":"7 Hudson Square","lat":40.726146,"lon":-74.006621,"blurb":"This 2024 terracotta tower is Disney's East Coast headquarters, and its vanity address is an inside joke: '7' salutes flagship station WABC-TV, which broadcasts on channel 7. It's also officially the Robert A. Iger Building, honoring the Disney CEO. Disney signed a 99-year, $650 million lease on land owned by Trinity Church, and one by one its shows moved in, from The View to Good Morning America, alongside studios for ABC News and ESPN."},{"name":"Jacqueline Kennedy Onassis Reservoir","lat":40.78548,"lon":-73.962078,"blurb":"This 106-acre Central Park reservoir, holding over a billion gallons, was renamed in 1994 for Jacqueline Kennedy Onassis, who loved to jog its path. Completed in 1862 as a working part of the Croton water system, it was decommissioned in 1993 and now serves purely for recreation and scenery. Central Park itself was partly shaped around water: the board president of the Croton Aqueduct pushed for the park so its earlier receiving reservoir, now the site of the Great Lawn, would sit at the geographic center."},{"name":"Joe's Pizza","lat":40.730547,"lon":-74.002063,"blurb":"In Spider-Man 2, Peter Parker works here as a delivery boy before getting fired for the chronic lateness his superhero side-gig keeps causing. This Greenwich Village slice institution on Carmine Street was founded in 1975 by Pino 'Joe' Pozzuoli, an immigrant from Naples, and is celebrated for classic New York street-style pizza. Times critic Pete Wells called it the benchmark that neoclassical slice shops are chasing, and it even turns up as an inaccessible pizza parlor in Grand Theft Auto III."},{"name":"Lever House","lat":40.759593,"lon":-73.972848,"blurb":"Only the second glass-curtain-wall skyscraper in New York, after the UN Secretariat, this 1952 SOM landmark by Gordon Bunshaft and Natalie de Blois helped turn Park Avenue from a canyon of masonry apartments into a corridor of glass office slabs. Built for soap maker Lever Brothers, it was so small and valuable that developers itched to replace it; a 1980s plan for a 40-story tower nearly demolished it before it squeaked through as a city landmark in 1982. Its raised slab sits on a public courtyard beneath overhanging upper floors."},{"name":"American Musical and Dramatic Academy","lat":40.772305,"lon":-73.987572,"blurb":"This performing-arts conservatory, founded in 1964 by theatre director Philip Burton and the New York theatre community, counts Janelle Monae, Jason Derulo, Erik Estrada, and Tony nominee Mike Faist among its alumni. Outgrowing its first East 23rd Street home, it moved to Greenwich Village's Bleecker Street, then to the grand Ansonia Building, and finally set up its main campus behind Lincoln Center. In 2003 it expanded west, opening a Los Angeles campus in Hollywood's Vine Tower."},{"name":"200 West Street","lat":40.714705,"lon":-74.01446,"blurb":"Goldman Sachs built its gleaming 44-story global headquarters here with the help of $1.65 billion in tax-exempt Liberty Bonds and hefty government subsidies, a deal that put taxpayers on the hook and drew sharp criticism. Designed by Henry N. Cobb of Pei Cobb Freed and completed in 2010 at a cost of $2.1 billion, it is the tallest building in Battery Park City. Construction was marred by accidents, including a falling load that paralyzed an architect and a plunging pane of glass."},{"name":"1 Wall Street Court","lat":40.705195,"lon":-74.008526,"blurb":"Carved beavers crown the entrance of this flatiron-shaped 1904 tower, nodding to its original name, the Beaver Building, and its perch at the acute angle of Pearl and Beaver Streets. Designed by Clinton and Russell in Renaissance Revival style, it served as headquarters for the Munson Steamship Line before housing the New York Cocoa Exchange from 1931 to 1972, which lent it another nickname. A city landmark since 1995, it was converted into residential condos in 2006."},{"name":"Trump World Tower","lat":40.752551,"lon":-73.967705,"blurb":"The top floor of this 72-story tower is labeled 90, because Donald Trump simply declared the building 900 feet tall and divided by ten to inflate the floor numbers. Built between 1999 and 2001 near the United Nations with partners including Korea's Daewoo, its slender bronze-glass slab drew fierce opposition, with neighbors like Walter Cronkite objecting that it would dwarf the UN across the street. Foes even raised $400,000 in a failed bid to stop it."},{"name":"David Geffen Hall","lat":40.772822,"lon":-73.983017,"blurb":"To bankroll a renovation, Lincoln Center stripped philanthropist Avery Fisher's name off this concert hall in 2014 so it could resell the naming rights, then landed a $100 million gift from music mogul David Geffen in 2015. Home to the New York Philharmonic since it opened in 1962 as Philharmonic Hall, it was plagued from day one by acoustic problems that repeated renovations in 1976 and 1992 only partly fixed. Architect Norman Foster was hired for a redo in 2005 but resigned from the project."},{"name":"One Penn Plaza","lat":40.751156,"lon":-73.992229,"blurb":"More than 80 percent of the 2011 Wall Street thriller Margin Call was shot on this building's 42nd floor, in space recently vacated by a trading firm. Completed in 1972 next to Penn Station and Madison Square Garden, the 57-story tower has its own ZIP code, 10119. Its designers placed the mechanical rooms on the 12th and 13th floors rather than the roof, a trick that let equipment go in early and shaved up to nine months off construction; its plaza fountain puffs steam in winter and fog in summer."},{"name":"Rockefeller Center Christmas Tree","lat":40.758733,"lon":-73.978637,"blurb":"During the Depression in 1931, construction workers pooled their money and hung strings of cranberries, paper garlands, and a few tin cans on a 20-foot balsam fir here on Christmas Eve; the first official tree followed in 1933. During WWII the tree went dark from 1944 to 1945 under blackout rules, and in 1942 three smaller trees were raised in red, white, and blue. The 2018 Swarovski crown by architect Daniel Libeskind bristles with 70 spikes and three million crystals and weighs 900 pounds, above some 50,000 LED lights."},{"name":"Fulton Street station (New York City Subway)","lat":40.709963,"lon":-74.005986,"blurb":"This four-station maze was stitched together over nearly three decades by rival companies, opening in 1905, 1918, 1931, and 1933 before being linked under a single fare in 1948. Days before the first platform opened in 1905, advertising agents Ward and Gow slipped slot machines onto it; the transit commission ordered them yanked as illegal ads, only for them to reappear in 1906 after a court fight. The complex was folded into the glassy Fulton Center in 2014 and ranks among the system's busiest stations."},{"name":"Ethel Barrymore Theatre","lat":40.760107,"lon":-73.986145,"blurb":"The Shubert brothers built this 1928 house as part of a deal in which actress Ethel Barrymore agreed to let them manage her career; it was the last theater they finished before the Depression hit. Barrymore worked with the Shuberts only until 1932 and last trod its stage in 1940. Uniquely among Broadway houses, it has never been sold or renamed since it opened. Its upper facade carries a terracotta screen inspired by ancient Roman baths."},{"name":"Belasco Theatre","lat":40.756655,"lon":-73.983792,"blurb":"Impresario David Belasco built himself a ten-room duplex penthouse atop this 1907 theater and crammed it with his collection of memorabilia, above an interior of Tiffany lighting and sweeping murals by American artist Everett Shinn. It opened as the Stuyvesant Theatre, a nod to New Amsterdam's Peter Stuyvesant, before Belasco renamed it for himself in 1910. After his death in 1931, the Shuberts bought it in 1948 and even leased it to NBC as a TV studio for three years."},{"name":"FDR Drive","lat":40.749213,"lon":-73.972974,"blurb":"This riverside parkway is a patchwork of viaducts, at-grade stretches, and tunnels: the United Nations headquarters was built on a platform right over it between 42nd and 48th Streets, and it burrows beneath Gracie Mansion, the mayor's official residence, at 90th Street. Building the Sutton Place stretch meant demolishing and rebuilding waterfront homes to fit the highway underneath. Officially the Franklin D. Roosevelt East River Drive, it runs from the Battery up to the 125th Street interchange, where it becomes the Harlem River Drive."},{"name":"14th Street–Union Square station","lat":40.734603,"lon":-73.99036,"blurb":"When this station opened in 1904 as one of the subway's original 28 stops, it transformed Union Square into a major transit hub and wholesaling district packed with loft and office buildings. During construction, a nearby hotel owner sued over the temporary compressed-air plant in Union Square, and in 1902 New York's highest court ordered the contractors to tear it down and stop storing materials in the park. In 1905 the transit commission installed giant fans here as an experiment to improve the subway's ventilation. Today it is among the system's busiest stations."},{"name":"Neue Galerie New York","lat":40.781219,"lon":-73.960237,"blurb":"Cosmetics heir Ronald Lauder built this Fifth Avenue museum of German and Austrian art as a tribute to his late friend, dealer Serge Sabarsky, opening it in 2001 in the Beaux-Arts William Starr Miller House. In 2006 Lauder bought Klimt's gold 'Portrait of Adele Bloch-Bauer I' from Maria Altmann for a reported $135 million, then the highest price ever paid for a painting. Its Cafe Sabarsky recreates a Viennese coffeehouse down to Josef Hoffmann light fixtures. In 2026 the Neue announced a merger with the Met, taking effect in 2028."},{"name":"Webster Hall","lat":40.731769,"lon":-73.98909,"blurb":"Billed as the first modern nightclub, this 1886 'hall for hire' hosted labor rallies and, in the 1910s and 20s, masquerade balls so wild that the socialist magazine The Masses dubbed it the 'Devil's Playhouse'; Marcel Duchamp, Man Ray, Langston Hughes, and F. Scott Fitzgerald all turned up. During Prohibition it was rumored to be owned by Al Capone. As RCA's East Coast studio from 1953 to 1968, it captured Bob Dylan's recording debut on February 2, 1962, blowing harmonica on Harry Belafonte's 'Midnight Special.'"},{"name":"Village Vanguard","lat":40.73602,"lon":-74.001639,"blurb":"New York's oldest operating jazz club opened in 1935 as a haven for poets and folk singers before Max Gordon flipped it fully to jazz in 1957. When a then-unknown Thelonious Monk opened here on September 14, 1948, 'nobody came, none of the so-called cognoscenti, zilch,' yet the club's faith helped make his career. Its basement acoustics captured landmark recordings, including Sonny Rollins's pioneering piano-less trio sessions in 1957 and John Coltrane's and Bill Evans's celebrated 1961 dates."},{"name":"Hospital for Special Surgery","lat":40.765164,"lon":-73.95269,"blurb":"Founded in 1863 to treat injured Civil War soldiers and the city's needy, this is the oldest orthopedic hospital in the United States and consistently ranks as the world's best. Its first patient, admitted that May, was a four-year-old boy with paralysis. In 1887 it launched the country's first orthopedic residency program, giving American medicine the very term 'resident' for a doctor in training. It installed one of the first X-ray machines in 1899, just four years after Roentgen invented the device."},{"name":"New York City Center","lat":40.763936,"lon":-73.979405,"blurb":"This Moorish-Revival fantasy was raised by the Shriners between 1922 and 1924 as the Mecca Temple, a Masonic meeting house crowned with a dome about 104 feet across. When the Depression forced the Shriners out, Mayor Fiorello La Guardia rescued it as the city's first municipal performing-arts center, reopening in 1943. In its early decades it was home to the City Opera and City Ballet before both decamped for Lincoln Center. Today it hosts the Encores! series and the Manhattan Theatre Club."},{"name":"Strawberry Fields (memorial)","lat":40.77542,"lon":-73.974742,"blurb":"When John Lennon's widow Yoko Ono funded this Central Park memorial with over a million dollars, she insisted it be a 'living memorial' of trees and plantings rather than a statue, reasoning that there are already enough statues in Central Park. Its centerpiece is the circular black-and-white 'Imagine' mosaic, laid in the style of Portuguese pavement, near West 72nd Street where Lennon was gunned down outside the Dakota. It was dedicated on what would have been his 45th birthday, October 9, 1985, and takes its name from the Beatles song 'Strawberry Fields Forever.'"},{"name":"New York Hilton Midtown","lat":40.762454,"lon":-73.979714,"blurb":"Standing outside this hotel on April 3, 1973, Motorola's Martin Cooper made the world's first handheld cellphone call on a two-pound DynaTAC, ringing his rival Joel Engel at Bell Labs just to gloat about it. The largest hotel in New York, it has hosted every U.S. president since JFK and was where Donald Trump gave his 2016 election victory speech. Hilton claims John Lennon composed 'Imagine' here, and in 1971 New York Times reporters holed up in its rooms to organize the Pentagon Papers."},{"name":"Coogan's Bluff","lat":40.832139,"lon":-73.940301,"blurb":"This Washington Heights promontory looked down on the Polo Grounds from 1890 to 1964, and sportswriters so often invoked 'Coogan's Bluff' that the name became shorthand for the ballpark itself, longtime home of baseball's New York Giants. It is named for James J. Coogan, a real-estate developer and one-term Manhattan Borough President who owned the land. Because his heirs kept owning it, the Giants could not easily improve the stadium, which helped push the team to San Francisco after 1957. The John T. Brush Stairway that carried fans down to the gates still stands."},{"name":"Congregation Shearith Israel","lat":40.774855,"lon":-73.97735,"blurb":"The oldest Jewish congregation in the United States traces to 1654, when 23 refugees from Dutch Brazil landed in New Amsterdam and were initially rebuffed by director Peter Stuyvesant before winning the right to stay. Until German Jews founded a congregation in 1825, this Spanish and Portuguese synagogue was the only one in New York City. Its current 1897 home on the Upper West Side was designed by Arnold Brunner, with interiors and stained glass by Louis Comfort Tiffany."},{"name":"JW Marriott Essex House","lat":40.766172,"lon":-73.978511,"blurb":"Ground broke on this Central Park South hotel on October 30, 1929, one day after the Wall Street Crash, and the Depression delayed its opening to 1931. On January 13, 1979, soul singer Donny Hathaway was found dead on the pavement below his locked 15th-floor room, its window glass carefully removed; with no signs of a struggle, his death was ruled a suicide. The hotel, crowned by its landmark red neon sign, was also among the final residences of David Bowie and composer Igor Stravinsky."},{"name":"Astor Library Building","lat":40.72892,"lon":-73.99176,"blurb":"Built in stages between 1854 and 1881 with money from John Jacob Astor's fortune, this was one of the city's first great libraries until its books were shipped to the New York Public Library's Bryant Park branch in 1911. By 1965 the empty building faced the wrecking ball, but Joseph Papp's New York Shakespeare Festival persuaded the city to buy it, converting the old reading room into stages for what became the Public Theater in 1967. It was among the very first structures named a city landmark."},{"name":"55 Water Street","lat":40.703227,"lon":-74.009063,"blurb":"When it topped out in 1972, this 53-story hulk on the East River was the world's largest privately owned office building, packing some 3.5 million square feet, more than the Empire State Building. The entire site is reclaimed land that was once part of the East River itself. After the developer's successor defaulted on the mortgage, the building was bought in 1993 by the Retirement Systems of Alabama, that state's pension fund, which still owns it. It is big enough to have its own ZIP code, 10041."},{"name":"Little Red School House","lat":40.729283,"lon":-74.001953,"blurb":"One of New York's first progressive schools, it opened in 1921 as a public-private experiment testing John Dewey's education ideas in the city's crowded, diverse classrooms. During the Depression in 1932, superintendent William O'Shea, who had already tried to kill the program over its progressive bent, refused the funds parents raised to save it, forcing the school to go independent in a Bleecker Street building donated rent-free by the First Presbyterian Church. In the 1940s its high-schoolers voted to add founder Elisabeth Irwin's name to the school."},{"name":"Mott Street","lat":40.719933,"lon":-73.996337,"blurb":"Chinatown's unofficial Main Street got its distinctive bend at Pell Street by curving around the long-since-buried Collect Pond. It is named for Joseph Mott, a Revolutionary-era butcher and tavern owner, and the enclave grew after merchant Wo Kee opened a general store here in 1872. The 1970s were Chinatown's most violent years, when Cantonese gangs like the Ghost Shadows and Flying Dragons ran the street with the backing of the powerful On Leong Tong, and gunfire sometimes caught passing tourists."},{"name":"111 Eighth Avenue","lat":40.741359,"lon":-74.003209,"blurb":"Google paid $1.8 billion for this full-block Chelsea colossus in 2010, and its arrival helped remake the neighborhood. Built in 1932 as a Port Authority inland freight terminal, it packs 2.9 million square feet, more floor space than the Empire State Building, with individual floors nearly four acres each. Its Art Deco skin carries recurring seagull motifs, and it was designed with truck elevators that could hoist 40,000-pound loads, some still in use today."},{"name":"Canal Street station (New York City Subway)","lat":40.718092,"lon":-73.999892,"blurb":"Digging this station between 1900 and 1904 meant tunneling through the site of the old Collect Pond, and engineers braced for quicksand. Instead they hit surprisingly solid gravel, along with buried tree trunks and human bones mixed with coins, silverware, keys, and steel tools. Canal Street itself is named for the drainage canal that once emptied the pond, which the subway builders rerouted toward the East River. The IRT platforms opened in 1904 as one of the subway's original 28 stations."},{"name":"Trump International Hotel and Tower","lat":40.769121,"lon":-73.981544,"blurb":"This Columbus Circle tower began in 1970 as the Gulf and Western Building, an aluminum-and-marble office block that went bankrupt by the early 1990s, when a venture including Donald Trump and GE's pension fund reskinned it in glass and split it into a hotel and condos, a redesign by Philip Johnson. The land was once owned by press baron William Randolph Hearst, who bought it in 1911 dreaming of a Columbus Circle headquarters that the Depression killed. The basement long held a Paramount movie theater."},{"name":"Instituto Cervantes","lat":40.755045,"lon":-73.970505,"blurb":"Named for Miguel de Cervantes, the author of Don Quixote and the towering figure of Spanish literature, this nonprofit was created by Spain's government in 1991 and has grown into the world's largest organization promoting the Spanish language and Hispanic culture, with 103 centers across 52 countries. It administers the official DELE diplomas that certify Spanish proficiency, as well as the exams that are a legal requirement for acquiring Spanish citizenship. King Felipe VI serves as honorary president of its governing board."},{"name":"The El Dorado","lat":40.788346,"lon":-73.967692,"blurb":"One of Central Park West's four twin-towered Art Deco giants, the El Dorado went up in 1929-1931 with Emery Roth consulting on the design, its brick facade tuned to emphasize soaring vertical lines. Developer Louis Klosk lost it after the Wall Street Crash, and it sold at a 1931 foreclosure auction; in 1953 it briefly belonged to the flamboyant pastor Charles M. 'Daddy' Grace. It opened with 200 apartments spread across 1,500 rooms and didn't become a co-op until 1982."},{"name":"United Nations Secretariat Building","lat":40.748926,"lon":-73.968097,"blurb":"Before the diplomats arrived this was Turtle Bay, a cove fringed by slaughterhouses that ran for over a century, so when the UN bought the land in 1946 it came with one condition: cattle could never be slaughtered there again. Completed in 1951, the 505-foot glass slab was shaped by a ten-architect board that included Le Corbusier and Brazil's Oscar Niemeyer under Wallace Harrison, its broad east and west faces sheathed in glass curtain walls that inspired a wave of imitators. Though it sits inside the US, the site is extraterritorial UN jurisdiction."},{"name":"The Ramble and Lake","lat":40.776887,"lon":-73.97139,"blurb":"Olmsted and Vaux designed this 38-acre 'wild garden' in their 1857 Greensward Plan to feel deliberately untamed, and it has long drawn two crowds: birdwatchers and men cruising. The 20-acre Lake beside it was dug entirely by hand out of swampy ground, and its Bow Br
