<title>manhattan gps watch > map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

<style>
  @font-face { font-family: "Silkscreen"; font-display: swap;
    src: url("../../fonts/silkscreen-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 300; font-display: swap;
    src: url("../../fonts/ibm-plex-mono-latin-300-normal.woff2") format("woff2"); }
  :root {
    --case: #34373b; --case-hi: #4b4f54; --case-lo: #212327;
    --lcd: #9dab8d; --lcd-2: #94a383; --lcd-ink: #191e13;

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif; }
  #map { position: absolute; inset: 0; z-index: 1; background: #aab; }

  /* Floating watch HUD */
  .hud {
    position: absolute; z-index: 1000; top: 14px; right: 14px; width: 260px;
    background: linear-gradient(150deg, var(--case-hi), var(--case) 42%, var(--case-lo));
    border-radius: 22px; padding: 16px 15px 15px;
    box-shadow: 0 10px 26px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
    color: #fff;
  }
  @media (max-width: 560px) {
    .hud { top: auto; bottom: 10px; right: 10px; left: 10px; width: auto; }
  }
  .brand { text-align: center; color: #cdd0d4; font-size: 9px; letter-spacing: .22em;
           text-transform: uppercase; margin-bottom: 8px; opacity: .85; }
  .lcd {
    background: linear-gradient(170deg, #14171b, #0b0d10);
    border-radius: 7px; padding: 11px 12px 10px; color: #c9cdc2;
    font-family: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums; position: relative; overflow: hidden;
    border: 1px solid rgba(255,255,255,.05);
  }
  .lcd::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(105deg, rgba(255,255,255,.05), transparent 40%); pointer-events: none; }
  .lcd-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px;
             border-bottom: 1px solid rgba(255,255,255,.08); padding-bottom: 5px; margin-bottom: 7px; }
  .mode { font-weight: 700; letter-spacing: .1em; color: #8b9184; }
  .odo { font-weight: 700; letter-spacing: .08em; color: #8b9184; }
  .hero { text-align: center; margin: 3px 0 4px; }
  .reading { font-family: "Silkscreen", "IBM Plex Mono", monospace; font-size: 24px; font-weight: 400;
    line-height: 1.15; white-space: nowrap; color: #e0243f; text-shadow: 0 0 12px rgba(224,36,63,.35); }
  .reading .x { font-family: "IBM Plex Mono", monospace; opacity: .6; margin: 0 .12em; font-weight: 300;
    color: #e0243f; text-shadow: none; }
  .reading.toofar { font-size: 16px; font-weight: 400; letter-spacing: .02em; text-transform: lowercase; }
  .caption { display: none; }
  .hoodline { text-align: center; font-size: 10px; font-weight: 400; letter-spacing: .12em;
    text-transform: lowercase; color: #8ea38a; opacity: .9;
    border-top: 1px solid rgba(255,255,255,.08); margin-top: 7px; padding-top: 7px; }
  .lcd-sub { display: flex; align-items: center; justify-content: center; gap: 5px; flex-wrap: wrap;
    border-top: 1px solid rgba(255,255,255,.08); margin-top: 7px; padding-top: 7px; font-size: 10px; color: #8b9184; }
  .lcd-sub .slabel { font-size: 8.5px; letter-spacing: .14em; text-transform: uppercase; color: #6b7168; }
  .lcd-sub .coord { font-family: "Silkscreen", monospace; font-size: 11px; color: #c9cdc2; }
  .lcd-sub .coord .x { font-family: "IBM Plex Mono", monospace; opacity: .5; margin: 0 .1em; }
  .lcd-sub .arrow { display: inline-block; color: #c9cdc2; font-family: "IBM Plex Mono", monospace; }
  .bullet { display: inline-flex; width: 16px; height: 16px; border-radius: 50%; align-items: center;
    justify-content: center; font: 700 9px/1 "IBM Plex Mono", monospace; color: #fff; }
  .lcd-bot { display: flex; justify-content: space-between; align-items: baseline;
             border-top: 1px solid rgba(255,255,255,.08); padding-top: 7px; margin-top: 7px; }
  .clock { font-size: 20px; font-weight: 700; color: #c9cdc2; }
  .clock .sec { font-size: 12px; opacity: .6; }
  .colon.blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .colon.blink { animation: none; } }
  .fix { font-size: 10px; opacity: .6; text-align: right; }
  .cameo { display: none; margin: 10px 2px 0; font-size: 10.5px; line-height: 1.5; color: #b7c3b2; }
  .cameo.show { display: block; }

    font-size: 8.5px; margin-bottom: 4px; opacity: .9; }

  .ctrls button {

  .ctrls button:hover { border-color: var(--accent); }
  .ctrls button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ctrls button.on { border-color: var(--accent); color: #fff; background: rgba(159,90,73,.35); }
  .ctrls .row { display: flex; gap: 6px; width: 100%; }
  .ctrls .row button { flex: 1; }

    background: linear-gradient(150deg, var(--case-hi), var(--case) 42%, var(--case-lo));

  .panel p { margin: 0 0 10px; color: #a7ac9f; line-height: 1.5; }

  .panel .chips button {

  var LANDMARKS = [{"name":"National September 11 Memorial & Museum","lat":40.711555,"lon":-74.01317,"blurb":"The design, 'Reflecting Absence' by Israeli-American architect Michael Arad, beat thousands of international entries: two square reflecting pools sit exactly in the footprints of the fallen Twin Towers, ringed by a grove of swamp white oaks. Victims' names are inscribed around the pools in 'meaningful adjacencies,' grouping people who were connected in life. The memorial opened on the tenth anniversary in 2011; the museum was dedicated in 2014 with remarks from President Obama and Mayor Bloomberg."},{"name":"Memorial Sloan Kettering Cancer Center","lat":40.764458,"lon":-73.956963,"blurb":"Founded in 1884 as the New York Cancer Hospital by a group including John Jacob Astor III, MSK's early surgeon William Coley pioneered an immunotherapy that used infections to attack tumors. Rose Hawthorne, novelist Nathaniel Hawthorne's daughter, trained here in 1896 before founding a nursing order. Its research arm was seeded by GM's Alfred Sloan and Charles Kettering, whose fortunes came partly from leaded gasoline. In a darker chapter, from the 1950s researcher Chester Southam injected live cancer cells into patients and prisoners without consent, and was found guilty of fraud and deceit in 1963."},{"name":"Washington Square Arch","lat":40.731235,"lon":-73.997102,"blurb":"Stanford White's marble arch, modeled on Rome's 1st-century Arch of Titus, marks the centennial of Washington's 1789 inauguration and anchors the southern end of Fifth Avenue. A permanent replacement for a wildly popular 1889 plaster-and-wood arch, it hides a curious detail: the last stone bears a huge 'P' honoring Polish pianist and prime minister Ignacy Jan Paderewski, who donated $4,500 from a concert. Digging the eastern pier turned up human remains, a coffin, and an 1803 gravestone ten feet down."},{"name":"Stonewall National Monument","lat":40.733768,"lon":-74.000998,"blurb":"On June 28, 1969, a police raid on the Stonewall Inn, then a mob-run gay bar operating without a liquor license, sparked days of rioting now regarded as the birth of the modern LGBTQ rights movement. In 2016 President Obama made it the first US national monument dedicated to LGBTQ history. Christopher Park across the street holds George Segal's white 'Gay Liberation' statues, installed in 1992."},{"name":"Statue of George M. Cohan","lat":40.758759,"lon":-73.985146,"blurb":"This bronze of composer and Broadway showman George M. Cohan by Georg John Lober, with architect Otto Langman, stands in Duffy Square, part of Times Square. Cast in 1959, it was dedicated on September 11, 1959, and rests on a light Barre granite pedestal set on a darker Barre granite base."},{"name":"Bethesda Terrace and Fountain","lat":40.774215,"lon":-73.970859,"blurb":"Built through the Civil War, the terrace took its biblical name from the Angel of the Waters statue atop its fountain. The arcade ceiling is lined with roughly 14,000 hand-painted Minton encaustic tiles, pried out in the 1980s and left in storage for over 20 years before being reinstalled in 2007. Look closely at the staircase balustrades, carved by Jacob Wrey Mould with the seasons: among them hide ice skates and even a witch on a broomstick for Halloween."},{"name":"African Burial Ground National Monument","lat":40.714526,"lon":-74.004464,"blurb":"In the early 1990s, federal construction crews digging near Broadway unearthed the remains of more than 419 Africans - part of a colonial-era cemetery historians think may hold 10,000 to 20,000 burials, most of them enslaved. It is the largest such burial ground found in the country and rewrote the city's forgotten history: by the Revolution, enslaved and free Africans made up nearly a quarter of New York's population. Called the most important urban archaeological project in the U.S., it became a national monument in 2006."},{"name":"America's Response Monument","lat":40.710459,"lon":-74.014053,"blurb":"The Horse Soldier, subtitled De Oppresso Liber, was the first publicly accessible monument to the U.S. Army Special Forces and the first near Ground Zero to honor heroes of 9/11. Sculptor Douwe Blumberg, an 18-year horse trainer and military-history buff, was riveted by a photo Donald Rumsfeld showed in 2001 of Green Berets riding Afghan horses into battle. An anonymous group of Wall Street bankers who lost friends on 9/11 commissioned the 16-foot bronze, dedicated on Veterans Day 2011 by Vice President Joe Biden."},{"name":"Irish Hunger Memorial","lat":40.715142,"lon":-74.016548,"blurb":"The memorial is built around a real famine-era cottage from Carradoogan in County Mayo, donated by the Slack family who abandoned it in the 1960s, and it's landscaped with stones and soil from every county in Ireland. It honors An Gorta Mor, the Great Hunger of 1845 to 1852, when over a million Irish starved. So many fled to New York that by 1855 the Irish-born made up nearly a third of the city. Construction pushed on through the September 11 attacks nearby and finished in 2002."},{"name":"Columbus Monument","lat":40.768068,"lon":-73.981898,"blurb":"The 76-foot column at the center of Columbus Circle was carved by Italian sculptor Gaetano Russo in 1892 and paid for largely by Il Progresso, a New York Italian-language newspaper, for the 400th anniversary of Columbus's voyage. Following the classical rostral-column tradition, its bronze ships - meant to be the Nina, Pinta, and Santa Maria - are oddly rendered as Roman galleys rather than caravels. Subway digging in the late 1920s nudged the statue two inches north and tilted its top; in 2012 artist Tatzu Nishi wrapped it in a fully furnished living room."},{"name":"King Jagiello Monument","lat":40.778924,"lon":-73.96668,"blurb":"This towering bronze of King Wladyslaw II Jagiello, sword crossed overhead, was sculpted for the Polish pavilion at the 1939 New York World's Fair, where it stood at the entrance in Flushing Meadows. When Nazi Germany invaded Poland that September, the pavilion's staff and equipment were stranded in the United States, and the statue never went home; it was permanently installed in Central Park in 1945. It commemorates Poland and Lithuania's 1410 rout of the Teutonic Order at the Battle of Grunwald. The Warsaw original was melted down into bullets by the occupying Germans."},{"name":"Judson Memorial Church","lat":40.730192,"lon":-73.998407,"blurb":"Backed by John D. Rockefeller and other prominent Baptists, this Greenwich Village church was designed by Stanford White with stained-glass windows by John La Farge and a baptistery frieze conceived by sculptor Augustus Saint-Gaudens. Edward Judson built it starting in 1888 as a memorial to his father, Adoniram Judson, one of the first Protestant missionaries to Burma. Judson deliberately planted it on Washington Square South, at the seam between Fifth Avenue wealth and Lower Manhattan poverty, to reach the neighborhood's poor. It was landmarked in 1966."},{"name":"Pulitzer Fountain","lat":40.764087,"lon":-73.973579,"blurb":"Newspaper baron Joseph Pulitzer left $50,000 for this Grand Army Plaza fountain, asking that it echo those on the Place de la Concorde in Paris. Its crowning bronze, the abundance-goddess Pomona modeled by Doris Doscher, was left unfinished when sculptor Karl Bitter died in April 1915 just after completing the plaster cast; Isidore Konti finished it, and it was dedicated in 1916. In a surprising twist, Donald Trump's foundation later gave $264,000 - its largest-ever gift - toward the 1990 restoration, indirectly benefiting his Plaza Hotel across the street."},{"name":"USS Maine National Monument","lat":40.768247,"lon":-73.981001,"blurb":"The gilded figures crowning this Columbus Circle monument - Columbia Triumphant riding a seashell chariot drawn by three hippocampi - were reportedly cast from bronze recovered from the guns of the USS Maine, the battleship whose 1898 explosion in Havana Harbor helped spark the Spanish-American War. Dedicated in 1913 to the men killed aboard, it was sculpted by Attilio Piccirilli, and its Columbia was modeled by Audrey Munson, the era's most famous artists' model. A plaque here was cast from metal salvaged from the ship itself."},{"name":"Soldiers' and Sailors' Monument","lat":40.792096,"lon":-73.978927,"blurb":"Modeled on the Choragic Monument of Lysicrates in Athens, this white marble Civil War memorial - a ring of twelve Corinthian columns - was dedicated on Memorial Day 1902 with President Theodore Roosevelt officiating, after veterans paraded up Riverside Drive. Its ornamental carving was by Paul DuBoy, architect of the nearby Ansonia. The 'Temple of Fame' has decayed for decades; a 2017 study pegged full repairs at $36.5 million, and the crumbling structure was fenced off from the public."},{"name":"Gay Liberation Monument","lat":40.733607,"lon":-74.002395,"blurb":"George Segal's Gay Liberation was the first piece of public art dedicated to gay rights - four life-size bronze figures painted white, two men standing and two women seated, commissioned in 1979 for the tenth anniversary of the Stonewall uprising. Its road to Christopher Park, across from the Stonewall Inn, was brutal: installed at Stanford, it was slashed and jabbed for an estimated $50,000 in damage, then splattered with paint by football players in 1994. New York finally took it in, dedicating it in 1992."},{"name":"Titanic Memorial","lat":40.7074,"lon":-74.003861,"blurb":"This 60-foot lighthouse near the South Street Seaport was raised in 1913, partly at the urging of Titanic survivor Margaret 'Molly' Brown, and dedicated on April 15 - one year to the day after the ship sank. From 1913 to 1967 a time ball at its top dropped every day at noon to signal ships in the harbor, triggered by a telegraph pulse sent from the Naval Observatory in Washington. Originally perched atop the old Seamen's Church Institute at Coenties Slip, the lighthouse was re-erected at Fulton and Pearl Streets in 1976 with funds from Exxon."},{"name":"Cherry Hill Fountain","lat":40.774696,"lon":-73.972708,"blurb":"Designed in the 1860s as a watering trough for horses, it's often mistaken for the Friends opening-theme fountain (really in Burbank)."},{"name":"Women's Rights Pioneers Monument","lat":40.770711,"lon":-73.97239,"blurb":"Unveiled on Women's Equality Day in August 2020, this Central Park sculpture by Meredith Bergmann was the park's first-ever statue of real historical women - until then its only female figures were the fictional Alice in Wonderland and Juliet. Dubbed an effort to 'break the bronze ceiling,' it depicts suffrage pioneers Susan B. Anthony and Elizabeth Cady Stanton at a table with Sojourner Truth, who was added only after the National Congress of Black Women objected that the original two-woman design whitewashed Black women's role in the movement."},{"name":"Statue of John Watts","lat":40.707691,"lon":-74.012137,"blurb":"This bronze of U.S. Congressman John Watts by George Edwin Bissell stands in the Trinity Church cemetery outside the church in Lower Manhattan. It was erected in 1893 by Watts's own grandson, John Watts de Peyster."},{"name":"Statue of David Farragut","lat":40.742764,"lon":-73.987663,"blurb":"This was Augustus Saint-Gaudens's first major work, and it was so accomplished that a rival sculptor, Truman Bartlett, launched a smear campaign insisting the piece had secretly been made in Paris. The 1881 Madison Square monument to the Civil War admiral pairs Saint-Gaudens's bronze with a stone exedra by Stanford White, whose father composed the inscription; one critic called its flowing forms the first expression of an American art nouveau. The original bluestone base weathered so badly the WPA replaced it in the 1930s."},{"name":"Statue of Giuseppe Garibaldi","lat":40.730592,"lon":-73.996834,"blurb":"When workers shifted this Washington Square statue of Italian unification hero Giuseppe Garibaldi fifteen feet east in 1970 to make way for a new promenade, they unearthed an 1880s glass time capsule beneath it-stuffed with newspaper clippings about Garibaldi's death and the monument's own dedication. The 1888 statue was sculpted by Giovanni Turini, who had actually served as a volunteer in Garibaldi's Fourth Regiment against Austria in 1866, funded by the editors of the paper Il Progresso Italo-Americano."},{"name":"New York Studio School of Drawing, Painting and Sculpture","lat":40.732267,"lon":-73.997255,"blurb":"When the Metropolitan Museum snubbed Gertrude Vanderbilt Whitney's 1929 offer of a gift of modern art, she founded her own Whitney Museum and converted these Greenwich Village row houses into its first home in 1931. The museum moved uptown in 1954, and in 1963 a group of students and their teacher Mercedes Matter turned the building into an atelier-style art school. Faculty over the years included Philip Guston, Alex Katz, and Esteban Vicente; composer Morton Feldman once served as dean."},{"name":"Amiable Child Monument","lat":40.814808,"lon":-73.963169,"blurb":"Tucked into Riverside Park across from the massive Grant's Tomb is a tiny, poignant grave: 'Erected to the Memory of an Amiable Child, St. Claire Pollock, Died 15 July 1797 in the Fifth Year of His Age,' a boy who fell to his death down the adjacent bluff. It is thought to be the only single-person private grave on city-owned land in New York. It inspired verses and pilgrimages, and when the city tried to move it to make room for Grant's Tomb, a groundswell of public opposition forced officials to back off."},{"name":"Untermyer Fountain","lat":40.794262,"lon":-73.951953,"blurb":"The centerpiece of Central Park's Conservatory Garden is Walter Schott's 'Three Dancing Maidens,' three young women circling hand in hand, their dresses clinging 'as if they were perpetually in the fountain's spray.' Cast in Germany before 1910, it once stood at lawyer and civic leader Samuel Untermyer's Greystone estate in Yonkers. After his 1940 death his children donated it to the park, where it was installed in 1947."},{"name":"Burnett Memorial Fountain","lat":40.793158,"lon":-73.95276,"blurb":"This bronze fountain near Fifth Avenue and the Museum of the City of New York honors Frances Hodgson Burnett, author of The Secret Garden and Little Lord Fauntleroy. Sculptor Bessie Potter Vonnoh created it in 1936, depicting the characters Mary and Dickon from The Secret Garden. Mayor Fiorello LaGuardia dedicated it on May 28, 1937."},{"name":"Bust of Golda Meir","lat":40.75388,"lon":-73.98741,"blurb":"This bronze bust of former Israeli prime minister Golda Meir, unveiled in 1984 at Golda Meir Square near Broadway and 39th Street in the Garment District, once held a rare distinction: as of 2016, it was one of only five statues of women in all of New York City. The sculpture has since drawn debate amid efforts to rehabilitate Meir's contested reputation."},{"name":"107th Infantry Memorial","lat":40.769331,"lon":-73.969557,"blurb":"Sculptor Karl Illava had served as a sergeant with the 107th Infantry, and for this Central Park bronze he used his own hands as the model for all seven soldiers' hands, staging the doughboys charging out of a wooded thicket. Cast in Florence in 1927, it was dedicated on September 29 that year, the 9th anniversary of the regiment's assault on the Hindenburg Line, before a crowd of 5,000. Onlookers swore the lead figure was boxer Gene Tunney; the sculptor said it was actually an ad executive named Paul Cornell."},{"name":"Statue of José Bonifácio de Andrada","lat":40.753725,"lon":-73.984675,"blurb":"This 9-foot, two-ton bronze of the Brazilian founding father stands in Bryant Park, its sculptor José Otavio Correia Lima picked through a competition the Brazilian government sponsored, kicking in $60,000 for the plaza and granite base. Cast in 1954 and dedicated in April 1955, the unveiling drew Robert Moses, Cardinal Spellman, and Mayor Wagner. It moved to its spot along Avenue of the Americas in the early 1990s, and every September the Brazilian consulate holds a ceremony here for the country's Independence Day."},{"name":"Richard Morris Hunt Memorial","lat":40.771456,"lon":-73.967988,"blurb":"This granite-and-marble exedra on the Central Park wall at Fifth Avenue and 70th Street honors architect Richard Morris Hunt, and it faces the very spot where his Lenox Library once stood. Bruce Price designed the setting; Daniel Chester French sculpted the bust of Hunt flanked by figures of Painting, Sculpture, and Architecture. The commissioning coalition tells you Hunt's reach: the Met, whose main building he designed, and the AIA, which he co-founded in 1857. It was unveiled in 1898."},{"name":"Giuseppe Verdi Monument","lat":40.779217,"lon":-73.981486,"blurb":"Nearly 26 feet tall, this Verdi Square monument surrounds a white Carrara marble Giuseppe Verdi with four of his operatic characters - Aida, Otello, Leonora, and Falstaff - each facing a different compass point, marble lyres between them and a time capsule sealed in the base. Sculptor Pasquale Civiletti's work was dedicated on Columbus Day, October 12, 1906. The drive was led by Carlo Barsotti, founding editor of Il Progresso Italo-Americano, who used his paper to fund this and monuments to Garibaldi, Verrazzano, and Dante."},{"name":"Statue of Mahatma Gandhi","lat":40.735551,"lon":-73.991325,"blurb":"This 8-foot bronze of Mahatma Gandhi by Kantilal B. Patel, larger than life, was dedicated in Union Square on October 2, 1986 - the 117th anniversary of Gandhi's birth - with civil rights leader Bayard Rustin delivering the keynote. It was donated by the Gandhi Memorial International Foundation with support from Mohan Murjani. In 2001 the statue was removed and conserved, then reinstalled in a landscaped garden in 2002."},{"name":"General William Jenkins Worth Monument","lat":40.742755,"lon":-73.988967,"blurb":"This granite obelisk marks the grave of General William Jenkins Worth, a War of 1812 veteran and Mexican-American War hero whose name lives on in Fort Worth, Texas and Lake Worth, Florida. Dedicated in 1857 on Evacuation Day, the anniversary of the British departure, its cast-iron fence replicates the Congressional sword of honor Worth was awarded in 1847. Through the 1860s, '70s, and '80s, Columbia College undergraduates used it as the launch point for their annual Burial of the Ancients parade and bonfire."},{"name":"William Cullen Bryant Memorial","lat":40.753433,"lon":-73.982751,"blurb":"Herbert Adams's 1911 bronze sits behind the New York Public Library, whose main branch opened that same year, in the park that bears the poet-editor's name. Bryant is shown as an elderly man in a business suit with a throw over his lap, seated in an ancient-Greek-style chair that nods to his love of the classics, a passage from his poem 'Thanatopsis' carved at the base. A twin of this bronze stood among the 'Eminent Americans' at San Francisco's 1915 Panama-Pacific Exposition."},{"name":"Frederick Douglass Memorial","lat":40.800647,"lon":-73.958138,"blurb":"This memorial at Central Park's northwest corner pairs an 8-foot bronze of the abolitionist Frederick Douglass by Gabriel Koren with a large circle and fountain designed by Algernon Miller. Dedicated on September 20, 2011, it was paid for through New York City's Percent for Art program and the Department of Cultural Affairs."},{"name":"Bust of Alexander Lyman Holley","lat":40.731282,"lon":-73.998145,"blurb":"This bronze bust in Washington Square Park honors Alexander Lyman Holley, a pioneering steel engineer, and was sculpted by John Quincy Adams Ward with architect Thomas Hastings. Cast by the Henry-Bonnard Bronze Company of New York in 1889 and set on an Indiana limestone pedestal in a Beaux-Arts design, it was dedicated on October 2, 1890."},{"name":"Union Square Drinking Fountain","lat":40.736003,"lon":-73.99073,"blurb":"Also called the James Fountain, this 1881 bronze was donated by Daniel Willis James and Theodore Roosevelt Sr. - father of the future president - 'to promote public health as well as the virtue of charity.' Sculpted by Adolf von Donndorf, the group shows a standing woman cradling a baby with a young child at her side, set on an octagonal Swedish red granite pedestal ringed with lion-head spouts."},{"name":"Bertel Thorvaldsen with the Statue of Hope","lat":40.788621,"lon":-73.956,"blurb":"Danish sculptor Bertel Thorvaldsen modeled this self-portrait in plaster in 1839, depicting himself in a workman's robe with mallet and chisel, resting on a scaled-down version of his 1817 statue of Hope. The hammer may nod to the Norse god Thor: Thorvaldsen reportedly said 'they call me Thor, one Thor crushes, the other Thor creates.' He died before carving it in marble, leaving his pupil Herman Wilhelm Bissen to finish it in 1859. A bronze cast, gifted by Americans of Danish descent, was erected in Central Park in 1894."},{"name":"Madison Square Park Fountain","lat":40.741728,"lon":-73.988294,"blurb":"The Southern Fountain was the only one of several planned Madison Square fountains ever built. Made of North Jay granite, it was begun in 1842 and finished in 1843 on the site of the Old Post Office, then hauled uptown and rededicated in Madison Square Park on June 28, 1867. The version standing today is a 1990 reproduction of the original."},{"name":"Bust of Victor Herbert","lat":40.772728,"lon":-73.972286,"blurb":"Commissioned by ASCAP, the American Society of Composers, Authors and Publishers, this bronze bust of composer Victor Herbert by Edmond Thomas Quinn was unveiled by his daughter in 1927, with Irving Berlin and Arthur Hammerstein in the crowd. It stands on the Central Park Mall, long a home for a free concert series. Herbert is one of only four musicians memorialized in the park, alongside John Lennon's Strawberry Fields, Beethoven, and Duke Ellington."},{"name":"Bust of Giuseppe Mazzini","lat":40.773009,"lon":-73.976694,"blurb":"Poet William Cullen Bryant delivered the dedication speech for this Italian-American commissioned bronze tribute in 1878."},{"name":"Statue of Walter Scott","lat":40.770141,"lon":-73.97234,"blurb":"This Central Park bronze depicts Scottish writer Sir Walter Scott with his favorite dog Maida at his side. It's a replica of John Steell's 1845 original at Edinburgh's Scott Monument, cast in 1871 and dedicated on November 27, 1872. The statue was a gift to the city from resident Scottish-Americans."},{"name":"Harriet Tubman Memorial","lat":40.808179,"lon":-73.952788,"blurb":"Sculptor Alison Saar's 13-foot bronze, titled Swing Low, shows Tubman striding forward while roots claw at the back of her skirt, representing the roots of slavery she tore free of, with the faces of the enslaved people she guided north worked into her hem. Dedicated November 13, 2008 at Harlem's Harriet Tubman Triangle, it takes its name from the spiritual 'Swing Low, Sweet Chariot,' said to be one of Tubman's favorite songs and used to pass coded messages to escaping slaves."},{"name":"Statue of Alexander Hamilton (Central Park)","lat":40.781033,"lon":-73.964572,"blurb":"Alexander Hamilton's own son, John C. Hamilton, commissioned this granite statue and unveiled it on a bitterly cold, windy November 22, 1880, forcing the ceremony indoors to the Metropolitan Museum. Sculptor Carl Conrads modeled Hamilton's head on a bust by Giuseppe Ceracchi, an artist whose own story ended grimly: after celebrating and then turning against Napoleon, Ceracchi was guillotined at the Place de Greve in 1801. The figure was carved from exceptionally durable Westerly granite."},{"name":"Statue of Balto","lat":40.769961,"lon":-73.97101,"blurb":"Balto the sled dog is reportedly the only subject of a Central Park statue who attended his own dedication, on December 17, 1925. He earned his fame leading the final leg of the 1925 serum run that rushed diphtheria antitoxin to stricken Nome, Alaska. In a twist, sculptor Frederick Roth actually modeled the bronze on a New Hampshire malamute named Chinook. Kids still climb it to pretend to ride; Kevin Bacon, who voiced Balto in the 1995 film, dropped by to visit in 2022."},{"name":"Statue of Daniel Webster","lat":40.774753,"lon":-73.974118,"blurb":"Thomas Ball's larger-than-life-size bronze of the statesman was commissioned in the 1870s to stand on Central Park's grand Mall, but it grew so oversized that size restrictions banished it to the West Drive at 72nd Street instead. Daniel Webster was presented to the park by Gordon W. Burnham in 1876."},{"name":"Statue of Alexander Hamilton (Columbia University)","lat":40.806713,"lon":-73.961776,"blurb":"This 1908 bronze of founding father Alexander Hamilton, by sculptor William Ordway Partridge, stands outside Hamilton Hall on the Columbia University campus, the building that bears his name."},{"name":"Statue of Abraham Lincoln","lat":40.736245,"lon":-73.990067,"blurb":"Henry Kirke Brown's 1870 bronze, sponsored by the Union League Club after Lincoln's assassination, was mocked from the moment it was unveiled. A New York Times critic savaged Lincoln's attire, marveling that the artist had 'clapped a Roman toga over the upper part of the figure,' combining past and present costume in a way 'never yet dreamt of by caricaturists.' Its pedestal rested on a 17-ton granite block said to be the largest ever quarried in America up to that time. An 1875 fence carried his words: 'with malice toward none; charity toward all.'"},{"name":"Statue of the Marquis de Lafayette","lat":40.73569,"lon":-73.989989,"blurb":"This bronze Marquis de Lafayette in Union Square Park was sculpted by Frederic Auguste Bartholdi and donated by the French residents of New York, dedicated on September 6, 1876. The portrait statue rests on a Quincy granite pedestal. It was conserved in 1991 through the Municipal Art Society and the city Art Commission's joint Adopt-A-Monument program."},{"name":"Statue of Thomas Jefferson (Columbia University)","lat":40.807465,"lon":-73.963568,"blurb":"This bronze Thomas Jefferson by William Ordway Partridge stands outside Columbia University's School of Journalism. Modeled in plaster in 1901, it was cast in bronze in 1914 by the celebrated New York foundry Roman Bronze Works."},{"name":"Madison Square Garden","lat":40.750518,"lon":-73.993506,"blurb":"The current Garden is the fourth of that name and the only one nowhere near Madison Square, opening in 1968 atop Penn Station and now the oldest arena in the NBA. Demolishing the majestic old Pennsylvania Station to build it caused such outrage that the city created its Landmarks Preservation Commission; historian Vincent Scully lamented, 'One entered the city like a god; one scuttles in now like a rat.' An earlier Garden on Eighth Avenue notoriously hosted a 20,000-person Nazi rally in 1939."},{"name":"Empire State Building","lat":40.748442,"lon":-73.985659,"blurb":"Built in just 13.5 months during the Great Depression, the Empire State Building opened on May 1, 1931 and reigned as the world's tallest until the World Trade Center topped out in 1970. Its designers reworked the plans fifteen times to guarantee the record height, yet so few tenants signed on that the owners didn't turn a profit until the early 1950s. It has been a cultural icon ever since King Kong clung to it in 1933, appearing in more than 250 films and TV shows, and it's so massive it was assigned its own ZIP code, 10118."},{"name":"The New York Times","lat":40.756106,"lon":-73.990295,"blurb":"The Gray Lady made its name in the 1870s by relentlessly exposing corrupt Tammany boss William Tweed, even publishing his secret ledgers in 1871 and helping send him to prison. In 1971 it defied President Nixon to print the Pentagon Papers, and the Supreme Court affirmed its First Amendment right to do so. Founded in 1851 and controlled by the Ochs-Sulzberger family since 1896, it has won 135 Pulitzer Prizes, more than any other publication. Its nickname nods to both its dense newsprint and its scorn for yellow journalism."},{"name":"International Society for Krishna Consciousness","lat":40.724476,"lon":-73.990443,"blurb":"The Hare Krishna movement was founded in New York City in 1966 by A.C. Bhaktivedanta Swami Prabhupada, who carried the 16th-century Bengali devotional tradition of Chaitanya Mahaprabhu to America. Its followers, called bhaktas, practice bhakti yoga, keep a strict lacto-vegetarian diet, and are known for publicly chanting the Hare Krishna mantra as a kind of 'sonic theology.' Though outsiders often call it monotheistic, ISKCON teaches that Krishna is the single ultimate reality manifesting in countless forms. It now claims roughly a million members worldwide, headquartered in Mayapur, West Bengal."},{"name":"One World Trade Center","lat":40.712999,"lon":-74.013189,"blurb":"Rising exactly 1,776 feet, One World Trade Center encodes the year of the Declaration of Independence in its height, a deliberate touch when the final spire section went up in 2013. Officially named to replace the colloquial 'Freedom Tower,' it is the tallest building in the Western Hemisphere and stands on the site of the original 6 WTC, beside the footprints of the Twin Towers. The North Tower had burned for 102 minutes before collapsing on 9/11, with debris later toppling neighboring 7 WTC. The rebuilt tower opened in 2014."},{"name":"Pfizer Building","lat":40.750402,"lon":-73.97254,"blurb":"Once the international headquarters of pharmaceutical giant Pfizer, these two 42nd Street buildings are being converted into 1,600 apartments, one of the biggest office-to-residential projects in the city. The 1960 International Style tower once held a 36-foot tin-and-aluminum mural, 'Medical Research Through the Ages,' depicting Hippocrates, Alexander Fleming, and Louis Pasteur. The conversion turned dramatic on July 7, 2026, when two columns began to buckle and the building was evacuated amid fears of collapse, forcing part of the new additions to be rebuilt."},{"name":"Brooklyn Bridge","lat":40.708246,"lon":-73.99956,"blurb":"When it opened in 1883, the Brooklyn Bridge was the longest suspension bridge in the world and the first fixed crossing of the East River, its neo-Gothic stone towers instantly iconic. Chief engineer Washington Roebling built on his father John's design, aided by his wife, the engineer Emily Warren Roebling, a rare woman in the field. John Roebling had made the trusses six to eight times stronger than needed, a cushion quietly halved when a supplier fraudulently substituted inferior wire. The Bronx foundry that cast the bridge's iron railings also made the U.S. Capitol dome."},{"name":"Flatiron Building","lat":40.74103,"lon":-73.989686,"blurb":"This 22-story triangular wedge, opened in 1902 as the Fuller Building, takes its nickname from its resemblance to a cast-iron clothes iron. Locals were so sure the slender scalene tower would topple that they dubbed it 'Burnham's Folly,' after architect Daniel Burnham. A low retail add-on at its sharp northern point earned the nickname 'cowcatcher,' after the device on a locomotive. Its steel frame was engineered to withstand four times the area's maximum wind force, and the whole district eventually took the building's name."},{"name":"New York University","lat":40.729099,"lon":-73.995894,"blurb":"Chartered in 1831 and founded by Albert Gallatin as a non-denominational, all-male school built around a secular curriculum, NYU has centered on Greenwich Village's Washington Square Park since 1833. It's now one of the largest private universities in the U.S., with over 51,000 students, and among the most applied-to schools in the country. Its global system reaches far beyond Manhattan to full degree-granting campuses in Abu Dhabi and Shanghai, plus academic centers from Accra and Berlin to Sydney and Tel Aviv."},{"name":"AOL","lat":40.730885,"lon":-73.991638,"blurb":"In 2001, at the height of the dot-com boom, AOL bought media giant Time Warner in the largest merger in U.S. history, a deal that soon became a cautionary tale as dial-up collapsed. AOL had grown from a 1985 online service into the web's most recognized American brand, pioneering chat rooms and Instant Messenger and reaching over 20 million subscribers by 2000. After buying Netscape for $4.2 billion in 1998, it shrank rapidly, was spun off from Time Warner in 2009, and was sold to Verizon in 2015 for $4.4 billion."},{"name":"Juilliard School","lat":40.773839,"lon":-73.983102,"blurb":"Juilliard's alumni have collected a staggering haul: 105 Grammys, 62 Tonys, 47 Emmys, and 24 Academy Awards, including two who completed the rare EGOT. Founded in 1905 as the Institute of Musical Art by Frank Damrosch, a godson of Franz Liszt, the conservatory later took the name of benefactor Augustus D. Juilliard and added drama and dance to its music program. With only about 950 students and one of the lowest acceptance rates in the country, it sits at Lincoln Center and is home to the celebrated Juilliard String Quartet."},{"name":"2 World Trade Center","lat":40.712177,"lon":-74.011146,"blurb":"When the original South Tower opened in 1973, it was the second-tallest building in the world after its own twin, and its 110 floors went unmatched until Dubai's Burj Khalifa in 2010. Destroyed on 9/11, its replacement has long been a stalled hole in the ground: the foundation was finished in 2013, but the tower then sat unbuilt for years. In 2026 American Express finally stepped in, announcing plans to develop and occupy a new headquarters tower on the site, with completion targeted for 2031."},{"name":"Gracie Mansion","lat":40.776113,"lon":-73.943071,"blurb":"Since 1942 this modest 1799 country house has been the official home of New York City's mayor, perched in Carl Schurz Park overlooking the treacherous Hell Gate strait. Merchant Archibald Gracie built it as his rural retreat, but over the years it served humbler duties, including public restrooms, an ice cream stand, and classrooms, before housing the Museum of the City of New York in the 1920s. Nearly every mayor since has lived there and redecorated on arrival; the notable holdout was billionaire Michael Bloomberg, who stayed in his own townhouse."},{"name":"Chrysler Building","lat":40.751622,"lon":-73.975339,"blurb":"Walter Chrysler paid for this Art Deco masterpiece out of his own pocket, not as his company's headquarters but as a real estate investment for his children. Locked in a height race with 40 Wall Street and the rising Empire State Building, it became the world's first supertall skyscraper and held the title of world's tallest for 11 months after its 1930 completion. It remains the tallest steel-framed brick building on earth, and in 2007 was ranked ninth on the AIA's list of America's favorite architecture. The Chrysler family sold it in 1953."},{"name":"Jane Street Capital","lat":40.714102,"lon":-74.016129,"blurb":"This secretive quantitative trading firm got its name almost by accident: its founders picked Jane Street in Greenwich Village at random, and it has never actually been headquartered there. Founded in 1999 by four traders, three of them poached from Susquehanna, which promptly sued, Jane Street runs without a CEO and operates more like an 'anarchist commune' led loosely by 30 or 40 senior executives. Every employee is paid from the firm's collective profits rather than personal trading gains, and it now employs around 3,000 people across more than twenty countries."},{"name":"Studio 54","lat":40.764344,"lon":-73.983779,"blurb":"The most notorious nightclub in history opened in 1977 inside a former opera house and CBS television studio, keeping the old broadcast fixtures as stage machinery. For three wild years Studio 54 was synonymous with celebrity guest lists, capricious door policies, rampant drugs, and open hedonism, until owners Steve Rubell and Ian Schrager were convicted of tax evasion and it closed in 1980. The space later became the Ritz rock club and, since a 1998 renovation, a respectable Roundabout Broadway theater."},{"name":"Metropolitan Museum of Art","lat":40.779397,"lon":-73.963418,"blurb":"The Met is the largest art museum in the Americas and the most-visited museum in the U.S., drawing over 5.7 million visitors in 2025 to its two-million-square-foot home on Fifth Avenue's Museum Mile. Founded in 1870 by a group of philanthropists, artists, and businessmen, its collection spans the ancient Near East and Egypt through to the contemporary world across 17 curatorial departments. Its medieval outpost, The Cloisters, sits up in Fort Tryon Park, and in 2028 it will absorb the neighboring Neue Galerie and its Austrian and German art."},{"name":"The Dakota","lat":40.776777,"lon":-73.976154,"blurb":"The Dakota is the oldest surviving luxury apartment building in New York, built between 1880 and 1884 in a moody German Renaissance style when the Upper West Side was still sparsely developed. Designed by Henry Janeway Hardenbergh for businessman Edward Cabot Clark, it was one of the first large developments in the neighborhood. Every apartment, each with a unique layout of four to twenty rooms, opens onto a dramatic central courtyard entered through a double-height archway on 72nd Street, and each quadrant has separate elevators for tenants and their servants."},{"name":"Grand Central Terminal","lat":40.752806,"lon":-73.977179,"blurb":"One of the ten most-visited attractions on earth, Grand Central drew 21.6 million sightseers in 2018, separate from its actual train riders. Opened by the New York Central Railroad, its Beaux-Arts hall is a National Historic Landmark filled with artworks and a favorite film backdrop. Beneath the Metro-North platforms, a 16-acre addition called Grand Central Madison was carved out from 2007 to 2023 to bring in the Long Island Rail Road. The terminal even hides a sub-basement power station, a tennis club, and its own event hall."},{"name":"UNICEF","lat":40.750247,"lon":-73.969784,"blurb":"UNICEF was born on December 11, 1946 to rush food and relief to children left destitute by World War II, and it was meant to be temporary, but in 1953 the UN made it permanent, keeping the acronym even as 'International' and 'Emergency' fell out of its name. Today it works in 192 countries and territories, delivering vaccines, HIV treatment, nutrition, and disaster relief, and it runs entirely on voluntary donations, taking in $8.61 billion in 2024. It is among the most recognized humanitarian organizations in the world."},{"name":"Trump Tower","lat":40.762319,"lon":-73.973893,"blurb":"Donald Trump's namesake tower opened in 1983 on the site of the old Bonwit Teller department store, and its construction became infamous when Trump ordered the destruction of prized Art Deco sculptures from the store's facade, alongside accusations that he underpaid contractors. He won permission to stack on extra stories by providing retail space and privately owned public areas on the ground floor. Trump keeps his penthouse residence here atop the Trump Organization's headquarters, and the 58-story tower became a security flashpoint after his 2016 presidential campaign."},{"name":"Central Park Tower","lat":40.766413,"lon":-73.980984,"blurb":"At 1,550 feet, Central Park Tower is the tallest residential building in the world and the second-tallest building in the U.S., behind only One World Trade Center. On Billionaires' Row, its 179 condos average a cavernous 5,000 square feet, with a private club on the 100th floor. To capture the best Central Park views, the tower actually cantilevers out over the neighboring Art Students League building. Its base holds a Nordstrom flagship that opened in 2019, and though its top floor is numbered 136, it has just 98 above-ground stories."},{"name":"432 Park Avenue","lat":40.761696,"lon":-73.97185,"blurb":"Briefly the tallest residential building in the world, 432 Park Avenue is the slender white obelisk that reshaped the skyline in 2015, its facade a lattice of white Portland-cement concrete. Rising 1,396 feet on the site of the old Drake Hotel, it's split into 12-story blocks separated by open double-height mechanical floors that let wind gusts blow straight through. Its 125 ultra-luxury condos have sold for as much as $90 million, making it a lightning rod for commentary on both its extreme slenderness and its symbolism as a tower for the ultra-wealthy."},{"name":"George Washington Bridge","lat":40.849757,"lon":-73.942408,"blurb":"The George Washington Bridge is the world's busiest motor-vehicle bridge, carrying over 104 million vehicles in 2019, and the only suspension bridge anywhere with 14 lanes. When it opened in 1931, its 3,500-foot main span nearly doubled the previous record and reigned as the world's longest until the Golden Gate Bridge opened in 1937. Spanning the Hudson from Washington Heights to Fort Lee, New Jersey, its double-decked roadway is affectionately known to New Yorkers as simply 'the George.'"},{"name":"The New School","lat":40.735466,"lon":-73.997081,"blurb":"Founded in 1919 as a haven for academic freedom and progressive education, The New School pulled off one of history's boldest intellectual rescues: in 1933 it created a 'University in Exile' to shelter largely Jewish scholars fleeing Hitler's Europe. Today it spans divisions including the famous Parsons School of Design, Eugene Lang College of Liberal Arts, and the Mannes School of Music, with over 70 percent of its roughly 8,500 students studying design, fine arts, or the performing arts."},{"name":"Headquarters of the United Nations","lat":40.750208,"lon":-73.967225,"blurb":"Though it sits in Midtown's Turtle Bay, the UN headquarters is technically not on U.S. soil, since by treaty the land is extraterritorial and administered solely by the United Nations. Completed in 1952, the complex of the slab-like Secretariat, the General Assembly, and the library was designed by an international board that famously included modernist titans Le Corbusier and Oscar Niemeyer. It houses the seats of the General Assembly and Security Council, though the International Court of Justice sits far away in The Hague. 'Turtle Bay' has become shorthand for the UN itself."},{"name":"Hotel Chelsea","lat":40.744374,"lon":-73.996818,"blurb":"The Hotel Chelsea has sheltered a legendary parade of writers, musicians, and artists since it opened in 1884, when it was among the first buildings in the city to feature duplex and penthouse apartments. Built as a housing cooperative and wrapped in flowered iron balconies beneath a steep mansard roof, the 12-story landmark counted many creative residents who lived there well into the 21st century. Its ground floor is still home to the El Quijote restaurant. Most of the Chelsea now operates as a luxury hotel."},{"name":"Rockefeller Center","lat":40.75924,"lon":-73.980094,"blurb":"Rockefeller Center began as a plan for a new Metropolitan Opera house, but when the Met couldn't afford to move during the Depression, John D. Rockefeller Jr. was left holding a vast leased site and built this 14-building Art Deco complex instead. Its construction was one of the great make-work efforts of the Depression era, beginning in 1931 with the core finished by 1939. Columbia University owned the land until 1985. Radio City, along Sixth Avenue, was built for RCA and NBC's radio empire, and Tishman Speyer bought the whole complex for $1.85 billion in 2000."},{"name":"Museum of Modern Art","lat":40.761612,"lon":-73.977545,"blurb":"MoMA opened just days after the Wall Street Crash of 1929, the brainchild of three women, Abby Aldrich Rockefeller, Lillie P. Bliss, and Mary Quinn Sullivan, determined to give modern art a home. Abby's husband, John D. Rockefeller Jr., at first opposed the venture yet ended up donating the land for its permanent West 53rd Street building, which opened in 1939. Under founding director Alfred H. Barr Jr., the collection exploded, and landmark shows like 1936's 'Cubism and Abstract Art' shaped the very story of modern art. It now holds over 200,000 works."},{"name":"Barnard College","lat":40.809505,"lon":-73.963534,"blurb":"Barnard was born of a snub: when Columbia refused to admit women, 19-year-old activist Annie Nathan Meyer led the 1889 campaign to create an affiliated women's college, named pointedly after Columbia president Frederick A. P. Barnard. One of the historic Seven Sisters, it keeps its own admissions, curriculum, and finances yet shares sports teams with Columbia, making it the only women's college competing in NCAA Division I athletics. Its students can even take courses at Juilliard, the Manhattan School of Music, and the Jewish Theological Seminary."},{"name":"33 Thomas Street","lat":40.716521,"lon":-74.005902,"blurb":"This 550-foot Tribeca monolith has not a single window, a windowless Brutalist slab built between 1969 and 1974 as AT&T's Long Lines telephone-switching fortress, packed with giant 4ESS switches that routed long-distance calls. Its sinister, sealed appearance matches its reputation: reporting has identified it as a suspected NSA mass-surveillance facility. Built where ornate cast-iron buildings once stood, their facades salvaged first, it still handles phone switching and now also houses highly secure data centers."},{"name":"Waldorf Astoria New York","lat":40.756502,"lon":-73.973361,"blurb":"The original Waldorf-Astoria was torn down in 1929 to clear the site for the Empire State Building, so this 47-story Art Deco tower rose on Park Avenue in 1931 as its grand replacement, reigning as the world's tallest hotel until Moscow's Hotel Ukraina in 1957. A byword for glamour, its Presidential Suite was even furnished in White House-style Georgian decor. In 2014 China's Anbang Insurance bought it for $1.95 billion, the most ever paid for a hotel, then closed it for a long renovation; it finally reopened in July 2025."},{"name":"Broadway","lat":40.720391,"lon":-74.001044,"blurb":"Broadway follows an ancient path, much of it beginning as the Wickquasgeck trail worn by Native Americans before Europeans arrived and later becoming a main road of Dutch New Amsterdam. It runs 13 miles up Manhattan and keeps going for dozens more through the Bronx and Westchester. In Midtown its name became a global metonym for American theater; in Lower Manhattan one stretch is the 'Canyon of Heroes,' where ticker-tape parades honor the city's heroes. Oddly, most of the street didn't officially bear the name until the late 19th century."},{"name":"Woolworth Building","lat":40.712454,"lon":-74.008334,"blurb":"Retail magnate Frank W. Woolworth built this 792-foot Neo-Gothic tower as a headquarters worthy of his five-and-ten-cent empire, and from 1913 to 1929 it was the tallest building in the world. Cass Gilbert clad it in ornate architectural terracotta and filled the lobby with sculptures and mosaics, then tucked in an observatory on the 57th floor and a private swimming pool in the basement. Woolworth planned it jointly with Irving Trust, which also used it as headquarters. Its final height wasn't even decided until January 1911."},{"name":"American Museum of Natural History","lat":40.781099,"lon":-73.974211,"blurb":"Conceived in 1861 by naturalist Albert Bickmore, who argued that New York's wealth made it the best home for a great museum, the AMNH first had to win the blessing of Boss Tweed's corrupt Tammany Hall to get its charter. It opened inside Central Park's Arsenal in 1871, then moved to its purpose-built home; President Grant attended the groundbreaking and President Hayes the opening. Its collections now hold about 32 million specimens, of which only a sliver is ever on display at once."},{"name":"Grant's Tomb","lat":40.813454,"lon":-73.963051,"blurb":"Ulysses S. Grant died bankrupt of throat cancer in 1885, days after finishing the memoirs he wrote to save his family from ruin; his empty casket drew 15,000 mourners. His tomb, modeled on the ancient Mausoleum at Halicarnassus and the largest in North America, was funded by an association chaired by ex-president Chester Arthur, with Richard Greener, Harvard's first Black graduate, as secretary. After decades of neglect and vandalism, it was rescued in the 1990s by a campaign led by college student Frank Scaturro."},{"name":"Cathedral of St. John the Divine","lat":40.803767,"lon":-73.961747,"blurb":"Nicknamed St. John the Unfinished, this is the largest church in North America, yet only two-thirds built since work began in 1892. Midway through, architects abandoned the original Byzantine-Romanesque scheme for Gothic Revival, and funding shortfalls stalled the nave until 1941. A 2001 fire forced yet another restoration, and its towers and crossing steeple were never completed. It rose on the site of the Leake & Watts Orphan Asylum, near the former Bloomingdale Insane Asylum."},{"name":"Charging Bull","lat":40.705564,"lon":-74.013446,"blurb":"On the night of December 14, 1989, sculptor Arturo Di Modica trucked this 7,100-pound bronze to Wall Street and dropped it, illegally, beneath the Stock Exchange's Christmas tree as a guerrilla-art gift, spending $360,000 of his own money in response to the 1987 crash. Police impounded it within hours, but public outcry got it reinstalled at Bowling Green. Cast in Greenpoint, Brooklyn, it was meant to prove that if things are very bad, you can still do something by yourself."},{"name":"Pace University","lat":40.711118,"lon":-74.004888,"blurb":"Brothers Homer and Charles Pace launched their accountancy school in 1906 on a $600 loan, teaching a first class of 13 in a rented New York Tribune Building classroom. The school spread to YMCAs and cities nationwide before refocusing on Lower Manhattan, and became a university in 1973. It is home to the Actors Studio Drama School and the Inside the Actors Studio TV show. Four blocks from Ground Zero, its campus lost four students and over 40 alumni on 9/11 and became a triage center."},{"name":"Stuyvesant High School","lat":40.717948,"lon":-74.013905,"blurb":"This exam-only public school admits about 800 of some 30,000 applicants a year, under 3%, on a single test score, and has produced four Nobel laureates. Alumni range from actor James Cagney and attorney general Eric Holder to economist Thomas Sowell and physicists Brian Greene and Lisa Randall. Founded as an all-boys school in 1904, it was forced to admit girls in 1969 after Alice de Rivera sued over being barred from the entrance exam. It is named for Peter Stuyvesant, New Netherland's last Dutch director."},{"name":"Dalton School","lat":40.781532,"lon":-73.955062,"blurb":"Founded in 1919 by Helen Parkhurst, who had studied under Maria Montessori, this progressive school pioneered the Dalton Plan, pairing students and teachers on individualized goals, a method later adopted from Japan to Chile. Eleanor Roosevelt admired Parkhurst's work and helped engineer a 1939 merger that expanded the school. Alumni include Antony Blinken, Anderson Cooper, Claire Danes, Sean Lennon and painter Helen Frankenthaler. With tuition topping $64,000, it still keeps traditions like a Greek Festival and candle-lighting before winter break."},{"name":"High Line","lat":40.747953,"lon":-74.003954,"blurb":"Built atop an abandoned elevated freight railway saved from demolition, this greenway took its cue from a similar elevated park in Paris."},{"name":"Carnegie Hall","lat":40.764998,"lon":-73.979912,"blurb":"Built by industrialist Andrew Carnegie, it was saved from demolition in the 1950s by a public campaign led by violinist Isaac Stern."},{"name":"Council on Foreign Relations","lat":40.768435,"lon":-73.96625,"blurb":"This foreign-policy think tank grew out of The Inquiry, a secret group of about 150 scholars Woodrow Wilson assembled in 1917 to plan the postwar world, work that fed his Fourteen Points. Incorporated in 1921 under former secretary of state Elihu Root, it has published Foreign Affairs since 1922. During WWII it ran the confidential War and Peace Studies, funded entirely by the Rockefeller Foundation and so secret that uninvolved members did not know it existed; its arms group was led by future CIA figure Allen Dulles. It produced 682 classified memos for the State Department."},{"name":"One Vanderbilt","lat":40.752979,"lon":-73.97853,"blurb":"Rising 1,401 feet to its spire, One Vanderbilt is the city's fourth-tallest building and home to the vertigo-inducing Summit observation deck. Its site was normally capped at 600 feet, but developer SL Green more than doubled the height by buying air rights and paying for transit and public-space upgrades beside Grand Central. It replaced older Terminal City buildings, one of which had housed Governor Al Smith's campaign headquarters, and the developer salvaged their terracotta porpoises and cherubs. Opened in 2020, its design was tuned to harmonize with Grand Central next door."},{"name":"The Cloisters","lat":40.864823,"lon":-73.931792,"blurb":"This medieval museum was assembled by sculptor George Grey Barnard, who bicycled the French countryside buying up abbey stones; he claimed to have found one tomb effigy lying face-down, in use as a bridge over a stream. Living near poverty, Barnard sold his collection to John D. Rockefeller Jr. for around $700,000. Rockefeller had five European cloisters disassembled stone by stone and shipped to Fort Tryon Park, reconstructed into the building that opened in 1938. Its treasures include the Unicorn Tapestries and the Merode Altarpiece."},{"name":"Yeshiva University","lat":40.850497,"lon":-73.92926,"blurb":"Yeshiva University traces to the Etz Chaim Yeshiva, a cheder founded by Eastern European immigrants on the Lower East Side in 1886, and its dual curriculum embodies the philosophy of Torah Umadda, Torah and secular knowledge. Its endowment was badly burned by Bernard Madoff's Ponzi scheme, losing at least $110 million; in 2014 Moody's cut its bonds five steps to junk level. To survive, the university sold off real estate and handed its Albert Einstein College of Medicine to the Montefiore health system."},{"name":"St. Patrick's Cathedral","lat":40.758589,"lon":-73.976296,"blurb":"North America's largest Gothic Revival Catholic cathedral rose on a Fifth Avenue plot that once held a Jesuit college and later a Trappist orphanage; when construction began in 1858 the area was still nearly rural. Architect James Renwick Jr. drew inspiration from the then-unfinished Cologne Cathedral; work stalled during the Civil War, and the cathedral finally opened in 1878, its 330-foot spires added in 1888. It was not consecrated until 1910, once all its debt was paid off. Today it faces Rockefeller Center."},{"name":"Bellevue Hospital","lat":40.738973,"lon":-73.975225,"blurb":"America's oldest public hospital became so tied to psychiatric care that Bellevue turned into slang for a madhouse; one writer called it the Chelsea Hotel of the mad. It grew from a 1736 almshouse and took its name from the Belle Vue farm, bought in 1798 to quarantine yellow-fever victims. Bellevue notched a string of firsts, including the nation's first Nightingale-model nursing school in 1873. In 1919 the German spy Fritz Duquesne escaped its prison ward after faking paralysis for nearly two years."},{"name":"Vessel (structure)","lat":40.753806,"lon":-74.002159,"blurb":"Thomas Heatherwick's climbable honeycomb packs 154 flights, 2,500 steps and 80 landings into a 150-foot structure modeled on Indian stepwells; developer Stephen Ross wanted it to stand out like a year-round Christmas tree. It cost an estimated $200 million, and at first Hudson Yards absurdly claimed to own any photo taken of it. After a series of suicides, the copper-clad landmark closed and reopened repeatedly, finally returning in October 2024 with tall glass safety barriers."},{"name":"B&H Photo","lat":40.753129,"lon":-73.996137,"blurb":"B&H takes its name from the initials of founders Blimie and Herman Schreiber, who opened a Tribeca film shop in 1973. Owner Herman Schreiber and many of his staff are observant Satmar Hasidic Jews, so the single Manhattan store, and even online checkout, shuts down from Friday sundown through Saturday for Shabbat, plus most Jewish holidays and Christmas. Now one of the largest U.S. electronics retailers with over 400,000 products, its famous overhead conveyor-belt system whisks purchases along the ceiling."},{"name":"American Academy of Dramatic Arts","lat":40.745516,"lon":-73.984776,"blurb":"Founded in 1884 by Franklin Haven Sargent, a Harvard speech professor, this drama conservatory set out to train actors for the stage and first met in the original Lyceum Theatre. In 1963 it moved into its current landmark home, a building the celebrated architect Stanford White had designed for the Colony Club. For decades it ran the only actor-training school with campuses in both New York and Los Angeles, until declining enrollment forced the LA campus to close after the 2024-2025 year."},{"name":"School of Visual Arts","lat":40.741584,"lon":-73.99075,"blurb":"The School of Visual Arts opened in 1947 as the Cartoonists and Illustrators School, with three teachers and 35 students, most of them WWII veterans on the G.I. Bill. Renamed SVA in 1956, it did not grant degrees until 1972. Its ties to design legend Milton Glaser run deep: the library houses his archive and design study center, and he designed the SVA Theatre's interior and the sculpture atop its marquee. In 2025 ownership passed from the founding Rhodes family to the school's alumni society."},{"name":"Bowery","lat":40.725839,"lon":-73.992058,"blurb":"The Bowery is Manhattan's oldest thoroughfare, starting as a Lenape footpath and named from the Dutch bouwerie, meaning farm. Director-general Peter Stuyvesant retired to his Bowery farm and was buried in its chapel, now St. Mark's Church in-the-Bowery. Lorenzo Da Ponte, Mozart's librettist for Don Giovanni, briefly ran a fruit shop here after emigrating in 1806. By the Civil War its mansions had given way to flophouses and brothels and the turf of one of America's earliest street gangs, the nativist Bowery Boys; composer Stephen Foster lived in a flophouse at No. 15."},{"name":"PS General Slocum","lat":40.726897,"lon":-73.981372,"blurb":"On June 15, 1904, this sidewheel steamboat caught fire in the East River while carrying members of a German Lutheran church, mostly women and children from Manhattan's Little Germany, to a picnic. An estimated 1,021 of the 1,342 aboard died, making it New York City's worst maritime disaster and the deadliest on U.S. waters of the century until the Titanic eight years later. The unlucky vessel had a checkered past: in 1901 it carried some 900 intoxicated anarchists who rioted and tried to seize control of the ship."},{"name":"30 Hudson Yards","lat":40.753949,"lon":-74.000555,"blurb":"The Edge, a triangular glass-floored sky deck, juts out from the 100th floor 1,100 feet up, the second-highest outdoor observation deck with transparent flooring in the world. Home to Warner Bros. Discovery, whose CNN studios broadcast from inside, and to investment giant KKR, the tower's protruding deck has led reviewers to compare its silhouette to a duck. In a striking maneuver, WarnerMedia sold its office space to the developer and Allianz for $2.2 billion in 2019, then leased it right back."},{"name":"Cooper Union","lat":40.729335,"lon":-73.989671,"blurb":"Peter Cooper had less than a year of schooling yet built America's first steam locomotive and made a fortune, then in 1859 founded a college open and free to all, which offered free tuition to every student until 2014. Its Great Hall hosted Abraham Lincoln's 1860 Cooper Union Address, which galvanized support and helped win him the Republican nomination. The Foundation Building was the first structure to use rolled-iron I-beams, Cooper's own invention, and included an elevator shaft years before elevators existed, built round because Cooper assumed they would be cylindrical."},{"name":"Stuyvesant Town–Peter Cooper Village","lat":40.731722,"lon":-73.978174,"blurb":"To build this 11,250-apartment complex, MetLife razed the gritty Gas House District after WWII; 600 buildings came down and roughly 11,000 people were forced out, which the Times called the greatest mass movement of families in New York's history. The old district's gangs were once policed by Captain Alexander Williams, who declared there is more law at the end of a policeman's nightstick than in a decision of the Supreme Court. Its two halves honor Peter Stuyvesant and industrialist Peter Cooper. In 2015 it sold for $5.45 billion."},{"name":"Times Square Ball","lat":40.756132,"lon":-73.986577,"blurb":"New York Times owner Adolph Ochs first dropped the ball on December 31, 1907, to ring in 1908 and advertise his paper's new headquarters. Inspired by a time ball atop the Western Union building, the original was a 5-foot wood-and-iron sphere lit by 100 bulbs; today's version glitters with Waterford crystal panels and tens of thousands of LEDs. The drop has happened every year since except 1942 and 1943, when wartime blackouts kept it dark. In 2026 it even dropped eight times over July 3 and 4, once for each U.S. time zone."},{"name":"Apollo Theater","lat":40.810129,"lon":-73.949863,"blurb":"Harlem's Apollo began in 1913 as Hurtig & Seamon's burlesque house that served only white patrons; it did not open to Black performers until 1934. Its weekly Amateur Night, where the audience's cheers and boos judge newcomers, has launched countless careers and become the theater's signature. The Schiffman family ran it from 1935 to 1976, and former Manhattan borough president Percy Sutton bought it at auction in 1981. Now a designated landmark, it is home to Showtime at the Apollo."},{"name":"Lincoln Center","lat":40.772613,"lon":-73.984223,"blurb":"To clear ground for Lincoln Center, Robert Moses's urban-renewal program displaced more than 7,000 residents and 800 businesses from the San Juan Hill neighborhood in the 1950s and 60s. John D. Rockefeller III led the effort, personally raising over half the $184.5 million cost. Oddly, no one is sure whether the complex honors Abraham Lincoln or simply Lincoln Square; one theory holds that references to the president were quietly dropped because the 1906 mayor was the son of General McClellan, Lincoln's bitter rival. President Eisenhower broke ground in 1959."},{"name":"City College of New York","lat":40.818152,"lon":-73.950039,"blurb":"City College opened in 1847 as the Free Academy, the first free public institution of higher education in the United States, founded by Townsend Harris, who urged, open the doors to all, let the children of the rich and the poor take their seats together. Its first president framed it as an experiment in whether the children of the whole people can be educated. Chemist Oliver Wolcott Gibbs taught here after Columbia denied him a post over his Unitarian faith. A later president, General Alexander Webb, was a Gettysburg hero who won the Medal of Honor."},{"name":"Eleven Madison Park","lat":40.741598,"lon":-73.98719,"blurb":"This Flatiron temple of fine dining earned three Michelin stars and topped the World's 50 Best Restaurants list in 2017. Chef Daniel Humm and Will Guidara bought it from restaurateur Danny Meyer in 2011, then split in 2019. During the pandemic it became a commissary cooking meals for food-insecure New Yorkers. In 2021 Humm made headlines by going entirely plant-based, citing farmed rather than wild ingredients, only to bring back fish and meat in 2025, partly for financial reasons."},{"name":"St. Paul's Chapel","lat":40.711315,"lon":-74.009196,"blurb":"Built in 1766, St. Paul's is the oldest surviving church in Manhattan; George Washington worshipped here on his Inauguration Day in 1789 and throughout the years New York served as the capital. As a King's College student, Alexander Hamilton drilled with a militia in its churchyard. Its greatest fame came on 9/11: standing directly across from the World Trade Center, it survived the towers' collapse without a single broken window, shielded by a sycamore that took the brunt of the debris. Serving as a round-the-clock refuge for recovery workers, it earned the nickname The Little Chapel That Stood."},{"name":"Ford Foundation","lat":40.750006,"lon":-73.971079,"blurb":"The Ford Foundation was created in 1936 with a $25,000 gift from Edsel Ford, partly to shelter the family fortune from FDR's new 70% inheritance tax, and by 1947 it owned 90% of Ford Motor's non-voting stock, making it the world's largest endowment. At the height of the Cold War it served as a CIA conduit: chairman John J. McCloy, who had helped found the OSS, set up a secret three-person committee just to handle the spy agency's funding requests. With Eleanor Roosevelt's backing, it even gave $150,000 to a CIA-controlled group operating in East Berlin."},{"name":"Fearless Girl","lat":40.706817,"lon":-74.0108,"blurb":"State Street commissioned Kristen Visbal's bronze and planted it facing Charging Bull on March 7, 2017, the eve of International Women's Day, to promote a gender-diversity index fund; the plaque's word SHE doubled as the fund's stock ticker. Bull sculptor Arturo Di Modica objected that the little girl hijacked the meaning of his work, and in 2018 Fearless Girl was relocated to Broad Street facing the Stock Exchange. Tellingly, by 2025 State Street had quietly abandoned the very board-diversity requirements the statue once championed."},{"name":"220 Central Park South","lat":40.767004,"lon":-73.980573,"blurb":"In 2019 hedge-fund billionaire Ken Griffin paid $238 million for an apartment here, the most expensive home ever sold in the U.S. at the time, and it wasn't even the building's only nine-figure sale. This Billionaires' Row pencil tower, a 70-story limestone slab by Robert A.M. Stern, is famous for its secretive sales and anonymous buyers. Developer Vornado spent years fighting a tenants' lawsuit that delayed demolition of the old rent-stabilized complex until 2012."},{"name":"Seagram Building","lat":40.758352,"lon":-73.971977,"blurb":"When Seagram unveiled its planned Park Avenue headquarters, CEO Samuel Bronfman's 27-year-old daughter Phyllis Lambert torpedoed the original design and personally steered the commission to Ludwig Mies van der Rohe. His 1958 bronze-and-glass tower became one of New York's most copied buildings; its pink-granite plaza was so admired it helped inspire the 1961 zoning law that rewarded developers who added public plazas. The Four Seasons restaurant lived at its base."},{"name":"Rockefeller Foundation","lat":40.750822,"lon":-73.983315,"blurb":"Built on John D. Rockefeller's Standard Oil fortune and chartered in 1913, this was the largest philanthropic enterprise in the world by the 1920s, and the World Health Organization was modeled on its International Health Division of globe-trotting doctors. Its record isn't spotless: it openly supported eugenics in the 1930s. In 2020, in a pointed reversal, the oil-funded foundation pledged to divest entirely from fossil fuels."},{"name":"Citigroup Center","lat":40.758331,"lon":-73.9699,"blurb":"Less than a year after it opened in 1977, engineers quietly reinforced this stilt-legged tower after realizing a design flaw left it vulnerable to collapse in high winds. Its four giant columns sit mid-wall rather than at the corners, and the 45-degree sloped roof is instantly recognizable. St. Peter's Lutheran Church sold its corner only on the condition that a new sanctuary be built at the tower's base, which now sits tucked beneath the overhanging skyscraper."},{"name":"The Explorers Club","lat":40.769954,"lon":-73.965572,"blurb":"Founded in New York in 1904, this club has counted the men who reached the North Pole (Peary and Henson, 1909), the South Pole (Amundsen, 1911), and the summit of Everest (Hillary and Norgay, 1953), plus honorary members from Teddy Roosevelt to Buzz Aldrin. Women weren't admitted until 1981, in a class that included ocean explorer Sylvia Earle. Its annual dinner is notorious for serving deliberately exotic, adventurous cuisine."},{"name":"New York University Tisch School of the Arts","lat":40.729614,"lon":-73.993838,"blurb":"Home to the Martin Scorsese Institute of Global Cinematic Arts and the Clive Davis Institute of Recorded Music, Tisch counts 22 Academy Award winners, 17 Emmy winners, and 12 Tony winners among its alumni and faculty, and sends more graduates to Broadway than any other theater school in the country. Renamed in 1982 after a Tisch family gift, it once ran a Singapore campus that collapsed in 2014 amid 'educational scam' accusations."},{"name":"Rockefeller University","lat":40.762274,"lon":-73.955952,"blurb":"The oldest biomedical research institute in America, founded by John D. Rockefeller in 1901, has been affiliated with 26 Nobel laureates and, in the 1940s, was first to prove that genes are made of DNA. Later breakthroughs here included the 1994 discovery of leptin, the hormone that governs appetite. David Rockefeller chaired its board and stayed active as a patron until his death at age 102 in 2017. It admits only graduate and postdoctoral scientists."},{"name":"Queensboro Bridge","lat":40.759709,"lon":-73.961287,"blurb":"Completed in 1909, this double-deck cantilever over the East River is a New Yorker's '59th Street Bridge' and a Queens resident's sore spot: the 2011 renaming for former mayor Ed Koch proved so unpopular that the public kept calling it the Queensboro for years, and a councilman later tried to strip Koch's name off entirely. When it opened it carried elevated trains and trolleys, the latter stopping mid-span at an elevator down to Roosevelt Island."},{"name":"New York City Hall","lat":40.712735,"lon":-74.006007,"blurb":"Built from 1803 to 1812, this is the oldest U.S. city hall still serving its original purpose, and its architects were so sure no one would look at the back that they faced the rear in cheap brownstone. It rose on the old Common, once the site of the city's first almshouse. In 1857 rival Municipal and Metropolitan police brawled on its steps over the arrest of Mayor Fernando Wood, and in 2003 a city councilman was shot dead inside the council chamber by a political rival."},{"name":"Mount Sinai Hospital","lat":40.789742,"lon":-73.953052,"blurb":"Founded in 1852 as The Jews' Hospital, this institution was created because other New York hospitals refused to hire Jewish doctors or treat Jewish patients in their wards. Within a few years of opening it was unexpectedly filled with soldiers wounded in the Civil War. Its physicians first described and gave their names to Crohn's disease and Tay-Sachs disease, and its early staff member Abraham Jacobi is regarded as the father of American pediatrics."},{"name":"The Tombs","lat":40.716517,"lon":-74.000465,"blurb":"This Egyptian Revival jail of 1838, shaped like a mastaba, earned the nickname 'the Tombs,' and Charles Dickens gawked at it in American Notes as a 'dismal fronted pile of bastard Egyptian.' Built on the filled-in Collect Pond, it began sinking almost immediately into damp, fetid squalor. Killer John C. Colt stabbed himself in his cell the very day he was to hang, amid a mysterious fire, while millionaire Harry Thaw did his time with a brass bed, custom clothes, and meals catered by Delmonico's."},{"name":"Cleopatra's Needle","lat":40.779636,"lon":-73.965396,"blurb":"This 69-foot granite obelisk was raised at Heliopolis around 1475 BC for the pharaoh Thutmose III, with Ramesses II adding his own boasts two centuries later. Egypt's Khedive gave it to the U.S. in 1877 for staying neutral in European power plays, and railroad heir William H. Vanderbilt paid over $100,000 to ship it across. Moving the 200-ton stone from the harbor to Central Park took 112 days and 32 horses; a time capsule beneath it holds a Bible, Shakespeare, and the Declaration of Independence."},{"name":"Frick Collection","lat":40.771277,"lon":-73.967146,"blurb":"Coke-and-steel baron Henry Clay Frick built this Beaux-Arts mansion in 1914, designed around the masterpieces he planned to hang in it, and explained his collecting with the line, 'I can make money... I cannot make pictures.' Vermeers, Rembrandts, a Titian, and a Velazquez still hang much as he left them when he bequeathed the house as a public museum. During a recent renovation the collection decamped to the old Breuer building on Madison Avenue, reopening at home in 2025."},{"name":"Puck Building","lat":40.724529,"lon":-73.995411,"blurb":"This red-brick Romanesque pile was the longtime home of Puck, the biting satirical cartoon magazine, and two gilded statues of Shakespeare's mischievous sprite Puck, from A Midsummer Night's Dream, still preside over the facade. Puck folded in 1918, and printing firms filled the halls for decades afterward. In the 1990s the Kushner family took over the building and later carved luxury penthouses into its top floors, one crowned with a new dormer."},{"name":"The Battery","lat":40.702814,"lon":-74.015775,"blurb":"Before Ellis Island existed, Castle Clinton here served as America's immigrant landing depot, taking in new arrivals from 1855 until 1890, and later spent decades as the New York Aquarium. The fort began as an artificial-island battery built just before the War of 1812, later swallowed as landfill expanded the park. The park's name comes from the 17th-century cannon batteries that guarded the harbor, and the Lenape called this rocky point 'Kapsee.'"},{"name":"Moynihan Train Hall","lat":40.751299,"lon":-73.995338,"blurb":"Carved into the grand 1914 Farley Post Office and topped with a 92-foot glass skylight, this $1.6 billion hall finally gave Penn Station the soaring room it lost when the original station was demolished. It's named for Senator Daniel Patrick Moynihan, who championed the idea for decades before it opened on New Year's Day 2021. A Kehinde Wiley stained-g
