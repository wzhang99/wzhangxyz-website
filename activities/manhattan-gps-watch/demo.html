eassure riders, since the lifts are the platforms' only access. Designed with tilework by IND chief architect and painter Squire J. Vickers, it opens near Fort Tryon Park and the Cloisters; in 1951 researchers judged it deep enough to shelter New Yorkers from nuclear fallout."},{"name":"181st Street station (IRT Broadway–Seventh Avenue Line)","lat":40.849301,"lon":-73.933756,"blurb":"During 1903 construction, a boulder weakened by explosives collapsed, killing ten miners—nine Italian immigrants and one German electrician."},{"name":"Brooklyn Banks","lat":40.711473,"lon":-74.002947,"blurb":"Skaters call this brick-banked spot under the Brooklyn Bridge's Manhattan anchorage 'the Mecca of New York skateboarding.' The vaults it abuts once stored 19th-century wine and, later, Cold War survival supplies against nuclear attack. Landscape architect M. Paul Friedberg designed the wavelike banks - not for skating, and one critic called them 'bleak by design' - but from the mid-1980s they became downtown's go-to. Closed in 2010 for bridge work, they reopened by 2023-25 after petitions drew tens of thousands of signatures, and starred in games like Tony Hawk's Pro Skater 2."},{"name":"Cherry Street","lat":40.711482,"lon":-73.987229,"blurb":"The four-story mansion at 3 Cherry Street was America's first Executive Mansion - George and Martha Washington lived there in 1789, in a house owned by Samuel Osgood, the first Postmaster General, that had already sheltered presidents of the Continental Congress. The street, named for David Provoost's seven-acre cherry orchard, holds more firsts: in 1818 Henry Sands Brooks opened the shop that became Brooks Brothers at Catherine and Cherry, and a long-gone house here was Manhattan's first gas-lit home. Young Irving Berlin once lived at 330 Cherry."},{"name":"Charles Scribner's Sons Building","lat":40.757345,"lon":-73.977687,"blurb":"Look up at 597 Fifth Avenue and you'll spot bronze medallions of four printing pioneers - Benjamin Franklin, William Caxton, Johann Gutenberg, and Aldus Manutius - crowning the piers of Ernest Flagg's Beaux-Arts facade. Built in 1912-13 for Charles Scribner's Sons, its glass-and-iron storefront with black-and-gold trim held the elegant Scribner's Bookstore until 1989. Flagg, who also designed the firm's earlier store downtown, thought highly of this one: 'I think the building is the best thing I ever did.'"},{"name":"Wall Street station (IRT Broadway–Seventh Avenue Line)","lat":40.706724,"lon":-74.009183,"blurb":"Squeezed under William Street - just 40 feet wide - this station has one of the subway's narrowest island platforms. Before it was built, William Street business owners fought the line in court, fearing the tunneling would crack their buildings, most of which rested on shallow foundations sunk only to a layer of quicksand rather than bedrock. To avoid disaster, contractors underpinned every single building along the route. Opened July 1, 1918, it briefly marked the line's end until the Clark Street Tunnel to Brooklyn opened in 1919."},{"name":"Angel Orensanz Center","lat":40.721182,"lon":-73.985791,"blurb":"Built in 1849, this is the oldest surviving synagogue building in New York and the fourth-oldest in the US - and the largest synagogue in the country when it went up, a rare Gothic Revival design modeled on Cologne Cathedral. After its congregations left and vandals moved in by 1974, Spanish sculptor Angel Orensanz bought the abandoned hall in 1986 and made it an arts space. Sarah Jessica Parker and Matthew Broderick married here in 1997, and Philip Glass, Maya Angelou, Arthur Miller, and Mariah Carey have all performed under its 50-foot blue ceilings."},{"name":"Washington Square Village","lat":40.728056,"lon":-73.997778,"blurb":"In March 1895, fire tore through Nikola Tesla's laboratory at 33-35 South Fifth Avenue - now LaGuardia Place, the western edge of Washington Square Village - destroying ten years of his research. The 'tower in a park' apartment complex standing here today came out of Robert Moses's urban-renewal push; locals fought off the broader plan, which would have driven the Lower Manhattan Expressway through the neighborhood. NYU bought the complex in 1964 and still houses faculty and grad students in its primary-colored slabs."},{"name":"East Broadway station","lat":40.713715,"lon":-73.990173,"blurb":"Behind a locked door at the north end of this Lower East Side station lies a ghost: platform and trackway space built for the IND's Worth Street Line, a subway never completed. Opened January 1, 1936, East Broadway ended up honeycombed with closed and half-built mezzanines - one entire level sealed off as storage, another meant to be the phantom line's platform, where the floor drops toward a trackway that runs just 15 feet before hitting a solid wall. An abandoned tower still stands at the platform's end."},{"name":"Elizabeth Street","lat":40.720054,"lon":-73.995195,"blurb":"Once the heart of Little Italy's Sicilian enclave - reputedly the largest gathering of Sicilian speakers anywhere outside Sicily - Elizabeth Street below Canal was co-named Private Danny Chen Way in 2014, for a Chinatown-born soldier who died after being bullied by fellow US soldiers. At the corner of Spring Street stands the old 'Candle Building,' a former stable that IBM's John Simpson packed with Rube Goldberg contraptions and lined with leftover 1964 World's Fair candles, later a legendary canvas for graffiti artists."},{"name":"Rubin Museum of Himalayan Art","lat":40.740096,"lon":-73.997738,"blurb":"Donald and Shelley Rubin spent $22 million in 1998 to buy the Chelsea building that bankrupt fashion emporium Barneys had left behind, keeping its dramatic six-story spiral staircase as the heart of their Rubin Museum of Himalayan Art. Opened in 2004 with more than 1,000 works of Tibetan and Himalayan art, it drew on a collection the couple had built since 1974. After two decades - and budget cuts deepened by the pandemic - it closed on October 6, 2024, to reinvent itself as a global 'museum without walls' of loans and traveling shows."},{"name":"Paula Cooper Gallery","lat":40.747005,"lon":-74.006834,"blurb":"When Paula Cooper opened her gallery at 96 Prince Street in October 1968 with just $4,400, friends told her she was crazy - nobody went downtown. It became SoHo's first art gallery, launching with a benefit for an anti-Vietnam War committee that featured Sol LeWitt's first wall drawing plus Carl Andre, Dan Flavin, Donald Judd, and Robert Ryman - a show now seen as seminal to Minimalism. By 1975 the area had been christened SoHo and held 83 more galleries. Cooper decamped to Chelsea in 1996."},{"name":"One Dag Hammarskjöld Plaza","lat":40.753467,"lon":-73.970028,"blurb":"Andy Warhol's original silver-walled Factory stood on this Second Avenue site from 1963 to 1967, before the 49-story tower rose here in 1972. Named for the UN secretary-general Dag Hammarskjold and designed by Emery Roth, the 628-foot building has become a diplomatic hive: more than a dozen nations - among them France, Italy, the UK, Spain, Canada, Sweden, and Ireland - keep their permanent missions to the United Nations inside it, with a couple of consulates thrown in."},{"name":"3 Park Avenue","lat":40.746456,"lon":-73.980995,"blurb":"The 23-foot bronze 'Obelisk to Peace' at the entrance of 3 Park Avenue was sculptor Irving Marantz's final outdoor work before he died. The 42-story, diagonally set tower - built in 1973 by Shreve, Lamb & Harmon, the same firm behind the Empire State Building - shares its bright-brick block with several small high schools. It replaced the armory of the 71st Regiment, a brownstone pile that Time magazine once dismissed as 'Manhattan's ugly old brownstone' before it came down in the 1960s."},{"name":"Zeckendorf Towers","lat":40.734665,"lon":-73.989146,"blurb":"Rising over Union Square on the site of the old bargain department store S. Klein, the four-towered Zeckendorf complex (1987) is capped by illuminated glass pyramids that glow at night. Hidden on its seventh floor is New York's largest residential green roof - 14,000 square feet planted in 2010 under Bloomberg's green-infrastructure push, meant partly to soak up rain that would otherwise flood the 14th Street-Union Square station below. In the basement, developer William Zeckendorf Jr. gave the nonprofit Vineyard Theatre a home for a dollar a year."},{"name":"Blue Hill (restaurant)","lat":40.73204,"lon":-73.99957,"blurb":"Barack and Michelle Obama had a well-publicized date-night dinner at this Greenwich Village farm-to-table restaurant on May 30, 2009. Opened in 2000 by Dan, David, and Laureen Barber, Blue Hill sources ingredients from the Stone Barns farm upstate, where chef Dan Barber runs a second restaurant. The James Beard Foundation named it an 'Outstanding Restaurant' in 2013. When the pandemic shut down dining in 2020, Barber pivoted to resourcED, boxing up farm ingredients with recipes to keep the kitchen and its suppliers afloat."},{"name":"Christopher Street station (PATH)","lat":40.732988,"lon":-74.006906,"blurb":"When the September 11 attacks destroyed the World Trade Center PATH station, this little Greenwich Village stop became the closest PATH link to New Jersey - ridership more than doubled from 1.3 to 2.7 million a year, and the Port Authority had to make it exit-only during the morning rush. Opened in 1908 as part of the original Hudson & Manhattan Railroad, its free-standing entrance still wears a restored marquee bearing the old 'Hudson Tunnels' name. Down on the platform is Biff Elrod's 1986 mural of riders climbing the stairs."},{"name":"Church of the Holy Communion and Buildings","lat":40.74103,"lon":-73.993709,"blurb":"Richard Upjohn's 1845 design here was the first asymmetrical Gothic Revival church in America, its brownstone blocks laid deliberately at random - 'one of the most influential buildings of the 19th century.' But it's better known for its afterlife: from 1983 nightclub impresario Peter Gatien ran it as the Limelight, the drug-soaked disco that inspired Steve Taylor's song 'This Disco (Used to be a Cute Cathedral).' After the club closed it passed through incarnations as a retail marketplace and, improbably, a gym."},{"name":"New York Foundling","lat":40.738936,"lon":-73.995424,"blurb":"Founded in 1869 by the Roman Catholic Sisters of Charity, this children's charity kept a white wicker cradle just inside its front door for abandoned babies - 45 arrived in the first month alone. From 1875 it ran Catholic 'mercy trains,' eventually placing 1,000 orphans a year with far-flung families. In 1904 nineteen infants sent to Clifton, Arizona were seized within two days by armed white vigilantes; the fight to reclaim them reached the U.S. Supreme Court, which ruled in 1906 that the children would stay where the mob had put them."},{"name":"The Pond and Hallett Nature Sanctuary","lat":40.766265,"lon":-73.974642,"blurb":"In late 2018 a wayward mandarin duck - a species native to East Asia - turned up on this pond and became a global celebrity dubbed 'Mandarin Patinkin.' The adjoining Hallett Sanctuary, Central Park's smallest woodland at just 4 acres, was fenced off as a bird refuge by Robert Moses in 1934 and stayed closed to the public until 2016. Another odd visitor was Hal the coyote, who briefly passed through in 2006. The pond is spanned by the schist Gapstow Bridge, built in 1896."},{"name":"Society for the Lying-In Hospital","lat":40.734726,"lon":-73.983646,"blurb":"Look up: swaddled babies are carved into the windows and spandrels of this 1902 Renaissance Revival building, fitting for a maternity hospital once said to account for 60 percent of all births in Manhattan. J.P. Morgan Jr., worried about the future of the hospital his father had endowed, recruited John D. Rockefeller Jr. and the Bakers to tie it to New York Hospital. It moved out in 1932, and the R.H. Robertson-designed building became offices and apartments in 1985."},{"name":"23rd Street–Baruch College station","lat":40.740179,"lon":-73.986382,"blurb":"One of the original 28 stations of New York's first subway, it opened on October 27, 1904, on the line August Belmont Jr. financed and the IRT ran under a 50-year lease. Express trains still whoosh past its two side platforms on the inner tracks without stopping. The platforms were repeatedly lengthened - by 1948 they could hold ten-car trains - and in 2025 the stop was renamed for nearby Baruch College, after simply being '23rd Street' for 121 years."},{"name":"Beekman Tower","lat":40.753331,"lon":-73.966082,"blurb":"This 26-story Art Deco tower went up in 1928 as the Panhellenic - a club and hotel exclusively for college sorority women - but for lack of patronage it opened to non-sorority women and men by the mid-1930s. Architect John Mead Howells drew on Eliel Saarinen's Tribune Tower design, while Rene Chambellan added Art Deco panels resembling 'frozen fountains.' Its 26th-floor solarium became the Top of the Tower bar in 1940, ran until 2013, and reopened in 2018 as Ophelia."},{"name":"Dyckman Street station (IRT Broadway–Seventh Avenue Line)","lat":40.860928,"lon":-73.925255,"blurb":"When the first subway pushed north to a temporary terminus at 221st Street on March 12, 1906, Dyckman Street was its first open-air station - the stops at 168th, 181st, and 191st weren't finished yet, so shuttle trains ran until express service arrived that May. The opening helped spark the development of Upper Manhattan and Inwood. Listed on the National Register of Historic Places, the station finally became fully wheelchair-accessible in 2023."},{"name":"Museum of Arts and Design","lat":40.767382,"lon":-73.982005,"blurb":"Founded in 1956 as the Museum of Contemporary Crafts under craft patron Aileen Osborn Webb, MAD ignited a fierce preservation war when it moved into 2 Columbus Circle in 2008. Remodeling Edward Durell Stone's distinctive original building drew public objections from Tom Wolfe, Chuck Close, Frank Stella, and Robert A. M. Stern. Brad Cloepfil's terra-cotta-and-fritted-glass redesign more than tripled the museum's space. From 2013 to 2021 it churned through eleven directors, six of them interim."},{"name":"Lesbian, Gay, Bisexual & Transgender Community Center","lat":40.738013,"lon":-74.001058,"blurb":"ACT UP, Queer Nation, the Lesbian Avengers, and GLAAD were all born inside this former West Village schoolhouse, which the city sold to the Center for $1.5 million in 1983. Sixty groups met here in its first year; by the early 1990s it was hosting more than 300. For the 1989 Center Show marking Stonewall's 20th anniversary, Keith Haring painted a work titled 'Once Upon a Time.' The building also briefly housed the Harvey Milk High School and gave refuge to the gay Catholic group Dignity when it was expelled from churches."},{"name":"The Meatball Shop","lat":40.721651,"lon":-73.988822,"blurb":"Daniel Holzman and Michael Chernow, two native New Yorkers, met as teenagers delivering food for the vegan spot Candle Cafe - then built a meatball empire. Holzman, a Culinary Institute grad and Le Bernardin alum, ran the kitchen; Chernow handled branding, and together they published a cookbook in 2011. At its peak the Meatball Shop had eight locations. Battered by Covid, rising rents, and thinner crowds, the last outpost in Hell's Kitchen closed its doors on March 28, 2026."},{"name":"Park Avenue Christian Church","lat":40.779488,"lon":-73.958263,"blurb":"Its Gothic sanctuary, built in 1911 by Cram, Goodhue & Ferguson, was modeled by architect William Heywood on Paris's La Sainte-Chapelle, down to a slender 70-foot spire - and its buttresses let it stand with no steel frame. The east window was designed by Louis Comfort Tiffany (moved from the congregation's old 38th Street home), with more glass by his former employee Mary Tillinghast. Since 2016 it has been led by Rev. Kaji Dousa, the first woman and first Black woman in the role. It even shares its space with a Reform Jewish congregation."},{"name":"Eleanor Roosevelt High School","lat":40.770287,"lon":-73.95327,"blurb":"This small Upper East Side public school picks just 125 to 140 students a year out of more than 6,000 applicants, and is often chosen over the city's elite specialized high schools by teens wanting a more liberal curriculum. Its roughly 500 students hail from over 40 countries. It opened at a temporary Chelsea location with only 105 ninth graders and eight staff, and by 2021 U.S. News ranked it the 81st best public high school in the nation."},{"name":"79th Street","lat":40.772859,"lon":-73.953894,"blurb":"Robert Moses buried the New York Central's West Side railroad here in 1937 under a grand multilevel Henry Hudson Parkway interchange - the covered-over tracks became the graffiti-famous Freedom Tunnel, and the project added the 79th Street Boat Basin. The street has drawn a marquee roster of residents: Michael Bloomberg (in a five-story townhouse), Tom Wolfe, Reggie Jackson, Art Garfunkel, and Eliot Spitzer. At Broadway stands the 1908 Apthorp, and No. 53 houses the New York Society Library, the city's oldest, founded in 1754."},{"name":"Highbridge Park","lat":40.846005,"lon":-73.93195,"blurb":"The park takes its name from the High Bridge (1848), New York City's oldest standing bridge, built to carry the Croton Aqueduct over the Harlem River. George Washington ran his headquarters from the adjacent Morris-Jumel Mansion in the fall of 1776. Former president Grover Cleveland was asked to help appraise the park's land lots in 1889 but declined the job. A trolley-driven amusement park operated here from 1895 to 1914, and Robert Moses opened a huge WPA-funded swimming pool in the park in 1936."},{"name":"Wards Island Bridge","lat":40.786639,"lon":-73.939222,"blurb":"Designed by Othmar Ammann - the engineer behind the George Washington and Verrazzano bridges - this vertical-lift footbridge opened on May 18, 1951 as a pedestrian-only crossing to Wards Island, first planned by Robert Moses back in 1937. Bikes were allowed on in 1967. For years it closed overnight and all winter, a restriction rooted in 1980s fears among East River Houses tenants about patients crossing from the Manhattan Psychiatric Center. A $16.8 million overhaul reopened it around the clock in 2012."},{"name":"Elmer Holmes Bobst Library","lat":40.729429,"lon":-73.997218,"blurb":"NYU's flagship library, designed by Philip Johnson and opened in 1973, is named for pharmaceutical magnate and Nixon confidant Elmer Holmes Bobst. Its dramatic 12-story atrium became notorious after three students jumped to their deaths from the interior crosswalks between 2003 and 2009; the school installed floor-to-ceiling perforated aluminum screens meant to evoke 'the zeros and ones of a digital waterfall.' Jane Jacobs led Village protests against the building, and in 2003 a homeless student secretly lived inside, earning the nickname 'Bobst Boy.'"},{"name":"One High Line","lat":40.744774,"lon":-74.007546,"blurb":"Bjarke Ingels's BIG designed this pair of twisting Chelsea towers on a full-block site HFZ Capital bought for a record $870 million in 2015 - over $1,100 per buildable square foot. The complex holds 247 condos plus a Six Senses hotel; New Zealand billionaire Graeme Hart reportedly paid $34 million for a penthouse. Inspired by the Meatpacking District's punched-window warehouses, the leaning design has been likened to Calatrava's Turning Torso - and less kindly called 'two drunken figures on the verge of keeling over.'"},{"name":"Blockhouse No. 1","lat":40.79867,"lon":-73.956288,"blurb":"Built to defend New York during the War of 1812, this fort was completed just two days before the treaty ending the war was signed, yet never saw combat."},{"name":"Grand Street","lat":40.716328,"lon":-73.987954,"blurb":"Once a Revolutionary War battleground with two fortified hills, this thoroughfare later hosted Stanford White's 1893 Bowery Savings Bank."},{"name":"University Village","lat":40.726944,"lon":-73.998889,"blurb":"NYU's University Village centers on a 36-foot concrete sculpture, the Bust of Sylvette, realized by Carl Nesjar from a Pablo Picasso design. Its three 30-story brutalist towers - two of them the Silver Towers - were designed by I. M. Pei and James Ingo Freed and arranged in a pinwheel around the courtyard, winning awards on their mid-1960s completion. The complex rose from Robert Moses's slum-clearance push under the 1949 Housing Act, and its original towers and courtyard were landmarked in 2008."},{"name":"Rivington Street","lat":40.71857,"lon":-73.983375,"blurb":"The street honors James Rivington, who published one of the colonies' most notorious Loyalist newspapers while secretly running a spy ring that fed intelligence to George Washington. The corner of Rivington and Ludlow appears on the cover of the Beastie Boys' 'Paul's Boutique' and was renamed Beastie Boys Square in 2023. George Burns once lived here, and the second African burial ground in New York lies beneath a nearby park. In the 1980s the block was a notorious 'drug supermarket,' and it's now part of the bar-packed 'Hell Square.'"},{"name":"American Seamen's Friend Society Sailors' Home and Institute","lat":40.738304,"lon":-74.00933,"blurb":"Built in 1908 as a sailors' boarding house across from the Cunard piers, this red-brick West Village landmark sheltered survivors of the Titanic in 1912. Its corner tower was once topped by a beacon, and its 200 guestrooms were tiny - averaging just 50 square feet. Over the decades the ground floor held everything from a bowling alley to the off-Broadway Jane Street Theater. Reborn as the boutique Jane hotel in 2008, it had been renamed the West Village Eurohostel by 2025."},{"name":"Spring Street station (IND Eighth Avenue Line)","lat":40.72554,"lon":-74.004014,"blurb":"Part of the city-built IND, this SoHo station opened on September 10, 1932, its ultramarine-and-cobalt-blue tilework still intact. In 1953 the line briefly ran eleven-car, 660-foot trains through here, but the experiment ended in 1958 because Manhattan's short signal blocks left motormen almost no margin to line up at the platform. One of the northbound exits is built right into the headquarters of the meal-delivery charity God's Love We Deliver. An elevator finally reached the downtown platform in December 2025."},{"name":"79th Street station (IRT Broadway–Seventh Avenue Line)","lat":40.783862,"lon":-73.979992,"blurb":"One of the original 28 stops on New York's first subway, this Upper West Side station opened October 27, 1904, helping spur the neighborhood's growth - the grand Apthorp apartment house was built just outside an exit in anticipation of it. Sadly most of its original Heins & LaFarge tile and mosaic work was long ago replaced with plain cinder block, though the surviving portion is a designated city landmark on the National Register. Express trains bypass it on the inner two of its four tracks."},{"name":"Bowery Savings Bank","lat":40.718921,"lon":-73.995192,"blurb":"Baseball legend Joe DiMaggio was the bank's pitchman from 1972 to 1992, and in 1930 it ranked as the largest savings bank in the United States by deposits. Its 1895 headquarters at 130 Bowery, designed by Stanford White with a Roman-temple interior of Siena marble, set a national trend for temple-style banks and is now the event space Capitale. The bank moved to a basilica-like 42nd Street hall by York & Sawyer in 1923 - today a Cipriani venue. After 1980s deregulation losses, it was sold off and gone by 1992."},{"name":"New York City Marble Cemetery","lat":40.72461,"lon":-73.988896,"blurb":"After yellow-fever outbreaks scared New Yorkers off shallow earthen burials - which the city had actually outlawed - five partners built this East Village graveyard in 1831 with 258 underground Tuckahoe-marble vaults. It was the city's second non-sectarian cemetery, one block and one year removed from the first. President James Monroe was buried here before his 1858 reinterment in Virginia, as was Monitor designer John Ericsson before his remains went to Sweden. The Kip family, namesakes of Kips Bay, rest here too."},{"name":"Rector Street station (BMT Broadway Line)","lat":40.70722,"lon":-74.013342,"blurb":"Opened in 1918, this understated Financial District station sits on a grade, giving its platforms a noticeable slant. Just blocks from the World Trade Center, it was shut for six weeks after the September 11 attacks, reopening on October 27, 2001. A late-1970s overhaul stripped its original mosaic trim for plain white cinderblock, though a few painted-over 'Rector Street' mosaic name tablets still survive at the platform's closed-off north end."},{"name":"David Zwirner Gallery","lat":40.745807,"lon":-74.007033,"blurb":"David Zwirner opened his gallery in 1993 in a SoHo storefront with a one-man show by Austrian sculptor Franz West - and grew it into a global powerhouse the New York Times reported was pulling in $500 million a year by 2018, rivaling Gagosian and Hauser & Wirth. It now spans New York, Los Angeles, London, Paris, and Hong Kong. In 2021 it launched 52 Walker in Tribeca, an autonomous space run by curator Ebony L. Haynes with an all-Black staff and a kunsthalle-style program."},{"name":"New York Marble Cemetery","lat":40.725632,"lon":-73.99098,"blurb":"Tucked inside a block and reachable only through a gated alley off Second Avenue, this is New York City's first non-sectarian cemetery, founded in 1830 as a commercial venture by Perkins Nichols. Playing on yellow-fever fears that had made shallow earthen burial illegal, he built 156 room-sized marble vaults, marked only by name tablets set in the walls - there are no headstones on the lawn. Some 2,100 people lie here, including Erie Canal chief engineer Benjamin Wright and members of old families like the Beeckmans and Lorillards."},{"name":"Lincoln Towers","lat":40.777123,"lon":-73.985949,"blurb":"Robert Moses razed part of the densely populated San Juan Hill neighborhood for this Upper West Side complex, built in the late 1950s as a Le Corbusier-style 'towers in the park' beside the new Lincoln Center. I. M. Pei had proposed a richer mix, but cost-cutting yielded six standardized 28-story slabs with roughly 3,800 apartments on a superblock that severed the street grid. Developer William Zeckendorf was blunt: 'when these towers are torn down, no one will mourn their passing.' Tenants bought their units when it went co-op in 1987."},{"name":"Carver Houses","lat":40.791078,"lon":-73.950368,"blurb":"During construction, crews discovered they were building right over Montague's Creek, a buried stream that once fed the treacherous Hell Gate. Finished between 1955 and 1958 at rents of $12 a room, the East Harlem project honors George Washington Carver, the chemist born into slavery who found endless uses for peanuts and sweet potatoes. Its amphitheater and Isamu Noguchi-inspired climbing sculpture so impressed Brooke Astor at the 1964 dedication that she pledged $1 million for the Riis Houses. In 1970 the Young Lords led tenants in a rent strike."},{"name":"Trump Palace Condominiums","lat":40.767407,"lon":-73.961751,"blurb":"The tallest building on the Upper East Side for 26 years, until 520 Park overtook it in 2017, this 54-story Art Deco pastiche rose on the site of the New York Foundling Hospital. In one of the Trumps' tax dodges, Fred Trump's $15.5 million stake was sold to son Donald in 1991 for just $10,000, masking a hidden gift and evading the 55% gift tax. The New York Times sniffed that the tower 'wants to stick out on the skyline like a prima donna.'"},{"name":"207th Street station","lat":40.864404,"lon":-73.918968,"blurb":"Built in 1906 but held shut until April 1907 because Inwood was still too sparsely settled to bother opening it, this elevated station saw a 1916 crash in which one train telescoped into another, badly injuring a motorman and hurting twelve of the more than 200 riders aboard. Three tracks run through it, though the center one never carries passengers. The 1991 platform artwork, Wopo Holup's 'Elevated Nature,' depicts tree limbs in carved concrete panels."},{"name":"Strip House","lat":40.734305,"lon":-73.993461,"blurb":"Every location of this steakhouse plays on its cheeky name with sultry David Rockwell interiors hung with 1920s burlesque-star portraits from Vienna's Studio Manasse. The original opened in New York in 2000 under the Glazier Group, which filed for bankruptcy in 2010; BR Guest Hospitality bought the brand in 2011, and Landry's swallowed the whole thing in 2016. Locations survive in New York and Las Vegas."},{"name":"103rd Street station (IND Eighth Avenue Line)","lat":40.79613,"lon":-73.961455,"blurb":"This two-level station opened in September 1932 with three fare-control areas, but it's now the only stop on the line with just a single open staircase to the street. The exits to West 104th Street were shuttered as early as November 1932, barely two months after opening, thanks to relentless vandalism; covered directional signs and doorways now leading to storage closets are the ghostly evidence. Northbound and southbound trains stack on separate levels here."},{"name":"William Street","lat":40.704977,"lon":-74.009862,"blurb":"Originally King Street, this is one of Manhattan's oldest lanes, visible on the 1660 Castello Plan of New Amsterdam. It was renamed for Willem Beekman, who sailed over in 1647 as a fellow passenger of Peter Stuyvesant, started out as a Dutch West India Company clerk, and went on to serve nine terms as mayor of the young port. The stepped-gable, red-brick buildings at 13-23 South William were rebuilt in Dutch Revival style around 1900 to evoke that colonial past, and Delmonico's anchors the corner at 2 South William."},{"name":"145th Street station (IRT Broadway–Seventh Avenue Line)","lat":40.8265,"lon":-73.950438,"blurb":"When the New York City Subway opened on October 27, 1904, this was the end of the line, the northern terminus of the original 28 stations, only because the planned terminal at 157th Street sat unfinished, still awaiting paint and plaster. Its reign was brief: trains pushed on to 157th Street barely two weeks later, on November 12, and the line eventually reached 242nd Street in the Bronx by 1908. The center of its three tracks has never carried passengers."},{"name":"Sutton 58","lat":40.758281,"lon":-73.961283,"blurb":"Residents were told the tower next door would be 13 to 30 stories, then shown plans for a 90-story, roughly 1,000-foot Norman Foster spike, so they fought back, raising money and pushing the city to rezone the whole neighborhood with a 260-foot height cap. Developer Bauhouse defaulted on a $147 million loan and went bankrupt in 2016, two days before a foreclosure auction. Gamma Real Estate seized the site and built a slimmer 847-foot tower designed by Thomas Juul-Hansen, finished in 2022."},{"name":"New York Society Library","lat":40.776333,"lon":-73.961451,"blurb":"Founded in 1754, this is the oldest cultural institution in New York City, and while the city was the nation's capital it doubled as the de facto Library of Congress; its ledgers record books borrowed by George Washington, John Adams and Alexander Hamilton. Washington never returned two volumes due in 1789, and the library has offered to waive the roughly $300,000 fine if it can just get them back. During the Revolution, British soldiers looted its collection, tearing pages for musket wadding and selling books for rum."},{"name":"103rd Street station (IRT Broadway–Seventh Avenue Line)","lat":40.799179,"lon":-73.968532,"blurb":"One of the original 28 stations that launched the New York City Subway on October 27, 1904, this Upper West Side stop helped spark the development of Morningside Heights and Harlem; the Hotel Marseilles across the street was built in anticipation of its opening. A new entrance completed in 1912 reused a decorative kiosk that had previously stood at Broadway and 42nd Street serving Times Square. The center of its three tracks is reserved for train storage, never revenue service."},{"name":"66th Street","lat":40.764965,"lon":-73.961078,"blurb":"Lincoln Center rose over the demolished San Juan Hill neighborhood as part of Robert Moses' 1960s urban-renewal push, and the block by ABC's headquarters is co-named Peter Jennings Way for the late anchor. Oddly, West 66th runs westbound even though even-numbered streets usually go east. Grace Kelly and Benny Goodman both lived at Manhattan House, and in 1986 Donald Trump floated a Television City tower here that would have been the world's tallest, 150 stories and 1,910 feet."},{"name":"Bank Street","lat":40.736889,"lon":-74.003388,"blurb":"The street got its name from the Bank of New York, which, fleeing a 1798 yellow-fever outbreak near Wall Street, bought lots here for an emergency branch. In apartment 105, John Lennon and Yoko Ono lived from 1971 to 1973, borrowing neighbor Merce Cunningham's phone to dodge FBI wiretaps, with John Cage and Bob Dylan among their neighbors. Sid Vicious died of a drug overdose at No. 63 in February 1979, and a teenage Lauren Bacall, plus writers Willa Cather and John Dos Passos, all lived on the block."},{"name":"51st Street","lat":40.753874,"lon":-73.964199,"blurb":"At 351 East 51st Street stands an apartment complex on one of several sites where patriot spy Nathan Hale is believed to have been hanged after the Battle of Long Island. Farther west near Eighth Avenue, St. Paul's House glows with a cross-shaped 'Sin Will Find You Out' neon sign that once turned up on Saturday Night Live. The 1.9-mile crosstown street even threads past a quirky pedestrian lane the city officially named Sixth and a Half Avenue."},{"name":"Colonnade Row","lat":40.72928,"lon":-73.992453,"blurb":"These 1830s Greek Revival row houses were faced in Westchester marble cut by convicts at Sing Sing prison, and named LaGrange Terrace after the Marquis de Lafayette's French country estate. Of the original nine, only four survive; residents once included John Jacob Astor III, shipping baron Cornelius Vanderbilt, Washington Irving, and Julia Gardiner, the future First Lady who married President John Tyler. More than half were razed for a Wanamaker's warehouse, and one salvaged column now sits in the Metropolitan Museum of Art."},{"name":"Whitehall Street","lat":40.703,"lon":-74.012986,"blurb":"The Army Building at 39 Whitehall processed nearly three million American inductees from 1884 until the Vietnam War's end, closing after war resisters bombed it twice in the late 1960s. One of the city's oldest streets, laid out around 1626 in Dutch New Amsterdam, it takes its name from Peter Stuyvesant's Governor's House, which the British dubbed the 'Whitehall' after London's seat of government once they seized the colony in 1664. Cass Gilbert's 1907 Custom House still commands its western sidewalk."},{"name":"Comic Strip Live","lat":40.774858,"lon":-73.953696,"blurb":"The oldest stand-up showcase in New York, opened in 1976, this Second Avenue club is where Chris Rock stacked chairs just to earn stage time and Colin Quinn tended bar. In June 2008 it set a Guinness World Record for the longest continuous stand-up show, running past the 50-hour mark with the likes of Jeffrey Ross and Mike Birbiglia. Jerry Seinfeld, who first performed here in 1976, returned in 2017 to shoot his Netflix special 'Jerry Before Seinfeld.'"},{"name":"Trash and Vaudeville","lat":40.726642,"lon":-73.985288,"blurb":"Ray Goodman opened this punk emporium in 1975 at just 18, on St. Marks Place, and it became one of the first U.S. stores to stock the British Doc Martens boot that turned into an international symbol of rebellion. In 1978 the shop stitched the first black skinny jeans, worn by the Ramones and still sold today. The Clash, Bruce Springsteen and Blondie's Debbie Harry all shopped here in punk's golden age; it decamped to East 7th Street in 2016 amid laments about gentrification."},{"name":"Chrystie Street","lat":40.715863,"lon":-73.994878,"blurb":"On June 28, 1776, Thomas Hickey was hanged at the corner of Chrystie and Grand before a crowd of over 20,000 for his part in a plot to kill George Washington. Originally called First Street, it was renamed for Colonel John Chrystie, a War of 1812 veteran. In a grubby mid-1970s loft at 195 Chrystie, Chris Frantz, Tina Weymouth and David Byrne formed and rehearsed Talking Heads; the Beastie Boys later namechecked '59 Chrystie Street,' and Spider-Man's Peter Parker supposedly lived at No. 187."},{"name":"Fanelli Cafe","lat":40.724607,"lon":-73.99875,"blurb":"Pouring drinks at 94 Prince Street since 1847, Fanelli's is reckoned New York's second-oldest food-and-drink spot in one location, behind only the Bridge Cafe and older than both Pete's Tavern and McSorley's. Michael Fanelli bought it in 1922 and put his name up just as Prohibition turned it into a speakeasy. As SoHo shifted from factories to lofts, it became an artists' agora, with painter Chuck Close a regular alongside boxing champ Rocky Graziano and Bob Dylan."},{"name":"Thomas Jefferson Park","lat":40.793254,"lon":-73.935395,"blurb":"Built by the WPA in 1935-36 to designs by Stanley Brogren, this East Harlem pool once held over a million gallons of water and, by one count, could swallow 2,600 swimmers, its diving pool bristling with seven boards until a 1992 conversion to a wading pool. Critic Lewis Mumford praised the landmarked bathhouse as 'sound vernacular modern architecture.' Oddly, the park named for Thomas Jefferson holds no statue of him, only Melvin Edwards' abstract steel sculpture 'Tomorrow's Wind.'"},{"name":"Prince Street station","lat":40.724329,"lon":-73.997702,"blurb":"Along both platforms runs Janet Zweig's 2004 artwork 'Carrying On,' a water-jet-cut steel, marble and slate frieze stretching 1,200 feet with 194 frames of New Yorkers from all walks of life, nearly every one of them carrying something. The SoHo station opened on September 4, 1917, as part of the first stretch of the BMT Broadway Line, back when its platforms could hold only six stubby 67-foot cars before being lengthened for longer trains."},{"name":"Shakespeare garden","lat":40.779817,"lon":-73.96996,"blurb":"A Shakespeare garden cultivates some or all of the 175 plants named in the Bard's works, each usually flagged with the relevant quotation and watched over by a weatherproof bust. The idea has deep roots: in 1631 Sir Thomas Temple sent a servant to Stratford for cuttings from the grapevines at New Place, Shakespeare's retirement home, though his surviving letter never once mentions the poet, praising the vines only on his sister-in-law's word. The genre took off in the 1920s after Ernest Law reconstructed a garden at New Place."},{"name":"569 Lexington Avenue","lat":40.756658,"lon":-73.971425,"blurb":"Morris Lapidus, architect of Miami's Fontainebleau, bent this hotel into an S-shape so he could cram in 800 rooms, reasoning that if a straight line is the shortest distance between two points, a curvy one gives you more. Opened in 1961 as the Summit, Manhattan's first new hotel in three decades, its turquoise brick and dark-green tile drew nearly universal scorn. It rose on the site of a theater built by Oscar Hammerstein I, and since 2022 has housed a student dorm called Found Study."},{"name":"157th Street station","lat":40.834068,"lon":-73.944916,"blurb":"This station jumped the gun: though the subway's first 28 stops opened on October 27, 1904, unfinished paint and plaster kept it dark until two days later, when it threw open for limited service to handle crowds heading to a Yale-Columbia football game at the Polo Grounds. It formally opened November 12, 1904, becoming the line's northern terminus and relieving congestion at 96th Street. In 1906 the line pushed north to 221st Street."},{"name":"10 East 40th Street","lat":40.751539,"lon":-73.981212,"blurb":"On November 14, 2007, this 1929 tower became the very last address unplugged from Thomas Edison's original direct-current grid in New York City, a holdover from an era when 90% of lower Manhattan ran on DC. When it opened it was the fourth-tallest building in the world at 632 feet, owned until his 1938 death by Frederick William Vanderbilt. Its first tenant, Chase Brass & Copper, gave it the nickname the Chase Tower."},{"name":"Firehouse, Engine Company 33 and Ladder Company 9","lat":40.726979,"lon":-73.992514,"blurb":"Ten of the fourteen firefighters this house sent to the World Trade Center on September 11 were killed, one of the department's heaviest losses that day. Home to Engine Company 33 and Ladder Company 9, the Beaux-Arts firehouse at 42 Great Jones Street was built in 1899 by Ernest Flagg and Walter B. Chambers, its grand arched facade a NoHo landmark. Its first steam engine, built by Clapp & Jones, could throw water 215 feet."},{"name":"Stuyvesant Street","lat":40.729888,"lon":-73.989305,"blurb":"Though it looks like it cuts diagonally against the grid, Stuyvesant Street is actually one of Manhattan's few true east-west streets, since the rest of the grid runs nearly 29 degrees off. It once ran straight through Petrus Stuyvesant's farm to his manor house, which burned in 1778; the family's old chapel site became St. Mark's Church in-the-Bowery. Spared as an exception in the 1811 grid plan, this 'Old New York' block hosted Nicole Kidman's apartment in the 2005 film The Interpreter."},{"name":"Soldiers', Sailors', Marines', Coast Guard and Airmen's Club","lat":40.747937,"lon":-73.978239,"blurb":"Co-founded in 1919 by General John J. Pershing along with the wife of Theodore Roosevelt Jr., this Murray Hill club gave U.S. servicemembers cheap lodging and, over the decades, put up more than 2.5 million of them. Among its presidents was Lt. Col. Serge Obolensky, an exiled Russian prince who also ran the company behind the Sherry-Netherland hotel and has a room named for him. Funded entirely by donations and guest fees, it finally closed on the last day of 2018, and the building was sold to the Sisters of Life in 2025."},{"name":"Conservatory Water","lat":40.77422,"lon":-73.967125,"blurb":"This Central Park model-boat pond was immortalized in E.B. White's 1945 Stuart Little, where the mouse-like boy races his toy schooner across it, a scene recreated in the 1999 film. Children have sailed miniature yachts here since the 1860s, and the Central Park Model Yacht Club still docks radio-controlled boats at the Kerbs Boathouse. Overlooking the water from 927 Fifth Avenue, the celebrated red-tailed hawk Pale Male built his nest; the pond even harbors tiny freshwater jellyfish."},{"name":"St. John's Park","lat":40.721247,"lon":-74.007363,"blurb":"Once New York's first private residential square, St. John's Park was a Gramercy-style Eden of townhouses that Trinity Church laid out around a fenced garden, fashionable enough by the 1820s to draw the Hamilton and Schuyler families. Its 'polished elegance' lasted just one generation: in 1866 Trinity sold it to Cornelius Vanderbilt, who buried it under a railroad freight depot. Today the site is swallowed entirely by the Holland Tunnel's exit ramps and closed to the public."},{"name":"Vladeck Houses","lat":40.71272,"lon":-73.981799,"blurb":"This Lower East Side project honors Baruch Charney Vladeck, the general manager of the Yiddish-language Jewish Daily Forward who helped found the Jewish Labor Committee in 1934, served as its first president, and sat on the original board of the New York City Housing Authority. Its twenty six-story buildings, holding more than 1,500 apartments across 13 acres, went up fast, from groundbreaking in September 1939 to completion by November 1940."},{"name":"135th Street station (IND Eighth Avenue Line)","lat":40.817202,"lon":-73.947982,"blurb":"A rare beast: this Harlem station is one of only three in the entire subway system with six tracks side by side on a single level, alongside Brooklyn's DeKalb Avenue and Hoyt-Schermerhorn Streets. The outer tracks serve local trains, the inner ones express, and the middle pair just park trains. It opened in 1932, and in 1997 a Queens-bound A train derailed just north of here, injuring fifteen. Its 137th Street exit is dressed in cathedral-like stone casting from 1932."},{"name":"Dunbar Apartments","lat":40.825066,"lon":-73.938455,"blurb":"John D. Rockefeller Jr. built this Harlem complex from 1926 to 1928 as the first large housing cooperative aimed at African Americans and the city's first big garden-apartment block, its six U-shaped buildings wrapped around a green courtyard. Named for poet Paul Laurence Dunbar, it drew a remarkable roster: polar explorer Matthew Henson, labor leader A. Philip Randolph, W.E.B. Du Bois, Paul Robeson, and tap star Bill 'Bojangles' Robinson. When Depression-era tenants fell behind, Rockefeller foreclosed in 1936 and the co-op became rentals."},{"name":"Abraham Joshua Heschel School","lat":40.772418,"lon":-73.989336,"blurb":"Named for Abraham Joshua Heschel, a towering 20th-century Jewish leader and activist, this pluralistic nursery-to-12th-grade day school competes under the banner 'Heschel Heat.' In 2024 its ultimate frisbee squad won both the city and state titles - the smallest team ever to take the New York state championship and the only Jewish school to do it. When the school added a new building on West End Avenue in 2009, staff nicknamed the design the 'Weird Campus Plan.' A Columbia Law professor took over as head of school in 2014."},{"name":"Consulate General of Russia","lat":40.784507,"lon":-73.957006,"blurb":"This limestone mansion at 9 East 91st Street was built in 1903 for banker John Henry Hammond by Carrere and Hastings, the same firm behind the New York Public Library's main branch. The consulate's darkest drama played out at an earlier location on East 61st Street: in 1948 Soviet teacher Oksana Kasenkina leapt from a third-story window to escape repatriation, was caught by two police officers, and the ensuing furor shuttered the Soviets' New York and San Francisco consulates. Russia's current consulate opened here in 1994."},{"name":"68th Street–Hunter College station","lat":40.767878,"lon":-73.964119,"blurb":"Opened in 1918, this Lexington Avenue local was renamed from plain '68th Street' in 1917 at the request of Hunter College officials. Its long-delayed accessibility upgrade became a saga: neighbors on 69th Street fought the proposed new entrances in 2011-12, claiming the staircases would ruin the block's character, and engineers twice had to relocate the elevator after finding sites structurally infeasible. The finished elevators finally opened in December 2024 - at a cost of $177 million."},{"name":"215th Street station","lat":40.869569,"lon":-73.915188,"blurb":"The northernmost subway stop on Manhattan Island, this elevated Inwood station opened in 1906 as part of the city's very first subway line. It's also the borough's least-used station - just 1,787 riders on an average 2018 weekday, ranking 402nd of 424 systemwide. Four blocks away sit Inwood Hill Park and Columbia University's Baker Field athletic complex, and just north the line crosses the Harlem River Ship Canal on the Broadway Bridge. Wopo Holup's 1991 tree-limb panels 'Elevated Nature' decorate the platform."},{"name":"South Street","lat":40.709379,"lon":-73.994978,"blurb":"Ships once docked bowsprits-out right against this East River waterfront, earning it the nickname the 'street o' ships.' On a single day in 1836, 921 vessels waited to load or unload here, back when New York handled 62% of all U.S. imports - and even the Great Fire of 1835, which destroyed 76 buildings on the street, barely slowed the boom. By the 1930s it had collapsed into Depression poverty, its docks lined with idle drifters, before a 1980s revival transformed it into the South Street Seaport."},{"name":"86th Street station (IRT Broadway–Seventh Avenue Line)","lat":40.788339,"lon":-73.976505,"blurb":"One of the original 28 stations that opened with New York's very first subway on October 27, 1904, this Upper West Side stop was built with decorative tile and mosaic work - though its later platform extensions wear a plainer cinder-block look. Express trains rush past on the inner two tracks while locals stop at the two side platforms. The line was planned in the 1890s and funded by financier August Belmont Jr., whose firm ran it under a 50-year lease as the Interborough Rapid Transit Company."},{"name":"Hester Street","lat":40.717584,"lon":-73.996271,"blurb":"Named for Hester Leisler, daughter of insurrectionist Jacob Leisler - and, through her, the great-great-grandmother of Founding Father Gouverneur Morris - this Lower East Side street became the beating heart of Ashkenazi Jewish immigrant life before Chinatown absorbed it. Sculptor Jacob Epstein grew up at 102 Hester Street, and the block lent its name to Abraham Cahan's 1896 novel and the 1974 film 'Hester Street.' A weekend open-air market, the Hester Street Fair, still runs from April through October."},{"name":"50 West Street","lat":40.707837,"lon":-74.015005,"blurb":"Architect Helmut Jahn wrapped this 778-foot Financial District condo tower in curved glass that runs in one unbroken vertical sweep from street to penthouse - 500 of its 3,000 panels are curved, each costing three to five times more than flat glass, and Jahn claimed no other building uses curved glass in such volume. After Hurricane Sandy flooded the site in 2012, the developers raised the ground-floor sills and added floodgates. Up top, a 64th-floor open-air deck at 734 feet comes with binocular viewers and barbecue stations facing the Statue of Liberty."},{"name":"Church of the Intercession","lat":40.832123,"lon":-73.945305,"blurb":"Founded in 1846 by naturalist John James Audubon, this Gothic Revival church - considered architect Bertram Grosvenor Goodhue's masterpiece - shares its grounds with Trinity Church Cemetery, where Audubon, John Jacob Astor, and Charles Dickens's son Alfred all lie buried. Clement Clarke Moore, author of 'A Visit from Saint Nicholas,' rests here too, honored each December by the city's oldest continuing Christmas tradition. In Steven Spielberg's 2021 'West Side Story,' Tony and Maria sing 'One Hand, One Heart' in a scene filmed here, though the story pretends it's the Cloisters."},{"name":"Varick Street","lat":40.729383,"lon":-74.005202,"blurb":"Named for Richard Varick, New York's mayor from 1789 to 1801, this Hudson Square street holds a piano-world origin story: in 1853 Heinrich Steinweg - soon known as Henry E. Steinway - founded the first American Steinway & Sons factory in a loft at the back of 85 Varick Street. The street was widened in 1917 to extend Seventh Avenue, a project that demolished St. John's Chapel and opened the way for the subway. Today its rightmost lanes feed the Holland Tunnel, where rush-hour backups are routine."},{"name":"28th Street station (BMT Broadway Line)","lat":40.745494,"lon":-73.988691,"blurb":"On August 6, 1927, bombs went off at this station and its Lexington Avenue namesake, injuring numerous passengers; the bomber was never identified, though investigators first suspected Galleanist anarchists, since Sacco and Vanzetti had been denied appeal just three days earlier. Opened in 1918, the station still shows off its original columnless BRT-style mosaics and '28TH STREET' name tablets. A 2001 renovation stripped away 1970s tile to restore that trim, and Mark Hadjipateras's glass mosaic 'City Dwellers' nods to the surrounding Garment and Flower Districts."},{"name":"Unitarian Church of All Souls","lat":40.775326,"lon":-73.958192,"blurb":"New York's first Unitarian congregation sparked in 1819, when Lucy Channing Russell gathered forty friends in her Lower Manhattan parlor to hear her brother, William Ellery Channing, preach en route to the Baltimore sermon that would define American Unitarianism. Its striped red-and-white 1855 sanctuary earned the nicknames 'The Holy Zebra' and 'The Beefsteak Church,' and its pews drew figures like inventor Peter Cooper and novelist Herman Melville. The congregation's current Colonial Revival home, built in 1932, was designed by Hobart Upjohn, grandson of architect Richard Upjohn."},{"name":"St. Michael's Episcopal Church","lat":40.796356,"lon":-73.969079,"blurb":"Elizabeth Schuyler Hamilton, widow of Alexander Hamilton, once worshipped among this Upper West Side parish, founded in 1807 when the area was still rural farmland. In 1895 Louis Comfort Tiffany designed its seven great lancet windows depicting 'St. Michael's Victory in Heaven,' along with a marble altar. The 1891 church rose on a former cemetery - graves were left undisturbed beneath it, including that of its first rector. More than a century later, selling the parish's air rights to build The Ariel towers financed a major restoration."},{"name":"Greenacre Park","lat":40.756273,"lon":-73.969285,"blurb":"This 6,360-square-foot pocket park in Turtle Bay was a 1971 gift from Abby Rockefeller Mauze - daughter of John D. Rockefeller Jr. - and designed by Hideo Sasaki, former chair of Harvard's landscape architecture department. Its centerpiece is a 25-foot waterfall, and with heat-lamp trellises for chilly days it draws some 700 visitors daily. The park starred in William H. Whyte's influential 1980 study 'The Social Life of Small Urban Spaces,' and its guardians have repeatedly waged a 'Fight for Light' campaign against nearby towers that would cast it into shadow."},{"name":"Gracie Square Hospital","lat":40.769709,"lon":-73.952975,"blurb":"Behind the doors of this Upper East Side psychiatric hospital, founded in 1958 by mental-health professional Cynthia Zirinsky and her real-estate-developer husband Richard, lies a startling roster of patients. Jazz pianist Thelonious Monk, singer and activist Paul Robeson, protest songwriter Phil Ochs, crooner Eddie Fisher, poet Anthony Hecht, and actress-singer Audra McDonald all spent time here. Today part of the NewYork-Presbyterian system, it runs specialized programs from mood disorders to ketamine therapy."},{"name":"New York Eye and Ear Infirmary","lat":40.73188,"lon":-73.984581,"blurb":"Founded on August 14, 1820, this East 14th Street institution is America's very first specialty hospital, built to treat diseases of the eye and ear. Two centuries on, it remains one of the world's leading centers for ophthalmology and otolaryngology, with 69 beds handling a quarter-million outpatients and 30,000 surgeries a year. Now part of the Mount Sinai Health System, in 2019 it merged its ophthalmology training with the Icahn School of Medicine to form the nation's largest residency program, and complex eye injuries across the tristate area are referred to its Eye Trauma Service."},{"name":"Grand Hotel","lat":40.747163,"lon":-73.987953,"blurb":"When this Second Empire hotel opened in 1868, designed by Henry Engelbert for carpet magnate Elias Higgins, the surrounding stretch of Broadway was the city's premier entertainment district, packed with theaters and restaurants - and its sleazier side streets soon earned the whole area a lasting nickname, the 'Tenderloin.' Oscar Wilde is known to have stayed here at least twice during his 1882 American tour. As the theater district crept uptown, the Grand slid into life as a cut-rate residential hotel in the Garment District."},{"name":"Manhattan Country School","lat":40.786417,"lon":-73.974657,"blurb":"Founded in 1966 by Gus and Marty Trowbridge and inspired by the leadership of Dr. Martin Luther King Jr., this progressive PreK-8 school built its identity on a diverse student body, sliding-scale tuition, and a working farm 150 miles north in Roxbury, New York, where city kids tended gardens. Its finances unraveled fast: facing foreclosure over $3 million in debt in late 2024, the school filed for Chapter 11 in May 2025, and after a judge rejected an emergency financing plan, it converted to a Chapter 7 liquidation that June."},{"name":"Scarr's Pizza","lat":40.71574,"lon":-73.991569,"blurb":"Founded in 2016 by Scarr Pimentel, who learned the craft at the legendary Lombardi's, this Lower East Side pizzeria does something no other slice shop in New York does: it mills some of its own wheat in the basement daily for its fermented crust, blending it with upstate flour to keep up with demand. The decor - wood paneling, letter boards, fixtures salvaged from a bowling alley - conjures a 1970s-80s neighborhood joint. The New York Times, The New Yorker, Gothamist, and Serious Eats have all named it among the city's best slices."},{"name":"Delacorte Clock","lat":40.768115,"lon":-73.971175,"blurb":"Every half hour outside the Central Park Zoo, a bronze menagerie springs to life on this 1965 clock: a bear on tambourine, elephant on accordion, hippo on violin, and penguin on drums parade around while two monkeys strike the bell overhead. Publisher George Delacorte dreamed it up after seeing medieval automaton clocks like Bern's Zytglogge on a European trip, then commissioned Italian sculptor Andrea Spadini for the animals. Delacorte also gave the park its Alice in Wonderland statue and open-air Delacorte Theater."},{"name":"Center for Jewish History","lat":40.73759,"lon":-73.993718,"blurb":"Behind one Manhattan address sits the largest repository of Jewish history outside Israel - so vast that some call it the 'Jewish Library of Congress.' The Center for Jewish History is a partnership of five institutions, from YIVO to the Leo Baeck Institute and the American Sephardi Federation, that pool their collections while keeping separate governance. The idea came from YIVO chairman Bruce Slovin in the late 1980s, after he realized his organization's un-air-conditioned mansion was endangering priceless archives. It opened in 2000 and later retired its construction debt with a $30 million gift."},{"name":"Sara D. Roosevelt Park","lat":40.719628,"lon":-73.992597,"blurb":"Named in 1934 for Sara Roosevelt, President Franklin Roosevelt's formidable mother - over her own written objection - this seven-block Lower East Side park was designed under Robert Moses and built on ground that had once been an African-American burial ground and, before that, a Dutch Reformed Church cemetery. Today two of its basketball courts are painted in bold colors from a collaboration with artist KAWS and Nike, and its Hua Mei Bird Garden draws songbird owners who gather to show off their birds."},{"name":"Conservatory Garden","lat":40.793677,"lon":-73.952283,"blurb":"Central Park's only formal garden takes its name from a glass conservatory that stood here from 1898 until 1935, when Robert Moses tore the greenhouse down as obsolete. In its place he had landscape architect Gilmore Clarke design a new garden - with planting plans drawn by Clarke's wife, M. Betty Sprout - and WPA workers built and planted it for a 1937 opening. You enter through the ornate Vanderbilt Gate, salvaged from Cornelius Vanderbilt II's demolished Gilded Age mansion at Fifth Avenue and 58th Street. A fallen wasteland by the 1970s, it was gloriously restored in 1987."},{"name":"The Africa Center","lat":40.796342,"lon":-73.949334,"blurb":"Founded in 1984 by Susan Vogel, a former 'Primitive Art' curator at the Met, this East Harlem museum on Museum Mile once, in critic Holland Cotter's words, 'revolutionized the way art, any art, could be exhibited.' Its landmark shows - 'Art/Artifact' in 1988, 'Africa Explores' in 1991 - challenged how Western museums frame African art, helping launch what one critic called a golden age of African art exhibitions. During its 1990s SoHo years, its flowing galleries were designed by architect and artist Maya Lin."},{"name":"Calvary Baptist Church","lat":40.765112,"lon":-73.97837,"blurb":"In 1923 this Midtown church became one of the first anywhere to run its own radio station, and its broadcast 'Tell It From Calvary' still airs on WMCA a century later. Its 1931 home was a pioneering 16-story 'skyscraper church' that doubled as the Hotel Salisbury - and pianist Van Cliburn, who lived in the hotel, donated two Steinway grands to the sanctuary. Richard Nixon and Bill Clinton both worshipped here, while Billy Graham and Billy Sunday preached. The building was demolished starting in 2022 to make way for a 26-story tower."},{"name":"Stuyvesant Cove Park","lat":40.733142,"lon":-73.973986,"blurb":"This 1.9-acre East River park rose from a brownfield - the site of a former ready-mix concrete plant - after neighbors defeated a proposed mixed-use development called Riverwalk. A quirky relic remains: surplus concrete dumped from trucks into the river created a small beach near the end of 20th Street, though it's off-limits to pedestrians. The very activists who fought the development, organized as Citizens United Against Riverwalk, regrouped to raise the funding, and the $8.3 million park opened in 2002 as part of the East River Greenway."},{"name":"Church of St. Luke in the Fields","lat":40.732415,"lon":-74.006988,"blurb":"Poet Clement Clarke Moore - author of 'A Visit from Saint Nicholas' - laid out this West Village church complex in 1821 and served as its first pastor. The parish took its name, 'in the Fields,' to evoke the pastoral quality of a Greenwich Village that was then a rural sanctuary for city dwellers fleeing epidemics. Fire gutted the building in 1981, and architect Hugh Hardy rebuilt it while restoring its original Federal-style touches. During the AIDS crisis, the hard-hit congregation founded a project serving tens of thousands of afflicted people."},{"name":"Henry Street","lat":40.714089,"lon":-73.983186,"blurb":"Named for Revolutionary War hero and philanthropist Henry Rutgers, this Lower East Side street is best known as the birthplace of the Henry Street Settlement, which nurses Lillian Wald and Mary Maud Brewster founded in 1893 to combat the squalor of immigrant tenements. Rutgers's own generosity built the Mariner's Temple at 3 Henry Street in 1845 to serve sailors from the East River docks. Further east stands St. Augustine's Church, raised in 1827-29 out of Manhattan schist. The street remains an immigrant neighborhood, now absorbed into an expanding Chinatown."},{"name":"St. Vincent de Paul Church","lat":40.743602,"lon":-73.993582,"blurb":"This Chelsea church served as New York's national parish for French-speaking Catholics from 1841 until it closed in 2013. It owed its existence to Count Charles de Forbin-Janson, the exiled Bishop of Nancy, who arrived in 1839, found the city's Francophones drifting into Protestant Huguenot churches simply because services were held in French, and challenged them to build their own - kicking in $6,500 of his own fortune to start construction. It was staffed by the Fathers of Mercy, a society formed to re-evangelize a France shattered by its Revolution."},{"name":"Church of Sts. Cyril & Methodius and St. Raphael","lat":40.759017,"lon":-73.996747,"blurb":"Built in 1901-03 as the Church of St. Raphael to serve the poor Irish immigrants of rough-and-tumble Hell's Kitchen, this twin-towered French Gothic church of Manhattan schist has since 1974 been a Croatian national parish offering Mass in Croatian. When its cornerstone was laid in 1902, thousands watched from windows, fire escapes, and rooftops, the whole neighborhood decked in flags and bunting. During the banking Panic of 1907, Archbishop Farley preached here to businessmen, urging them to reassure the public that the banks were solvent. Building the Lincoln Tunnel later gutted the surrounding parish."},{"name":"Sydenham Hospital","lat":40.809858,"lon":-73.953699,"blurb":"New York City's first full-service hospital to hire Black doctors, this Harlem institution opened in 1892 and became a symbol in the fight against segregation. In 1971 Florence Gaynor took over as its director, becoming the first African American woman to head a major teaching hospital. When the Koch administration moved to close it in 1980, angry demonstrators stormed the building and occupied it for 10 days under a self-declared 'People's Administration.' It shut for good that November."},{"name":"Middle Collegiate Church","lat":40.727588,"lon":-73.987895,"blurb":"Its bronze bell, cast in Amsterdam in 1729, was rung to celebrate the signing of the Declaration of Independence and earned the nickname 'New York's Liberty Bell.' The Gothic Revival church, built 1891-92 with stained glass by Louis Comfort Tiffany, traces its congregation to 1628 New Amsterdam, one of the oldest continuous Protestant congregations in North America. A six-alarm fire on December 5, 2020, gutted the sanctuary and blew out the Tiffany windows, but the bell and stone walls survived."},{"name":"Davis Center","lat":40.795965,"lon":-73.954609,"blurb":"Completed in 2025 on the site of Lasker Rink, this Central Park skating-and-swimming facility carries a political backstory: the Trump Organization ran Lasker and nearby Wollman Rink starting in 1987, and a Trump-owned company held the concession until 2021, when Mayor Bill de Blasio severed all city contracts with Trump after the January 6 storming of the U.S. Capitol. The old rink, named for philanthropist Loula Davis Lasker, was long the less-crowded, cheaper alternative to Wollman at the park's poorer northern end."},{"name":"Hamilton Fish Park","lat":40.719793,"lon":-73.980833,"blurb":"Named for former New York governor Hamilton Fish, this Lower East Side park centers on a Beaux-Arts recreation center that Carrere and Hastings designed in 1900, modeling it on Paris's Petit Palais while the same firm was simultaneously designing the New York Public Library's main branch. Its swimming pool, designed by Aymar Embury II, was one of 11 WPA pools that opened across the city in 1936. The rec center was landmarked in 1982; ornamented lions' heads crown the piers of its facade."},{"name":"Third Avenue station (BMT Canarsie Line)","lat":40.733153,"lon":-73.986821,"blurb":"Opened in 1924 under 14th Street, this L-train stop was tapped in 2022 for the MTA's experimental half-height platform screen doors, a pilot announced after several people were shoved onto subway tracks, including one shove that killed a woman at another station. It is one of only two Canarsie Line stations in Manhattan with no transfer to another line, the other being nearby First Avenue. Each platform has its own fare control, so there is no free transfer between directions."},{"name":"The Actors' Temple","lat":40.761305,"lon":-73.989038,"blurb":"This Hell's Kitchen synagogue, officially Congregation Ezrath Israel, became the shul of choice for Jewish entertainers: Sophie Tucker, Milton Berle, Al Jolson, Jack Benny, Edward G. Robinson, Shelley Winters and two of the Three Stooges all worshipped here. Founded in 1917 for local shopkeepers, its congregation shrank from 300 members to roughly 30 by 2009, and it began renting out space for plays to survive. Its rabbi, Jill Hausman, even appeared beside Colin Jost on a season 49 finale of Saturday Night Live."},{"name":"Sullivan Street","lat":40.729194,"lon":-74.000083,"blurb":"Named in 1799 for Revolutionary War Major General John Sullivan (before that it was Locust Street), this Village street has a remarkable roster of former residents: Genovese crime family boss Vincent Gigante, future three-term mayor Fiorello La Guardia (born at 177 Sullivan), Vogue editor Anna Wintour, and avant-garde composer Edgard Varese, who lived at 188 with his wife Louise. St. Anthony of Padua Church stands near the Houston Street corner."},{"name":"Cable Building","lat":40.725921,"lon":-73.99696,"blurb":"Stanford White designed this 1894 Beaux-Arts building as the powerhouse for the Metropolitan Traction Company's Broadway cable cars, with four 32-foot winding wheels in a basement dug 46 feet below the street and driven by Corliss steam engines. The finicky cables frayed and caused runaway cars, and were ripped out for electric traction in 1901. Pop artist Keith Haring kept his studio here from 1982 to 1985, paying $1,000 rent, and the old cable powerhouse in the basement is now the Angelika Film Center."},{"name":"Lincoln Correctional Facility","lat":40.797758,"lon":-73.950628,"blurb":"This minimum-security prison facing Central Park held mostly drug offenders on work release, plus a sliver (about 5%) of white-collar inmates. Before it opened as a prison in 1976, the building had a varied life: a Young Women's Hebrew Association branch housing newly arrived Jewish immigrant women from 1914, then a WWII rest-and-relaxation center for soldiers after the Army bought it in 1942. It closed in 2019 and, after sitting vacant, reopened in 2023 as a temporary site to house asylum seekers."},{"name":"28th Street station (IRT Broadway–Seventh Avenue Line)","lat":40.747217,"lon":-73.993362,"blurb":"Tucked beside a street staircase from the northbound platform is La Noxe, a tiny speakeasy-style bar that opened in October 2020, closed briefly for the pandemic, and reopened in early 2021. The 1-train station opened in 1918 as the IRT extended down Seventh Avenue, part of the reconfiguration that turned the subway from a 'Z'-shaped map into an 'H.' Built atop a former wetland, the station is especially prone to flooding during heavy rains."},{"name":"103rd Street station (IRT Lexington Avenue Line)","lat":40.790298,"lon":-73.947624,"blurb":"East Harlem's heritage shows up in art here: Nitza Tufino's 1990 ceramic mural Neo-Boriken celebrates the neighborhood's Caribbean and Latin American roots, partly funded by a Puerto Rican community group. Opened in 1918, the 6-train station sits on Duffy's Hill, a slope so steep on Lexington Avenue that the fences around each exit stairway step down at different elevations. Once listed among the subway's 69 most deteriorated stations in 1981, it was renovated in 1990 and again in 2015-16."},{"name":"B&H Dairy","lat":40.728423,"lon":-73.988016,"blurb":"This narrow kosher dairy counter has served cheese blintzes, borscht and matzo brei in the East Village since 1938, when it opened in the heart of the Yiddish Theatre District (Molly Picon and Maurice Schwartz were regulars). In a very New York twist, it is now owned and run by an Egyptian Muslim and Polish Catholic couple, Fawzy and Alexandra Abdelwahed. It survived bankruptcy in 1978 and a months-long closure after a nearby 2015 gas explosion and fire, and won a grant in 2022 to restore its landmark facade."},{"name":"Tower 270","lat":40.71428,"lon":-74.006943,"blurb":"The Manhattan Project got its name from this 1930 building: its first headquarters occupied the 18th floor in 1942, where the Army Corps of Engineers' North Atlantic Division sat. General Leslie Groves, fearing the original label 'Laboratory for the Development of Substitute Materials' would draw attention, renamed the effort the 'Manhattan Engineer District,' soon shortened to Manhattan Project, and the name stuck even after coordination moved to Oak Ridge in 1943. Master builder Robert Moses later kept one of his offices here."},{"name":"West Broadway","lat":40.720499,"lon":-74.005356,"blurb":"Once nicknamed \"Rotten Row\" for its 1830s red-light reputation, this street was systematically rebranded through renaming campaigns to improve its tarnished image."},{"name":"Seward Park","lat":40.71483,"lon":-73.98915,"blurb":"The Outdoor Recreation League built America's first permanently municipally constructed playground here in 1903, decades before playgrounds became standard."},{"name":"Our Saviour Roman Catholic Church","lat":40.749234,"lon":-73.979234,"blurb":"When Father George Rutler took over in 2001 he brought back traditional Latin Rite liturgies and commissioned icons by artist Ken Woo, but in 2013 a new pastor stripped out the artwork, drawing protests from both Catholic and art-world circles. Built 1956-59 on Park Avenue, it was the first church in New York City designed to be air-conditioned, with the cooling equipment tucked into its tower. Its Languedoc marble pillars were quarried in southern France and shipped to Italy to be turned, because no lathe near New York was big enough."},{"name":"Reclining Figure (Lincoln Center)","lat":40.773183,"lon":-73.983682,"blurb":"Parks Commissioner Newbold Morris dismissed this Henry Moore bronze as 'junk' and wanted it removed, and other committee members balked at hiring a European sculptor. Moore got the commission in 1961 with a hefty $225,000 fee from Albert and Vera List, visited the site and joked the reflecting pool was as big as a cricket pitch, then built a two-part figure of woman and rock rising from the water. The six-ton, 16-foot bronze was installed in 1965 north of the Metropolitan Opera House, removed in 2007 for a plaza redesign, and reinstalled in 2009."},{"name":"163rd Street–Amsterdam Avenue station","lat":40.836945,"lon":-73.940126,"blurb":"Despite the name, you cannot exit to 163rd Street here: the mezzanine's entire northern half, which held three exits to 163rd Street, was closed by the late 1980s and sealed, its staircases removed. Opened in 1932 on the IND Eighth Avenue Line, the Washington Heights station uses yellow tiles as part of the IND's color-coded system that helped riders navigate away from Lower Manhattan. A 2018 renovation added a glass mosaic by Firelei Baez, Ciguapa Antellana, evoking the artist's Caribbean ancestry."},{"name":"Theater for the New City","lat":40.728614,"lon":-73.984789,"blurb":"This radical off-off-Broadway theater, founded in 1971, has racked up 43 Obie Awards and a Pulitzer: its 1978 production of Sam Shepard's Buried Child became the first off-off-Broadway play to win the Prize. TNC also founded the Village Halloween Parade (with puppeteer Ralph Lee) and gave early roles to unknowns like Tim Robbins, who played the lead in a 1973 The Little Prince, and Vin Diesel, in a 1976 play called Dinosaur Door. Since 1986 it has occupied a former WPA building at 155 First Avenue."},{"name":"4th Street","lat":40.726967,"lon":-73.991266,"blurb":"West 4th Street famously breaks the grid, turning north near Sixth Avenue and crossing West 10th, 11th, 12th and 13th Streets, a leftover of the old Village layout (it was once Asylum Street, after an orphan asylum). Folk history runs deep here: Gerde's Folk City at 11 West 4th hosted Bob Dylan's New York debut in 1961 and Simon & Garfunkel's, and Dylan rented a $60-a-month studio at 161 West 4th. At 147 West 4th, Gertrude Vanderbilt Whitney's 1918 Studio Club, forerunner of the Whitney Museum, gave Edward Hopper his first solo show."},{"name":"Asser Levy Recreation Center","lat":40.735842,"lon":-73.975438,"blurb":"Built 1905-08 to fight tenement sanitary crises, this ornate Roman Revival bathhouse in Kips Bay was inspired by ancient Roman baths and the City Beautiful movement, its twin entrance arches originally separating men (north) and women (south). A terracotta frieze still reads 'free public baths' and 'city of new york.' It honors Asser Levy, one of New York's first Jewish citizens and an outspoken advocate for civil liberties. Architectural historian Robert A. M. Stern likened its arches to portals to a great amphitheatre."},{"name":"Holy Cross Church","lat":40.758153,"lon":-73.991164,"blurb":"The oldest building on 42nd Street, this 1870 Catholic church is best known as 'Father Duffy's Church.' Francis P. Duffy, chaplain of the 'Fighting Irish' 69th Regiment in World War I, became its pastor and in 1932 started a 2:30 A.M. 'Printers' Mass' for the late-shift workers of the Times, Herald Tribune, Daily News and Daily Mirror. He is memorialized by the bronze statue at Times Square's Duffy Square. Inside, Louis Comfort Tiffany designed the mosaics beneath the dome and the transept windows."},{"name":"VA New York Harbor Healthcare System","lat":40.737072,"lon":-73.976899,"blurb":"In June 2021 this system's Manhattan campus in Kips Bay was renamed for Margaret Cochran Corbin, a woman who fought in the Revolutionary War's Battle of Fort Washington, making it the first VA facility in the United States named after a woman veteran. Senator Kirsten Gillibrand and Congresswoman Carolyn Maloney introduced the renaming bill, which was signed into law in January 2021. The system runs medical centers and clinics across four of the five boroughs."},{"name":"North Moore Street","lat":40.719832,"lon":-74.007273,"blurb":"The FDNY's Hook & Ladder No. 8 firehouse at 14 North Moore played the exterior of the Ghostbusters headquarters (the interiors were shot in a Los Angeles station). The street was named in 1790 for Bishop Benjamin Moore, who gave Alexander Hamilton communion on his deathbed, with 'North' added to avoid confusion with an older Moore Street. In 1970 Yoko Ono and John Lennon staged a series of Fluxus art events called GRAPEFRUIT FLUXBANQUET at Joe Jones's music store at 18 North Moore. John F. Kennedy Jr. later lived on the block."},{"name":"All Angels' Church","lat":40.784952,"lon":-73.979997,"blurb":"Founded in the 1830s to minister to Seneca Village, the free Black settlement whose roughly 270 residents were evicted to build Central Park, this Upper West Side Episcopal church later counted children's author Madeleine L'Engle among its congregants. Its old sanctuary was famous for a two-and-a-half-story Tiffany window that bathed the church in golden afternoon light and a pulpit ringed with limestone angels, now preserved in the Metropolitan Museum's American Wing. The 1890 building was demolished in 1979."},{"name":"Metropolitan Community Church of New York","lat":40.755333,"lon":-73.997519,"blurb":"This LGBTQ Christian church in Hell's Kitchen runs Sylvia's Place, an emergency shelter for homeless queer youth, and the Sylvia Rivera Food Pantry, both named for the pioneering transgender activist Sylvia Rivera, who was a parishioner. Part of a worldwide fellowship founded in Los Angeles in 1968 by Reverend Troy Perry, the New York congregation once met inside the city's LGBT Community Center before settling on West 36th Street in 1994. The City Council allocated $400,000 in 2005 to help house youth at the shelter."},{"name":"Jones Street","lat":40.732032,"lon":-74.002476,"blurb":"The cover of Bob Dylan's 1963 album The Freewheelin' Bob Dylan shows him and girlfriend Suze Rotolo strolling arm-in-arm down the middle of this Greenwich Village street on a wintry February day. The name traces to Gardner Jones, whose brother-in-law Samuel Jones deeded a nearby street on condition it bear his name too; to end the confusion of two Jones Streets, Samuel reportedly said, 'Then make mine Great Jones Street.' The block has since appeared in films from Cruising to The Irishman."},{"name":"1 Lincoln Plaza","lat":40.77165,"lon":-73.981324,"blurb":"In January 2012, resident actor Nick Santino killed himself soon after euthanizing his pit bull Rocco, amid what some neighbors described to the press as harassment by building management over the dog. Completed in 1974, the 43-story tower was built around a stubborn holdout: an 1890s tenement at 33 West 63rd Street whose owner refused to sell after developer Paul Milstein balked at a demanded $100,000 charity donation. ASCAP kept its headquarters here from 1974 until 2018."},{"name":"Worth Street","lat":40.717377,"lon":-74.006894,"blurb":"From the corner of Worth Street and Broadway on September 11, 2001, filmmaker Jules Naudet captured the only known footage of American Airlines Flight 11 striking the World Trade Center's North Tower. Once called Anthony Street and running through the notorious Five Points, it was renamed in 1854 for Major-General William J. Worth, a Mexican War hero buried two miles north beneath the monument at Worth Square. One stretch is nicknamed the 'Avenue of the Strongest' for the Sanitation Department headquartered along it."},{"name":"High School of Graphic Communication Arts","lat":40.763843,"lon":-73.990643,"b
