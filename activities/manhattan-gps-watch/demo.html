lurb":"Built in 1959, this Hell's Kitchen vocational school (founded in 1925 as the New York School of Printing) was the first high school in the city to install escalators, and its main entrance holds a mural by Abstract Expressionist master Hans Hofmann. The city voted to close it in 2012 for poor performance, but a legal arbitrator's June 2012 ruling kept it and 23 other schools open, gutting a central plank of Mayor Bloomberg's 'Turn Around' program by finding its staff-overhaul method violated labor contracts."},{"name":"Church of the Blessed Sacrament","lat":40.77711,"lon":-73.981222,"blurb":"This Upper West Side Catholic parish, established in 1887, worships in a church begun in 1914 to designs by Gustave E. Steinback, which held its first mass on Christmas Day 1920. Just east of Broadway on West 71st Street, it once had an unusual downstairs tenant: a performing arts venue called the ArcLight Theatre occupied its lower level."},{"name":"New York School of Interior Design","lat":40.768564,"lon":-73.962464,"blurb":"Founded in 1916 by Sherrill Whiton, this private Upper East Side college is devoted exclusively to interior design, guided by the conviction that 'the successful design of an interior space improves human welfare.' Chartered by New York's Board of Regents in 1924, it only won degree-granting authority in 1976. It opened a LEED-Platinum Graduate Center on Park Avenue South in 2010, and its programs have ranked among DesignIntelligence's top five interior design schools for years."},{"name":"Washington Market Park","lat":40.717029,"lon":-74.011643,"blurb":"TriBeCa residents, including future city councilwoman Kathryn Freed, fought off a city plan to pave a disused dump site into a municipal parking lot, winning a park instead, which opened in April 1983. It is named for the old Washington Market, once New York City's most important wholesale produce market, which peaked between 1880 and 1910 before the trade decamped to Hunts Point in the Bronx and the market buildings were torn down in the 1960s."},{"name":"685 First Avenue","lat":40.747393,"lon":-73.971349,"blurb":"Architect Richard Meier, famous for his gleaming white buildings, went entirely black for this 2019 Murray Hill tower, his first all-black design and tallest New York project. Developer Sheldon Solow built it on land bought from Con Edison after the Waterside Generating Station was decommissioned. As condo sales launched in March 2018, Meier's name was scrubbed from the marketing after five women who had worked with him alleged sexual harassment, and the condominium was rebranded 'One United Nations Park.'"},{"name":"Association Residence Nursing Home","lat":40.798668,"lon":-73.966531,"blurb":"Richard Morris Hunt-the first American trained at Paris's Ecole des Beaux-Arts, who designed the Statue of Liberty's pedestal-built this Victorian Gothic pile in 1881-83 for a charity founded in 1814 to aid widows of Revolutionary War soldiers. At its dedication, the Times reported visitors were so charmed they said they'd 'like to be old women.' Robert Moses wanted it razed; it survived a fire during the 1977 blackout before preservationists prevailed, and it's now North America's largest hostel at 670 beds."},{"name":"Leslie-Lohman Museum of Art","lat":40.721768,"lon":-74.003032,"blurb":"The world's only museum dedicated to LGBTQ art grew out of a 1969 exhibition that Charles Leslie and Fritz Lohman mounted in their Prince Street loft. When the pair sought nonprofit status in 1987, the IRS objected to the word 'gay' in the foundation's name and stalled the application for years, finally relenting in 1990. Its 22,000-plus objects include work by Andy Warhol, Robert Mapplethorpe, David Hockney, Tom of Finland, and David Wojnarowicz."},{"name":"Lucy Drexel Dahlgren House","lat":40.787705,"lon":-73.954555,"blurb":"One of three houses that architect Ogden Codman Jr. designed on this block-another being his own home at No. 7-this 1915-16 mansion went up for Drexel heiress Lucy Wharton Drexel Dahlgren as a suave imitation of a 19th-century French townhouse. In the French manner, its front doors don't open into the house at all: they lead to a porte-cochere, an outdoor courtyard, and a garage paved in herringbone brick. A private home that later served for a time as a convent, it's now a city landmark."},{"name":"Thompson Street","lat":40.729056,"lon":-73.999138,"blurb":"Named for Revolutionary War Brigadier General William Thompson, this Village-to-SoHo street was once thick with mob royalty: Genovese boss Vincent 'the Chin' Gigante lived here, as did Bonanno acting boss Carmine Galante and Genovese figures Thomas Eboli and Anthony Strollo. Subway shooter Bernhard Goetz lived at No. 211, Frank Zappa at No. 180. Today No. 230-once the Village Chess Shop-is the Uncommons, Manhattan's first board game cafe, and No. 181 houses the restaurant Carbone."},{"name":"Charles Street","lat":40.73476,"lon":-74.004064,"blurb":"In March 1970, a year after Stonewall, police raided the gay bar the Snake Pit and hauled 167 people to the 6th Precinct at 135 Charles Street; an Argentinian immigrant named Diego Vinales, terrified, leapt from a third-story window and was critically injured, drawing a 500-strong protest march to the building. The street, named for landowner Charles Christopher Amos, also holds No. 159-the last of nine Greek Revival houses on the site of the old Newgate Prison-and Jon Bon Jovi bought a condo at No. 150 in 2015."},{"name":"Film Center Building","lat":40.759916,"lon":-73.991156,"blurb":"Purpose-built in 1928-29 for New York's film trade-then clustered around Times Square-this Art Deco tower by Ely Jacques Kahn packed in nearly 100 film vaults plus offices for studios like Metro-Goldwyn-Mayer. Kahn's lobby, now a city landmark, is one of his most striking interiors, its walls and ceilings styled to resemble tapestries and laced with pre-Columbian motifs and multicolored geometric details. By mid-century, television and independent producers had moved in alongside the movie men."},{"name":"145th Street Bridge","lat":40.819615,"lon":-73.934113,"blurb":"Alfred Pancoast Boller modeled this Harlem River swing bridge on his own Macombs Dam Bridge, tweaking the design to handle growing water traffic. Construction started in 1901 but stalled when the 145th Street subway station had to be built beneath one of its piers; the $2.75 million span finally opened in 1905. Once known as the 'Lenox Avenue Bridge,' a name now forgotten, it's a sleepy crossing today-it swung open for passing vessels just 23 times between 2000 and 2014."},{"name":"University Heights Bridge","lat":40.863067,"lon":-73.915569,"blurb":"This swing bridge has led two lives: it opened in 1895 a mile north as the Harlem Ship Canal Bridge, carrying Broadway-the same canal that severed Marble Hill from the rest of Manhattan Island-then was floated south to University Heights in 1908. Its movable central span still pivots around a small masonry island anchored into the riverbed bedrock. Engineer William Hubert Burr designed it, but he credited Alfred Pancoast Boller for the aesthetics; Boller argued ornament enhanced a bridge 'at a very small cost.'"},{"name":"Church of the Ascension, Episcopal","lat":40.733787,"lon":-73.995751,"blurb":"The first church built on Fifth Avenue (1840-41, Richard Upjohn's Gothic Revival), this was where President John Tyler quietly married Julia Gardiner in 1844-she was so much younger that John Quincy Adams sneered the couple were 'the laughing-stock of the city.' Stanford White remade the interior in the 1880s, crowning it with John LaFarge's 30-foot mural The Ascension. After the 1929 crash, rector Donald Aldrich threw the doors open 24 hours a day for prayer, earning it the nickname 'The Church of the Open Door.'"},{"name":"Holy Trinity Lutheran Church","lat":40.772069,"lon":-73.97941,"blurb":"In the 1984 Ghostbusters climax, the rampaging Stay Puft Marshmallow Man tramples this Central Park West church, prompting Peter Venkman's cry, 'Nobody steps on a church in my town!' Founded in 1868 after breaking from St. James's, it was one of very few English-speaking Lutheran congregations in a then-heavily-German city. Since 1968 it has hosted the Bach Vespers series-the first place in America where Bach's cantatas could be heard regularly on the very day the composer assigned them."},{"name":"Liz Christy Garden","lat":40.724241,"lon":-73.992152,"blurb":"New York's first and oldest community garden began in 1973 when Liz Christy talked the city into renting her this trash-strewn Bowery lot for a dollar a month; she founded the Green Guerillas and rallied volunteers to build it. Renamed in her honor after she died of cancer in 1985, it hides a startling amount of life behind the traffic din-two ponds with fish and turtles, a perennial lotus, and the tallest Dawn Redwood tree in the entire city. It was the first winner of the American Forestry Association's Urban Forestry Award."},{"name":"DeWitt Clinton Park","lat":40.768201,"lon":-73.994268,"blurb":"From 1902 to 1932 this Hell's Kitchen park held New York's first children's farm garden-356 tidy vegetable plots, each handed to a neighborhood 'little farmer' and championed by Frances Griscom Parsons. Named for the governor who opened the Erie Canal, the park later lent its name to the neighborhood, rechristened 'Clinton' in 1959. When a swath was carved off in 1932 for the West Side Elevated Highway, the excavated earth was trucked to Central Park to help create the Great Lawn."},{"name":"Sylvan Place","lat":40.801085,"lon":-73.938923,"blurb":"This ghost of a street-its signage still bolted up-was once part of the East Post Road, the colonial highway that ran from the city all the way to Boston. Where it met the Kingsbridge Post Road, Harlem Road, and Church Lane, a five-cornered junction gave the surrounding East Harlem area its old nickname, the 'Five Points'-not the notorious downtown slum of the same name. Sylvan Place's ground is now Harlem Art Park and the Harlem Courthouse frontage; the 1880s townhouses of Sylvan Court still stand across the way, unrestored."},{"name":"Institute of Audio Research","lat":40.733026,"lon":-73.993771,"blurb":"For nearly five decades this NYC audio school turned novices into recording engineers in about a year, its faculty stacked with Grammy, Emmy, Tony, and Oscar honorees. Its alumni rippled through music: hit-making producer Benny Blanco, Coheed and Cambria frontman Claudio Sanchez, veteran producer Jack Douglas, and Larry Harlow of the Fania All-Stars all passed through. Founded in 1969, it closed in 2017 after 48 years before partly resurfacing at Long Island's Five Towns College in 2022."},{"name":"Southbridge Towers","lat":40.709287,"lon":-74.003507,"blurb":"When dog-owning tenants defied this co-op's no-pet clause, complaints piled up-of neighbors afraid to share elevators with big dogs and of messes in the stairwells-until a 1973 court fight produced a plan of 'compassion': original residents could keep their dogs for $15 a month, but no new ones were allowed in. Built 1965-71 as a Mitchell-Lama affordable co-op of four 27-story towers and low-rises totaling 1,651 apartments, it anchored a Lower Manhattan slum-clearance push before residents voted to privatize in 2015."},{"name":"Third Avenue Bridge","lat":40.806983,"lon":-73.933596,"blurb":"During a 2024 heat wave, this Harlem River swing bridge expanded in the heat, jammed open, and had to be hosed down by the FDNY until it cooled enough to close. Carrying southbound Third Avenue traffic between Manhattan and the Bronx, it went one-way in 1941 on the very same day the nearby Willis Avenue Bridge was flipped to one-way northbound. Its current swing span was floated into place in 2004-dramatic enough that the Discovery Channel built a Mega-Builders episode, 'Spanning the Harlem,' around it."},{"name":"Jewish Center","lat":40.787242,"lon":-73.973239,"blurb":"Members affectionately dub it 'the first Shul with a Pool,' America's first synagogue built as a cultural and recreational home, not just a sanctuary."},{"name":"Andy Kessler Skatepark","lat":40.805059,"lon":-73.970569,"blurb":"Manhattan's first full-sized public skatepark, built in 1995-96 by skateboarder Andy Kessler with help from teenagers of Harlem and the Upper West Side."},{"name":"Springs Mills Building","lat":40.753448,"lon":-73.985933,"blurb":"This glassy hexagonal tower, an early International Style landmark by Harrison & Abramovitz (1961-63), rose for Springs Mills-then America's largest maker of bedsheets and pillowcases and parent of the Springmaid and Wamsutta brands-though the company filled only a quarter of it and leased the rest to rival textile firms. Its two facades follow different rulebooks: the 40th Street side obeys the new 1961 Zoning Resolution, the 39th Street side the older 1916 code. It replaced the neoclassical Maxine Elliott's Theatre."},{"name":"Maritime Hotel","lat":40.742436,"lon":-74.003867,"blurb":"Those portholes are no gimmick: architect Albert C. Ledner designed this white 'pizza box' building in the 1960s for the National Maritime Union. When the union collapsed with the decline of the Port of New York, the building became Covenant House's shelter for runaways, then in 1994 passed to the Chinese government, which ran it as a center housing visiting Chinese artists, students, and businessmen. Nightclub impresarios Sean MacPherson and Eric Goode bought it for $19 million in 2001 and reopened it in 2003 as a nautical-themed boutique hotel."},{"name":"The Mysterious Bookshop","lat":40.714889,"lon":-74.009276,"blurb":"Fittingly, this mystery specialist opened on Friday the 13th in April 1979, making it one of the oldest crime-fiction bookstores in the country. Run by editor-publisher Otto Penzler, it doubles as a publishing house, issuing leather-bound limited editions and its Bibliomystery series of novellas about murders tied to books and collecting-one of which, by John Connolly, won the 2014 Edgar Award for best short story. After 25 years on West 56th Street, it decamped to Tribeca in 2005."},{"name":"Madison Avenue Bridge","lat":40.814307,"lon":-73.934709,"blurb":"Every November, thousands of New York City Marathon runners pound across this Harlem River swing bridge for the race's final leg, returning to Manhattan from a short loop through the South Bronx that they entered via the Willis Avenue Bridge. Designed by prolific bridge engineer Alfred P. Boller and built in 1910, it doubled the capacity of an earlier swing bridge that had stood on the site since 1884. It carries East 138th Street traffic and a clutch of local and express bus routes between the two boroughs."},{"name":"High School for Health Professions and Human Services","lat":40.732672,"lon":-73.982579,"blurb":"Set in the old Stuyvesant High School building on East 15th Street, this health-careers school runs so crowded that starting times are staggered across triple sessions from 7:20 to 9 a.m. Its curriculum leans hard into science-four years each of math and science, a medical-assisting track ending in a state licensing exam, and a research program whose top students work with hospital mentors and occasionally reach the Intel Science Talent Search. The student body is about 70% female; singer Adrienne Bailon of 3LW and The Real is an alum."},{"name":"New York City Fire Museum","lat":40.725576,"lon":-74.006935,"blurb":"Housed in a beaux-arts 1904 firehouse that once quartered Engine Company 30, this museum guards over 10,000 objects tracing firefighting from 1650s bucket brigades to modern engines-so many that only about 3% is on view at once. Its most solemn space is a permanent memorial to the 343 FDNY members who died on September 11, complete with artifacts pulled from the World Trade Center site. The collection's roots reach to 1870; it opened in its Spring Street home in 1987 and closed temporarily in 2024 over structural concerns."},{"name":"85th Street","lat":40.775223,"lon":-73.947571,"blurb":"This crosstown street stacks up an astonishing roster: Park Lane Tower at No. 185, with its rounded corner balconies, opened every episode of The Jeffersons (1975-85); Tropic of Cancer author Henry Miller was born on the top floor of No. 450 East in 1891; and Harriet the Spy author Louise Fitzhugh lived at No. 524. Darker still, the German American Bund-an American Nazi outfit-kept its national headquarters at No. 178 from 1936 into the early 1940s, sometimes parading the block in Nazi uniforms."},{"name":"Forsyth Street","lat":40.713412,"lon":-73.993795,"blurb":"Named in 1817 for Lt. Colonel Benjamin Forsyth, this Lower East Side street threads from Houston down to Henry, its southern end running in the literal shadow of the Manhattan Bridge through Chinatown, where a greenmarket sets up beneath the span. The street is broken for a block north of Canal by a 20th-century schoolhouse-now Pace University High School and I.S. 131-built right across its old route. Farther north, Sara D. Roosevelt Park buffers it from parallel Chrystie Street."},{"name":"Hotel Wolcott","lat":40.746621,"lon":-73.986705,"blurb":"Designed by John H. Duncan-the architect of Grant's Tomb-this ornate 1904 Beaux-Arts hotel once counted a remarkable set of permanent residents: Mark Twain, Edith Wharton, dancer Isadora Duncan, tobacco magnate James Buchanan Duke and his daughter Doris, and Henry Miller all lived here. Its developer, William C. Dewey, fared worse, losing the building to foreclosure within months of its opening. By 1975 the Wolcott had slid into a single-room-occupancy flophouse; it later became a budget hotel and, in the 2020s, a temporary shelter."},{"name":"Bohemian National Hall","lat":40.769123,"lon":-73.956427,"blurb":"In 2001 the Bohemian Benevolent & Literary Association sold this five-story neo-Renaissance hall to the Czech government for exactly one dollar, on the condition that Prague foot the renovation bill. Built 1895-97 by architect William C. Frohne as a Czech American social club, it was the birthplace of the Manhattan Theater Club and reopened in 2008 after a gut renovation. Today it packs in the Czech Consulate, an art gallery, a ballroom, a roof terrace, and the Czech restaurant Hospoda."},{"name":"Central Park Place","lat":40.767098,"lon":-73.983012,"blurb":"This 628-foot gray-green glass tower one block south of Columbus Circle was deliberately tinted to echo nearby Central Park, though critic Carter Horsley sniffed that the pale green 'is a bit weak-looking.' Developer William Zeckendorf Jr. started assembling the site in 1982, demolishing a single-room-occupancy hotel called the Alpine and paying the city $2.29 million to do it. Completed in 1988 with 300 condos and near-full-height bay windows, it was almost fully occupied within two years."},{"name":"The Dairy","lat":40.769106,"lon":-73.973704,"blurb":"Calvert Vaux designed this Gothic Revival cottage as part of Central Park's Children's District, where kids could buy milk (from cows originally stabled in the basement) and borrow board games, until a tainted-milk scandal tightened the rules. Political pressure from Boss Tweed turned it into a restaurant; Robert Moses later reduced it to a storage shed, and by 1950 tree branches were poking through its roof. Restored beginning in 1979 with help from Revlon, it is now one of the park's visitor centers."},{"name":"West End Collegiate Church","lat":40.783039,"lon":-73.981554,"blurb":"Architect Robert W. Gibson modeled this 1892 church on the 1606 Vleeshal (meat market) of Haarlem, right down to the long thin brown Roman brick and buff terra-cotta, planting a slice of the old Dutch Republic on the Upper West Side. It belongs to America's oldest continuously organized Protestant congregation, and during World War II it served as a hub for Dutch refugee relief, drawing two visits from Princess Juliana of the Netherlands. Three of its stained-glass windows are by Tiffany Studios."},{"name":"70 Vestry","lat":40.723254,"lon":-74.011036,"blurb":"Robert A.M. Stern wrapped this 13-story Tribeca building in limestone, and the resident list reads like a tabloid: Tom Brady and Gisele Bundchen bought in for $25.5 million in 2018, then flipped it for $36.8 million in 2020 when Brady decamped to Tampa Bay. Formula One driver Lewis Hamilton paid $40 million for a unit in 2019, and Julia Haart of Netflix's My Unorthodox Life bought a penthouse with her husband in 2018. The largest apartment, over 10,000 square feet, was priced at $65 million."},{"name":"Temple Israel of the City of New York","lat":40.772569,"lon":-73.961848,"blurb":"Founded in 1873 by German Jewish shopkeepers as Yod b'Yod, or 'Hand in Hand,' this was the first synagogue in Harlem, its congregation first worshiping above a printing shop on East 125th Street. An early trustee was Cyrus L. Sulzberger, father of the New York Times publisher Arthur Hays Sulzberger. In a century and a half the congregation has been served by only five senior rabbis. It moved to the Upper East Side in 1967 into a stark Brutalist building on East 75th Street."},{"name":"Wooster Street","lat":40.724215,"lon":-74.001094,"blurb":"Named for Revolutionary War general David Wooster, this cobblestoned SoHo street with flagstone sidewalks is a favorite for on-location filming and photo shoots thanks to its low traffic and gritty old-world feel, and it even appeared as a rainy night scene on a 2021 New Yorker cover. It is home to the experimental Wooster Group theater company at the Performing Garage, 33 Wooster Street. Residents have included Claire Danes and Hugh Dancy, Whoopi Goldberg, and Smashing Pumpkins frontman Billy Corgan."},{"name":"19 Dutch","lat":40.709811,"lon":-74.007377,"blurb":"Amancio Ortega, the founder of Zara and one of the world's richest men, snapped up this entire 63-story Financial District tower in July 2022 for around $500 million, through his holding firm Pontegadea. Completed in 2019 at 758 feet, 19 Dutch holds 483 apartments (including 97 affordable units) above ground-floor retail. It was built by Carmel Partners, which put it up for sale barely three years after finishing it."},{"name":"Church of the Holy Apostles","lat":40.749225,"lon":-73.998787,"blurb":"Rumored to have been a stop on the Underground Railroad, this 1840s Chelsea church is the only surviving Manhattan work of architect Minard Lafever. It has long worn its activism openly: it sheltered Congregation Beit Simchat Torah, a synagogue for gays and lesbians, hosted the ordination of Ellen Barrett, the first woman (and openly lesbian) priest in the New York Episcopal diocese, and in 1982 launched the Holy Apostles Soup Kitchen. A 1990 fire destroyed some stained glass, but the church was restored by 1994."},{"name":"La Scuola d'Italia Guglielmo Marconi","lat":40.787292,"lon":-73.955033,"blurb":"Established in 1977 by Italy's Ministry of Foreign Affairs, La Scuola d'Italia is the only bilingual English-Italian preK-through-grade-12 day school in North America, named for radio pioneer Guglielmo Marconi. It occupies a French-style mansion at 12 East 96th Street that was built by Robert L. Livingston and designed by the society architect Ogden Codman Jr. The New York State Association of Independent Schools accredited it in 2006, and the Italian government accredits it as well."},{"name":"The Town School","lat":40.768318,"lon":-73.949778,"blurb":"This Upper East Side elementary school began in 1913 as Miss Hyde's School, a nursery that Hazel Hyde ran on East 81st Street; after she resigned in 1936, it was renamed The Town School. Since 1963 it has sat on an East 76th Street cul-de-sac overlooking the East River, and it wears its green credentials proudly, installing solar panels in 2009 and, in 2012, becoming the first New York City school to put up a wind turbine. Tuition now tops $55,000 a year for the upper grades."},{"name":"Downtown Community Television Center","lat":40.717373,"lon":-74.001273,"blurb":"Documentary filmmaker Jon Alpert and his wife Keiko Tsuno founded this community media center in 1972, and since the 1980s it has occupied a landmarked 1895 firehouse, the former Engine Company 31, at 87 Lafayette Street. Its own documentaries have won 16 national Emmy Awards, and the earnings help fund free and low-cost production classes for people from underprivileged backgrounds. In 2022 it opened Firehouse Cinema, an art-house theater screening documentaries only."},{"name":"Baxter Street","lat":40.715752,"lon":-74.000462,"blurb":"Once called Orange Street, this narrow Chinatown-Little Italy lane was the spine of the notorious Five Points slum, and it is where tap dance was reportedly born, invented by competing Black and Irish dancers in a tavern at No. 67. It was renamed in 1854 for Charles Baxter, a state legislator killed as a lieutenant colonel at Chapultepec during the Mexican-American War. A boy gang called the Baxter Street Dudes even ran their own Grand Duke's Theatre here in the 1870s, and Jacob Riis later photographed its 'Dens of Death.'"},{"name":"Charlton–King–Vandam Historic District","lat":40.727222,"lon":-74.004722,"blurb":"This pocket of Federal-style row houses, the city's largest concentration, sits on the former Richmond Hill estate, whose 1767 mansion served as George Washington's Revolutionary headquarters and later as Vice President John Adams' residence. Aaron Burr bought the property, threw lavish parties there, and in 1797 mapped it into lots, laying out the grid that became Charlton, King, and Vandam Streets. After his fatal duel with Alexander Hamilton, Burr lost the estate to land baron John Jacob Astor, who paid him off in 1817 and developed the blocks."},{"name":"University Place","lat":40.732453,"lon":-73.994063,"blurb":"This short Greenwich Village street was once just an extension of Wooster Street until it was renamed in 1838, a year after New York University opened its first building on Washington Square. It has a heavyweight academic past: the Union Theological Seminary was founded here in 1838, and the New York Society Library moved in by 1856. Today its cafes, shops, and restaurants largely cater to students from NYU and The New School."},{"name":"George F. Baker Jr. Houses","lat":40.784896,"lon":-73.954166,"blurb":"This trio of neoclassical mansions on East 93rd Street was assembled by banker George F. Baker Jr., who bought stockbroker Francis Palmer's 1918 Delano & Aldrich house in 1926 and kept expanding, adding a ballroom wing, a garage with staff quarters, and eventually a whole townhouse next door for his father, who died before he could move in. Edith Baker later donated two ballroom chandeliers, each with about eighty rock-crystal prisms, to the White House. In 1958 the complex was sold to the Russian Orthodox Church Outside of Russia, which turned the ballroom into a cathedral."},{"name":"Teardrop Park","lat":40.71678,"lon":-74.015619,"blurb":"Hemmed in by tall residential towers, this shady 1.8-acre Battery Park City park got a clever fix for its perpetual gloom: its southern expansion installed three eight-foot solar mirrors, or heliostats, atop a nearby apartment building to bounce sunlight down onto the play area. Designed by Michael Van Valkenburgh and opened in 2004, it features a stacked rock wall of New York State stone rigged with a water source so icicles form in winter, plus a short tunnel that pays homage to Olmsted's Central Park passages. Artist Ann Hamilton created a rock installation for it."},{"name":"Holy Trinity Episcopal Church","lat":40.778345,"lon":-73.949565,"blurb":"The 1887 hiring of an English clergyman, E. Walpole Warren, as this parish's rector became the subject of the notable Supreme Court case Church of the Holy Trinity v. United States. The congregation began at Madison Avenue and 42nd Street, in buildings designed by Jacob Wrey Mould and then Leopold Eidlitz, before merging with St. James in 1895 and demolishing that church. The present Yorkville church was built from 1895 to 1899 on the former Rhinelander Farm, on land donated by Serena Rhinelander, and became its own parish in 1951."},{"name":"Allerton Hotel for Women","lat":40.760795,"lon":-73.969593,"blurb":"Built in 1923 to house hundreds of working women and shelter young girls, the Allerton chain was named for Mayflower passenger Mary Allerton."},{"name":"Abingdon Square Park","lat":40.737268,"lon":-74.005387,"blurb":"At a quarter-acre, this is one of New York's oldest and smallest parks, carved from the 300-acre estate Sir Peter Warren bought in 1740. It is named for his daughter Charlotte, who married Willoughby Bertie, the 4th Earl of Abingdon, and got the land as a wedding gift, and while most British place names in Manhattan were scrubbed after the Revolution, Abingdon Square kept its name thanks to the couple's well-known patriot sympathies. Calvert Vaux helped redesign it in the 1880s, and a small garden memorializes filmmaker Adrienne Shelly, murdered in her office nearby."},{"name":"Incarnation Children's Center","lat":40.843329,"lon":-73.9366,"blurb":"From the late 1980s through 2005, HIV-positive foster children at this Catholic-affiliated Washington Heights nursing facility were enrolled in clinical trials of antiretroviral drugs, treatment that sharply cut the AIDS death rate. A 2005 BBC documentary, 'Guinea Pig Kids,' alleged ethical violations, prompting an investigation by the Vera Institute of Justice, which found that no children had died as a result of the trials but that the center kept poor records. The BBC later apologized, conceding the film was misleading and biased toward AIDS denialists."},{"name":"Grey Art Museum","lat":40.729947,"lon":-73.996123,"blurb":"In 1983 this NYU museum became the first institution in the United States to mount a major Frida Kahlo exhibition. It grew from a 1973 gift of a thousand artworks from collector Abby Weed Grey, heavy on modern Iranian and Turkish art. For decades it sat in NYU's Silver Center, on the site of the original University Building where Samuel F. B. Morse founded the first academic art department in America and Samuel Colt and Winslow Homer once worked, and where, from 1927 to 1943, A. E. Gallatin ran the first American museum devoted solely to modernist art. It reopened at 18 Cooper Square in 2024."},{"name":"Langston Hughes House","lat":40.807199,"lon":-73.940536,"blurb":"For the last two decades of his life, from 1947 to 1967, the poet Langston Hughes kept his workroom on the top floor of this 1869 Italianate brownstone in Harlem, a house owned by his adopted uncle and aunt, Emerson and Ethel Harper. It was here that Hughes wrote Montage of a Dream Deferred and his memoir I Wonder as I Wander. The narrow rowhouse, just 20 feet wide, became a city landmark in 1981 and was being restored as of 2026."},{"name":"Church of the Ascension, Roman Catholic","lat":40.801866,"lon":-73.966329,"blurb":"This Upper West Side Catholic church has moonlighted as a movie and TV set: it appeared in the 2000 comedy Keeping the Faith and stood in as 'Trinity Church' in a first-season episode of White Collar. Built in 1896-97 by the German American firm Schickel & Ditmars, its midblock design is a Sicilian Romanesque hybrid of Norman and Byzantine styles. The parish dates to 1895 and once boasted a Muller & Abel pipe organ installed in 1898."},{"name":"89th Street","lat":40.777855,"lon":-73.945675,"blurb":"The stretch of East 89th Street between Fifth and Madison is co-named Fred Lebow Place for the founder of the New York City Marathon, and the block fittingly holds the offices of the New York Road Runners. The street is a parade of institutions: the Dalton, Dwight, and Abraham Joshua Heschel schools, the former Isaac Rice Mansion (now a yeshiva), and the National Academy of Design. Its western end terminates grandly at the marble Soldiers' and Sailors' Monument overlooking the Hudson."},{"name":"Ukrainian Museum","lat":40.727662,"lon":-73.989765,"blurb":"The largest museum of Ukrainian art and culture outside Ukraine got its start in 1976, founded by the Ukrainian National Women's League of America and paid for by the Ukrainian-American community. Its East Village home on 6th Street, designed by Ukrainian-American architect George Sawicki, brims with intricately painted pysanky Easter eggs, folk costumes, and works by modernist sculptor Alexander Archipenko. In spring 2024 it mounted 100 works by folk artist Maria Prymachenko, the largest showing of her art anywhere outside Europe."},{"name":"St. Brigid Roman Catholic Church","lat":40.725386,"lon":-73.980626,"blurb":"Built in 1848 by Irish shipwrights from the East River boatyards who were themselves fleeing the Great Famine, this Tompkins Square church earned the nickname the 'Famine Church,' its Gothic reredos hand-carved by architect Patrick Keely. Its second pastor, Fr. Thomas Mooney, was beloved chaplain to the 'Fighting 69th' regiment until Archbishop 'Dagger' Hughes recalled him for baptizing a 64-pound Columbiad cannon; on his return, 4,000 parishioners mobbed the square to welcome him. During the 1988 park riot, pastor Rev. George Kuhn was arrested defying police to bring food to protesters, insisting his orders came 'from a higher authority.'"},{"name":"The Sofia","lat":40.770566,"lon":-73.98329,"blurb":"This Art Deco tower at Columbus and 61st opened in 1930 as the Kent Automatic Garage, a 1,000-car garage where vehicular elevators and electric trolleys on every floor automatically ferried cars to their parking spots. It's the only large Art Deco parking garage ever built in New York, its terracotta entrance crowned with chevrons and medallions inspired by Aztec designs. The Sofia Brothers turned it into a warehouse in 1944 before it became residential condos in the 1980s, and it's now a city landmark."},{"name":"Holy Name of Jesus Roman Catholic Church","lat":40.794486,"lon":-73.970639,"blurb":"For years the pastor here was auxiliary bishop Stephen Donahue, who in 1939 was floated as a possible Archbishop of New York before Pope Pius XII gave the post to Francis Spellman instead. Built of pink Milford granite between 1891 and 1900 in Gothic Revival style, the Upper West Side church boasts a hammer-and-beam ceiling, five marble altars, and a carved relief of the Last Supper modeled on Da Vinci's. In 1997 the organ's air compressor caught fire during noon Mass, prompting a full renovation."},{"name":"St. Benedict the Moor Church","lat":40.764629,"lon":-73.986356,"blurb":"The first church in New York City for Black Catholics, and the first anywhere north of the Mason-Dixon line, it grew from an 1883 bequest of $5,000 left by Fr. Thomas Farrell. Augustus Tolton, the first openly Black Catholic priest in America, celebrated his first U.S. Mass at the parish in 1886, and the first openly Black Catholic seminarian, William Augustine Williams, later served as its sacristan. As its congregation followed the Black population uptown to Harlem, the parish relocated to Hell's Kitchen in 1898; the building was sold to a developer in 2023."},{"name":"Front Street","lat":40.706192,"lon":-74.004912,"blurb":"Conjured entirely out of landfill in the late 1700s, Front Street marked the East River shoreline until South Street was built out around 1810. Grocer Matthew Howell's Federal-style store at 206 Front, from about 1798, is one of the oldest buildings in the Seaport. At number 189, Nantucket sea captain Josiah Macy built a fortune shipping whale oil, and his descendants later endowed the Josiah Macy Jr. Foundation. A fire tore through the block's wooden buildings in 1821, and by 1885 Gouverneur Hospital was treating emergency cases at the street's edge."},{"name":"Church of St. John Nepomucene","lat":40.764009,"lon":-73.958317,"blurb":"This Upper East Side parish traces back to Slovak immigrants who, around 1891, gathered at St. Brigid's on Avenue B and organized themselves under the Society of St. Matthew to build a church of their own. Carved out of the St. Elizabeth of Hungary parish, St. John Nepomucene was formally established in 1895, its church, school, and rectory built for $300,000. It still stands at 66th Street and First Avenue."},{"name":"Mills House No. 1","lat":40.728435,"lon":-74.000201,"blurb":"Banker Darius Ogden Mills built this Bleecker Street pile as a hotel for poor men, opening it in 1897 with 1,554 tiny rooms renting at 20 cents a night, meals another 15 cents. Designed by housing reformer Ernest Flagg, each cramped room caught daylight from a skylit air shaft, though the walls stopped a foot short of the ceiling. Later a notorious 'welfare hotel,' its basement laundry became the legendary jazz club The Village Gate from 1958 to 1994. Gut-renovated in the 1970s, it's now the apartment building called The Atrium."},{"name":"Jan Hus Presbyterian Church","lat":40.769565,"lon":-73.955495,"blurb":"In the 150-seat basement theater of this Upper East Side church, a young Barbra Streisand made her first New York stage appearance in May 1960, in a revival of the Insect Comedy. The oldest historically Czech Presbyterian congregation in the US, founded in 1877 in a neighborhood once called Little Bohemia, its 1888 building bears the Jan Hus motto 'Truth Prevails.' From 1981 to 1992 the improv troupe Chicago City Limits made the theater home, its stand-up nights hosting Robin Williams, Jerry Seinfeld, and Jon Stewart before they were famous."},{"name":"Damrosch Park","lat":40.772321,"lon":-73.985005,"blurb":"Named for the Damrosch family of musicians, this small park beside the Metropolitan Opera House hosts the Big Apple Circus and open-air concerts at its Guggenheim Bandshell. In 2013, local residents who felt the endless events betrayed the space's status as a public park sued to keep it open to the public year-round. In response, the city and Lincoln Center evicted the twice-yearly, invitation-only New York Fashion Week the following year."},{"name":"Magnet Theater","lat":40.748777,"lon":-73.995351,"blurb":"Founded in March 2005 by four friends, three of whom trained under legendary improv guru Del Close at Chicago's Improv Olympic, the Magnet Theater has become what's considered the world epicenter of musical improvisation. It hosts the New York Musical Improv Festival, drawing performers from Austin to Vancouver, and has featured acts like Baby Wants Candy and members of Freestyle Love Supreme. Co-founder Armando Diaz, who also helped start the Peoples Improv Theater, still runs the place."},{"name":"Austrian Cultural Forum New York","lat":40.759552,"lon":-73.975272,"blurb":"An architectural anomaly on East 52nd Street, this Austrian cultural outpost rises 24 stories and 275 feet on a sliver of a lot just 24.5 feet wide, its glass-and-aluminum facade slanting to a narrow point to satisfy zoning laws. Raimund Abraham's design beat out 226 competition entries in 1992 and was completed in 2002. The institution began in 1942 as the Austrian Institute, founded by emigres, with Irene Harand as vice president. Its library holds more than 10,000 books on Austrian art and culture."},{"name":"Our Lady of Good Counsel Church","lat":40.780644,"lon":-73.950964,"blurb":"Before the world knew him, a teenage Harry Connick Jr. served as the pianist at this Yorkville church from 1985 to 1987. The parish dates to 1886, with the church itself completed in 1892 to designs by Thomas H. Poole, and it now shares a congregation with nearby St. Thomas More."},{"name":"93rd Street","lat":40.780754,"lon":-73.944752,"blurb":"The Marx Brothers lived at 179 East 93rd Street, and decades later Jackie Robinson spent a year and a half at 33 West 93rd in the 1960s. Split in two by Central Park, the street runs through the elegant Carnegie Hill Historic District on its east side and ends at Riverside Park beneath Anna Hyatt Huntington's monument to Joan of Arc. In 2025, a stretch near West End Avenue was co-named Malachy McCourt Lane for the Irish-American actor and writer."},{"name":"Odd Fellows Hall","lat":40.71946,"lon":-73.998441,"blurb":"One of New York's earliest Italianate buildings, this 1847-48 Grand Street hall was designed by Trench & Snook, the firm whose Joseph Trench had introduced the style to the city with 280 Broadway two years earlier. His partner, John B. Snook, went on to design many of SoHo's cast-iron buildings. The secretive Independent Order of Odd Fellows occupied it until the 1880s, when they followed the population uptown, and a mansard roof was added in 1881-82. It became a city landmark in 1982."},{"name":"Allerton 39th Street House","lat":40.749405,"lon":-73.976574,"blurb":"F. Scott Fitzgerald holed up in a room here in February 1920, writing the short stories 'The Jelly-Bean' and 'May Day.' Opened in 1918 as a men-only 'club hotel' for young bachelors, complete with a gym, pool, and roof garden, the building was designed by Arthur Loomis Harmon for a company named after Mayflower passenger Mary Allerton. After a 1948 bequest, the Salvation Army bought it and ran it as a residence for working women from 1956 to 2007. Since 2012 it has operated as the Pod 39 hotel."},{"name":"Studebaker Building (Columbia University)","lat":40.818349,"lon":-73.957849,"blurb":"The blue Studebaker logo used between 1912 and 1934 still sits near the top of this 1923 Manhattanville building, once the automaker's car-finishing plant. After Studebaker sold it to Borden in 1937 it became a milk-processing plant, then home to an eclectic mix of tenants, including the Madame Alexander doll company and Scientific Prototypes, which built the sirens for every NYPD vehicle from 1979 to 1989. Columbia University eventually bought it, keeping it as one of three historic structures preserved during its campus expansion."},{"name":"Manhattan Place","lat":40.745175,"lon":-73.971755,"blurb":"One of New York's first high-rise condominiums, this 35-story Murray Hill tower opened in 1984 on the site of a former Texaco gas station. It was the first project for which architect Costas Kondylis received credit as designer, and it launched his career: the building caught Donald Trump's eye, and the two went on to collaborate on Trump World Tower and other projects. Its triangular-ended form was angled to grab East River views, and it appeared as a construction site in the 1984 film Falling in Love."},{"name":"Group of Bears","lat":40.777495,"lon":-73.963942,"blurb":"Paul Manship's charming 1932 bronze of huddled bears proved so popular it was cast again and again across the globe. Versions adorn the Paul J. Rainey Memorial Gates at the Bronx Zoo, the William Church Osborn Gates in Central Park, and a playground at Fifth Avenue and 79th Street, while other casts turned up at the Metropolitan Museum, the Jerusalem Biblical Zoo, and gardens in Bentonville, Arkansas."},{"name":"John Jay Park","lat":40.769252,"lon":-73.949638,"blurb":"Named for statesman and New York governor John Jay, this Upper East Side park opened in 1906 as a public bath house on land the city had seized through condemnation four years earlier. A swimming pool and promenade followed in 1940-42 under a WPA program. A 1941 renovation added an auditorium, gym, and changing facilities that could accommodate more than 1,500 bathers at once."},{"name":"Stanton Street","lat":40.722052,"lon":-73.990467,"blurb":"Named for George Stanton, an associate of colonial landowner James De Lancey, this Lower East Side street counts Lady Gaga among former residents from before her fame. The crowded, market-lined street even appears in 1927's The Jazz Singer, the first popular sound movie. Between Stanton and Rivington once lay the city's second African burial ground, now a playground in Sara D. Roosevelt Park, and the block is still home to the historic Stanton Street Synagogue."},{"name":"Equestrian statue of José Martí (Central Park)","lat":40.766045,"lon":-73.976066,"blurb":"This Central Park equestrian statue captures Cuban independence hero and poet Jose Marti at the very instant he was fatally shot at the Battle of Dos Rios on May 19, 1895. Sculpted by Anna Hyatt Huntington, cast in 1959 and dedicated in 1965, it was donated by the Cuban government, with a copy standing in Havana. Its base recounts that Marti, born in Havana in 1853, spent fifteen years of his exile living in New York City."},{"name":"Church of the Epiphany (Roman Catholic, Manhattan)","lat":40.737114,"lon":-73.982012,"blurb":"An errant cigarette burned this Gramercy parish's original church to the ground on December 20, 1963. Its bold modernist replacement, built in 1965-67, salvaged a Madonna and Child from the flames and set it into new stained glass; the AIA Guide to New York City later hailed the building as 'the most positive modernist religious statement on Manhattan Island to date.' The parish itself dates to 1868, its first Mass held on the eve of the Epiphany feast for which it is named."},{"name":"Vandam Street","lat":40.726678,"lon":-74.008195,"blurb":"The Federal-style townhouses at 23, 25, 27, and 29 Vandam Street, with their pitched roofs, dormers, and delicately contrived doorways, survive in nearly original condition as part of the Charlton-King-Vandam Historic District. Legendary opera soprano Leontyne Price lived at 9 Vandam from 1962 until 2013. The street sits in Hudson Square, in a neighborhood whose roots reach back to the Dutch founding of New Amsterdam in 1609, decades before the English renamed the city in 1665."},{"name":"Indian Hunter (Ward)","lat":40.770377,"lon":-73.973152,"blurb":"John Quincy Adams Ward's bronze of a crouching hunter and his dog holds a milestone: unveiled in 1869, it was the first sculpture by an American artist installed in Central Park, then just eleven years old. Cast in 1866 at a cost of $10,000, it first traveled to the 1867 Paris Exposition before being presented to the city. Larger than life, it stands on a plinth of polished Rockport granite."},{"name":"240 East 38th Street","lat":40.747261,"lon":-73.974932,"blurb":"This hexagonal Murray Hill tower was the very first building to exploit 1965 revisions to New York's zoning code, which until then had required walls parallel to the street. Architect Robert Allan Jacobs of Kahn & Jacobs proposed the change himself, and the ship's-prow angle netted an extra 2,000 square feet per floor. Completed in 1967 as an office and communications hub for the New York Telephone Company, it was later converted by Verizon and has housed an NYU Langone ambulatory care center since 2012."},{"name":"Immaculate Conception Church","lat":40.730802,"lon":-73.982253,"blurb":"The parish's grand church on 14th Street, dedicated in 1858 and by 1875 the largest congregation in the entire city, was demolished in the 1940s to clear ground for the vast Stuyvesant Town housing complex. Founded in 1855 among Irish and Italian immigrants, the parish relocated in 1943 into a former Grace Church chapel and hospital, a Barney and Chapman design from 1896. A new convent and school followed in 1945."},{"name":"Louis J. Lefkowitz Building","lat":40.715094,"lon":-74.001235,"blurb":"On the day same-sex marriage became legal in New York in 2011, 293 couples wed inside this Civic Center building, turning its Manhattan Marriage Bureau into what supporters called a monument to LGBTQ New Yorkers. Governor Al Smith laid its cornerstone in 1928, praying it would 'stand here through the ages,' and it opened in 1930 to house state tax and motor-vehicle offices. It was renamed in 1984 for Louis J. Lefkowitz, the longest-serving attorney general in state history."},{"name":"Chelsea Park","lat":40.749919,"lon":-74.00067,"blurb":"The 'Doughboy Statue' guarding this Chelsea park has a curious pedigree: the city's Art Commission rejected French-born sculptor Philip Martiny's first, less dynamic design, so he redrew the WWI soldier in a commanding, defiant pose, the very same stance he had used in his poster for the 1918 propaganda film Under Four Flags. Erected in 1921 atop a 14-foot granite stele, the bronze was cast by the Roman Bronze Works of New York. The park itself dates back to 1910."},{"name":"Coleman Playground","lat":40.71117,"lon":-73.993317,"blurb":"The beloved LES Skatepark tucked under the bridge here began as a DIY spot on abandoned basketball courts before a 2012 concrete rebuild led by local skater Steve Rodriguez and funded by Nike SB. In 2017, artist Barbara Kruger wrapped its ramps and rails in her signature bold slogans, including 'WANT IT. NEED IT. BUY IT.' The park honors Corporal Joseph Francis Coleman, who died in 1919 after contracting tuberculosis in the trenches of World War I."},{"name":"The Astor","lat":40.781462,"lon":-73.981722,"blurb":"William Waldorf Astor commissioned the two southern towers of this Upper West Side complex in 1901, then added a third in 1914, built deliberately four stories taller to hold the large penthouse apartments the era's wealthy were craving. All three wings share gray brick facades, a limestone base, and limestone quoins. Astor was betting on the neighborhood's pull, close to Central Park, the first subway line, and Broadway's straight shot down to the Financial District."},{"name":"New Era Building","lat":40.722248,"lon":-74.000063,"blurb":"One of the earliest Art Nouveau buildings still standing in Manhattan, this 1893 SoHo loft at 495 Broadway is crowned by a two-story copper mansard roof gone verdigris-green, straight out of Paris. Butler Brothers, an early mail-order house with 100,000 customers, moved in and later franchised the Ben Franklin Stores. A 1927 fire burned two hours before anyone noticed, then eight floors collapsed when three unprotected cast-iron support columns buckled in the heat. The Swiss Institute ran an art space here from 1994 to 2011."},{"name":"United States Post Office (Madison Square Station)","lat":40.73954,"lon":-73.983553,"blurb":"Five bronze reliefs trace communication from smoke signals to carrier pigeons, tied to a 1930s plan to fly airmail in by seaplane."},{"name":"First Hungarian Reformed Church of New York","lat":40.766116,"lon":-73.958499,"blurb":"This is the only church Emery Roth ever designed, the Hungarian immigrant architect who would go on to line Central Park West with grand apartment towers. Completed in 1916 at 346 East 69th Street in a Hungarian vernacular style, it has anchored the city's Hungarian-American community since. Inside, the choir loft stair carries marquetry panels of Hungarian folk-art motifs, and the gilded coffered ceiling holds stained-glass skylights. It became a New York City landmark in 2019."},{"name":"MacDougal–Sullivan Gardens Historic District","lat":40.728455,"lon":-74.001277,"blurb":"In the 1920s a furniture magnate turned these run-down row houses into middle-class apartments, merging their backyards into a shared hidden garden."},{"name":"Substation 7","lat":40.787146,"lon":-73.948379,"blurb":"This unassuming East Harlem building at 99th Street and Third Avenue was a power plant for the elevated trains, built by the Manhattan Railway Company right beside the Third Avenue El's 99th Street station. From 1918 into the 1970s it fed the IRT Lexington Avenue Line, converting 25-cycle AC piped in from the 74th Street power station into the DC that ran the motors. It sat in the old 99th Street rail yard, later cleared for the Lexington Houses, and is now on the National Register."},{"name":"Cleburne Building","lat":40.800951,"lon":-73.96851,"blurb":"This 1913 Arts and Crafts apartment house at 924 West End Avenue rose on the former mansion site of Isidor and Ida Straus, the Macy's owners who went down with the Titanic and are memorialized in nearby Straus Park. Its later roster of residents reads like a literary directory: writer Madeleine L'Engle, actress Estelle Parsons, satirist Andy Borowitz, and Charlie Smalls, who composed the music for 'The Wiz.' It still keeps its handsome porte-cochère."},{"name":"Duane Park","lat":40.717163,"lon":-74.009407,"blurb":"New York City bought this tiny triangular Tribeca park from Trinity Church in 1795 for a grand total of five dollars. Landscape architect Calvert Vaux, of Central Park fame, laid it out, and it's ringed by the ornate turn-of-the-century loft buildings that give the neighborhood its character. The bordering Duane Street takes its name from James Duane, a noted Trinity Church parishioner."},{"name":"American Federation of Arts","lat":40.75278,"lon":-73.969113,"blurb":"Founded in 1909 with Theodore Roosevelt's blessing and Secretary of State Elihu Root's leadership, this nonprofit was born to send 'exhibitions of original works of art on tour to the hinterlands' at a time when the nation's art was locked up in a few eastern cities. The founding meeting was a who's-who: President Taft, J. Pierpont Morgan, Andrew Mellon, and Senator Henry Cabot Lodge among them. Its mission of 'bringing the museum to the people' has since put roughly 3,000 exhibitions in front of more than 10 million viewers."},{"name":"Jackson Square Park","lat":40.739005,"lon":-74.002882,"blurb":"This triangular Greenwich Village park owes its odd shape to two Native American footpaths, one of them aligned to the spring and fall equinox, that grew into the crossing streets before the 1811 grid plowed 8th Avenue through them. Named for Andrew Jackson by the early 1850s, it spent decades as an open rallying ground drawing crowds up to 2,000 lit by burning tar barrels. It was fenced and planted in 1872, then redesigned in 1887 by Central Park's own Calvert Vaux and Samuel Parsons Jr."},{"name":"Civic Club / Estonian House","lat":40.745197,"lon":-73.976147,"blurb":"This Beaux-Arts building at 243 East 34th Street went up in 1898-99 for the Civic Club, founded by social reformer F. Norton Goddard to fight poverty and gambling in the neighborhood. The club dissolved after Goddard's death in 1905, and in 1946 the family sold the house for $25,000 to the New York Estonian Educational Society. It's since become the main hub of Estonian culture on the U.S. East Coast, home to a school, choruses, a folk-dance group, and the country's largest Estonian-language newspaper in America."},{"name":"Clinton Houses","lat":40.791951,"lon":-73.948005,"blurb":"At a 1959 hearing on this Spanish Harlem project, Jane Jacobs blasted the housing authority for displacing the poor and building for middle-class tastes, arguing instead for mixing low-rise buildings among the high-rises to preserve the neighborhood's social fabric. The result, finished in 1965 and designed by Perkins and Will, became one of the first 'vest-pocket' developments to keep the city's street grid intact, even as it stayed in the tower-in-the-park mold. It's named for DeWitt Clinton, the mayor and governor who championed the Erie Canal."},{"name":"Orwashers Bakery","lat":40.772281,"lon":-73.954944,"blurb":"Eastern European immigrant Abraham Orwasher opened this Upper East Side bakery in 1916, living in a back apartment and delivering rye and pumpernickel by horse and carriage from a basement brick oven. His son Louis is credited with inventing raisin pumpernickel bread right here during World War II. Sold in 2007 to Keith Cohen, who launched a line of artisan breads risen with a wine-grape starter, it's been ranked among the top ten bakeries in America."},{"name":"High School for Environmental Studies","lat":40.76788,"lon":-73.988308,"blurb":"This Hell's Kitchen high school occupies a building that was once a Fox Film movie studio. It opened in 1992, initially in the old Stuyvesant High School building on East 15th Street, with just 150 freshmen, launched to ride a rising wave of environmental awareness and the expanding field of green professions."},{"name":"Dante Park","lat":40.771919,"lon":-73.982571,"blurb":"Italian-Americans created this triangular sliver opposite Lincoln Center in 1921 to mark the 600th anniversary of Dante Alighieri's death. Il Progresso editor Carlo Barsotti had originally dreamed of a far grander Dante statue in Times Square around 1912, but fundraising fell short, so he settled for Ettore Ximenes's smaller bronze at Broadway and 63rd. A twin casting of the same statue stands at Meridian Hill Park in Washington, D.C."},{"name":"Washington Square Methodist Episcopal Church","lat":40.731476,"lon":-73.999977,"blurb":"For nearly 150 years this Greenwich Village church earned the nickname 'The Peace Church' for its fierce opposition to the Vietnam War under pastor Finley Schaef, even hosting planning meetings for the 1971 Fifth Street Women's Building takeover. Paul Abels, New York City's first openly gay clergyman, led the congregation from 1973 to 1984 and championed the gay and lesbian community. A balcony added to the 1860 building was the first in the city built without supporting columns; the church became the Novare condos in 2004."},{"name":"Henry P. Davison House","lat":40.769128,"lon":-73.965677,"blurb":"This Neo-Georgian mansion at 690 Park Avenue went up in 1917 for banker Henry P. Davison. After his death it drew a parade of moneyed tenants, including Marshall Field, and his widow Allene Tew, who married German aristocrat Prince Heinrich of Reuss in 1929. Since 1952 it's housed the Consulate General of Italy, and in 2001 thieves pried the official Italian consular seal right off the front door."},{"name":"Weehawken Street","lat":40.732832,"lon":-74.009834,"blurb":"This short West Village street is named for the colonial-era ferry landing that once linked it across the Hudson to Weehawken, New Jersey. The land was part of Newgate State Prison until the jail was razed and the lots sold off in 1829; the city kept a strip for a produce market, building a Market House in 1834 that flopped and closed by 1844. By the late 20th century the block was known for its saloons and 'rough trade' gay bars, and in 2006 it was designated a historic district."},{"name":"Sushi of Gari","lat":40.771345,"lon":-73.95278,"blurb":"This Upper East Side omakase temple at 402 East 78th Street is the work of master chef and owner Masatoshi 'Gari' Sugio, whose name literally invites diners to trust the chef. The Michelin Guide handed it a one-star rating in both 2006 and 2009, and in 2013 Zagat scored its food a 27, the second-best rating in the East 70s."},{"name":"Lower East Side Preparatory High School","lat":40.720045,"lon":-73.986035,"blurb":"Born in Manhattan's Chinatown in 1973 to teach mainly Chinese immigrants, this public school at 145 Stanton Street grew into a transfer school drawing students aged 14 to 21 from all five boroughs and beyond. It offers bilingual Spanish/Chinese classes, English-language programs, and AP courses, and about eighty percent of its graduates go on to college."},{"name":"Jack Shainman Gallery","lat":40.746248,"lon":-74.006241,"blurb":"Jack Shainman and his then-partner Claude Simard founded this contemporary gallery in Washington, D.C. in 1984 before moving it to New York, building a roster heavy on artists from Africa, East Asia, and North America, including El Anatsui and Kerry James Marshall. Its flagship now fills the historic Clock Tower Building at 108 Leonard, a space designed by Shainman's niece Gloria Vega Martín. It soft-opened with a Richard Mosse show in January 2024 and officially launched in January 2025 with an inaugural solo exhibition by Nick Cave."},{"name":"Greenwich Savings Bank","lat":40.751472,"lon":-73.987121,"blurb":"In October 1981 a meeting participant left confidential materials on a table, the story reached The New York Times, and the resulting run drained $500 million from this bank in just three days before state regulators shut it down. Chartered back in 1833, it had been the 16th-largest bank in the country. Its monumental 1922-24 headquarters at Broadway and 36th, all Corinthian columns and a Roman dome by York and Sawyer, later starred as the bank robbed by George Burns and Art Carney in the film 'Going in Style,' and today hosts events as Gotham Hall."},{"name":"Hamilton Grange Library","lat":40.825712,"lon":-73.947997,"blurb":"This Hamilton Heights branch of the New York Public Library, built in 1905-06, was one of 65 libraries funded by philanthropist Andrew Carnegie, and one of just 11 of those entrusted to the celebrated firm McKim, Mead & White. Faced in deeply rusticated gray limestone in an Italian Renaissance style, it shows off round-arched openings and bronze lamps and grilles. It became a New York City Landmark in 1970."},{"name":"Metropolitan Baptist Church","lat":40.810919,"lon":-73.94641,"blurb":"Founded in 1912, the Metropolitan Baptist Church was one of the first African American congregations in Harlem, and in 1918 it moved into this granite Romanesque Revival building at 128th Street and Adam Clayton Powell Jr. Boulevard, originally built for a Presbyterian congregation in the 1880s. The church left behind its old Metropolitan Baptist Tabernacle, which became Liberty Hall, a hub of Marcus Garvey's Back-to-Africa movement. A planned corner tower was never built."},{"name":"Stanton Street Synagogue","lat":40.720266,"lon":-73.983859,"blurb":"Built in 1913 by immigrants from the Galician town of Brzeżany, this is one of the last surviving tenement-style synagogues, cobbled together from two 1840s buildings on the Lower East Side. In 2002 its own congregants went to court to block the rabbi and board from selling the aging shul to an organization run by a Jesuit priest; the ensuing settlement and press coverage revived interest and membership. Its long-serving rabbi Joseph Singer, the Pilzner Rav, had fled the Nazis in 1939 and led the congregation nearly four decades, mostly without pay."},{"name":"Gunther Building (Broome Street)","lat":40.722415,"lon":-74.001858,"blurb":"This 1871 cast-iron building at 469 Broome Street stands out from its SoHo neighbors with a bright white facade, richly decorated Corinthian columns, and a distinctive curved glass corner. Designed by Griffith Thomas for prominent furrier William Gunther, it began life as a warehouse for textiles and furs. Today it's a co-op of artists and architects, and musician Lenny Kravitz was once among its residents."},{"name":"Church of the Epiphany (Episcopal, Manhattan)","lat":40.768473,"lon":-73.952996,"blurb":"Founded in 1833 as the very first church of the New York Protestant Episcopal City Mission Society, this Episcopal congregation held its debut service in a hall at Allen and Houston Streets before wandering the city for a century. It finally landed at York Avenue and 74th Street, where its Norman Gothic building opened in 1939. Its former rector, the Rev. Jennifer Anne Reddall, was elected the sixth Bishop of the Episcopal Diocese of Arizona in 2018."},{"name":"Fort Clinton (Central Park)","lat":40.795285,"lon":-73.95215,"blurb":"Long before Central Park, a stone-and-earthworks fort rose here in 1814 near what's now 107th Street, named for New York City mayor DeWitt Clinton. It was the easternmost of a linked chain of War of 1812 defenses guarding McGowan's Pass, tied to Nutter's Battery and commanded from Fort Fish, which had a sweeping view over Long Island Sound and Westchester. The same high ground had served British and Hessian troops as a redoubt during the Revolution. A plaque and two cannons mark the spot today."},{"name":"Cary Building","lat":40.715278,"lon":-74.007963,"blurb":"Built in 1856-57 for a dry-goods firm, this Tribeca landmark shows off twin cast-iron facades from Daniel Badger's ironworks, and it was once home to The New York Sun. The 1920s widening of Church Street sheared away its neighbors and left a 200-foot wall of plain brick exposed, prompting critic Christopher Gray to quip that 'there is not too little of the Cary Building but too much.' In 1973 artist Knox Martin wrapped it in a 280-foot patterned canopy that Ada Louise Huxtable praised in the Times."},{"name":"10 Sullivan","lat":40.724736,"lon":-74.004002,"blurb":"This wedge-shaped, sixteen-story SoHo tower deliberately evokes the Flatiron Building, though architect Cary Tamarkin insists the triangular form was simply forced by the lot's shape next to the Holland Tunnel entrance. During its 2014-16 construction and sluggish sales, the project became the center of a bitter feud between its two developers: Madison Equities' Robert Gladstone sued partner Kevin Maloney of Property Markets Group, blaming sabotage and mismanagement for $30 million in lost profits. The case was eventually dismissed."},{"name":"Saints Kyril & Metodi Bulgarian Eastern Orthodox Diocesan Cathedral","lat":40.76544,"lon":-73.994156,"blurb":"This Hell's Kitchen church at 552 West 50th Street has changed hands and faiths repeatedly since a congregation raised it around 1899 on a former silk-ribbon factory site. A Polish Catholic parish rented it in 1909, then Croatian Franciscan friars took it over in 1913, buying it for $21,000 with donated altars and vestments to serve some 4,000 immigrants. After the Croatians moved out in 1974 it sat empty until the Bulgarian Eastern Orthodox Church bought it in 1979, keeping the Slavic patron saints and changing only the spelling of their names."},{"name":"Nutter's Battery","lat":40.796541,"lon":-73.952851,"blurb":"This scenic overlook in Central Park's North Woods, gazing over the Harlem Meer, was a War of 1812 gun battery built to defend Manhattan against a British invasion sweeping down from the north. A redoubt connected to Fort Fish by earthworks along the Old Post Road, it ran to a gatehouse at McGowan's Pass near 107th Street. After the war the wall crumbled and vanished; Parks marked the spot with a low wall in 1945, and the Central Park Conservancy rebuilt it in 2014. It's named for Valentine Nutter, who owned the surrounding land."},{"name":"Umbrella House","lat":40.721375,"lon":-73.981075,"blurb":"In November 1988, days after the Tompkins Square Park Riot, five people broke into this derelict Avenue C tenement with a sledgehammer, among them Steven Ashmore, a 28-year-old art student and go-go dancer. The roof leaked so badly they joked they needed umbrellas indoors, hence the name, still marked by umbrellas on the facade. A 1984 documentary shows it was earlier squatted by Native Americans who called it a survival house. Evicted in a 1995 raid, residents won it back in court under adverse possession, bought it for one dollar in 2002, and now grow food in an 820-square-foot rooftop garden."},{"name":"Rutgers Presbyterian Church","lat":40.779594,"lon":-73.982443,"blurb":"Founded in 1798 on land donated by Colonel Henry Rutgers, this congregation had become the largest Presbyterian church in the entire denomination by 1830, with 1,157 members. Today it has broken sharply with mainstream Christianity: congregants aren't required to hold a traditional belief in God, a Black Lives Matter banner hangs outside, and gender-fluid buttons are offered to members. Its 1843 stone building still stands, now the Catholic Church of St. Teresa. The current church, near the Ansonia at 236 West 73rd Street, opened in 1926."},{"name":"The Cornwall","lat":40.791173,"lon":-73.974806,"blurb":"Its ornate Art Nouveau cornice, dubbed 'a terra-cotta diadem,' was so prized that owners paid $600,000 in 1991 to replace it with replicas."},{"name":"601 West 29th Street","lat":40.753168,"lon":-74.004836,"blurb":"Before this roughly 700-foot Chelsea tower rose on infill beside the High Line, the site held a studio used by artist Jeff Koons. Developer Douglaston bought 120,000 square feet of air rights from nearby Chelsea Piers to build it, designed by FXCollaborative. The building packs 931 units, including 234 affordable apartments, plus a pool, private cabanas, and a pet daycare. Ares Management sank $160 million in equity into the project in 2019."},{"name":"San Lorenzo Ruiz Chapel","lat":40.720552,"lon":-73.996302,"blurb":"Cardinal Edward Egan named this Broome Street chapel the archdiocese's official 'Church of Filipinos' in 2005, honoring San Lorenzo Ruiz, the first Filipino saint and martyr. Its bronze statue of the saint, donated in 1982 by Philippine Cardinal Jaime Sin and considered miraculous by devotees, was enshrined with President Gloria Macapagal Arroyo as guest of honor. But the building had opened in 1925 for a mostly Italian parish, and as the neighborhood's Filipino population thinned, as few as five worshippers turned up. The archdiocese sold it for $7.3 million in 2017."},{"name":"Second Church of Christ, Scientist","lat":40.773618,"lon":-73.978297,"blurb":"This copper-domed Beaux-Arts sanctuary at Central Park West and 68th Street was designed by Frederick R. Comstock and built in 1899-1901. In a bit of ecclesiastical musical chairs, Second Church merged with First Church of Christ, Scientist in 2003, but the combined congregation kept the name First Church while worshipping here in the former Second Church. A 2005 restoration cleaned the facade, reinforced the stained glass, and waterproofed the copper dome. It sits within the Central Park West Historic District."},{"name":"Church of Our Lady of Sorrows","lat":40.719089,"lon":-73.982289,"blurb":"Built in 1867-68 by Henry Engelbert in a mix of Victorian, Byzantine, and Romanesque Revival styles, this Pitt Street church was the national parish for German Catholics of Kleindeutschland, the Lower East Side's Little Germany. Staffed by Capuchin Friars and dedicated by Archbishop John McCloskey in 1868, it later served Italian and then Hispanic immigrants as the neighborhood changed. Its parish school was among 27 the archdiocese closed under Archbishop Timothy Dolan in 2011."},{"name":"Mariner's Temple","lat":40.712968,"lon":-73.997708,"blurb":"This brownstone Baptist church with Ionic columns at 3 Henry Street traces to 1795 as the Oliver Street Baptist Church, with the present building inaugurated in 1845. It holds a quiet footnote in Scandinavian religious history: pioneering Swedish Baptist leaders Anders Wiberg and John Alexis Edgren were ordained here, in 1852 and 1866 respectively. The Reverend Dr. Henrietta Carter became its pastor in 1998. It remains a member of the American Baptist Churches USA."},{"name":"Trinity Evangelical Lutheran Church of Manhattan","lat":40.796222,"lon":-73.968075,"blurb":"Founded in 1888 as a German immigrant congregation that first met in a storefront, this Gothic Revival church on West 100th Street was designed by George W. Conable and built in 1908. In the 1950s Robert Moses' urban renewal bulldozers came for it, but the parish fought back and won after a decade-long battle, leaving the church the only building left standing within 32 razed acres. It landed on the National Register of Historic Places in 2009."},{"name":"Vesuvio Playground","lat":40.725375,"lon":-74.002612,"blurb":"This SoHo playground at Thompson and Spring Streets was named in the late 1990s for the beloved nearby Vesuvio Bakery, which was itself named for Mount Vesuvius, the volcano whose A.D. 79 eruption buried Pompeii. The park was really meant to honor the bakery's owner, but Parks Department policy barred naming it after a living person, so the volcano got the credit instead. It was formerly Thompson Street Playground, after a street named for Revolutionary War Brigadier General William Thompson."},{"name":"Church of Our Lady Queen of Angels","lat":40.795321,"lon":-73.940444,"blurb":"When this East Harlem parish was founded in 1886, the area was still largely rural, and Archbishop Michael Corrigan asked Capuchin friar Bonaventure Frey to build a national parish for German Catholics moving north from Yorkville. The Neo-Romanesque church, the third Capuchin parish in the city, sits at the end of a cul-de-sac now ringed by the Jefferson Houses. Though the church closed in 2007, its convent is home to the Franciscan Sisters of the Renewal, who run the 'Fr. Solanus Soup Kitchen.'"},{"name":"Our Saviour New York","lat":40.76849,"lon":-73.98633,"blurb":"Built in 1886-87 on West 57th Street, this Late Victorian Gothic church was designed by Francis H. Kimball for the Catholic Apostolic Church, an English sect that believed in an imminent Second Coming. Influential critic Montgomery Schuyler declared there was 'no more scholarly Gothic work in New York,' praising its deep red brick, terra-cotta leaves and angelic heads, and flame-shaped iron fence posts. As the congregation dwindled, it was donated to Lutheran ministries in 1995 and designated a city landmark in 2001."},{"name":"Hungarian House of New York","lat":40.776113,"lon":-73.954956,"blurb":"Founded in 1966, this Upper East Side cultural institution bought its 82nd Street building that year from the German athletic club Central Turnverein. Its halls have welcomed a remarkable roll call of Hungarian luminaries, including nuclear physicist Edward Teller, Nobel laureate physicist Dennis Gabor, European Parliament member Otto von Habsburg, Cardinal Jozsef Mindszenty, and Jozsef Antall, Hungary's first democratically elected post-Communist prime minister. It houses a Hungarian library and the Janos Arany Hungarian School."},{"name":"303 Gallery","lat":40.747543,"lon":-74.007539,"blurb":"Founded in 1984 by Lisa Spellman, whom critic Jerry Saltz called 'one of the greatest New York gallerists of our time,' this gallery has a name that nods to two things at once: its original address at 303 Park Avenue South, and Room 303 of the Anderson Galleries, home of Alfred Stieglitz's historic 'Intimate Gallery.' It helped launch the careers of Christopher Wool, Robert Gober, Rirkrit Tiravanija, and Karen Kilimnik. A landmark 1988 show hung Wool's Apocalypse Now painting opposite Gober's Three Urinals sculpture, the first showing of either."},{"name":"Millan House","lat":40.767896,"lon":-73.965127,"blurb":"The land under this Lenox Hill co-op was given to a Baptist Church shortly after the Civil War, until John D. Rockefeller Jr. bought it from the church for one million dollars in 1929 and hired architect Andrew J. Thomas to build these two buildings, completed in 1931. The 57 apartments, spread across 115 East 67th and 116 East 68th Streets, are joined by a formal back garden. Early tenants included Simon Flexner and Witherbee Black of the silversmith family behind Black, Starr & Frost. A resident pushed to convert it from rentals to a co-op in 1947."},{"name":"Judge Building","lat":40.737042,"lon":-73.993328,"blurb":"This 1888 Flatiron District building at 110 Fifth Avenue, designed by McKim, Mead, and White, takes its name from Judge magazine, which was printed there. In December 1890 it hosted America's first-ever doll exhibition, three thousand of them, including a large Albani doll shipped from London. But its most historically striking tenant was Gianni Bettini, whose top-floor studio made pioneering musical recordings in the early 1890s, capturing the voices of Sarah Bernhardt and Mark Twain. The New York Times Company acquired the building in 1985."},{"name":"Bellevue South Park","lat":40.740039,"lon":-73.97805,"blurb":"This Kips Bay park was planned in 1964 as part of an urban renewal area but didn't open until 1979, its construction stalled for a decade by the city's fiscal crisis. The new north-south street laid out beside it went nameless for years, labeled simply 'A New Street' on city maps until it was christened Mount Carmel Place in 1989, marking the centennial of Carmelite priests' arrival in New York. In 2001 the abstract sculpture 'Skagerrak,' representing the strait between Denmark, Norway, and Sweden, was relocated here from Madison Square Park."},{"name":"Chinatown Ice Cream Factory","lat":40.715416,"lon":-73.998158,"blurb":"Chinese-American businessman Phillip Seid and one of his brothers opened this Chinatown parlor in 1977, selling 45-cent scoops, inspired by a nearby Carvel but determined to make flavors for the Asian-American market like lychee, papaya, red mango, and taro. The shop struggled through its first decade and was targeted by gangs, but Seid flatly refused to pay them extortion money. His daughter Christina took over in 2002 and added flavors like black sesame, durian, ube, and a sesame-based 'zen butter.'"},{"name":"Le Petit Versailles","lat":40.721139,"lon":-73.981782,"blurb":"Artists Peter Cramer and Jack Waters, longtime collaborators and co-directors of the ABC No Rio space, built this Lower East Side community garden in 1996 on a lot that had been an auto chop shop, wanting to create a queer public space in the city. In the aftermath of the September 11 attacks and the protests against the 2004 Republican National Convention, the garden became a refuge and organizing space for activists. In 2006 it began broadcasting footage of its arts events on Manhattan Neighborhood Network as LPVTV. It's part of the city's GreenThumb program."},{"name":"Vincent F. Albano Jr. Playground","lat":40.741944,"lon":-73.978385,"blurb":"This Kips Bay pocket park was born from a highway that never got built: the Triborough Bridge and Tunnel Authority bought the land in 1965 as right-of-way for Robert Moses' proposed Mid-Manhattan Expressway, an elevated road that infuriated incoming Mayor John Lindsay. When the project stalled, Parks Commissioner Thomas Hoving, a champion of tiny 'vest pocket parks,' persuaded Moses to let it become an experimental children's playground, designed by landscape architect M. Paul Friedberg and opened in 1967. The expressway was officially killed in 1971, but the MTA still owns the land underneath."},{"name":"Annunciation Greek Orthodox Church","lat":40.792052,"lon":-73.976026,"blurb":"This Upper West Side church at West End Avenue and 91st Street was built in 1893-94 by Heins & LaFarge, not for Greek Orthodox worshippers but as the Fourth Presbyterian Church; a Greek parish bought it in 1952. Its rusticated stone facade, Venetian Gothic and Richardsonian Romanesque details, and gargoyle-spouted corner bell tower reveal Richardson's influence. Its fine stained glass may be from Tiffany studios, or possibly by John LaFarge, the architect's own father, which would make it even rarer."},{"name":"Duarte Square","lat":40.722543,"lon":-74.005495,"blurb":"This triangular Hudson Square park is anchored by a thirteen-foot bronze statue of Juan Pablo Duarte, a founding father of the Dominican Republic, dedicated by the country's consulate in 1978 on the 165th anniversary of his birth. Italian sculptor Nicola Arrighini designed the figure, one of a series of monuments to Latin American leaders along the Avenue of the Americas. The site was farmland owned by Trinity Church in the late 1600s. In 2011, Occupy Wall Street protesters climbed the fence onto the adjacent Trinity-owned LentSpace plot, and police arrested about 50, including an Episcopal bishop."},{"name":"St. Francis de Sales Roman Catholic Church","lat":40.786317,"lon":-73.951256,"blurb":"This Upper East Side church at 135 East 96th Street was organized in 1894, its cornerstone laid by Bishop Farley and the building dedicated in 1903, designed in Italian Renaissance style by O'Connor & Metcalf. Its first organ was built by the renowned firm of E. and G. G. Hook & Hastings of Boston. Among its notable parishioners was James Cagney, the legendary American actor and dancer."},{"name":"Samuel Finley Breese Morse (sculpture)","lat":40.772483,"lon":-73.967435,"blurb":"This bronze statue in Central Park honors Samuel Morse, the painter and inventor of the telegraph, and was sculpted by Byron M. Pickett. Standing 13 feet tall on a Quincy granite pedestal, it was dedicated on June 10, 1871."},{"name":"Plaza Lafayette","lat":40.851551,"lon":-73.941591,"blurb":"This tiny trapezoidal pocket park in Hudson Heights is named for the Marquis de Lafayette, the French hero of the American Revolution, and the stretch of Riverside Drive bordering it was originally called Boulevard Lafayette. Just across the way, near Manhattan's highest natural point at nearby Bennett Park, a small viewing pl
