atform offers unobstructed views of the George Washington Bridge, the Hudson Palisades, and the river. A now-gated staircase once led down to what is today the Henry Hudson Parkway. The land was acquired by the city in 1918."},{"name":"La Plaza Cultural de Armando Perez","lat":40.725361,"lon":-73.978645,"blurb":"Founded in 1976 amid the arson and abandonment of the fiscal crisis, this East Village community garden began when the Latino group Charas/El Bohio cleared truckloads of trash from vacant lots. Working with Buckminster Fuller, they built a geodesic dome for cultural events, while artist Gordon Matta-Clark helped construct an amphitheater from railroad ties and materials reclaimed from abandoned buildings. Green Guerillas pioneer Liz Christy seeded the turf with 'seed bombs' and planted weeping willows. Preserved by legal settlement in 2002, it was renamed for slain Charas founder Armando Perez in 2003."},{"name":"St. Spyridon Greek Orthodox Church","lat":40.848917,"lon":-73.93602,"blurb":"This Washington Heights church on Wadsworth Avenue, dedicated in 1952 by Archbishop Michael, is known for its elaborate Byzantine Revival architecture and interior covered in traditional wall painting, much of it by Georgios Gliatas, a student of the iconographer Fotis Kontoglou. Konstantinos Pylarinos carved some of its Byzantine woodwork in the 1970s. After the World Trade Center's south tower collapsed on 9/11 and destroyed St. Nicholas Greek Orthodox Church, its displaced parishioners worshipped here."},{"name":"McKenna Square","lat":40.838349,"lon":-73.939157,"blurb":"This small triangular green in Washington Heights, created in 1917 when West 165th Street was widened, is named for Private William McKenna, a local anti-aircraft soldier killed at the Battle of the Argonne Forest in France in 1918. Before it became a park, its northern side was Croton Street, a lane predating Manhattan's street grid whose name likely evokes the Croton Aqueduct that brought clean water to the city in 1842; it was lined with workers' cottages of Irish immigrants. Redeveloped in 1985, the park now features a raised pavilion of steel, stone, and glass block."},{"name":"Albert Capsouto Park","lat":40.722073,"lon":-74.005891,"blurb":"After 9/11 this Tribeca parking lot became a search-and-rescue staging area, one of the closest accessible points to the fallen towers, and members of the public left flowers, cards and letters here. Opened in 2009 at a cost of $3.4 million, it features a 114-foot fountain by local artist Elyn Zimmerman that echoes the canal that once ran along Canal Street. Originally the kitschy CaVaLa Park (Canal-Varick-Laight), it was renamed in 2010 for Tribeca restaurateur and activist Albert Capsouto, often seen pedaling his bike around the neighborhood."},{"name":"Writopia Lab","lat":40.784132,"lon":-73.976317,"blurb":"This nonprofit creative-writing program for kids and teens ages 4-18 was founded in 2007 by journalist Rebecca Wallace-Segall, with each student setting personal goals and finishing a full piece by the end of the workshop. Its advisory council reads like a literary who's-who: Nicole Krauss, Susan Cain, and Freakonomics co-author Stephen Dubner. Writopia also runs the Worldwide Plays Festival, funded by David Letterman's production company Worldwide Pants, which donated $50,000-$60,000 a year to stage student-written plays off-Broadway."},{"name":"Open Road Park","lat":40.729382,"lon":-73.982918,"blurb":"This East Village playground sits atop the city's third Catholic cemetery, opened in 1833 at what was then the northern edge of town. After interring 41,016 people it hit capacity by 1848, and when the church later tried to sell, relatives sued to stop the disinterment; the last bodies weren't removed until 1909. The site then became a school and a bus garage before nonprofit Open Road turned the contaminated lot into a community garden in 1993, complete with a greenhouse and turtle pond."},{"name":"Substation 219","lat":40.815701,"lon":-73.948063,"blurb":"This double-height Art Deco substation, trimmed with limestone chevrons, was built in 1932 to feed power to the subway's IND Eighth Avenue Line."},{"name":"The 8th Floor","lat":40.738527,"lon":-73.993271,"blurb":"Founded by collectors Donald and Shelley Rubin in 2010, this exhibition space sits at 17 West 17th Street in the same building as the Rubin Museum. Its rotating shows often carry a social-justice focus, and in 2019 it launched a run of two-year exhibitions under the theme Revolutionary Cycles."},{"name":"Hales Gallery","lat":40.746867,"lon":-74.007617,"blurb":"This gallery began in 1992 in a basement beneath the Revival Cafe in Deptford, South London, where owner Paul Hedge split his days between running the space and cooking meals in the cafe upstairs. From that basement he launched the careers of Jake and Dinos Chapman, whose first show 'We Are Artists' was here, plus Mike Nelson and Sarah Jones. The gallery represents feminist artist Carolee Schneemann and opened a Chelsea, New York location in 2018 with a Virginia Jaramillo solo show."},{"name":"Microscope Gallery","lat":40.752109,"lon":-74.002652,"blurb":"Artist Marni Kotak literally gave birth in this gallery as a performance piece titled The Birth of Baby X, drawing a wave of media attention. Founded in 2010 by Elle Burchill and Andrea Monti, Microscope specializes in time-based film, sound, and performance art, and has shown work by Anthology Film Archives founder Jonas Mekas, Fluxus co-founder George Maciunas, underground filmmaker Nick Zedd, and Barbara Hammer."},{"name":"New York University Center for Neural Science","lat":40.729161,"lon":-73.994435,"blurb":"Founded in 1989 out of NYU's Psychology Department, this research center has been led by J. Anthony Movshon virtually ever since. Its 25 faculty include three members of the National Academy of Sciences: Movshon, David Heeger, and Joseph LeDoux. Thanks to Paul Glimcher's work it is one of the birthplaces of neuroeconomics, and thanks to LeDoux it has been a prime center for studying emotions and the amygdala."},{"name":"Holy Trinity Church (Upper West Side)","lat":40.785572,"lon":-73.977375,"blurb":"Built from 1910 to 1912 by architect Joseph Hubert McGuire, this Upper West Side church was designed deliberately in the Byzantine style, unusual for its era, and crowned with a dome of Guastavino tile. Frederick D. Taylor called it one of the finest examples of Byzantine architecture in the country. Constructed of brick and terra cotta near Amsterdam Avenue, it was dedicated on May 11, 1912."},{"name":"Mandarin Oriental","lat":40.76901,"lon":-73.982912,"blurb":"Glass artist Dale Chihuly created a roughly 2,100-pound chandelier here from 683 hand-blown glass and crystal pieces in a rare collaboration with Waterford Crystal, plus his first-ever foray into glass gardens on the 35th-floor lobby. The five-star hotel perches more than 280 feet above Columbus Circle in the Deutsche Bank Center, the former Time Warner Center, spanning floors 35 to 54. Its signature lobby fan was designed by fashion designer Vivienne Tam; Reliance Industries bought a majority stake in 2022 for $98 million."},{"name":"125th Street station (IRT Broadway–Seventh Avenue Line)","lat":40.815737,"lon":-73.958281,"blurb":"This is the only station on the 2,174-foot Manhattan Valley Viaduct, a steel double-hinged arch that carries the subway across a natural valley at 125th Street. Engineers switched from a standard elevated structure to the dramatic arch specifically to avoid rerouting the Third Avenue streetcar line running below. Opened October 27, 1904 as the Manhattan Street station, it was one of the original 28 stops on the city's first subway; the viaduct is now a designated NYC landmark."},{"name":"125th Street station (IRT Lexington Avenue Line)","lat":40.804349,"lon":-73.937411,"blurb":"This is one of the subway's oddest stations: a bi-level express stop with island platforms where the upper level serves northbound trains to the Bronx and the lower level serves southbound trains, rather than separating locals from expresses. It opened July 17, 1918 as part of the Dual Contracts scheme that reshaped the IRT into an H-shaped system. A future Second Avenue Subway extension is planned to connect here and to Metro-North's Harlem-125th Street station one block west."},{"name":"Performance Space New York","lat":40.728112,"lon":-73.984426,"blurb":"This avant-garde institution was born in an abandoned public elementary school, P.S. 122, where visual artists had squatted the old classrooms as studios until choreographer Charles Moulton began holding rehearsals in the second-floor cafeteria in 1979. It launched in 1980 with the first 'Avant-Garde-Arama' and became a launchpad for experimental dance and performance. After a $37 million renovation it reopened in 2018 under a new name and, in Jenny Schlenzka, its first female director."},{"name":"Schinasi House","lat":40.802979,"lon":-73.96936,"blurb":"Built from 1907 to 1909 for tobacco baron Morris Schinasi, this neo-French Renaissance marble chateau is one of the last freestanding single-family mansions in Manhattan still used as a home. Architect William Tuthill worked pineapple motifs (a symbol of hospitality) and carved tobacco leaves nodding to the owner's trade into the facade, and Schinasi had water taps installed on the exterior so it could be hosed clean. It later served as a girls' finishing school and a Columbia daycare; since 2013 it's owned by a Goldman Sachs executive."},{"name":"Canal Street station (IRT Broadway–Seventh Avenue Line)","lat":40.722557,"lon":-74.006289,"blurb":"This station opened July 1, 1918 as part of the Dual Contracts, when the IRT pushed a new line down Varick Street and West Broadway, forcing the city to widen streets and build two new ones. It was central to the switch from a Z-shaped to an H-shaped subway system linked by the 42nd Street Shuttle, a change that doubled the IRT's capacity. In the 1920s an entrance here was rebuilt for the Holland Tunnel exit plaza, the first city project to separate pedestrian and vehicular traffic."},{"name":"Kasmin Gallery","lat":40.750597,"lon":-74.002931,"blurb":"Founded in 1989 as the Paul Kasmin Gallery on Grand Street in SoHo, this gallery is credited with helping build New York's Chelsea art scene after moving there in 2000. Kasmin, son of the noted British dealer John Kasmin, gave the Lalanne brothers' whimsical furniture-sculpture its first New York show in nearly 30 years in 2007. Its 2018 Chelsea space boasts 28 skylights and a rooftop sculpture garden beside the High Line, and it manages the estates of Lee Krasner, Jackson Pollock, and Constantin Brancusi."},{"name":"Marketfield Street","lat":40.704844,"lon":-74.012085,"blurb":"This crooked one-block Financial District alley traces the old path to the Dutch livestock market Marcktveldt, then outside the city walls, where Governor-General Willem Kieft opened the colony's first cattle market in 1641. Over the centuries it collected a string of names including Petticoat Lane and Oblique Road. The city's first French Huguenot church was built here in 1688, and the block was among the areas devastated by the Great Fire of New York in September 1776."},{"name":"133rd Street","lat":40.818622,"lon":-73.955599,"blurb":"During Prohibition this Harlem block was 'Swing Street' (also nicknamed Jungle Alley), packed with at least 20 jazz clubs and speakeasies where a 17-year-old Billie Holiday was discovered. Harry Hansberry's Clam House, one of the city's most notorious LGBT speakeasies, featured Gladys Bentley singing risque lyrics in a tuxedo, while Pod's and Jerry's showcased pianist Willie 'The Lion' Smith. The scene faded after Prohibition's 1933 repeal and the 1935 Harlem riot; today Bill's Place keeps jazz alive in the former Tillie's Chicken Shack."},{"name":"Isham Park","lat":40.869652,"lon":-73.919076,"blurb":"Wealthy leather merchant William Bradley Isham bought this Inwood hilltop as a summer estate in 1864, with a peculiar cross-shaped house and a cold spring that was one of the area's few natural sources of fresh water. His family later gifted the land to the city, and the deteriorating mansion was torn down in the 1940s. The park's southern end features exposed marble outcroppings dating to the Cambrian period, a popular stop for college geology classes, from the same marble once burned in kilns here to make lime."},{"name":"250 Water Street","lat":40.708233,"lon":-74.002665,"blurb":"A 19th-century five-story thermometer factory once worked mercury on this South Street Seaport block, which then languished for decades as a parking lot amid a graveyard of failed redevelopment plans. Milstein Properties bought it in 1979 and watched eight straight proposals get rejected by the Landmarks Preservation Commission over their scale. The Howard Hughes Corporation bought it in 2018 for $180 million, and a design of four closely gathered towers with 270 apartments was finally approved in 2021."},{"name":"Winston Churchill Square","lat":40.729857,"lon":-74.00245,"blurb":"This tiny .05-acre Greenwich Village garden, named for the British prime minister, sits where Bleecker, Downing, and Sixth Avenue meet, centered on an ornamental armillary sphere. The city bought the parcel in 1943. For over a decade it was lovingly tended by a volunteer crew under Professor Bert Waggott of Cooper Union and Pratt, who kept at it himself until his death in 2014; artist Bob Brisley now oversees its vibrant plantings."},{"name":"Church of the Most Holy Redeemer","lat":40.72362,"lon":-73.984244,"blurb":"Once the grand 'German Catholic Cathedral' of Manhattan's Little Germany, this cathedral-scale church was built in 1851-1852 to serve what was then the city's second-largest Catholic community after the Irish. Its parish school, run by the School Sisters of Notre Dame and taught entirely in German for most of the 19th century, lost more than a dozen children to a fire in 1883. The church originally had a soaring 250-foot Baroque tower, shortened in a 1913 renovation; today many parishioners know it as Santisimo Redentor."},{"name":"Church of the Most Precious Blood","lat":40.717775,"lon":-73.998883,"blurb":"This is the National Shrine Church of San Gennaro, and during Little Italy's September Feast of San Gennaro the saint's statue is carried from here in a procession through the streets. Established in 1888 for the flood of Italian immigrants, the church was begun by the Scalabrini Fathers around 1891, but they ran out of money and the Franciscans completed the building in 1904. Sitting just north of the rough Five Points, it saw its priest, Father Buonaventura Piscopo, receive death threats in 1898 for crusading against local vice."},{"name":"Calvary Church","lat":40.738928,"lon":-73.98676,"blurb":"Designed by James Renwick Jr., architect of St. Patrick's Cathedral, this 1848 Gothic Revival church was Theodore Roosevelt's boyhood parish; he was born two blocks away in 1858. Chester A. Arthur married here in 1859, and in 1875 Alva Smith wed William Kissam Vanderbilt in what was called the grandest wedding New York had seen in years. It's also woven into AA history: when Rev. Sam Shoemaker was minister, Calvary House became the American hub of the Oxford Group, and Bill Wilson credited him as one of the prime sources of AA's spiritual principles. Its two wooden spires came down in 1860."},{"name":"Church of the Transfiguration, Episcopal","lat":40.745161,"lon":-73.985825,"blurb":"Known as the Little Church Around the Corner, this garden-fronted parish earned its nickname in 1870 when a nearby rector refused to bury an actor and sniffed that there was a little church around the corner where they do that sort of thing, launching a lasting bond with theater. During the 1863 Draft Riots, rector George Houghton sheltered African Americans and turned away the mob with You white devils, you! Do you know nothing of the spirit of Christ? The Episcopal Actors' Guild first met here in 1923, and P.G. Wodehouse married his wife Ethel at the church in 1914."},{"name":"Church of the Sacred Heart of Jesus","lat":40.765228,"lon":-73.990311,"blurb":"One of Midtown's largest churches, this Hell's Kitchen parish was founded in 1876 and first met in a former Baptist church before its Victorian Romanesque home, a confection of deep red brick and terra cotta by the prominent firm Napoleon LeBrun & Sons, was dedicated in 1885. Serving a mostly Irish and German congregation, it made history in 1966 as the first church in the Archdiocese of New York to reconfigure its interior following the reforms of the Second Vatican Council."},{"name":"Hotel Metropole","lat":40.756497,"lon":-73.985396,"blurb":"Now the Casablanca Hotel just off Times Square, this was the city's first hotel with running water in every room, and its guest list ran to gamblers and gunslingers like lawman-turned-writer Bat Masterson. In the early hours of July 16, 1912, gambling-den owner Herman Rosenthal was gunned down out front, a murder allegedly ordered by police detective Charles Becker, who was executed for it in 1915. F. Scott Fitzgerald wove the Metropole into The Great Gatsby as a haunt of Meyer Wolfsheim."},{"name":"Park Avenue Armory","lat":40.767232,"lon":-73.9655,"blurb":"Home to the 7th Regiment, this 1880 Gothic Revival fortress boasts a drill hall measuring 200 by 300 feet, one of New York's largest column-free indoor spaces when built. Its lavish interiors were decorated by a who's who of the Gilded Age, including Louis Comfort Tiffany, Stanford White, and the Herter Brothers. When the Board of Aldermen approved construction but refused to pay the $350,000 cost, the regiment funded it themselves through donations and bonds. Since 2006 the Park Avenue Armory Conservancy has run it as an acclaimed arts venue on a 99-year lease."},{"name":"Islamic Cultural Center of New York","lat":40.785471,"lon":-73.948571,"blurb":"New York's first purpose-built mosque, this East Harlem landmark is deliberately rotated 29 degrees off Manhattan's street grid so its mihrab faces Mecca, at a heading of 58 degrees calculated by the great-circle route. Planned since the late 1960s, construction began in 1984 and the mosque finally opened on April 15, 1991 for Eid ul-Fitr, its debut delayed by the Gulf War. More than 46 Muslim countries contributed to the $17 million cost, and its copper dome, like the Statue of Liberty, is clad in the same weathering metal."},{"name":"Church of St. Paul and St. Andrew","lat":40.788938,"lon":-73.977285,"blurb":"This socially liberal United Methodist church on the Upper West Side once fought to tear itself down and lost: after the city landmarked the building in 1981, the congregation challenged the designation in 1986, but the Landmarks Preservation Commission denied its application to demolish. Its 2010 Service of Lessons and Carols aired on the CBS Television Network. Known for welcoming all, it hosts Congregation B'nai Jeshurun, the West Side Campaign Against Hunger food pantry, and several performing arts groups."},{"name":"Ivey Delph Apartments","lat":40.822089,"lon":-73.946646,"blurb":"This six-story Hamilton Heights apartment house was designed in 1948 by Vertner Woodson Tandy, the pioneering African American architect who lived from 1885 to 1949. Completed in 1951, the beige brick and concrete building is a crisp example of the Moderne style, its center bay marked by projecting balconies with curved ends topped by sleek curved iron railings. It sits within the Hamilton Heights Historic District and was listed on the National Register of Historic Places in 2005."},{"name":"Church of the Sacred Hearts of Jesus and Mary","lat":40.743831,"lon":-73.975036,"blurb":"This now-demolished Kips Bay church served an Italian-American community estimated at 10,000 when the parish was founded in 1914. Its cornerstone was laid on October 3, 1915 by Cardinal John Farley before a crowd of more than five thousand Italian Catholics, and the first Mass was said early in 1916. Cardinal Edward Egan closed the parish in 2007 and the church was torn down, replaced by a small chapel built in 2009, where Egan himself later lived in retirement until his death in 2015."},{"name":"Stern College for Women","lat":40.746716,"lon":-73.97909,"blurb":"The women's college of Yeshiva University, its alumnae range from Orthodox rabbis to a writer who is also a Wiccan high priestess."},{"name":"Bridge Apartments","lat":40.847654,"lon":-73.934846,"blurb":"Four 32-story towers housing some 4,000 people rise on concrete platforms directly atop the 12-lane Trans-Manhattan Expressway as it feeds the George Washington Bridge, with open gaps between them left for ventilation. Built between 1961 and 1964, they were among the first aluminum-sheathed high-rises in the world. Residents complained of pollution almost immediately, and in 1967 Senator Robert F. Kennedy visited and proposed a vaporproof barrier over the road; a 1973 EPA study found carbon monoxide exceeding federal limits. In May 2026 detaching concrete beneath the buildings caused minor injuries."},{"name":"Bethesda Fountain","lat":40.774316,"lon":-73.970833,"blurb":"The bronze Angel of the Waters crowning this fountain went up during the Civil War, one of only three major park structures finished in that era, and the whole terrace wasn't completed until 1873. Look up under the arcade: 14,000 hand-painted Minton encaustic tiles, designed by Jacob Wrey Mould, that sat boxed in storage for over 20 years before a $7 million restoration reinstalled them in 2007. By the 1970s the fountain ran bone-dry and the spot had slid from hippie hangout to drug-trafficking haunt before the Conservancy rescued it."},{"name":"General Grant National Memorial","lat":40.813454,"lon":-73.963051,"blurb":"It's the largest mausoleum in North America, holding Ulysses S. Grant and his wife Julia, and its design was modeled on the ancient Mausoleum at Halicarnassus, one of the Seven Wonders. Grant died bankrupt of throat cancer in 1885, days after finishing the memoirs he wrote to save his family. Chester A. Arthur chaired the fundraising drive, whose secretary was Richard Greener, Harvard's first black graduate. After decades of neglect and vandalism, a college student named Frank Scaturro led the 1990s campaign that shamed the government into restoring it."},{"name":"Federal Hall National Memorial","lat":40.707327,"lon":-74.010248,"blurb":"George Washington took the first presidential oath here in 1789, and the First Congress that met inside adopted the Bill of Rights and voted to build Washington, D.C. The original building saw even more: the 1765 Stamp Act Congress protested 'taxation without representation,' and in 1735 printer John Peter Zenger was jailed and tried here, his acquittal becoming a cornerstone of press freedom. That original hall was demolished in 1812; today's Greek Revival marble temple opened in 1842 as the U.S. Custom House."},{"name":"USS Maine Monument","lat":40.768247,"lon":-73.981001,"blurb":"This Columbus Circle pylon honors the men killed when the USS Maine exploded in Havana Harbor, dedicated in 1913. The gilded figures of Columbia Triumphant riding a seashell chariot drawn by three hippocampi were reportedly cast from bronze recovered from the Maine's own guns, and a memorial plaque was struck from metal salvaged from the ship. Sculptor Attilio Piccirilli modeled his figures on Audrey Munson, the era's most famous artists' muse. In 2021 the memorial was hit with protest graffiti during a demonstration in Columbus Circle."},{"name":"Titanic Memorial Lighthouse","lat":40.7074,"lon":-74.003861,"blurb":"This 60-foot lighthouse was built by public subscription to remember the Titanic dead and dedicated on April 15, 1913, exactly one year after the ship went down, partly at the urging of survivor Margaret 'Unsinkable Molly' Brown. From 1913 to 1967 a time ball at its top dropped every day at noon, triggered by a telegraph signal from the Naval Observatory in Washington, so ships in the harbor could set their clocks. It originally crowned the Seamen's Church Institute before moving to the South Street Seaport in 1976."},{"name":"New York Vietnam Veterans Memorial","lat":40.702664,"lon":-74.009805,"blurb":"The glass-block memorial wall here honors the 1,741 New Yorkers who died in Vietnam, and it was financed in part by a young Donald Trump, who gave $1 million and served as co-chairman of the commission that raised $2.5 million in 1983. The site was once Coenties Slip, where Dutch sailors moored their boats in the 1600s before it was filled in 1835. Ed Koch dedicated the plaza in 1985; Rudy Giuliani rededicated it in 2001 after 9/11, adding a 'Walk of Honor' of twelve granite pylons naming every one of the dead."},{"name":"Slocum Disaster Memorial","lat":40.726897,"lon":-73.981372,"blurb":"This marks New York's deadliest day before 9/11: on June 15, 1904, the excursion steamer General Slocum caught fire in the East River and killed an estimated 1,021 of the 1,342 aboard, mostly women and children from the German-American congregation of St. Mark's Lutheran Church heading to a picnic. It was the worst U.S. maritime disaster until the Titanic surpassed it eight years later. The catastrophe effectively erased Manhattan's 'Little Germany' neighborhood, whose survivors scattered in grief."},{"name":"William Henry Seward Monument","lat":40.7415,"lon":-73.988837,"blurb":"Dedicated in Madison Square in 1876, this bronze of statesman William H. Seward is believed to be the first monument in New York City ever to depict an actual New York resident. It was sculpted by Randolph Rogers and set on a striking red Levante marble pedestal."},{"name":"Alexander Lyman Holley Monument","lat":40.731282,"lon":-73.998145,"blurb":"Tucked into Washington Square Park, this Beaux-Arts bronze bust of engineer Alexander Lyman Holley was sculpted by John Quincy Adams Ward, the same artist behind the George Washington statue at Federal Hall, working with architect Thomas Hastings. It was cast by New York's Henry-Bonnard Bronze Company in 1889, set on an Indiana limestone pedestal, and dedicated on October 2, 1890."},{"name":"Amiable Child Memorial","lat":40.814808,"lon":-73.963169,"blurb":"This tiny urn is thought to be the only single-person private grave on city-owned land in all of New York. It marks St. Claire Pollock, a boy who died at age five in a fall down the bluff in 1797, and it sits directly across the street from the massive Grant's Tomb, an irony captured in verse: 'A granite dome is over Grant, and over a child the green.' When the city tried to move the grave to clear room for Grant's memorial, public outrage killed the plan and made the little monument almost a national institution."},{"name":"Dipway Arch","lat":40.767458,"lon":-73.978125,"blurb":"This is one of 36 ornamental spans threaded through Central Park, and by design no two of them are alike. They were conceived by Olmsted and Vaux's 1858 Greensward Plan to keep carriages, horseback riders, and pedestrians from ever crossing paths, and most were built in a rush during the 1860s. Vaux favored bluestone and brownstone, and the arches ranged from rugged rock to Neo-Gothic cast iron, all meant to blend quietly into the landscape rather than show off."},{"name":"Marcus Garvey Memorial Park","lat":40.804486,"lon":-73.943673,"blurb":"Early Dutch settlers called this steep schist outcrop Slang Berg, or 'Snake Hill,' for the reptiles in its rock clefts, and Hessian soldiers mounted a battery here in the Revolution to command the Harlem River. Crowning it is the Harlem Fire Watchtower, an 1855 cast-iron tower with a 10,000-pound bell, the sole survivor of eleven such lookouts built before buildings stopped being made of wood. Renamed in 1973 for the black-nationalist leader, the park hosted 1969's 'Black Woodstock,' the Harlem Cultural Festival of 'Summer of Soul' fame."},{"name":"Saint Stephen of Hungary Church","lat":40.773802,"lon":-73.950541,"blurb":"This Romanesque Revival church was the heart of Manhattan's Hungarian Catholic community, founded in 1902 by a priest from Hungary, Laszlo Perenyi, to serve waves of immigrants. The congregation worshipped in a borrowed former Presbyterian church on 14th Street before building here in Yorkville, a neighborhood that became a magnet for German and Hungarian New Yorkers. The Franciscan friars ran the parish from 1922 until 2015, when the archdiocese merged it away and the Hungarian congregation moved to nearby St. Joseph's."},{"name":"Zion Saint Mark's Church","lat":40.776116,"lon":-73.951047,"blurb":"This neo-Gothic church rose in 1888 as the Deutsche Evangelische Kirche von Yorkville, a spiritual home for the flood of German immigrants pouring into the neighborhood at the turn of the century. Its congregation later merged in 1946 with St. Mark's Lutheran, the very same church whose members were aboard the General Slocum when it burned in 1904, killing over a thousand. After more than a century, a final 'service of Holy Closure' was held here on February 1, 2026."},{"name":"Arthur Ross Pinetum","lat":40.78341,"lon":-73.966769,"blurb":"This four-acre stand of 17 pine species sits atop what was once a 35-acre reservoir that held the city's drinking water starting in 1842. Building it displaced the community of York Hill, whose residents moved to Seneca Village, itself later razed to create Central Park. Once the reservoir went obsolete, a wild parade of schemes for the site was floated, including an opera house, a radio tower, airplane landing pads, and a film-storage mausoleum, before it became the Great Lawn and this grove named for philanthropist Arthur Ross."},{"name":"Zabar's","lat":40.78382,"lon":-73.98,"blurb":"An Upper West Side temple of appetizing since Louis and Lillian Zabar opened a smoked-fish counter here in 1934. It runs on a cult of lox, sturgeon, and its own house-roasted coffee, with a famously elbows-out cheese counter downstairs and a beloved upstairs balcony of discount kitchen gadgets. Still family-owned, it's less a store than a neighborhood institution New Yorkers argue about."},{"name":"Barney Greengrass","lat":40.78873,"lon":-73.9748,"blurb":"'The Sturgeon King' has cured fish on Amsterdam Avenue since Barney Greengrass founded it in 1908, settling into this spot in 1929. The tin ceilings and faded wallpaper haven't changed, and neither has the move: scrambled eggs with lox, onions, and a schmear. Four generations in, it's a Sunday-morning pilgrimage where the line is part of the ritual."},{"name":"Pomander Walk","lat":40.7938,"lon":-73.972,"blurb":"Hidden mid-block between Broadway and West End, this gated double row of tiny Tudor townhouses was built in 1921 and modeled on the London stage set of the play 'Pomander Walk.' The storybook mews became a private enclave rumored to have housed Humphrey Bogart, Rosalind Russell, and the Gish sisters. Most New Yorkers walk past 94th Street their whole lives without knowing it's there."},{"name":"The Dorilton","lat":40.7789,"lon":-73.982,"blurb":"This 1902 Beaux-Arts apartment house at 71st and Broadway is so extravagantly ornamented - swags, sculpted figures, a monumental gate - that a contemporary critic sniffed it made him physically ill. Time has been kinder: it's now a celebrated city landmark. It's the building people stop mid-block to stare up at, unsure whether it's beautiful or absurd."},{"name":"Symphony Space","lat":40.7936,"lon":-73.972,"blurb":"This Broadway arts center grew from a free 1978 marathon concert into a neighborhood fixture, famous for 'Wall to Wall' all-day music tributes and the public-radio series 'Selected Shorts,' where actors read short stories to a live crowd. It's the rare place you might catch a twelve-hour Bach binge or a Nobel laureate reading fiction. A scrappy Upper West Side answer to Lincoln Center."},{"name":"Bemelmans Bar","lat":40.7745,"lon":-73.9633,"blurb":"The walls of this Carlyle Hotel bar are painted with Central Park whimsy by Ludwig Bemelmans, creator of the Madeline books, who did them in 1947 in exchange for a year's lodging for his family. It's the only Bemelmans commercial artwork the public can still walk into. Just upstairs, cabaret legend Bobby Short held court at Cafe Carlyle for 36 years."},{"name":"Lexington Candy Shop","lat":40.7772,"lon":-73.956,"blurb":"A luncheonette frozen in 1925, still run by the same family, with a working soda fountain that mixes Coca-Cola from syrup and seltzer the old way. The vintage counter and malted machines have made it a favorite film and photo set for anyone chasing lost New York. Order a lime rickey and an egg cream and the century falls away."},{"name":"J. G. Melon","lat":40.7702,"lon":-73.9585,"blurb":"A cash-only Third Avenue pub since 1972, wrapped in green checks and melon-themed bric-a-brac, revered for a griddled bar burger and cottage-fried potatoes that regularly top 'best in the city' lists. It's the kind of unpretentious room where old-money regulars and downtown pilgrims share the same crowded bar. No reservations, no debate about the burger."},{"name":"Temple Emanu-El","lat":40.7677,"lon":-73.9695,"blurb":"Completed in 1929 at Fifth and 65th, this is one of the largest synagogues on earth, its cavernous Romanesque-Byzantine sanctuary seating around 2,500 - more than St. Patrick's Cathedral. Home to the first Reform congregation in New York, founded in 1845, it dwarfs visitors with mosaics and a vast rose window. A monument to the German-Jewish elite who once ruled this stretch of Fifth Avenue."},{"name":"Rhinelander Mansion","lat":40.7715,"lon":-73.966,"blurb":"Ralph Lauren's Madison Avenue flagship inhabits a French Renaissance chateau completed in 1898 for heiress Gertrude Rhinelander Waldo, who reportedly never actually moved in. After decades of varied use, Lauren restored its grand staircase and paneled rooms in 1986, turning a Gilded Age folly into the ultimate stage set for selling old-money fantasy. It's retail disguised as a house tour."},{"name":"Chelsea Market","lat":40.7424,"lon":-74.0061,"blurb":"This block-long food hall fills the old Nabisco bakery complex where the Oreo cookie was invented and first baked in 1912. A brick concourse of vendors now runs beneath offices that have housed the Food Network and Google, with the High Line brushing right past its upper floors. The exposed pipes and factory bones are the point - you're snacking inside industrial New York."},{"name":"Cushman Row","lat":40.746,"lon":-74.003,"blurb":"This crisp run of 1840 Greek Revival townhouses on West 20th is considered among the finest of its kind in the city, complete with iron pineapples signaling hospitality. It sits on land once owned by Clement Clarke Moore, the scholar credited with 'A Visit from St. Nicholas' ('Twas the Night Before Christmas'), whose Chelsea estate gave the whole neighborhood its name. The block feels like a preserved slice of the 1840s."},{"name":"Edgar Allan Poe Street","lat":40.7862,"lon":-73.976,"blurb":"West 84th between Broadway and Riverside carries a second name honoring Edgar Allan Poe, who summered on a farm near here in 1844 while sick and broke. Local lore holds he worked on 'The Raven' during that Upper West Side stay, before it made him famous the next year. A quiet residential block hiding a gothic literary footnote."}];
  function distM(la1,lo1,la2,lo2){ var R=6371000,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180,
    s=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);
    return 2*R*Math.asin(Math.sqrt(s)); }
  function bearingDeg(la1,lo1,la2,lo2){ var p1=la1*Math.PI/180,p2=la2*Math.PI/180,dl=(lo2-lo1)*Math.PI/180,
    y=Math.sin(dl)*Math.cos(p2), x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
    return (Math.atan2(y,x)*180/Math.PI+360)%360; }
  function cardinal(b){ return ["N","NE","E","SE","S","SW","W","NW"][Math.round(b/45)%8]; }
  var LM_RADIUS = 300;
  function nearestLandmark(lat,lon){ var best=null,bd=LM_RADIUS;
    for(var i=0;i<LANDMARKS.length;i++){ var lk=LANDMARKS[i]; var d=distM(lat,lon,lk.lat,lk.lon);
      if(d<bd){bd=d;best=lk;} }
    if(best)best._d=bd; return best; }
  function nearestStation(st, ave){ var b=null,bd=Infinity; for(var i=0;i<STATIONS.length;i++){var s=STATIONS[i];
    var d=(st-s[0])*(st-s[0])+10.9*(ave-s[1])*(ave-s[1]); if(d<bd){bd=d;b=s;}} return b; }
  function bullets(lines){ return lines.map(function(l){
    return '<span class="bullet" style="background:'+(LINES[l]||"#666")+';color:'+(YELLOW[l]?"#111":"#fff")+'">'+l+'</span>';
  }).join(""); }
  function fmtCoord(s){ return d1(labelStreet(s[0])) + '<span class="x">×</span>' + d1(s[1]); }
  function subwayBearing(st, ave, s){ return Math.atan2(-(s[1]-ave)*3.3, s[0]-st) * 180 / Math.PI; }
  var FACTS = {
    "Battery Park City":"landfill from the World Trade Center dig. newest land in Manhattan.",
    "Financial District":"these streets follow old cow paths, not the grid. good luck.",
    "Two Bridges":"named for the Brooklyn and Manhattan bridges overhead.",
    "Tribeca":"TRIangle BElow CAnal. a realtor coined it in the 70s.",
    "Civic Center":"there's a gorgeous abandoned subway station under City Hall.",
    "Lower East Side":"once the most densely packed place on earth.",
    "Little Italy":"the San Gennaro feast has run here since 1926.",
    "Chinatown":"more bakeries per block than anywhere. get the egg tart.",
    "Nolita":"NOrth of Little ITAly. yes, they really named it that.",
    "Hudson Square":"the old printing district. now full of ad agencies.",
    "SoHo":"SOuth of HOuston. cast-iron facades and $28 salads.",
    "Alphabet City":"Avenues A, B, C, D. 'Avenue D, you're dead' no longer applies.",
    "Meatpacking District":"actual meat was packed here until about 2000.",
    "West Village":"the grid breaks. West 4th crosses West 10th somehow.",
    "Greenwich Village":"Dylan, the Beats, and $9 million townhouses.",
    "East Village":"CBGB was here. it's a clothing store now. sorry.",
    "Union Square":"the greenmarket's run since 1976. get the cider.",
    "Stuyvesant Town":"11,000 apartments built for returning WWII vets.",
    "Flatiron District":"the Flatiron is about 6 feet wide at its tip.",
    "Gramercy Park":"the last private park in NYC. you'll never get a key.",
    "Chelsea":"the High Line runs through it, on old freight rail.",
    "NoMad":"NOrth of MADison Square. another realtor acronym.",
    "Kips Bay":"named for Jacobus Kip's farm. the bay's long buried.",
    "Hudson Yards":"built on a platform over live rail tracks.",
    "Murray Hill":"finance bros and a suspicious number of dentists.",
    "Garment District":"still sews most of America's clothing samples.",
    "Times Square":"named for the New York Times, which moved out in 1913.",
    "Hell's Kitchen":"the name stuck; the reputation didn't. now it's brunch.",
    "Midtown East":"Grand Central's ceiling zodiac is painted backwards.",
    "Lincoln Square":"Lincoln Center replaced the old San Juan Hill blocks.",
    "Upper West Side":"Zabar's, strollers the size of cars, and Seinfeld.",
    "Manhattan Valley":"a real dip in the terrain. hence the name.",
    "Carnegie Hill":"named for Carnegie's mansion, now the Cooper Hewitt.",
    "Yorkville":"once German 'Kleindeutschland.' last beer hall closed 2014.",
    "Lenox Hill":"the hospital here delivered a lot of famous New Yorkers.",
    "Upper East Side":"old money, the Met, and doormen who quietly judge you.",
    "Central Park":"bigger than the principality of Monaco.",
    "Morningside Heights":"Columbia's turf. the cathedral is still unfinished.",
    "East Harlem":"El Barrio. a birthplace of salsa.",
    "Harlem":"the Apollo's amateur night launched Ella and Jimi.",
    "Hamilton Heights":"Hamilton's house, the Grange, got moved twice.",
    "Washington Heights":"the highest natural point on the island. and 'In the Heights.'",
    "Inwood":"the last old-growth forest in Manhattan is up here.",
    "Lower Manhattan":"the oldest part of the city. streets predate the grid.",
    "Midtown":"more office space than most whole cities.",
    "Uptown":"everything above 59th. it's a big place."
  };
  var odoStreets = 0, odoPrevSt = null;

  // ---- MAP ----
  var map = L.map("map", { zoomControl: true }).setView([40.7580, -73.9855], 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  var marker = L.marker([40.7580, -73.9855], { draggable: true }).addTo(map);

  var shown = { lat: 40.7580, lon: -73.9855 };

  function fmtGrid(v) { return (Math.round(v * 100) / 100).toFixed(2); }

  function updateWatch(fixLabel) {
    var r = reading(shown.lat, shown.lon);
    var el = document.getElementById("reading");
    if (r.far) {
      el.className = "reading toofar"; el.textContent = "THE SUBURBS";
      document.getElementById("caption").textContent = "not manhattan";
      document.getElementById("hood").textContent = "—";
    } else {
      el.className = "reading";
      el.innerHTML = r.stTxt + '<span class="x">×</span>' + r.aveTxt;
      document.getElementById("caption").textContent = "street × avenue";
      document.getElementById("hood").textContent = r.hood || "—";
    }
    document.getElementById("coords").innerHTML =
      "<b>lat</b> " + shown.lat.toFixed(5) + "  <b>lon</b> " + shown.lon.toFixed(5) +
      "<br><b>model</b> street " + fmtGrid(r.st) + " · avenue " + fmtGrid(r.ave) +
      (r.hood ? "<br><b>area</b> " + r.hood : "");
    // nearest subway (coordinate + arrow toward station + bullets), fun fact, street odometer
    var stn = nearestStation(r.st, r.ave);
    document.getElementById("subwayLine").innerHTML =
      '<span class="slabel">nearest subway</span>'
      + '<span class="arrow" style="transform:rotate(' + subwayBearing(r.st, r.ave, stn) + 'deg)">↑</span>'
      + '<span class="coord">' + fmtCoord(stn) + '</span>' + bullets(stn[2]);
    var cEl = document.getElementById("cameo");
    var lm = r.far ? null : nearestLandmark(shown.lat, shown.lon);
    if (lm) {
      var deg = bearingDeg(shown.lat, shown.lon, lm.lat, lm.lon);
      var dm = Math.round(lm._d);
      var dtxt = dm < 950 ? dm + " m" : (dm/1000).toFixed(1) + " km";
      cEl.className = "cameo show";
      cEl.innerHTML = '<span class="ctag"><span class="dirarrow" style="transform:rotate(' + Math.round(deg) + 'deg)">\u2191</span> ' +
        cardinal(deg) + " \u00b7 " + dtxt + " \u00b7 " + lm.name + "</span>" + lm.blurb;
    } else {
      var hood = r.hood || neighborhood(r.ave, r.st);
      var nf = (!r.far && hood) ? (FACTS[hood] || null) : null;
      if (nf) { cEl.className = "cameo show"; cEl.innerHTML = '<span class="ctag">\u25b8 ' + (hood || "") + "</span>" + nf; }
      else { cEl.className = "cameo"; }
    }
    if (odoPrevSt != null) odoStreets += Math.abs(r.st - odoPrevSt);
    odoPrevSt = r.st;
    document.getElementById("odo").textContent = Math.round(odoStreets) + " st";
    if (fixLabel) document.getElementById("fix").textContent = fixLabel;
  }

  function moved(lat, lon) {
    shown.lat = lat; shown.lon = lon; updateWatch("FIX live");
  }

  marker.on("drag", function (e) { var p = e.target.getLatLng(); moved(p.lat, p.lng); });
  map.on("click", function (e) { marker.setLatLng(e.latlng); moved(e.latlng.lat, e.latlng.lng); });

  function setPin(lat, lon, fly) {
    marker.setLatLng([lat, lon]);
    shown.lat = lat; shown.lon = lon;
    if (fly) map.setView([lat, lon], Math.max(map.getZoom(), 14));
    updateWatch("FIX now");
  }

  // ---- Controls ----
  document.getElementById("refreshBtn").addEventListener("click", function () {
    var p = marker.getLatLng(); shown.lat = p.lat; shown.lon = p.lng; updateWatch("FIX now");
  });
  document.getElementById("locateBtn").addEventListener("click", function () {
    if (!navigator.geolocation) { alert("Geolocation not available in this browser."); return; }
    document.getElementById("fix").textContent = "locating…";
    navigator.geolocation.getCurrentPosition(
      function (pos) { setPin(pos.coords.latitude, pos.coords.longitude, true); },
      function (err) {
        document.getElementById("fix").textContent = "FIX now";
        alert("Couldn't get your location: " + err.message +
              "\n\n(Browsers often block GPS for files opened directly. It works when the page is served over http/https.)");
      }, { enableHighAccuracy: true, timeout: 10000 });
  });

  // ---- Grid overlay (streets & avenues from the model) ----
  var gridLayer = L.layerGroup();
  var gridOn = false;
  (function buildGrid() {
    var s, a, e;
    for (s = 0; s <= 135; s += 1) {
      e = [[toLatLon(AVE_MIN, s).lat, toLatLon(AVE_MIN, s).lon],
           [toLatLon(AVE_MAX, s).lat, toLatLon(AVE_MAX, s).lon]];
      L.polyline(e, { color: "#c1432a", weight: (s % 10 === 0) ? 1.4 : 0.5,
                      opacity: (s % 10 === 0) ? 0.7 : 0.4 }).addTo(gridLayer);
    }
    for (a = 1; a <= 12; a += 1) {
      e = [[toLatLon(a, ST_MIN).lat, toLatLon(a, ST_MIN).lon],
           [toLatLon(a, ST_MAX).lat, toLatLon(a, ST_MAX).lon]];
      L.polyline(e, { color: "#1f6f8b", weight: 0.9, opacity: 0.5 }).addTo(gridLayer);
    }
  })();
  var gridBtn = document.getElementById("gridBtn");
  gridBtn.addEventListener("click", function () {
    gridOn = !gridOn;
    if (gridOn) gridLayer.addTo(map); else map.removeLayer(gridLayer);
    gridBtn.classList.toggle("on", gridOn);
  });

  // ---- Landmark overlay (every fun-fact spot as a dot; popup = name + blurb) ----
  // ~1400 dots: canvas renderer keeps pan/zoom smooth where SVG would chug
  var lmRenderer = L.canvas({ padding: 0.3 });
  var lmLayer = L.layerGroup();
  LANDMARKS.forEach(function (lk) {
    // bubblingMouseEvents:false so tapping a dot opens its popup without moving the pin
    L.circleMarker([lk.lat, lk.lon], { renderer: lmRenderer, radius: 5, color: "#7c2130", weight: 1.5,
        fillColor: "#e0243f", fillOpacity: 0.85, bubblingMouseEvents: false })
      .bindPopup("<b>" + lk.name + "</b><br>" + lk.blurb, { maxWidth: 240 })
      .addTo(lmLayer);
  });
  var lmOn = false;
  var lmBtn = document.getElementById("lmBtn");
  lmBtn.addEventListener("click", function () {
    lmOn = !lmOn;
    if (lmOn) lmLayer.addTo(map); else map.removeLayer(lmLayer);
    lmBtn.classList.toggle("on", lmOn);
  });

  // ---- Presets ----
  var PRESETS = [
    ["Times Sq", 40.7580, -73.9855], ["Flatiron", 40.7411, -73.9896],
    ["Harlem 125th", 40.8090, -73.9490], ["Below Houston", 40.7270, -74.0012],
    ["Alphabet City", 40.7241, -73.9789], ["Financial Dist", 40.7075, -74.0100],
    ["Brooklyn", 40.6782, -73.9442]
  ];
  var pc = document.getElementById("presets");
  PRESETS.forEach(function (p) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = p[0];
    b.addEventListener("click", function () { setPin(p[1], p[2], true); });
    pc.appendChild(b);
  });

  // ---- Clock ----
  var DAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  function tick() {
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, "0");
    var mm = String(d.getMinutes()).padStart(2, "0");
    var ss = String(d.getSeconds()).padStart(2, "0");
    document.getElementById("clock").innerHTML =
      hh + '<span class="colon blink">:</span>' + mm + '<span class="sec">·' + ss + '</span>';
    document.getElementById("dateStr").textContent = DAYS[d.getDay()] + " " + (d.getMonth() + 1) + "-" + d.getDate();
  }

  updateWatch("FIX now"); tick(); setInterval(tick, 1000);
})();
</script>
