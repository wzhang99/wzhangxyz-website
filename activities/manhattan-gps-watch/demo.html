lpture."},{"name":"200 Liberty Street","lat":40.710633,"lon":-74.015611,"blurb":"Formerly One World Financial Center, this 1986 Cesar Pelli tower is capped with a mastaba - a truncated square pyramid - one of a set of ancient-inspired rooftops (a dome, a pyramid, a stepped pyramid) crowning the complex. Standing right across from the World Trade Center, it was badly damaged on September 11, its windows shattered by the dust cloud; it closed for months and reopened in 2002 after extensive restoration. It took the name 200 Liberty Street when the complex became Brookfield Place in 2014."},{"name":"Grace Church","lat":40.731983,"lon":-73.990908,"blurb":"A 25-year-old James Renwick Jr. designed this Gothic Revival gem, his first major commission, from marble cut by inmates at Sing Sing prison."},{"name":"Harlem Hospital Center","lat":40.814404,"lon":-73.938825,"blurb":"Harlem Hospital broke racial barriers in American medicine: May Edward Chinn, the first Black woman to graduate from Bellevue Hospital Medical College, was also the first to intern here, and Black physicians fought their way onto the staff in the 1930s. Founded in 1887 as a way station for patients bound for Bellevue, it became a source of pride for the growing African-American community. Today it runs one of the few specialized asthma centers - vital in Harlem, where about 20% of people have asthma versus 4% nationally."},{"name":"Greenwich Street","lat":40.704778,"lon":-74.014967,"blurb":"Edgar Allan Poe lodged in a Greenwich Street boardinghouse in 1844-45 but hated it, griping about the dirty streets and the racket of clam-and-catfish vendors; painter Thomas Cole had earlier kept a garret here. The street also hosted the notorious 'Madame Restell,' who sold abortion pills until an angry mob stormed her headquarters in 1846. And in 1867-68 engineer Charles Harvey tested a half-mile cable-drawn elevated railway above the street - the seed of what became the IRT Ninth Avenue El."},{"name":"Archdiocesan Cathedral of the Holy Trinity","lat":40.769829,"lon":-73.95612,"blurb":"The largest Eastern Orthodox church in the Western Hemisphere had its cornerstone laid by Eleanor Roosevelt on September 14, 1931. Founded in 1891, it was the first Greek Orthodox church in New York City and the second in all the Americas. Opera legend Maria Callas was baptized here in 1926, and in 2001 broadcaster George Stephanopoulos married comedian Alexandra Wentworth beneath its Byzantine mosaics. One patriarch dubbed it 'the Cathedral of all of Hellenism in America.'"},{"name":"W. R. Grace Building","lat":40.754689,"lon":-73.982676,"blurb":"That swooping concave travertine slab on 42nd Street is Gordon Bunshaft's 1972 Grace Building, which reused the rejected facade design he'd drawn for the nearby Solow Building. Its odd sloping shape drew so much backlash that the company ran a student contest to fix up the plaza around it. Built on the old Stern's department store site, it now hides the Michelin-starred restaurant Gabriel Kreuther in its lobby."},{"name":"Carl Schurz Park","lat":40.775213,"lon":-73.943757,"blurb":"The climactic fight scene in Spike Lee's 2002 film 25th Hour, with Edward Norton and Philip Seymour Hoffman, was shot in this Yorkville park. It's also home to Gracie Mansion, the mayor's official residence since 1942, built by Archibald Gracie in 1799 on a bluff the British bombarded on September 15, 1776, demolishing an earlier house. Named for German-born Interior Secretary Carl Schurz, it's tended by New York City's oldest park conservancy."},{"name":"Gertrude Rhinelander Waldo House","lat":40.771456,"lon":-73.965415,"blurb":"The heiress Gertrude Rhinelander Waldo spent 1894 to 1898 building this limestone French chateau modeled on the Loire Valley's castles, then never moved in, for unknown reasons refusing to maintain, rent, or sell it. The Dime Savings Bank seized it in 1912, and it drifted through commercial tenants until Ralph Lauren leased it in 1984 and made it his flagship store in 1986. Look up: some of the empty facade niches still hold statues of French Renaissance royalty."},{"name":"137th Street–City College station","lat":40.82142,"lon":-73.954146,"blurb":"One of the original 28 stations that opened with New York's very first subway line on October 27, 1904, this stop was built for August Belmont's IRT and helped spark the development of Harlem and Morningside Heights. The line here was switched from two tracks to three in 1901 so trains could be stored in the unused center track. Platforms were later stretched in 1948 to fit full ten-car trains serving nearby City College."},{"name":"Carrère and Hastings","lat":40.797908,"lon":-73.974426,"blurb":"The Beaux-Arts firm that won the 1897 competition to design the New York Public Library ended abruptly in tragedy: John Carrere was riding in a taxi in 1911 when a streetcar smashed into it, giving him a brain concussion from which he never woke. Partner Thomas Hastings carried on alone until 1929. The two had met as students in Paris and worked together at McKim, Mead & White; their first big break was the Ponce de Leon Hotel for Henry Flagler. Hastings' grandfather had composed the hymn 'Rock of Ages.'"},{"name":"London Terrace","lat":40.747447,"lon":-74.002487,"blurb":"At the 1932 Christmas party, Yankees legend Babe Ruth showed up dressed as Santa Claus, handed out gifts to hundreds of children, then revealed his identity to wild cheers before signing autographs apartment to apartment. Begun in 1929 as what was billed as the world's largest apartment complex, London Terrace fills an entire Chelsea block with about 1,700 units and an Olympic-sized pool. A descendant of Clement Clarke Moore laid its cornerstone; the Depression sent it into default by 1933."},{"name":"Pearl Street","lat":40.711129,"lon":-74.000651,"blurb":"Thomas Edison's Pearl Street Station, the first public power plant in the United States, fired up its direct-current generator at 255-257 Pearl Street on September 4, 1882. The street's name comes from the oyster shells the Dutch found here, Parelstraat. Herman Melville was born at 6 Pearl in 1819, and an 1835 gas-pipe fire consumed some 600 buildings across seventeen blocks. In 1854 schoolteacher Elizabeth Jennings was thrown off a streetcar nearby; her lawyer, future president Chester A. Arthur, won the desegregation suit."},{"name":"Merchant's House Museum","lat":40.727658,"lon":-73.992344,"blurb":"This is the only 19th-century home in Manhattan with its original interior and exterior both intact, right down to a secret passageway said to have sheltered fugitive slaves on the Underground Railroad. Merchant Seabury Tredwell's family lived here for nearly a century, so private they shunned publicity, until his youngest daughter Gertrude, born in the house in 1840, died there in 1933. After a daughter was hurt in a stagecoach accident, they installed a hand-pulled elevator. The museum holds over 4,500 family possessions."},{"name":"Metropolitan Hospital Center","lat":40.785057,"lon":-73.94495,"blurb":"Frederick Wiseman shot his Emmy-winning 1969 documentary Hospital inside this East Harlem hospital's emergency room; the film was later chosen for the National Film Registry. Two years on, the George C. Scott black comedy The Hospital was filmed in a psychiatric wing still under construction. Founded in 1875 as the Homeopathic Hospital on Wards Island, Metropolitan has been tied to New York Medical College ever since, the oldest hospital-and-private-medical-school partnership in the country."},{"name":"Eldridge Street Synagogue","lat":40.714729,"lon":-73.993461,"blurb":"When it was dedicated on September 4, 1887, this was one of the first synagogues built in America by Eastern European Jews, a Moorish Revival showpiece by architects Peter and Francis Herter. The congregation peaked around 800 members between 1890 and 1915, but after the 1924 Immigration Act choked off new arrivals, numbers collapsed. The grand main sanctuary was sealed shut in 1954 and the remaining few worshipped in the basement, until a restoration completed in 2007 brought it back."},{"name":"Broadway Bridge","lat":40.873228,"lon":-73.911505,"blurb":"The vertical-lift bridge you see today is the third span on this spot, and its predecessor had a remarkable afterlife: the original 1895 swing bridge was floated south down the Harlem River in 1905-06 and reinstalled as the University Heights Bridge. Oddly, though it's a Manhattan-to-Bronx route, the whole bridge sits within Manhattan, linking Inwood to Marble Hill, a chunk of the mainland that's still officially part of the borough. The lower deck carries Broadway, the upper deck the 1 train."},{"name":"57th Street station (IND Sixth Avenue Line)","lat":40.763972,"lon":-73.97745,"blurb":"This Sixth Avenue station opened on July 1, 1968, built as part of the Chrystie Street Connection that expanded capacity on the line, at a cost of $13.2 million. Before it opened, the MTA threw a 300-guest luncheon right on the platform. For two decades it was a dead-end terminal, until service was extended to Queens in 1989. From 1978 to 1990 it was a stop on the JFK Express, the airport train nicknamed the \"train to the plane.\""},{"name":"Westside Theatre","lat":40.759448,"lon":-73.99262,"blurb":"Before it was an off-Broadway house, this Hell's Kitchen building was a church: architect Henry Franklin Kilburn designed it in Romanesque Revival style in 1890 for the Second German Baptist Church, which used it until the 1960s. Various nightclubs took over next, and it finally became a theater in 1976. Today it packs in two stages, a 270-seat house upstairs and a 249-seat thrust-stage theater downstairs."},{"name":"Ray's Candy Store","lat":40.726282,"lon":-73.983546,"blurb":"Ray Alvarez, the owner of this East Village institution, was born Asghar Ghahraman in Tabriz, Iran, in 1933, served in the Iranian Navy, and in 1963 deserted his ship and swam ashore off the coast of Virginia. He bought the store in 1974 for $30,000 and kept it open through the 1988 Tompkins Square Park riot, saying he stayed because \"all the combatants were his customers.\" Curtis Sliwa was kidnapped and shot just outside in 1992. Ray finally became a U.S. citizen in 2011, at age 78."},{"name":"M15 (New York City bus)","lat":40.752475,"lon":-73.972702,"blurb":"This is the single busiest bus route in both New York City and the entire United States, carrying about 57,000 riders a day and 16.4 million a year on articulated buses. Its roots run deep: the Second Avenue Railroad opened a horsecar-era streetcar line along this corridor back in 1853-54. Buses replaced the streetcars in 1933, and limited-stop service arrived on September 13, 1976, shaving up to 23 minutes off a rider's trip."},{"name":"Avenues: The World School","lat":40.749417,"lon":-74.003321,"blurb":"This pricey for-profit school was co-founded by Benno Schmidt Jr., a former president of Yale, along with Edison Schools' Chris Whittle and former Esquire publisher Alan Greenberg, and it raised $85 million before it even opened in 2012. The Chelsea campus is a $60 million conversion of the R.C. Williams Warehouse, a building Cass Gilbert designed in 1928. Pop musician King Princess is among its alumnae, and the school starred in the 2015 gentrification documentary Class Divide."},{"name":"The New York Earth Room","lat":40.725979,"lon":-73.999754,"blurb":"Tucked inside a SoHo loft at 141 Wooster since 1977 is Walter De Maria's The New York Earth Room: 250 cubic yards of dirt, piled 22 inches deep across 3,600 square feet of prime real estate. For 35 years, from 1989 until he retired in 2024, painter Bill Dilworth was its sole caretaker, watering and raking the soil. The Dia Art Foundation keeps it on permanent view and even maintains an apartment on the same floor."},{"name":"Trump Parc","lat":40.765545,"lon":-73.976667,"blurb":"This was the Barbizon-Plaza Hotel, an art deco tower that opened in 1930 with 1,400 rooms and was built specifically for artists and musicians, complete with soundproof practice rooms, art studios, and two performance halls. From the late 1950s through the mid-1960s it hosted pioneering gay-rights gatherings, including a 1958 Mattachine Society convention and a 1964 Daughters of Bilitis convention. Donald Trump bought it in 1981 and converted it into the Trump Parc condominiums by 1988."},{"name":"72nd Street","lat":40.770882,"lon":-73.963296,"blurb":"On October 11, 2006, Yankees pitcher Cory Lidle's small plane slammed into the 50-story Belaire apartment tower at 524 East 72nd Street, killing him. This grand crosstown street, drawn extra-wide at 100 feet by the 1811 Commissioners' Plan, is lined with landmarks: the Dakota sits at its northwest corner with Central Park West, and the old Rhinelander Mansion, now Ralph Lauren, at the southeast corner of Madison. A Charles Tiffany mansion by McKim, Mead & White once stood here too, demolished in 1936."},{"name":"National Arts Club","lat":40.737754,"lon":-73.986681,"blurb":"Founded in 1898 by Charles DeKay, who had spent 18 years as the art and literary critic of the New York Times, this Gramercy Park club made a then-radical choice: it offered full membership to women from the very start. Its early rolls read like a Gilded Age who's-who, with collectors like Henry Frick and Benjamin Altman, financier J. P. Morgan, and artists Frederic Remington, William Merritt Chase, and George Bellows. Though private, all its exhibitions and programs are free and open to the public."},{"name":"Morningside Park","lat":40.806053,"lon":-73.95806,"blurb":"Columbia University's 1960s plan to build a gymnasium in the park, with a segregated entrance for Harlem residents, helped ignite the explosive 1968 student protests; the gym was scrapped, and its abandoned foundation became a waterfall and pond in 1990. The 30-acre park drapes over a dramatic Manhattan schist cliff that splits Morningside Heights from Harlem below. Central Park's designers Olmsted and Vaux shaped it, and it was finally completed in 1895."},{"name":"81st Street–Museum of Natural History station","lat":40.781784,"lon":-73.971923,"blurb":"This Upper West Side stop opened on September 10, 1932, as part of the very first segment of the city-built Independent Subway System, the Eighth Avenue Line running from Chambers Street to 207th Street, a line whose full construction cost $191.2 million. Sitting right beneath the American Museum of Natural History, the station was thoroughly renovated in 1998-2000 in tandem with the museum's new Hayden Planetarium inside the Rose Center for Earth and Space."},{"name":"Grand Street station (IND Sixth Avenue Line)","lat":40.718162,"lon":-73.993784,"blurb":"Opened on November 26, 1967, this station was one of two built as part of the Chrystie Street Connection, which finally linked the Sixth Avenue Line to the Manhattan and Williamsburg Bridges. It was originally meant to be far grander: a four-track station with two island platforms and a transfer to the long-promised Second Avenue Subway. Because so many senior citizens lived nearby, planners designed it with plentiful ramps and \"a minimum of steps.\""},{"name":"96th Street station (Second Avenue Subway)","lat":40.784318,"lon":-73.947152,"blurb":"When it opened on January 1, 2017, this station was part of New York's first major subway expansion in over half a century, capping a Second Avenue Subway saga that began construction back in 1972 before stalling in 1975 for lack of money. As the northern terminus of Phase 1, it boasts rarities for the system: full accessibility, air conditioning, and waterproofing. Its walls carry Sarah Sze's sweeping mural \"Blueprint for a Landscape.\""},{"name":"Martha Washington Hotel","lat":40.744707,"lon":-73.984457,"blurb":"For 95 years this was a women-only hotel, opened in 1903 by the Women's Hotel Company and named for Martha Washington, the country's first First Lady, with men generally barred above the ground floor. Robert W. Gibson designed the 13-story Renaissance Revival building, which held 200 short-term rooms and 400 long-term residences. It finally went mixed-sex in 1998, cycled through names like the Thirty Thirty and the Redbury, and in 2023 briefly served as a shelter for migrants."},{"name":"Ladies' Mile Historic District","lat":40.74,"lon":-73.9925,"blurb":"The revolutionary draw of this Gilded Age shopping district was safety: here, in the 1880s and 1890s, wealthy women could shop alone without a male chaperone, a genuine novelty that made it a magnet for the elite \"carriage trade.\" Its 28 blocks held New York's grandest emporiums, B. Altman, Lord & Taylor, Arnold Constable, and Tiffany & Co. among them. The area gained cachet in 1860 when the visiting Prince of Wales stayed at the Fifth Avenue Hotel, and it even hosted the first home of the Met."},{"name":"Central Park Carousel","lat":40.769943,"lon":-73.975248,"blurb":"Holden Caulfield watched his sister Phoebe ride here: the carousel that burned down in 1950 was immortalized in Salinger's The Catcher in the Rye, brass ring and all. The current one is even older than the one it replaced, carved in 1908 by Solomon Stein and Harry Goldstein and spun in a Coney Island trolley terminal until the 1940s. One of America's largest merry-go-rounds, it has 57 hand-carved horses and gives some 250,000 rides a year. The Trump Organization ran it until the city cut all its contracts after January 6, 2021."},{"name":"Hispanic Society of America","lat":40.833365,"lon":-73.946635,"blurb":"Despite the name it was never actually a learned society, just New York's most misunderstood museum, tucked away on Audubon Terrace in Washington Heights. Founded in 1904 by philanthropist Archer M. Huntington, it hoards masterworks by Velazquez, Goya, El Greco and Sorolla plus a first edition of Don Quijote and a 1526 Map of the World. Its Sorolla Room rings visitors with 14 massive canvases, 'Vision of Spain,' totaling over 200 linear feet. Oddly, it focuses on Old Spain while sitting in a heavily Dominican neighborhood."},{"name":"One Madison","lat":40.740479,"lon":-73.98808,"blurb":"One of the world's slenderest towers at a 12:1 height-to-width ratio, this Flatiron sliver topped out in 2010 then sat unfinished for three years amid bankruptcy and fraud allegations. Its residents read like a tabloid: Tom Brady and Gisele Bundchen own a $14-million suite, Warren Buffett's son Peter once lived here, and Rupert Murdoch bought the triplex penthouse plus another floor for $57.3 million in 2014. To keep the needle-thin tower steady, its roof hides three U-shaped tanks of water that counter the building's sway."},{"name":"Sylvia's Restaurant of Harlem","lat":40.808628,"lon":-73.944519,"blurb":"Sylvia Woods opened this Harlem soul-food institution in 1962 after buying the original luncheonette with money borrowed from her mother, who had to mortgage her farm to lend it; Woods repaid the loan within a year. Still family-run today, it has fed Nelson Mandela, Barack Obama, Bill Clinton, Whoopi Goldberg and Bruno Mars. It landed in the news in 2007 when Bill O'Reilly, dining there with Al Sharpton, made widely criticized on-air remarks about the experience."},{"name":"Masjid Malcolm Shabazz","lat":40.801989,"lon":-73.950196,"blurb":"Malcolm X was named minister of this Harlem mosque, then Nation of Islam Temple No. 7, in 1954, and preached here until he broke with Elijah Muhammad in 1964. The temple was firebombed in 1965 just after his assassination, forcing a move, and in 1976 it was renamed to honor him. In a strange twist, Farrakhan appointed Muhammad Abdul Aziz, a man convicted of Malcolm's murder who long proclaimed his innocence, as the mosque's security chief in 1989; Aziz's conviction was finally overturned in 2021."},{"name":"St. John's Terminal","lat":40.7282,"lon":-74.01001,"blurb":"Built in 1934 as the southern terminus of the High Line, back when it was a working elevated freight line, this hulking building could swallow 227 railcars, and its floors of 205,000 square feet each were the largest in New York City at the time. Freight trains ran until 1960, after which it became a warehouse and offices, largely used by Merrill Lynch by the 1990s. In 2021 Google bought the building for its Hudson Square campus, topping the original three floors with nine more; the redevelopment finished in 2024."},{"name":"125 Greenwich Street","lat":40.709108,"lon":-74.012746,"blurb":"Welding sparks ignited insulation and set this Rafael Vinoly-designed residential tower's roof ablaze one March 2024 morning, though firefighters quickly put it out. The 912-foot spire was originally drawn up far taller, at 1,356 feet and 77 floors, before being scaled back. Two blocks south of One World Trade Center, it rose on the site of an 1888 Western Electric telephone factory that later housed the American Stock Exchange. Its rounded, nearly column-free corners are held up by two I-beam-shaped shear walls running the height of the slender tower."},{"name":"181st Street station (IND Eighth Avenue Line)","lat":40.851761,"lon":-73.93796,"blurb":"One of the deepest stations in the system, sitting near Bennett Park, the highest natural point in Manhattan, this 1932 A-train stop was deemed so bomb-proof that a 1950 Cold War plan eyed it and four other Washington Heights stations as atomic-bomb shelters, complete with first-aid rooms; the program was never funded. Chief IND architect Squire Vickers, a painter, did its tilework. Soon after it opened, a nickel bought a bus ride from here across the George Washington Bridge to Fort Lee, New Jersey."},{"name":"Marcus Garvey Park","lat":40.804486,"lon":-73.943673,"blurb":"In the summer of 1969 this Harlem park hosted the Harlem Cultural Festival, later dubbed 'Black Woodstock' and resurrected in the 2021 documentary Summer of Soul. Long called Mount Morris Park, it was renamed in 1973 for Black nationalist Marcus Garvey. Its centerpiece is a steep outcrop of schist that Dutch settlers called Slang Berg, or Snake Hill, for the snakes in its rocks, which forced Fifth Avenue to split and detour around it. Atop it stands the 1855 Harlem Fire Watchtower, the last survivor of eleven cast-iron fire lookouts once scattered across the city."},{"name":"John's of Bleecker Street","lat":40.73161,"lon":-74.003342,"blurb":"This Greenwich Village pizzeria has been firing coal-oven tomato pies since 1915, and it has two ironclad rules: no slices, only whole pies from its 850-degree oven, and cash only (which held until 2016). Generations of customers have carved their names into its wooden booths. For years the shop was believed founded in 1929 by John Sasso, but documents later revealed it was actually opened in 1915 by Filippo Milone, with Sasso taking over in 1925."},{"name":"Frederick Douglass Houses","lat":40.796839,"lon":-73.965002,"blurb":"Named for the abolitionist Frederick Douglass, this NYCHA housing project between 100th and 104th Streets opened in 1958 with 17 towers and some 2,000 apartments. Its alumni include soul singer Kelis and actor Mekhi Phifer, plus NBA player Reggie Carter. Sharing the superblock is an unexpected neighbor: the flagship of Hostelling International USA, housed in a landmark 19th-century building designed by noted architect Richard Morris Hunt, filling the entire Amsterdam Avenue blockfront between 103rd and 104th."},{"name":"86th Street","lat":40.780711,"lon":-73.958453,"blurb":"East 86th Street was once nicknamed the 'German Broadway,' the heart of Yorkville's German community until its distinct German shops all but vanished after the 1980s. The street has quite a celebrity roster: Tom Cruise lived at 50 West 86th in 1981, and Robert Downey Jr. and Sarah Jessica Parker later shared an apartment in the same building. Nobel laureate Isaac Bashevis Singer lived here too, and a stretch of West 86th was renamed Isaac Bashevis Singer Boulevard in his honor."},{"name":"AI Now Institute","lat":40.735037,"lon":-73.994822,"blurb":"This NYU-affiliated research institute studies AI's social fallout and the concentration of power in Big Tech, and it grew out of a 2016 symposium organized by Obama's White House science office. It was co-founded by Meredith Whittaker, who started Google's Open Research group, and Microsoft researcher Kate Crawford, and bills itself as the first AI institute founded and led by women. In 2021-22 its leadership advised FTC Chair Lina Khan, and it has called for an end to 'black box' AI systems in criminal justice and healthcare."},{"name":"96th Street station (IRT Broadway–Seventh Avenue Line)","lat":40.794379,"lon":-73.972,"blurb":"Another of the 28 original stations that opened on October 27, 1904, this Upper West Side express stop hides two disused side platforms alongside its island platforms, relics of the system's early days. Just north of here, an at-grade junction caused such rush-hour congestion that the IRT drew up a costly '96th Street Improvement' to fix it, only to abandon the plan in 1908 when speed-control signals solved the problem more cheaply. A new head house in the Broadway median and elevators were added between 2007 and 2010."},{"name":"Seventh Avenue station (IND lines)","lat":40.762862,"lon":-73.981637,"blurb":"The 1990 murder of Utah tourist Brian Watkins here, killed defending his family from a robbery, was called 'probably the tipping point in New York's history of violence,' a low point of the city's record murder year that spurred a crackdown on crime. Opened in 1933, this Midtown interchange is a two-level station with one island platform stacked directly over another, letting riders swap between the Sixth Avenue and Queens Boulevard lines. Overhead you can glimpse the BMT Broadway Line crossing through the ceiling and columns."},{"name":"Marymount School of New York","lat":40.779918,"lon":-73.961212,"blurb":"This Catholic girls' school occupies a trio of turn-of-the-century Beaux-Arts mansions on Fifth Avenue, beginning with the Florence Vanderbilt estate at 1028, which Mother Marie Joseph Butler bought in 1926 to found the school. It later absorbed the neighboring Pratt and Dunlevy Milbank mansions, and the three buildings are on the National Register. Its alumnae include Maria Teresa, the Grand Duchess of Luxembourg, and Alicia Nash, a Salvadoran-American physicist."},{"name":"Alice in Wonderland sculpture","lat":40.775038,"lon":-73.966534,"blurb":"Sculptor Jose de Creeft modeled Alice's face on his own daughter and the Mad Hatter on philanthropist George Delacorte, who commissioned the 1959 statue for kids to climb on."},{"name":"Confucius Plaza","lat":40.714667,"lon":-73.996039,"blurb":"When this 44-story Chinatown co-op was built in 1975, it was the first major publicly funded housing project built almost exclusively for Chinese Americans, but its construction sparked a landmark protest: in 1974 Asian American activists blocked the site holding signs reading 'The Asians build the railroad; Why not Confucius Plaza,' and over 55 were arrested before the contractor agreed to hire minority workers. Out front stands a 15-foot bronze of Confucius by Liu Shih, given for the US bicentennial. A section of the never-finished Second Avenue Subway was even built underneath it."},{"name":"Bard High School Early College","lat":40.718458,"lon":-73.976023,"blurb":"At this public school students start college two years early, finishing high school in ninth and tenth grade and then earning a Bard College Associate in Arts degree under the same roof, taught by the same faculty. The first campus opened in Manhattan in 2001 as a partnership between Bard College and the city, funded partly by the Gates Foundation, and there are now eight campuses nationwide. President Obama name-checked the model as a future of education in his 2009 centennial speech to the NAACP."},{"name":"Museum of Jewish Heritage","lat":40.706044,"lon":-74.018603,"blurb":"This Holocaust memorial museum in Battery Park City is shaped to carry meaning: its six-sided building with a pyramid roof evokes both the six points of the Star of David and the six million Jews murdered in the Holocaust. Opened in 1997, it nearly didn't happen, as the 1987 'Black Monday' crash wiped out the funds of potential donors and dropped real estate prices. President Jimmy Carter, backed by Mayor Ed Koch, had even proposed placing the national Holocaust memorial in New York rather than Washington, though that was ruled out."},{"name":"Yonah Schimmel's Knish Bakery","lat":40.723186,"lon":-73.990131,"blurb":"Selling knishes since 1890, this Lower East Side fixture began when Yonah Schimmel, an immigrant from Austro-Hungarian Galicia, hawked them from a pushcart. A famous line from The Underground Gourmet captured its clout: 'No New York politician in the last 50 years has been elected to office without having at least one photograph showing him on the Lower East Side with a knish in his face.' Still family-run, it uses the same potato and kasha recipes as at its opening and turns up in Woody Allen's 2009 film Whatever Works."},{"name":"Inwood–207th Street station","lat":40.867764,"lon":-73.921055,"blurb":"The northern end of the line: this Inwood stop, opened in 1932, is the last stop on the A train and the IND Eighth Avenue Line, its tracks dead-ending at bumper blocks just past the platform. Its maroon tiles are no accident, part of a clever IND color code that helped riders heading away from Lower Manhattan track their progress, with the same maroon repeating south to the next express station. Fittingly for a terminal, its station artwork by Sheila Levrant de Bretteville is titled 'At the Start...At Long Last.'"},{"name":"St. Paul the Apostle Church","lat":40.769888,"lon":-73.985141,"blurb":"The mother church of the Paulist Fathers, the first community of Catholic priests founded in the US, this Upper West Side landmark was built between 1876 and 1884 from Tarrytown gray granite salvaged from the old Croton Aqueduct, with entrance steps recycled from Booth's Theatre. Its lavish interior draws on a who's who of American art: Stanford White, John La Farge stained glass, Augustus Saint-Gaudens and Bertram Goodhue's floor mosaics. The cavernous basement has served as everything from a homeless shelter and soup kitchen to rehearsal space for the Rockettes, boxing matches and a comic convention."},{"name":"452 Fifth Avenue","lat":40.752052,"lon":-73.982534,"blurb":"This Midtown tower gives a piggyback: the 30-story glass HSBC Tower curves around and preserves the 10-story Knox Building at its base, a 1902 Beaux-Arts gem built for Edward Knox of the Knox Hat Company. The Knox heirs sold it in 1964 to founders of the Republic National Bank, which made it their headquarters and later built the wrap-around tower as their world HQ. HSBC took over in the 1990s. Only the ornate Knox Building is a protected city landmark; a curved twin tower planned across Fifth Avenue was never built."},{"name":"Belaire Apartments","lat":40.76594,"lon":-73.952408,"blurb":"On October 11, 2006, a small plane owned by New York Yankees pitcher Cory Lidle slammed into this 42-story East Side tower, killing Lidle and his flight instructor and injuring a resident in the fire; the NTSB blamed pilot error. The building has an unusual arrangement with the Hospital for Special Surgery next door, which uses its lower floors for offices and once housed nurses there. Its residents have included junk-bond financier Ivan Boesky and Asif Ali Zardari, the Pakistani politician who later became the country's president."},{"name":"The Empire Hotel","lat":40.771336,"lon":-73.982717,"blurb":"This hotel by Lincoln Center starred as Chuck Bass's own hotel throughout The CW's Gossip Girl, boosting its bookings by up to 10 percent, and its enduring red rooftop neon, glowing since 1923, is said to have inspired the sign that shines into Kramer's apartment on Seinfeld. Down in the basement, the Iridium jazz club became famous for guitar legend Les Paul's weekly concerts. Scenes from Power and Dexter: Resurrection have also filmed here."},{"name":"Kalustyan's","lat":40.742829,"lon":-73.982138,"blurb":"This famed spice emporium sits in a building with a presidential past: it was built in the 1860s as Chester A. Arthur's town house, and Arthur was sworn in as US president on an upper floor before a young William Randolph Hearst bought it and ran the New York Journal from inside. The shop was founded in 1944 by Kerope Kalustyan, an Armenian from Turkey, when the area was 'Little Armenia'; as Indian immigrants arrived it helped turn the Murray Hill blocks into 'Curry Hill.' Today it stocks over 10,000 products from more than 80 countries."},{"name":"Fred F. French Building","lat":40.755371,"lon":-73.978898,"blurb":"Architectural writer Carol Krinsky called this 1927 Art Deco tower 'the only Mesopotamian skyscraper' in New York, and its architect deliberately chose facade colors meant to evoke the biblical Tower of Babel. The top is crowned with Mesopotamian-style bas-reliefs and faience tiles, while bronze entrances below are guarded by mythological winged beasts. Named for developer Fred F. French, who also built Tudor City, it was the tallest building on Fifth Avenue at its debut, and is so prominent it has its own ZIP code, 10176."},{"name":"The Corinthian","lat":40.746447,"lon":-73.972891,"blurb":"When it opened in 1988 this 57-story tower was New York City's largest apartment building, with 863 units, and it rose on the site of the old East Side Airlines Terminal, where travelers once checked bags and caught buses to LaGuardia and JFK through the adjacent Queens-Midtown Tunnel. The MTA auctioned the site in 1985, and a 21-round bidding war among eight buyers drove the price to a then-record $90.6 million. Architect Der Scutt clad it in clusters of fluted, rounded towers giving every apartment a 180-degree view, and much of the old terminal survives inside its base."},{"name":"Henry Street Settlement","lat":40.714075,"lon":-73.984518,"blurb":"In 1893 a girl repeating 'mommy... baby... blood' led nurse Lillian Wald to a tenement where a new mother lay abandoned by a doctor she couldn't pay to stay. Wald called it her 'baptism by fire' and founded the Nurses' Settlement, later renamed for Henry Street; banker Jacob Schiff bought it a townhouse. It pioneered the first public-school nurse and the Visiting Nurse Service, and in 1937 premiered a play-opera with music by Aaron Copland, directed by Orson Welles."},{"name":"54th Street","lat":40.760709,"lon":-73.974574,"blurb":"This crosstown run packs in Studio 54 and the disco-era Ameritania Hotel, plus 'Big Apple Corner' at Broadway honoring writer John J. Fitz Gerald, who popularized New York's nickname. The stretch by Eighth Avenue is signed Senor Wences Way for the Ed Sullivan Show ventriloquist. The Rockefellers lived at 4-15 West 54th (John D.'s mansion is now part of MoMA), and 1325 Sixth Avenue played Elaine's workplace on Seinfeld."},{"name":"26 Federal Plaza","lat":40.715427,"lon":-74.004175,"blurb":"At 41 stories it's the tallest federal building in America, but it's best known for Richard Serra's 'Tilted Arc,' the site-specific steel curve installed on its plaza in 1981 and so hated that its 1989 removal spawned the Visual Artists Rights Act of 1990. Former President Richard Nixon rented an office here from 1980 to 1988. The building even has its own ZIP code, 10278, and has become a flashpoint for immigration-enforcement protests."},{"name":"St. Thomas More Church","lat":40.782749,"lon":-73.956728,"blurb":"After John F. Kennedy Jr. died in a 1999 plane crash, the family held his private memorial here, with Senator Ted Kennedy delivering the eulogy and President Bill Clinton attending. Jacqueline Kennedy Onassis was a parishioner who had a Mass said for JFK every November 22; photographer Bill Cunningham worshipped here too. Built in 1870 as an Episcopal chapel modeled on a London church, it has served three denominations and is the second-oldest church on the Upper East Side."},{"name":"Alfred E. Smith Houses","lat":40.7104,"lon":-73.99865,"blurb":"Singer Luther Vandross and comedian Michael Che both grew up in this Lower East Side project, twelve 17-story buildings finished in 1953. It's named for Al Smith, the four-time New York governor and social reformer who in 1928 became the first Catholic nominated for president by a major party. Nearby sit Alfred E. Smith Park and a recreation center; by 2010 the complex had the highest share of elderly residents of any NYCHA development."},{"name":"Trump Plaza","lat":40.763232,"lon":-73.965702,"blurb":"The concrete for this 1984 co-op came from mobster Anthony 'Fat Tony' Salerno, linked to Donald Trump through their shared lawyer Roy Cohn; in 1986 Rudy Giuliani's office indicted Salerno for rigging concrete bids on the very building. A construction worker died falling 33 stories in May 1983. Dick Clark and Martina Navratilova lived here, and though Trump billed it as 39 stories it actually has 36. He even sued a rival architect for copying its design."},{"name":"Empire Diner","lat":40.747183,"lon":-74.004311,"blurb":"This gleaming 1946 Fodero dining car was a near-abandoned greasy spoon until new owners refurbished it in 1976, crowning the roof with a miniature stainless-steel Empire State Building and sparking a national craze for upscale retro diners. Reopened on Leap Day 1976, its 'highbrow-lowbrow' menu drew art-scene regulars like Meryl Streep and John Cazale. Its Art Deco exterior became an icon of countless films and TV shows."},{"name":"Alexander Hamilton Bridge","lat":40.845721,"lon":-73.929898,"blurb":"This eight-lane steel arch, named for the Founding Father, opened over the Harlem River in 1963 the same day the Cross Bronx Expressway was finished. Its knot of spiraling ramps to the Major Deegan is nicknamed 'The Corkscrew.' In a twist that defied officials' fears of gridlock, China Construction America won the $407 million renovation contract in 2009 and delivered it under budget and 35 days ahead of schedule."},{"name":"Argosy Book Store","lat":40.762386,"lon":-73.969167,"blurb":"New York's oldest independent bookstore, founded in 1925 by Louis Cohen, who picked the name partly because a leading 'A' put it near the top of phone directories. It filled orders for President Franklin Roosevelt, helped Jackie Kennedy stock the White House library with Americana, and restored Bill Clinton's flood-damaged books. Patti Smith worked here briefly in 1967. During Hurricane Sandy in 2012, bricks fell from the 32nd story of the next building and crashed through the roof, destroying acts of Congress signed by Thomas Jefferson."},{"name":"96th Street","lat":40.786776,"lon":-73.953081,"blurb":"For years in the early 1990s this stretch was stalked by Larry Hogue, the homeless crack addict dubbed the 'Wild Man of 96th Street,' who terrorized the block until he was forced into treatment and state custody, only to escape in 2009. The street also marks the northern edge of the world's largest steam system, which pumps 30 billion pounds of steam into 100,000 buildings to its south. The Islamic Cultural Center opened at Third Avenue in 1991, angled toward Mecca."},{"name":"York Preparatory School","lat":40.774103,"lon":-73.979416,"blurb":"Students at this Upper West Side prep school are nicknamed 'Yorkies' and were name-checked on ABC's Castle for their uniforms; the building's facade appeared in the Will Ferrell movie Elf. Founded in 1969 by Ronald and Jayme Stewart, it counts actress Liv Tyler among its alumni, along with the notorious Robert Chambers, the 'Preppie Killer' who killed Jennifer Levin in Central Park in 1986. Its students once got a crash course in hip-hop on VH1's Ice-T's Rap School."},{"name":"River House","lat":40.754646,"lon":-73.963125,"blurb":"The co-op board at this 1931 Art Deco tower was famously ruthless: it rejected Gloria Vanderbilt in 1980 (she blamed racism over her relationship with singer Bobby Short) and reportedly turned away Richard Nixon, Joan Crawford, and Diane Keaton. Residents could once dock their yachts at the building's own East River pier until the FDR Drive erased it. Tenants over the years included Henry Kissinger, Uma Thurman, and FM-radio inventor Edwin Armstrong."},{"name":"995 Fifth Avenue","lat":40.778008,"lon":-73.962545,"blurb":"As the Stanhope Hotel, this 1926 Rosario Candela building was where jazz legend Charlie Parker died in 1955, in the suite of his patroness, the jazz baroness Nica de Koenigswarter. Nine years earlier, socialite Kiki Preston had plunged to her death from a window here. The luxury hotel hosted live cabaret and celebrity guests like Ringo Starr in 1969 before it converted to co-ops in 2005 and took its street address as its name."},{"name":"Trinity Chapel Complex","lat":40.743765,"lon":-73.989894,"blurb":"Richard Upjohn built this Gothic chapel in 1855 as an uptown outpost of Trinity Church, and novelist Edith Wharton was married in it in 1885. A Serbian Orthodox congregation bought it in 1942 and reopened it in 1944 as Saint Sava church; King Peter II, the last king of Yugoslavia, attended services, and busts of Nikola Tesla and physicist Michael Pupin stand outside. A four-alarm fire gutted the church on Orthodox Easter, May 1, 2016."},{"name":"Park East Synagogue","lat":40.766996,"lon":-73.963366,"blurb":"This 1890 Moorish Revival synagogue is unusual for its era, with asymmetrical twin towers (the eastern one taller) and a prominent rose window; it's one of fewer than a hundred surviving 19th-century American synagogues. In 1957 Robert Briscoe, the Jewish Lord Mayor of Dublin, prayed here on a Shabbat morning carrying his tallis bag. In 2008 Pope Benedict XVI visited, the only papal visit to a synagogue ever held in the United States."},{"name":"Stuyvesant Square","lat":40.73365,"lon":-73.984,"blurb":"In 1836 Peter Gerard Stuyvesant, great-great-grandson of Peter Stuyvesant, sold the city four acres of the family farm for a token five dollars, on the condition it build a fence. When the city dawdled, the family sued in 1839, and the magnificent 2,800-foot cast-iron fence finally erected in 1847 still stands as the oldest in New York after Bowling Green's. Second Avenue splits the park in two, each half ringed by that original iron."},{"name":"First Presbyterian Church","lat":40.734486,"lon":-73.995255,"blurb":"Nicknamed the 'Church of Patriots' for its Revolutionary-era congregants, this parish traced its rebellious streak partly to the King's repeated refusal to grant it a charter to protect the Church of England's monopoly; the British seized it as barracks and a prison. Founded in 1716 on Wall Street, it moved to Fifth Avenue in 1846 and features windows by Louis Comfort Tiffany. From this pulpit in 1922 Harry Emerson Fosdick preached 'Shall the Fundamentalists Win?,' igniting a national religious feud that cost him his job."},{"name":"Penn South","lat":40.748095,"lon":-73.998507,"blurb":"This Chelsea housing co-op was sponsored by the garment workers' union (the ILGWU) and dedicated in May 1962 by President John F. Kennedy, with Eleanor Roosevelt and Governor Nelson Rockefeller looking on. Building it meant clearing a slum that displaced an estimated 7,500 residents, though four churches were spared. In 1963 a Carver Federal Savings branch opened here, the first African-American-run bank allowed to operate in a non-Black New York neighborhood."},{"name":"Ludlow Street","lat":40.722474,"lon":-73.987126,"blurb":"The Velvet Underground's Lou Reed, John Cale, and Sterling Morrison lived at 56 Ludlow in 1965 and cut the earliest known version of 'All Tomorrow's Parties' there, amid Warhol superstars Mario Montez and Jack Smith. The Beastie Boys shot the cover of Paul's Boutique at Ludlow and Rivington, an intersection renamed 'Beastie Boys Square' in 2023, and Banksy installed his largest New York work here in 2013. The street honors naval officer Augustus Ludlow, told 'Don't give up the ship.'"},{"name":"Sky (skyscraper)","lat":40.761554,"lon":-73.998837,"blurb":"This 70-story Hudson Yards rental tower has a pro-size basketball court designed by Carmelo Anthony and a Yayoi Kusama bronze pumpkin standing in its motor court. Broken ground in 2008, it stalled during the recession as a so-called 'zombie project' until a David Rockwell redesign revived it in 2012. With 1,175 units it has the most rentals of any building in the city; residents have included Knicks star Kristaps Porzingis and model Nina Agdal."},{"name":"86th Street station (IRT Lexington Avenue Line)","lat":40.779494,"lon":-73.955529,"blurb":"This station's lower express level opened on August 1, 1918, the day the revolutionary 'H system' went live, splitting the original IRT into separate east- and west-side trunk lines joined by the new 42nd Street Shuttle. Local and express trains ride stacked on two levels here. When a Gimbels department store rose directly overhead in 1970, the chain agreed to renovate the entrances. Oddly, the northbound and southbound platforms aren't linked inside the fare control."},{"name":"Salmagundi Club","lat":40.734302,"lon":-73.994553,"blurb":"This Fifth Avenue art club began in 1871 as the 'New York Sketch Class,' meeting Saturday nights in a sculptor's studio; its odd name comes either from the Salmagundi stew it long served or from Washington Irving's Salmagundi Papers. Men-only for its first century, it finally admitted women in 1973. Members have ranged from Childe Hassam and William Merritt Chase to Norman Rockwell, Stanford White, and N.C. Wyeth. It even holds the largest collection of used artists' palettes in America."},{"name":"Columbus Park","lat":40.715093,"lon":-74.000053,"blurb":"This Chinatown green space sits on the ground of Mulberry Bend, the deadliest corner of the notorious Five Points slum, which reformer and photographer Jacob Riis (author of How the Other Half Lives) campaigned to demolish; his 1888 'Bandits' Roost' photo was shot here. After the tenements came down in 1897, a police captain credited the park with cleaning up the whole precinct. Today neighbors gather to play mahjong and practice tai chi, near a 2019 statue of Sun Yat-sen."},{"name":"Westbeth Artists Community","lat":40.736494,"lon":-74.009046,"blurb":"This artists' housing complex fills the old Bell Telephone Laboratories, where the vacuum tube, the condenser microphone, an early television, and the transistor were all invented. Architect Richard Meier, in his first major commission, converted the 13 buildings in 1968-70 into what became the world's largest artists' housing of its kind. Demand was so fierce that the 10-to-12-year waiting list forced the co-op to close its rolls in 2007. It houses the Martha Graham dance company and the world's largest LGBT synagogue."},{"name":"Decker Building","lat":40.736845,"lon":-73.990934,"blurb":"Andy Warhol ran his Factory from the sixth floor here from 1968 to 1973, and it was in this building on June 3, 1968 that radical feminist Valerie Solanas shot and seriously wounded him. Built in 1892 for the Decker Brothers piano company by anarchist architect John Edelmann, the slender Venetian-Islamic tower once sported a rooftop minaret that vanished before World War II. Warhol began assembling his famous Time Capsules while moving out in 1974."},{"name":"110th Street–Malcolm X Plaza station","lat":40.798508,"lon":-73.95249,"blurb":"A 2020 fire aboard a northbound 2 train here killed the train operator and injured at least 16 others, investigated as possible arson amid a crime spree."},{"name":"B'nai Jeshurun","lat":40.790103,"lon":-73.976168,"blurb":"Founded in 1825, this was the second synagogue established in New York, broken away from Shearith Israel to follow the German and Polish rite. Its Civil War-era rabbi Morris Jacob Raphall delivered the notorious 'Bible view of slavery' sermon on January 4, 1861, defending the institution from scripture. The congregation spun off several other synagogues, and its present 1917 home was designed by Henry B. Herts, a celebrated theater architect and congregant."},{"name":"Riverbank State Park","lat":40.825427,"lon":-73.95652,"blurb":"This 28-acre park is built on the roof of the North River Wastewater Treatment Plant, which processes 125 million gallons of sewage a day atop 2,300 caissons pinned into bedrock. Opened in 1993 and inspired by Japanese rooftop parks, it boasts the largest green roof in New York City, with soil deep enough for trees up to 35 feet tall. Its whimsical Totally Kid Carousel features animals designed from neighborhood children's own drawings."},{"name":"Central Park Mall","lat":40.772585,"lon":-73.970213,"blurb":"The Mall is the one deliberately formal, straight feature in Olmsted and Vaux's otherwise naturalistic Central Park, laid out so carriages could drop passengers to stroll toward Bethesda Terrace. Its Naumburg Bandshell hosts the Naumburg Orchestral Concerts, founded in 1905 and billed as the world's oldest free outdoor classical series; a 1993 lawsuit saved the shell from demolition. Its double rows of American elms form one of the largest surviving stands of the disease-ravaged tree."},{"name":"Washington Mews","lat":40.731441,"lon":-73.995665,"blurb":"This gated cobbled lane began as a row of private stables serving the grand homes of men like architect Richard Morris Hunt and tobacco baron Pierre Lorillard, on land whose income built Staten Island's Sailors' Snug Harbor. In 1916 a dozen stables were remodeled into artist studios, and over the century sculptors Paul Manship and Gaston Lachaise and heiress-artist Gertrude Vanderbilt Whitney worked here. NYU took over most of it around 1950."},{"name":"Hudson Street","lat":40.740274,"lon":-74.005269,"blurb":"The White Horse Tavern on this street is where poet Dylan Thomas drank and collapsed before dying of alcohol poisoning. Urban-theorist Jane Jacobs famously lived at 555 Hudson above a candy shop, watching the sidewalk ballet she'd champion. The block also held the Hot 97 studios, scene of a 2005 gunfight between the entourages of 50 Cent and The Game, and Tiger Woods moved onto the street in 2010. In Highlander, it's home to Connor MacLeod's antique shop."},{"name":"Chambers Street","lat":40.717277,"lon":-74.013064,"blurb":"The street honors attorney John Chambers (1710-1764), a Trinity Church vestryman and warden for 38 years whose nephew was Founding Father John Jay; his law partner John Murray lent his name to nearby Murray Street. Before 1971 it pushed east of Centre Street as New Chambers Street, running straight through the archway of the Municipal Building until that stretch was closed to build the 1 Police Plaza plaza. It fronts City Hall and the Tweed Courthouse."},{"name":"Mmuseumm","lat":40.717363,"lon":-74.002815,"blurb":"This tiny 'natural history museum' opened in 2012 inside a former freight elevator shaft in Tribeca's Cortlandt Alley, founded by Alex Kalman and the Safdie brothers. Crammed into roughly 36 square feet, it displays everyday contemporary objects as artifacts in a style it calls 'Object Journalism,' echoing the old cabinet-of-curiosities model. There's no need to line up: its exhibits are visible 24 hours a day through peepholes cut into the doors."},{"name":"Bow Bridge (Central Park)","lat":40.775759,"lon":-73.971768,"blurb":"Central Park's most graceful iron span, completed in 1862, was cast by the Bronx foundry Janes, Kirtland & Co., the same firm that forged the dome of the U.S. Capitol. Designed by Calvert Vaux and Jacob Wrey Mould, its 87-foot arch over the Lake is the longest of the park's bridges, dressed with interlocking-circle railings and eight planting urns. Unlike the park's other ornamental iron bridges, it's the only one that never crossed a bridle path."},{"name":"120 Wall Street","lat":40.704764,"lon":-74.005949,"blurb":"This 1930 tower by Ely Jacques Kahn is a textbook 'wedding-cake' skyscraper, its setbacks stepping back from a 16-story platform in the style the 1916 Zoning Resolution made famous. Anchored at first by the American Sugar Refining Company, it stood as the only major high-rise on the downtown East River waterfront for decades until the post-1970s boom. Since 1992 it has been the city's only 'Association Center,' offering cut-rate rents to nonprofits like the National Urban League and Lambda Legal."},{"name":"SVB Financial Group","lat":40.742803,"lon":-73.984148,"blurb":"Silicon Valley Bank was founded over a poker game in 1982 by Bill Biggerstaff and Robert Medearis, and grew into the go-to bank for tech startups and venture capital. It collapsed in March 2023 after customers tried to yank 81% of deposits, some $142 billion, in just two days, the biggest bank failure since 2008 and the second-largest in U.S. history behind Washington Mutual. After the FDIC seized the shared Santa Clara headquarters, the holding company fled to New York City."},{"name":"86th Street station (Second Avenue Subway)","lat":40.777891,"lon":-73.951787,"blurb":"Nearly a century in the making: a Second Avenue subway was first floated in 1919, and the line was once mocked as a 'rich man's express... a silk stocking route' that skipped the Lower East Side's tenements. It finally opened January 1, 2017, one of the system's rare air-conditioned, waterproofed, fully ADA-accessible stations. Its walls hold 'Subway Portraits,' twelve tile-mosaic faces by painter Chuck Close. About 8.4 million riders passed through in 2019."},{"name":"Crenshaw Christian Center","lat":40.792064,"lon":-73.964891,"blurb":"Founded in 1973 by Frederick K.C. Price, this megachurch built the FaithDome on the old Pepperdine campus in South Los Angeles, inaugurating it in 1989 with 10,145 seats as the largest domed church in the United States. In 2007 ABC's 20/20 aired a segment called 'Enough!' accusing Price of misspending congregants' tithes, splicing in a clip of him voicing a fictional wealthy character as if it were his own boast. Price sued for defamation, and ABC later apologized both on air and in writing. Membership eventually reached 28,000."},{"name":"Hoboken–33rd Street","lat":40.739866,"lon":-74.011319,"blurb":"This blue PATH line traces its lineage to February 26, 1908, when the Hudson and Manhattan Railroad ran the very first tube service from Hoboken to 19th Street, later pushing north to 33rd Street in 1910. In late October 2012, Hurricane Sandy devastated it: roughly 8 feet of water submerged the tunnels around Hoboken Terminal, wrecking trainsets, rusting tracks, and destroying critical electrical gear. The station reopened on December 19, 2012. The 3.5-mile run takes about 14 minutes."},{"name":"Great Jones Street","lat":40.727441,"lon":-73.993949,"blurb":"Jean-Michel Basquiat lived and died at 57 Great Jones Street, a former stable that had been Paul Kelly's Five Points Gang headquarters in 1905 and was owned by Andy Warhol's company from 1970 to 1990; a plaque went up in 2016, and it now houses Angelina Jolie's Atelier Jolie. The street was named for lawyer Samuel Jones, the 'Father of the New York Bar,' who got 'Great' tacked on because the city already had a Jones Street. The Daily News even traces the slang 'jonesing' to this onetime junkie haunt."},{"name":"33rd Street station (IRT Lexington Avenue Line)","lat":40.746395,"lon":-73.981829,"blurb":"Building this station in 1902 turned deadly: to leave room for a never-built connection to Grand Central, the northbound tunnel was shoved east under Park Avenue, and a string of accidents followed. A dynamite explosion near 41st Street on January 27, 1902, killed five people, and that March several Park Avenue mansions collapsed into the excavation. Contractor Ira Shaler earned the nickname 'hoodoo contractor' before he was killed by a rockslide in his own pit that June. The station opened October 27, 1904, as one of the subway's original 28."},{"name":"Harlem Meer","lat":40.796202,"lon":-73.952181,"blurb":"Its surrounding hills held War of 1812 fortifications at McGowan's Pass, and Christo's \"The Gates\" reached the man-made lake's shores in 2005."},{"name":"First Houses","lat":40.723711,"lon":-73.986263,"blurb":"One of the first public housing projects in the United States, First Houses opened its 122 apartments on December 3, 1935, to overwhelming demand: more than 4,000 families applied. Architect Frederick Ackerman meant to rehab the old Victorian tenements, but they proved too fragile, so they were torn down and rebuilt from scratch, reusing bricks and relief-program labor. The project also won a landmark court fight establishing the Housing Authority's power of eminent domain for slum clearance. Mayor La Guardia dubbed it 'Boondoggling Exhibit A.'"},{"name":"Baruch Houses","lat":40.717558,"lon":-73.977833,"blurb":"The largest NYCHA development in Manhattan, Baruch Houses sprawls across roughly fifteen blocks of the Lower East Side, with 2,194 apartments in 17 buildings. Designed by Emery Roth & Sons and completed June 30, 1959, it is named for Bernard Baruch, the Wall Street trader who advised six presidents through two world wars. Its most famous product is Ursula Burns, who grew up here and went on to become chairman and CEO of Xerox."},{"name":"IRT Powerhouse","lat":40.771896,"lon":-73.9921,"blurb":"Stanford White dressed New York's first subway power plant as a Renaissance Revival palace, an ornate granite-and-terracotta focal point meant to rival Grand Central; its facade riffs on the Boston Public Library. At its peak the plant cranked out more than 100,000 horsepower, venting through towering smokestacks that rose 162 feet and deliberately echoed the steamships at the nearby Hudson piers. Built from 1902 to 1905, it powered the IRT until 1959, when Con Edison converted it to feed the city's steam system. It was finally landmarked in 2017."},{"name":"Chef's Table at Brooklyn Fare","lat":40.756078,"lon":-73.996449,"blurb":"Opened next to a Brooklyn grocery store, this 18-seat counter became the first New York restaurant outside Manhattan to earn three Michelin stars, serving 24 courses under strict rules: no photos, no notes, no phones. Reservations were so coveted that the booker was stalked by strangers begging to jump the line. In 2023 it imploded in a lawsuit: chef Cesar Ramirez said he was fired after spotting owner Moe Issa embezzling $400,000, while Issa accused him of stealing rare wines. Michelin stripped all three stars that November, treating the reopened restaurant as brand new."},{"name":"Murray's Cheese","lat":40.731005,"lon":-74.003025,"blurb":"Greenwich Village's beloved cheese counter was founded in 1962 by Murray Greenberg, born Moische Schuchelmann, a Ukrainian-Jewish immigrant, as a spinoff of an egg-and-dairy wholesaler. Mayor Ed Koch was a devoted regular, and the shop ages its wheels in a purpose-built 'caves' facility in Long Island City. After Kroger bought the business in 2017, it ballooned to more than 800 locations. A 2021 Forward article debunked shop lore, confirming it opened in 1962, not 1940, and that Greenberg never fought in the Spanish Civil War."},{"name":"49th Street station (BMT Broadway Line)","lat":40.759901,"lon":-73.984139,"blurb":"In the early 1970s architects Philip Johnson and John Burgee gave this humble local stop a makeover in bright orange tile, aiming, Johnson said, for a cheerful feel 'like a big shopping center'; noise-dampening panels installed here were an experiment never repeated elsewhere. The station opened July 10, 1919, and ended up a local stop only because Brooklyn riders insisted on an express station at Times Square instead. A 1967 pilot even tested futuristic touches like snow-melting devices built into the stairways."},{"name":"Spring Street","lat":40.726128,"lon":-74.010392,"blurb":"Spring Street takes its name from a freshwater spring that once ran through Lispenard's Meadow and still flows underground today, occasionally flooding SoHo basements; before 1806 it was called Brannon Street. Aaron Burr's estate, Richmond Hill, stood nearby in the 1790s, where he dammed Minetta Creek for an ornamental pool. In 1834 anti-abolitionist rioters, mostly Irish immigrants, stormed the Spring Street Presbyterian Church and wrecked its organ and pews. The corner at Broadway once held the opulent 600-room St. Nicholas Hotel, opened in 1853."},{"name":"Macombs Dam Bridge","lat":40.828045,"lon":-73.93472,"blurb":"This graceful swing bridge over the Harlem River pivots on a small masonry island midstream and is the oldest surviving swing bridge in New York City to keep its original span, plus the third-oldest major bridge still operating in the five boroughs. It began in 1814 as an actual dam, Macombs Dam, torn down in 1858 after complaints it blocked river navigation; the current steel span went up between 1892 and 1895 to designs by engineer Alfred Pancoast Boller. It links Harlem's 155th Street to the Bronx beside Yankee Stadium and was landmarked in 1992."},{"name":"145th Street station (IRT Lenox Avenue Line)","lat":40.820464,"lon":-73.936216,"blurb":"Unlike almost every other IRT station, this Harlem stop has platforms that fit only six and a half train cars, a quirk that nearly doomed it. When the Harlem-148th Street terminal opened just up the line in the 1960s, the MTA planned to shutter 145th Street, but community opposition and rider protests kept it alive. Opened in 1904 as one of the original line's northern termini, it was added to the National Register of Historic Places in 2005. Because it's the second-to-last stop, you can only enter on the southbound side."},{"name":"Masonic Hall","lat":40.743034,"lon":-73.992094,"blurb":"The Grand Lodge of New York's Freemasons built their first Masonic Hall in 1826 on lower Broadway, a Gothic pile whose main hall imitated the chapel of Henry VII at Westminster Abbey and which reportedly held the largest bowling alley in the world at the time. That $50,000 building lasted until 1856; a Second French Empire replacement by Napoleon LeBrun rose at 23rd Street and 6th Avenue in 1875. The current headquarters, on that same Flatiron-district corner, was completed in stages between 1909 and 1913."},{"name":"El Museo del Barrio","lat":40.793106,"lon":-73.951395,"blurb":"Founded in 1969, El Museo del Barrio is the oldest museum in the country devoted to Latino art, born when African-American and Puerto Rican parents, educators, and activists in East Harlem demanded schooling that reflected their heritage. Its Fifth Avenue home on Museum Mile was once a fire station where radical figures burned books during the Nuyorican and Civil Rights movements. The collection spans over 6,500 works and 800 years, from pre-Columbian Taino artifacts and carved Santos de palo to contemporary installations. It still throws an annual Three Kings Day parade."},{"name":"Classic Stage Company","lat":40.732723,"lon":-73.988247,"blurb":"Founded in 1967, this classical Off-Broadway company is among the oldest in New York, and its intimate 199-seat East Village home (the former Abbey Theatre on East 13th Street) has hosted a staggering roster of stars in the classics. Peter Dinklage played Turgenev, Ethan Hawke took on Chekhov's Ivanov, F. Murray Abraham did Galileo, and Mandy Patinkin starred in The Tempest. Nina Arianda's 'Venus in Fur' here transferred to Broadway and earned a Tony nomination. Its work has drawn Obie, Drama Desk, and Lucille Lortel awards."},{"name":"Birch Wathen Lenox School","lat":40.772472,"lon":-73.957686,"blurb":"This Upper East Side prep school was formed in 1991 by merging the Birch Wathen School (1921) and the Lenox School (1916), and its alumni roster is wildly eclectic. Graduates include broadcaster Barbara Walters, blockbuster novelist Judith Krantz, Hope Cooke (the last Queen of Sikkim), and Murray Rothbard, the economist who founded anarcho-capitalism. From 1962 to 1989 the Birch Wathen school occupied the ornate French-style Herbert N. Straus House on East 71st Street, directly across from the Frick Collection."},{"name":"Orchard Street","lat":40.716286,"lon":-73.991178,"blurb":"Orchard Street is named for a literal orchard that belonged to Loyalist James DeLancey, who fled to England in 1775 and had his farm declared forfeit. It became the spine of the Lower East Side immigrant experience, lined with iconic brick tenements and fire escapes, first as part of Little Germany and later a Jewish enclave. Its history is preserved at the Lower East Side Tenement Museum's restored building at 97 Orchard Street. Long a garment district, on Sundays the street still closes to traffic and turns into a bustling pedestrian market."},{"name":"Gramercy Theatre","lat":40.739908,"lon":-73.984929,"blurb":"Built in 1937 in sleek Streamline Moderne, this Gramercy venue spent the 1950s as a quirky Cinema V art house, notorious for refusing to admit anyone near a film's end and for serving coffee in the waiting area. After stints as a dollar theater, an Indian-cinema house in 1995, and even the shoot location for the Fugees' 'Killing Me Softly' video, it was reborn as a 499-seat playhouse in 1998. Today Live Nation runs it as a concert hall, a sibling to nearby Irving Plaza."},{"name":"Coenties Slip","lat":40.703517,"lon":-74.010424,"blurb":"Coenties Slip was originally an artificial inlet cut into the East River for loading and unloading ships, until it was filled in with land in 1835. The head of the slip was once the site of the Stadt Huys, the Dutch-era building that served as the first City Hall on Manhattan Island. Its odd name honors Dutch settler Conraet Ten Eyck and his wife Antje, and over the years New Yorkers have mangled the pronunciation every which way, from 'KWIN-seez' to 'KOH-en-teez.' In 2013 the block was converted into a pedestrian plaza."},{"name":"Sherman Square","lat":40.777365,"lon":-73.98235,"blurb":"Named in 1891 for General William Tecumseh Sherman, who lived nearby and died that year, this Upper West Side sliver earned a darker nickname in the 1960s and 70s: 'Needle Park,' for its open-air drug scene. That reputation gave James Mills the title and setting for his 1966 book and its 1971 film adaptation, 'The Panic in Needle Park,' directed by Jerry Schatzberg and starring Al Pacino in only his second screen role. Despite the grand name, the fenced green is a scalene triangle of just 264 square feet."},{"name":"Kips Bay Towers","lat":40.743229,"lon":-73.975774,"blurb":"I.M. Pei designed this pair of exposed-concrete brutalist slabs, completed in 1965 as Kips Bay Plaza, an early real-world demonstration of his framed-tube structural concept. Developed by Webb & Knapp under a federal Title I slum-clearance program tied to the neighboring NYU-Bellevue Medical Center, the towers opened as middle-income rentals and were converted to condominiums in the mid-1980s. The 1,118-unit complex frames a three-acre private landscaped garden between its two 20-story buildings and houses more than 4,000 residents."},{"name":"Cornell Club of New York","lat":40.7543,"lon":-73.979359,"blurb":"The Cornell Club's fourteen-story clubhouse at 6 East 44th Street has an unglamorous past: it was formerly the offices of the Chicago Pneumatic Tool Company, given to the university as a gift and renovated by Gensler before opening in 1989. The first Cornell Club was formed by alumni back in 1889. Membership extends to grads of ten affiliated schools, from Brown and Duke to Trinity College Dublin. And since the clubhouse has no squash courts of its own, members are allowed to play at the nearby Yale Club instead."},{"name":"Julius (restaurant)","lat":40.734536,"lon":-74.00163,"blurb":"Often called the oldest continuously operating gay bar in New York, Julius' was the site of the pivotal 1966 'Sip-In': on April 21, three Mattachine Society activists announced 'We are homosexuals' before ordering drinks, deliberately provoking a challenge to the rule that barred serving 'disorderly' gay patrons. Their protest, a block from the Stonewall Inn and three years before that uprising, helped establish the right of gay New Yorkers to be served. The tavern, its tables made from Jacob Ruppert beer barrels, was a favorite of Tennessee Williams, Truman Capote, and Rudolf Nureyev."},{"name":"Five Manhattan West","lat":40.753066,"lon":-73.999509,"blurb":"This 16-story slab in Hudson Yards literally straddles the railroad: it was built in 1969 as the Westyard Distribution Center directly over the tracks running west out of Penn Station, with the portals of the North River Tunnels beneath it. The New York Daily News ran its newsroom here from 1995 until 2011, and the Associated Press was a tenant from 2004 to 2017. Brookfield spent some $300 million stripping off the brutalist concrete for a glass skin, reopening it as Five Manhattan West in 2017."},{"name":"Lowline (park)","lat":40.720354,"lon":-73.987126,"blurb":"Conceived as the world's first underground park, the Lowline would fill a cavernous trolley terminal beneath Delancey Street, abandoned since 1948, with living trees and grass. Its trick: 'remote skylights' that collect sunlight above ground and funnel it below, a system devised by founders James Ramsey and Dan Barasch, who had grown disillusioned with his job at Google. The name plays on the High Line. A 2012 Kickstarter drew over $150,000 from 3,300 backers, but after construction began in 2019 the project stalled in 2020 for lack of funds."},{"name":"Harlem–148th Street station","lat":40.823712,"lon":-73.936101,"blurb":"The northern end of the 3 line sits at ground level inside what was originally the Lenox Avenue Yard, a train-storage yard dating to 1904; the station itself was carved out of it and opened in 1968, roofed over by a parking structure for the Frederick Douglass Academy. First proposed back in 1940, it was meant to replace the nearby 145th Street station as the line's terminal, but community opposition kept 145th Street open too. Earlier dreams of extending the Lenox line into the Bronx were foiled by incompatible elevated-track standards."},{"name":"Elizabeth Street Garden","lat":40.722189,"lon":-73.994783,"blurb":"This one-acre sculpture garden in Nolita is a genuine oasis, its winding gravel path lined with statues, columns, birdbaths, and a balustrade salvaged from Lynnewood Hall, a Gilded Age mansion in Pennsylvania. Landscape gardener Allan Reiver began transforming the vacant city lot in 1991. For years it was the flashpoint of a bruising fight between garden defenders and affordable-housing developers: the Court of Appeals cleared development in 2024, but Mayor Adams reversed course and designated it a city park in 2025, even as his successor signaled he might revive the housing plan."},{"name":"West 30th Street Heliport","lat":40.754999,"lon":-74.007065,"blurb":"Manhattan's first commercial heliport opened here on September 26, 1956, when New York Airways began landing pontoon-equipped Sikorsky S-55s carrying mail and cargo to LaGuardia and Newark. The idea dated to 1953, pitched partly to shuttle mail to the nearby General Post Office. The city first wanted the pads atop a freight terminal's roof, but the airline and Port Authority killed that as unworkable, insisting on at-grade pads jutting into the Hudson - built in just weeks."},{"name":"Mount Vernon Hotel Museum","lat":40.760522,"lon":-73.959713,"blurb":"One of the few Manhattan buildings still standing from before 1800, this 1799 stone structure was actually built as a carriage house and stable - the estate planned for Colonel William S. Smith and his wife Abigail, John Adams's daughter, was never finished. Joseph Coleman Hart turned it into a day hotel in 1826, when today's Midtown was rural countryside. Post-Erie Canal New Yorkers took day trips here to boat and escape the dirt downtown, home by sunset. It was one of over 50 such day hotels, closing in 1833."},{"name":"77th Street station (IRT Lexington Avenue Line)","lat":40.773653,"lon":-73.959844,"blurb":"In 1932, Lenox Hill Hospital won permission to mount its name on this station's walls - on the condition the hospital pay for the signs itself - which is why it's still called 77th Street-Lenox Hill Hospital. Opened July 17, 1918 under the Dual Contracts that reshaped the IRT into an H-shaped system, it had earlier been denied a renaming to '77th Street-St. Ann's Academy.' In 1924 the IRT added a change-making machine here to help retire the money-changers who worked the station booths."},{"name":"23rd Street station (IND Sixth Avenue Line)","lat":40.742878,"lon":-73.992821,"blurb":"The 11 glass mosaics lining this station are William Wegman's Stationary Figures - his famous Weimaraners, each posed in a different outfit. They went up in a 2018 overhaul under the MTA's Enhanced Station Initiative (the station closed that July and reopened ahead of schedule in November). The artwork sits above one of the subway's odder layouts: the platforms straddle the 23rd Street PATH station, whose tracks were built in 1911, four decades before the Sixth Avenue Line opened here in December 1940."},{"name":"City Pier A","lat":40.704412,"lon":-74.017914,"blurb":"The last masonry pier left in New York, Pier A was built in 1884-86 as headquarters for the city's Dock Commissioners and the NYPD's Harbor police, who worked here until 1955. The FDNY then ran it as a fireboat station from 1960 to 1992. Its clock tower - the clock added in 1919 - earned the nickname 'Liberty Gateway,' though it was never actually a major arrival point. Just south stands Marisol's haunting American Merchant Mariners' Memorial, where one bronze sailor is swallowed by the harbor at every high tide."},{"name":"74th Street","lat":40.770973,"lon":-73.959431,"blurb":"Where East 74th meets the East River once stood Dutch sawmills - Jan van Bonnel built one in 1664 where Saw Kill Creek emptied out, and an earlier 1639 mill nearby used enslaved African laborers to cut lumber. The creek's Saw Kill Bridge became known by 1806 as 'The Kissing Bridge,' its secluded setting a favorite necking spot in 18th- and 19th-century Manhattan. The Stable Gallery on the block later gave Andy Warhol an early New York show, and J.G. Melon at Third Avenue turns up in the film Kramer vs. Kramer."},{"name":"55th Street","lat":40.755982,"lon":-73.961416,"blurb":"The 27-story Mutual of New York Building near Seventh Avenue, finished in 1950, wore a giant 'MONY' sign that inspired the song 'Mony Mony.' The street packs in more lore: the Park Central Hotel is infamous for a mafia execution in its barber shop, and the original Soup Nazi of Seinfeld fame stood near Broadway. Two miles long across Midtown, 55th also holds P.J. Clarke's, an antique tavern that famously refused to be demolished for the skyscraper rising beside it."},{"name":"Patchin Place","lat":40.73499,"lon":-73.999312,"blurb":"This gated Greenwich Village cul-de-sac was a writers' colony: E.E. Cummings lived at #4 from 1923, calling his top-floor room 'Safety & Peace & the truth of Dreaming,' while Djuna Barnes moved into #5 in 1941 and grew so reclusive that Cummings would shout out his window, 'Are you still alive, Djuna?' Theodore Dreiser and John Cowper Powys were residents too. The lane still keeps a 19th-century gas lamp - one of only two left in the city, and the only one still lit. Future mayor Ed Koch helped save it from demolition; it's now nicknamed 'therapy row.'"},{"name":"Riis Houses","lat":40.724148,"lon":-73.974492,"blurb":"This Alphabet City housing project, completed in 1949, honors Jacob Riis, the photographer whose images exposed Lower East Side tenement squalor. Its 1966 playground was a design landmark in its own right - M. Paul Friedberg laid it out as four connected 'outdoor rooms,' Lady Bird Johnson came to the opening, and it won a federal First Honor Award before being copied at four other city playgrounds. Among the thirteen buildings' notable former residents is Sabu, the computer hacktivist."},{"name":"Castle Village","lat":40.853485,"lon":-73.940018,"blurb":"On May 12, 2005, the 75-foot retaining wall below Castle Village's garden gave way, sending a landslide onto the northbound Henry Hudson Parkway and burying six parked cars - miraculously injuring no one, though the highway ramp took two years to fully reopen. The five cross-shaped towers, built in 1938-39 by developer Charles V. Paterno on the site of his own castle home, were among the first apartments to use reinforced concrete, and their 'towers in a park' layout went on to shape much of New York's later public and cooperative housing."},{"name":"Mercer Street","lat":40.725763,"lon":-73.997662,"blurb":"Renamed in 1799 for Hugh Mercer, the Scottish-American general who died at the Battle of Princeton - a fight he'd urged George Washington to make - Mercer Street later collected its own pop-culture credits. Mark Ronson kept a studio here, and it's where he first met Amy Winehouse before they made 'Back to Black' around 2006. The street gets a nod in the Rolling Stones' 'Anybody Seen My Baby?' and its very naming turns up in Hamilton, in 'The Room Where It Happens.'"},{"name":"First Avenue station (BMT Canarsie Line)","lat":40.730865,"lon":-73.981423,"blurb":"In September 1983, graffiti artist Michael Stewart was arrested at this L-train station, and his death in police custody became a landmark police-brutality case that galvanized the downtown art world. Opened in 1924, the station gained new entrances at Avenue A during the 2019-2020 rebuild of the Sandy-damaged Canarsie Tubes. Its walls now carry mosaics by Katherine Bradford - dancers in 'Queens of the Night,' flying figures in 'Superhero Responds' - made by an artist who once rode the L through this stop on her daily commute."},{"name":"Rat Rock (Central Park)","lat":40.769202,"lon":-73.97781,"blurb":"Officially Umpire Rock (it sits by the Heckscher ballfields), this glacier-scarred lump of Manhattan schist near Central Park's southwest corner is better known as Rat Rock, for the rats that once swarmed it after dark. By day it's a bouldering magnet - up to 50 climbers at a time - presided over by Yukihiko Ikumori, a West Village gardener dubbed its 'spiritual godfather,' who was still scaling it at 60. Purists sniff, though: with poor stone and easy routes, it's been called 'one of America's most pathetic boulders.'"},{"name":"Brick Presbyterian Church","lat":40.783733,"lon":-73.955188,"blurb":"Mark Twain's funeral was held at Brick Presbyterian on April 23, 1910. The congregation's original 1768 building downtown at Beekman and Nassau Streets was commandeered by the British to hold prisoners of war during the Revolution. Now anchored at Park Avenue and 91st Street since 1940, its members have included Katie Couric, IBM's Thomas J. Watson, statesman John Foster Dulles, and Andrew Carnegie's wife Louise. One former clergyman, Maltbie Babcock, wrote the hymn 'This Is My Father's World.'"},{"name":"Houston Street station (IRT Broadway–Seventh Avenue Line)","lat":40.728599,"lon":-74.005308,"blurb":"Since a 1994 renovation, murals of fish and sea creatures have swum along both platforms here - Deborah Brown's Platform Diving, imagining the subway as an underwater world. Opened July 1, 1918 under the Dual Contracts, the station has an engineering quirk: the two center express tracks dip below the local tracks within the station, so the levels don't quite match. It ran briefly as a shuttle stop before the IRT's 'H'-shaped reorganization doubled the line's capacity that August."},{"name":"190th Street station","lat":40.859115,"lon":-73.934153,"blurb":"Buried deep under Fort Washington Hill, this 1932 station is reachable only by elevator - and from 1932 to 1957 locals happily paid the subway fare just to ride up rather than climb eight stories of hillside. Several elevators are still run by human attendants, kept on partly to r
