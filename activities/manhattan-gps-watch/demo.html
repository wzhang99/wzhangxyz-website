idge boasts the longest span of any bridge in the park at 87 feet. The Ramble once hid a rocky grotto called Indian Cave, later sealed up. At the Lake's edge, Bethesda Fountain's Angel of the Waters (1873) was the first large public sculpture commissioned from an American woman, Emma Stebbins."},{"name":"The Apthorp","lat":40.783744,"lon":-73.980884,"blurb":"William Waldorf Astor built this full-block palazzo between 1905 and 1908 and named it for the colonial Apthorp Farm that Charles Ward Apthorp had carved out of the land in 1763. Clinton & Russell modeled it partly on Florence's Palazzo Pitti, wrapping it around a private interior courtyard whose wrought-iron gates are crowned with gilded deer heads. The site's earlier house had sunk so low by the 1880s that it hosted 'prizefights, cockfights, and all kinds of illegal practices' before being demolished. The facade held 2,000 windows when finished."},{"name":"La Marqueta","lat":40.798302,"lon":-73.943979,"blurb":"Beneath the Park Avenue railway viaduct in East Harlem, La Marqueta was once the beating heart of Hispanic New York: in its 1950s-60s heyday more than 500 vendors packed the stalls, selling not just food and Latin records but traditional medicines and supplies for charms and curses. City-sanctioned since 1936, it later withered as buildings burned or were torn down. In 2026 Mayor Zohran Mamdani announced plans to open the city's first municipally owned grocery store here, a $30 million project."},{"name":"Jewish Theological Seminary of America","lat":40.811908,"lon":-73.960262,"blurb":"This Conservative Judaism powerhouse was born in 1886 as a traditionalist counterstrike: alarmed by the Reform movement's 1885 Pittsburgh Platform, Rabbi Sabato Morais rallied like-minded clergy to found a seminary, holding its first class in the vestry of Manhattan's oldest congregation, the Spanish-Portuguese Synagogue. Its very first ordained graduate, Joseph Hertz in 1894, went on to become Chief Rabbi of the United Kingdom. When Cambridge scholar Solomon Schechter took the helm in 1902, protesting Orthodox rabbis walked out and formed their own union. Its library is among the world's great Judaica collections."},{"name":"731 Lexington Avenue","lat":40.761731,"lon":-73.967947,"blurb":"Cesar Pelli's 2004 tower does double duty: Bloomberg L.P.'s newsroom fills the base, paying landlord Alexander's a staggering $105 million a year in rent, while a separate residential tower called One Beacon Court stacks 105 luxury condos above. The A-list resident roll has included Beyonce, former NBC anchor Brian Williams, and Yankees outfielder Bobby Abreu; hedge-fund billionaire Steven Cohen listed his unit for $67.5 million in 2017, and Jack Welch bought in for $6.4 million. The whole thing rose on the site of a defunct Alexander's department store."},{"name":"Broome Street","lat":40.719246,"lon":-73.993899,"blurb":"Jane Jacobs's most famous victory runs right through here: in the 1960s Robert Moses wanted to bulldoze Broome Street for a ten-lane elevated Lower Manhattan Expressway, wiping out the entire north side, until Jacobs-led protests killed it and saved the now-landmarked cast-iron district. The street is named for John Broome, a lieutenant governor of New York in 1804, and its distinctive iron-fronted buildings owe much to architect Griffith Thomas. One more claim to fame: actor Steve Buscemi served as a firefighter with FDNY Engine 55 at 363 Broome Street."},{"name":"14th Street","lat":40.729501,"lon":-73.977983,"blurb":"Once Manhattan's shopping mecca, 14th Street peaked in the 1850s with Steinway Hall, the Academy of Music, piano showrooms, and early department stores like Macy's and Siegel-Cooper clustered near Union Square, which had opened in 1839. As retail marched uptown it slid downmarket, the 1939 WPA Guide calling it 'perhaps the city's largest outlet for low-priced women's merchandise,' and by the 1970s it was lined with discount shops. In October 2019 it reinvented itself again, banning most cars during the day to become a bus-priority corridor."},{"name":"Via 57 West","lat":40.771466,"lon":-73.993031,"blurb":"Bjarke Ingels's first New York building looks like a giant sail slicing across the Hudson when viewed from New Jersey, and a steeply sloped pyramid from Manhattan, which is why BIG coined the term 'courtscraper' for its hybrid of European courtyard and Manhattan high-rise. The name comes from the West Side Highway, which slopes downward into the city right at the tower, forming an entrance 'via 57th.' One reviewer likened the 467-foot, 35-story wedge to 'a quarter of a watermelon' with its center surgically removed. It swept the 2016 skyscraper awards."},{"name":"Riverside Park","lat":40.80686,"lon":-73.968068,"blurb":"This four-mile ribbon of green along the Hudson began with an 1872 land condemnation, and in 1873 Frederick Law Olmsted reshaped it to mimic the wild Hudson Valley, curving the drive because he detested sharp corners. For decades the New York Central's riverfront freight tracks cut the park off from the water, until Robert Moses's 1930s West Side Improvement buried the rails beneath a broad esplanade and new recreational fields. Boss Tweed had quietly bought up adjacent lots in anticipation of the park's construction. It now anchors the Manhattan Waterfront Greenway."},{"name":"383 Madison Avenue","lat":40.755471,"lon":-73.976746,"blurb":"David Childs of SOM designed this 755-foot tower as Bear Stearns's world headquarters, completing it in 2002, only for the firm to collapse in 2008 and get swallowed by JPMorgan Chase, which has occupied it ever since. To thread the building over two stories of tracks feeding Grand Central Terminal, engineers hung much of it on huge sloped girders and trusses and pushed the elevators to the west side. When JPMorgan demolished its 270 Park Avenue headquarters in 2019, it temporarily moved its base of operations here."},{"name":"CUNY Graduate Center","lat":40.748519,"lon":-73.983639,"blurb":"CUNY's doctoral flagship occupies the grand former B. Altman and Company department store at Fifth Avenue and 34th Street, and its faculty roster reads like an awards ceremony: recipients of the Nobel Prize, the Pulitzer, Grammy Awards, and the National Medal of Science. It awarded its first two PhDs in 1965, and its first president was mathematician Mina Rees, after whom its library is named. Today it enrolls over 3,100 students across 32 doctoral programs, with an average doctoral acceptance rate around 13.5%."},{"name":"Serendipity 3","lat":40.761802,"lon":-73.964938,"blurb":"Marilyn Monroe, Andy Warhol, and Jackie Kennedy were all regulars at this whimsical dessert haven, founded in 1954 and named for the Persian fairy tale The Three Princes of Serendip. It holds a Guinness record for the $1,000 Golden Opulence Sundae, three scoops draped in 23-karat edible gold leaf and crowned with a bowl of dessert caviar, served in a crystal goblet the buyer gets to keep. The 2001 rom-com Serendipity was set here, and Selena Gomez now holds an ownership stake. A less glamorous note: health inspectors shut it in 2007 over mice and roaches."},{"name":"200 Vesey Street","lat":40.71357,"lon":-74.014881,"blurb":"The Winter Garden beside this Cesar Pelli tower shelters sixteen 40-foot palm trees hauled in from California's Mojave Desert, thriving under a 120-foot vaulted glass ceiling. Opened in 1986, the building served as world headquarters first for Lehman Brothers and then American Express. Falling debris from the collapsing Twin Towers gutted its southeast corner on September 11, 2001, closing it until May 2002; a memorial called Eleven Tears honors the eleven American Express employees killed. Pelli recycled its look for London's One Canada Square at Canary Wharf."},{"name":"Rose Center for Earth and Space","lat":40.781397,"lon":-73.973321,"blurb":"When the Rose Center opened in February 2000, its planetarium quietly displayed only eight planets, snubbing Pluto years before astronomers officially demoted it, and when the New York Times splashed the omission on its front page in January 2001, public outrage followed. Neil deGrasse Tyson has been its only director. The design encloses the illuminated 87-foot Hayden Sphere inside a six-story glass cube, which architect James Polshek dubbed a 'cosmic cathedral.' Tom Hanks narrated the first space show; Liam Neeson voices the Big Bang Theater."},{"name":"South Ferry/Whitehall Street station","lat":40.70171,"lon":-74.013149,"blurb":"Digging the original South Ferry station under Battery Park turned up an eerie haul: because the park is largely landfill, workers unearthed human skulls, copper coins, logs, and remnants of old brick piers. Three separate subway stations sat almost on top of one another here yet stayed unconnected for 91 years. A new terminal opened in 2009 to finally link them, only for Hurricane Sandy to flood and wreck it in 2012, forcing the MTA to reopen the old loop station from 2013 until the rebuilt terminal returned in 2017."},{"name":"Fort Tryon Park","lat":40.861978,"lon":-73.932637,"blurb":"John D. Rockefeller Jr. stitched this 67-acre ridge-top park together starting in 1917, buying up C. K. G. Billings's Tryon Hall estate and neighboring lots, hiring the Olmsted Brothers to design it, and handing it to the city in 1931. The ground saw real combat: the Battle of Fort Washington raged here on November 16, 1776, pitting 2,900 American soldiers against 8,000 Hessian troops. Rockefeller also bought sculptor George Gray Barnard's medieval art hoard for the Met, which built the Cloisters inside the park from 1935 to 1939 to display it."},{"name":"High Bridge","lat":40.842429,"lon":-73.931499,"blurb":"New York's oldest surviving major bridge opened in 1848 to carry Croton Aqueduct water 140 feet above the Harlem River, its fifteen stone arches deliberately evoking a Roman aqueduct like France's Pont du Gard. James Renwick Jr., who would later design St. Patrick's Cathedral, helped with the design. The five arches over the river were swapped for a single steel span in the 1920s. Water stopped flowing in 1958 and the bridge closed by the early 1970s, sitting shut for decades until a restoration reopened it to walkers and cyclists on June 9, 2015."},{"name":"Mount Sinai West","lat":40.769729,"lon":-73.986959,"blurb":"It was in this hospital's emergency room, then Roosevelt Hospital, that John Lennon was pronounced dead on December 8, 1980, after being shot outside the Dakota, and its ER later stood in for exterior shots on Seinfeld. Opened in 1871 from the bequeathed fortune of James Henry Roosevelt, it saw surgical history made: Charles McBurney, namesake of the appendectomy incision, introduced rubber gloves here to fight infection. Its Syms Operating Theater was among the first built for aseptic surgery. The 2015 rebrand to Mount Sinai West drew objections from the Roosevelt family."},{"name":"Teachers College, Columbia University","lat":40.810273,"lon":-73.960336,"blurb":"America's first graduate school of teacher education traces back to an 1880 charity called the Kitchen Garden Association, which philanthropist Grace Hoadley Dodge founded to swap toy kitchen utensils for age-appropriate playthings. As it grew into Teachers College, a young Nicholas Murray Butler, later Columbia's longest-serving president and a Nobel Peace Prize winner, was tapped to lead it. The influential philosopher John Dewey taught here from 1904 until 1930. It became Columbia's Graduate School of Education in 1898, and its first class of 26 had swelled to 686 graduates by 1911."},{"name":"Lombardi's Pizza","lat":40.721593,"lon":-73.995615,"blurb":"Long crowned America's first pizzeria (1905) and once counting tenor Enrico Caruso among its clientele, Lombardi's origin story got upended in 2019: records show Gennaro Lombardi only reached America in 1904 as a teenage 'laborer,' meaning he was likely an employee, not the founder, with research pointing instead to one Filippo Milone. It closed in 1984 and reopened a block away in 1994, forfeiting the 'longest continuously operating' crown to New Jersey's Papa's Tomato Pies. Current owner John Brescio was named a Genovese crime family captain by police in 2017. It has resold pizzas at the original 1905 price of five cents on anniversaries."},{"name":"Fairview (surveillance program)","lat":40.767046,"lon":-73.990643,"blurb":"This is the code name for the NSA's secret bulk-surveillance partnership with AT&T, launched in 1985 just a year after the Bell system's breakup, tapping phone, internet, and email traffic at cable landing and switching stations. Leaked Snowden documents praised the telecom's 'extreme willingness to help,' and in 2011 the program cost $188.9 million, twice its nearest rival, STORMBREW. Its New York peering point sits at 811 Tenth Avenue, one of several sites said to resemble the ominous windowless AT&T skyscraper at 33 Thomas Street in Lower Manhattan."},{"name":"Metropolitan Life North Building","lat":40.741511,"lon":-73.986487,"blurb":"The grand Art Deco block facing Madison Square Park was meant to be a 100-story colossus, the tallest building in the world, but the 1929 crash froze the money and it topped out at just 30 stories, finished piecemeal over three stages through 1950. It rose on the site of Stanford White's Madison Square Presbyterian Church. Now known as Eleven Madison, it serves as UBS's North American headquarters, and a few former Credit Suisse floors house Sony Corporation of America, including its music units."},{"name":"The Bitter End","lat":40.728334,"lon":-73.999217,"blurb":"Bob Dylan shot pool and occasionally took the stage here around 1961, at a Greenwich Village room that bills itself as New York's oldest rock club. Since opening that year, the Bitter End has launched or showcased Joni Mitchell, James Taylor, Woody Allen, and Billy Crystal, and it was the birthplace of Dylan's mid-1970s Rolling Thunder Revue. Lady Gaga played it as an unsigned unknown and returned in 2016 for her Dive Bar Tour. Bill Cosby recorded his first comedy album on its stage. It briefly went by 'The Other End' in 1975."},{"name":"United Nations International School","lat":40.736321,"lon":-73.973461,"blurb":"Founded in 1947 by UN diplomat families stumped by New York schools, it was a pilot school that awarded some of the first IB diplomas."},{"name":"Blue Note Jazz Club","lat":40.730832,"lon":-74.000725,"blurb":"Founder Danny Bensusan bet that big-name jazz plus great food in an intimate room would pack the house nightly, and when the Blue Note opened on September 30, 1981, in Greenwich Village with the Nat Adderley Quintet, he was proven right. Its flagship stage at 131 West 3rd Street went on to host Dizzy Gillespie, Sarah Vaughan, Ray Charles, Keith Jarrett, and Oscar Peterson. From that single club Bensusan built a global brand, opening Blue Note Tokyo in 1988 and eventually clubs from Milan to Shanghai."},{"name":"Brooklyn Bridge–City Hall/Chambers Street station","lat":40.712992,"lon":-74.00382,"blurb":"When the city's first subway opened on October 27, 1904, the very first passenger through this station was, per Newsday, an anonymous middle-aged Brooklyn woman who picked up her skirt and raced down the rubber-covered stairs three at a time to beat the crowd. It was one of the original 28 stations, an express stop on the IRT line funded by financier August Belmont Jr. The complex later fused that IRT station with the BMT's Chambers Street station, joined inside one fare zone in 1948."},{"name":"Dia Art Foundation","lat":40.747839,"lon":-74.006302,"blurb":"Bankrolled by Schlumberger oil heiress Philippa de Menil, this foundation set out in 1974 to be a Renaissance-style patron - one backer said founder Heiner Friedrich wanted to make a Sistine Chapel. It took its name from the Greek dia, meaning conduit, and funded art too big for anyone else: Walter De Maria's Lightning Field and New York Earth Room, and roughly six million dollars toward James Turrell's Roden Crater inside an Arizona volcano. So secretive it had no letterhead, it was nicknamed the art Mafia."},{"name":"Alvin Ailey American Dance Theater","lat":40.766922,"lon":-73.986964,"blurb":"America's largest modern dance company began in 1958 when Alvin Ailey and seven Black dancers took the stage at the 92nd Street Y. Two years later came Revelations, the company's signature work, rehearsed in a Clark Center basement and rooted in African American spirituals. Ailey danced at President Carter's 1977 inauguration gala, and Congress designated the troupe a cultural ambassador of the United States. When Ailey died of AIDS-related complications in 1989, dancer Judith Jamison took over as artistic director."},{"name":"United Palace","lat":40.846563,"lon":-73.938127,"blurb":"Televangelist Reverend Ike bought this 1930 movie palace in 1969 and made it the headquarters of his United Church Science of Living Institute. Architect Thomas Lamb threw everything into it - Aztec, Egyptian, Mayan, Islamic, Mughal and Classical motifs jammed together, decorations he said were meant to stimulate visitors' minds. It was one of five lavish Loew's Wonder Theatres around New York, each with a Wonder Morton pipe organ, and the only one without a single defined architectural style."},{"name":"8th Street and St. Mark's Place","lat":40.725189,"lon":-73.979587,"blurb":"St. Mark's Place, the East Village's rowdy main drag, got its name in 1835 from developer Thomas E. Davis, who borrowed it from the nearby church to lend cachet. By the 1840s German immigrants had packed the area so densely - 50,000 residents - that it was nicknamed Kleindeutschland, or Little Germany. Writer Ada Calhoun called it superglue for fragmented identities, a place for the wanderer, the undecided, the lonely and the promiscuous. Cooper Union opened its then-free college here in 1858."},{"name":"15 Penn Plaza","lat":40.749675,"lon":-73.990525,"blurb":"Nicknamed PENN15, this planned supertall triggered a bare-knuckle fight: the owners of the Empire State Building, the Malkin family, ran what the Times called a fierce PR, advertising and lobbying campaign to kill it, fearing it would blot out views of their landmark two blocks east. The City Council approved it anyway in a 47-1 vote in 2010 - the lone no coming from Brooklyn's Charles Barron, protesting the absence of a minority-hiring guarantee. The historic Hotel Pennsylvania was demolished for it by 2023."},{"name":"Daniel (restaurant)","lat":40.766778,"lon":-73.967571,"blurb":"Daniel Boulud, described as New York's longest-reigning four-star chef, has watched his Upper East Side flagship slide down the guides: three Michelin stars until 2014, then two, and just one by 2024. The New York Times gave it a coveted four stars before critic Pete Wells knocked it to three. Still, it has held the AAA Five Diamond award every year since 1999, and Forbes crowned it the top-ranked restaurant in America in October 2019."},{"name":"The Copper (building)","lat":40.744458,"lon":-73.971982,"blurb":"These twin luxury towers in Murray Hill appear to lean toward each other, joined 300 feet up by a three-story skybridge holding a 75-foot lap pool - said to be the first such bridge built in Manhattan in eight decades, its steel trusses weighing up to 421,000 pounds. The site was once Con Edison's Kips Bay power plant. The copper facade is slowly weathering to a pale blue-green verdigris, and of the 761 rental units, 20 percent are affordable."},{"name":"Bowery Ballroom","lat":40.720437,"lon":-73.993338,"blurb":"Industry insiders polled by Rolling Stone in 2013 crowned this 575-capacity room the best club in America, praising its sound, sightlines and touches of old-school class. The building went up as a high-end shoe store and haberdashery just before the 1929 Wall Street crash, then sat empty until after World War II. Patti Smith played here on New Year's Eve fourteen years running, and the venue turns up on screen in Coyote Ugly and Nick and Norah's Infinite Playlist."},{"name":"Patsy's Pizzeria","lat":40.797121,"lon":-73.9348,"blurb":"Opened in Italian Harlem in 1933 by Pasquale Patsy Lancieri, who learned his craft at Lombardi's coal-fired oven, this is one of New York's original pizzerias - and it claims to have invented selling pizza by the slice. The Patsy name later spawned a tangle of feuds: after the founder's widow sold the place in 1991, his snubbed nephew Patsy Grimaldi opened a rival and eventually renamed it Grimaldi's, which the Times judged the truest to the original."},{"name":"New York Historical","lat":40.779286,"lon":-73.974265,"blurb":"Founded in 1804, this is New York City's oldest museum - it predates the Metropolitan Museum of Art by nearly 70 years. Its art holdings top 1.6 million works, including a world-class trove of Hudson River School landscapes by Thomas Cole and Frederic Edwin Church. In 2005 it mounted a landmark two-year Slavery in New York exhibition, its largest themed show in 200 years on a subject it had never before addressed. It sits in a Roman Eclectic granite building on Central Park West, opened in 1908."},{"name":"Gramercy Tavern","lat":40.738389,"lon":-73.988414,"blurb":"Danny Meyer opened this New American mainstay - originally with chef Tom Colicchio - in July 1994, and Zagat voters have crowned it New York City's most popular restaurant seven separate times. Its rustic neo-Colonial dining room was the first hospitality project by architects Bentel and Bentel. The James Beard Foundation named it Outstanding Restaurant of 2008, and it carries one Michelin star, with Zagat once rating it about as perfect as a restaurant can get."},{"name":"240 Centre Street","lat":40.720138,"lon":-73.997941,"blurb":"This grand domed pile was the New York City Police Department's headquarters from 1909 to 1973, a Baroque and Renaissance Revival showpiece by Hoppin and Koen filling a full Little Italy block, its basement once holding pistol ranges. After the NYPD decamped to One Police Plaza, the building sat abandoned for a decade before being gutted and reborn in 1988 as roughly 55 luxury apartments known as the Police Building Apartments. It is a designated city landmark."},{"name":"Sarge's Deli","lat":40.747335,"lon":-73.977195,"blurb":"A retired NYPD sergeant named Abe Katz opened this Murray Hill Jewish deli in 1964, and it still makes its own pastrami and rolled beef - a genuine rarity. Its claim to fame is The Monster, billed as New York City's largest sandwich, stacking pastrami, corned beef, roast beef, turkey and salami into one tower. A three-alarm grease fire in 2012 shut it for 15 months. It also served as the set for the 1990 documentary My Dinner With Abbie, starring radical Abbie Hoffman."},{"name":"Nintendo New York","lat":40.757976,"lon":-73.979414,"blurb":"The store's little museum once displayed a Game Boy owned by Dr. Stephan Scoggins, a medic in the Gulf War: its front was charred and melted when his barracks was bombed, yet technicians found it could still power on and run Tetris using the surviving Start and Select buttons - a legendary testament to the console's toughness. Nintendo sent Scoggins a replacement as a Desert Storm courtesy. The two-story Rockefeller Center flagship opened in 2005, evolving from the earlier Pokemon Center New York."},{"name":"High School of Art and Design","lat":40.759098,"lon":-73.966308,"blurb":"Four art teachers started this school in 1936 in a former Manhattan elementary building, so broke they used orange crates and plywood to build desks and storage. Now a competitive career-and-technical high school requiring a portfolio and entrance exam, it offers majors from cartooning to fashion to film. Its faculty has included serious talent: Bel Kaufman, who wrote Up the Down Staircase; Frank Eliscu, the sculptor of the Heisman Trophy; and Pop artist Tom Wesselmann of Great American Nude fame."},{"name":"34th Street–Hudson Yards station","lat":40.755913,"lon":-74.0019,"blurb":"This deep, cathedral-like terminus of the 7 train was born from a failed dream - New York's bid for the 2012 Summer Olympics and its scrapped West Side Stadium. When London won the Games, the project limped through years of delays over escalators, elevators and fire systems before finally opening on September 13, 2015. It was the first entirely new station added to the subway since 1989, and the first funded by the city government since 1950."},{"name":"Lower East Side Tenement Museum","lat":40.718784,"lon":-73.990027,"blurb":"An estimated 15,000 immigrants from more than 20 nations passed through these two Orchard Street tenements between 1863 and 2015. In 1935, rather than pay to modernize 97 Orchard Street, the landlord simply evicted everyone, boarded the upper windows and sealed the floors - freezing the apartments as a time capsule of 19th-century living conditions until the museum's founders reopened them. Ruth Abram and Anita Jacobson launched the museum in 1988; the building is now a National Historic Site."},{"name":"One Manhattan West","lat":40.752735,"lon":-73.997691,"blurb":"Because this 996-foot SOM tower partly overhangs active railroad tracks, engineers made its reinforced-concrete central core - with walls up to four feet thick - carry most of the building's weight rather than the ground beneath it. That trick lets the 45-foot-high lobby stand entirely free of columns, wrapped in a glass wall held by glass fins. Completed in 2019 with law firm Skadden Arps as anchor tenant, its stainless-look curtain wall was meant to seem milled from solid steel."},{"name":"Calhoun School","lat":40.785589,"lon":-73.980593,"blurb":"This progressive Upper West Side school was founded in 1896 by Laura Jacobi, a German immigrant steeped in a circle committed to women's rights and civil reform. Her little school drew prominent families - among its early students were heiress Peggy Guggenheim, the children of the Morgenthaus and Strausses, and the son and daughter of Franz Boas, a founder of American anthropology. It was renamed in 1924 for headmistress Mary Calhoun and became fully coeducational in the early 1970s."},{"name":"Fordham University School of Law","lat":40.771553,"lon":-73.985012,"blurb":"Founded in 1905, Fordham's law school sits by Lincoln Center and is one of eight ABA-accredited law schools in New York City. It is unusually plugged into the city's industries, offering specialized degrees in Fashion Law and Corporate Compliance alongside the standard fare. It runs the highest-ranked part-time law program in New York State - once ranked second in the nation - and capped its 2005 centennial with an alumni gala on Ellis Island, held on the school's official birthday."},{"name":"Hotel Theresa","lat":40.808753,"lon":-73.948928,"blurb":"Known as the Waldorf of Harlem after Love B. Woods ended its whites-only policy in 1940, this white-terracotta hotel became the beating heart of Black social life - and its most famous guest arrived in 1960, when Fidel Castro decamped here for the UN session, renting 80 rooms at 800 dollars a day as Malcolm X helped arrange the stay. Malcolm later based his Organization of Afro-American Unity in the building. Colson Whitehead's 2021 novel Harlem Shuffle grew out of a real 1959 robbery at the hotel."},{"name":"Dyckman Street","lat":40.865283,"lon":-73.927112,"blurb":"This Inwood street is named for Dutch farmer William Dyckman, whose family once owned over 250 acres here; the 1784 Dyckman Farmhouse nearby is the oldest surviving farmhouse in Manhattan. A rustic 18th-century valley road, it predates the 1811 grid entirely - it sits where West 200th Street would be, in a gap where the numbered streets skip from 193rd to 201st. Stranger still, the seismically active Dyckman Street Fault runs directly beneath it."},{"name":"Office of Chief Medical Examiner of the City of New York","lat":40.741261,"lon":-73.97475,"blurb":"New York's medical examiner office replaced the old political coroner system on January 1, 1918, and its first true chief was Dr. Charles Norris, a pioneering forensic scientist. Grim modern chapters followed: after the September 11 attacks and the crash of Flight 587, the office built a Unified Victim Identification System for mass fatalities, and as of May 2021 it still held 750 pandemic dead in refrigerated truck trailers parked at a Brooklyn pier awaiting burial."},{"name":"Inwood Hill Park","lat":40.87226,"lon":-73.925348,"blurb":"This wild 196-acre park holds the largest old-growth forest left on Manhattan, on a glacially scoured schist ridge rising 200 feet above the Hudson. The Munsee-speaking Wecquaesgeek lived here for nearly 700 years and called the place Shorakapkok, meaning the sitting place. A Revolutionary War fort, Fort Cockhill, once guarded the river mouth here, and generations later the Macy's co-owner Isidor Straus, who would die aboard the Titanic, kept a summer estate on these hills."},{"name":"The Yale Club of New York City","lat":40.754012,"lon":-73.977521,"blurb":"When it opened at 50 Vanderbilt Avenue in 1915, this 22-story pile across from Grand Central was the largest clubhouse in the world, and it remains the biggest college clubhouse ever built. Its membership is restricted almost entirely to Yale alumni and faculty - now more than 11,000 worldwide - though it shares its facilities with the Dartmouth and University of Virginia clubs. Inside are three international squash courts, a swimming pool, a 20th-floor Grand Ballroom seating 500, and 138 guest rooms."},{"name":"1251 Avenue of the Americas","lat":40.760067,"lon":-73.981823,"blurb":"Here is an oddity: this 750-foot tower ranks among the 100 tallest buildings in America, yet it is nearly invisible on the skyline, hemmed in on every side by neighbors over 500 feet tall. Built in 1971 as the Exxon Building, it was the tallest of Rockefeller Center's later XYZ Buildings - the X - and is second in the whole complex only to 30 Rock. Exxon sold it to Japan's Mitsui for 610 million dollars in 1986 and moved its headquarters to suburban Texas, saying New York had grown too expensive."},{"name":"C-Squat","lat":40.725762,"lon":-73.977947,"blurb":"This Alphabet City tenement - built in 1872 and once home to a pickle shop, cigar factory and Republican meeting hall - was gutted by fire and abandoned to the city, then occupied by squatters in 1989. As landlords fled the neighborhood in the 1970s and 80s, the city fought back, sometimes mounting what one writer called massive paramilitary attacks on the buildings; in the end only 12 squats survived. C-Squat won provisional ownership in 2002 and went resident-owned, and its storefront now holds the Museum of Reclaimed Urban Space."},{"name":"Adafruit Industries","lat":40.726195,"lon":-74.005488,"blurb":"This open-source electronics company was founded in 2005 by Limor Fried while she was still an MIT student selling kits from her own designs. Its name comes from her online handle Ladyada, a nod to computing pioneer Ada Lovelace. Adafruit made headlines in 2010 by offering a bounty - 1,000 dollars, then bumped to 2,000 and finally 3,000 after Microsoft vowed to block such tampering - to anyone who could hack the Kinect's motion sensing for open use. Hacker Hector Martin claimed it with an open-source driver."},{"name":"The Peninsula New York","lat":40.761625,"lon":-73.975418,"blurb":"This Fifth Avenue hotel opened in 1905 as the Gotham, its limestone facade deliberately designed to echo the University Club next door. Its early years were rocky - it was sold in 1908 after repeatedly failing to secure a liquor license, then changed hands over and over for decades. Met Life owned it into the 1940s. It briefly became an outpost of the Parisian restaurant Maxim's in 1987 before Hong Kong's Peninsula group took over the lease in 1989 and gave it the name it carries today."},{"name":"945 Madison Avenue","lat":40.773409,"lon":-73.963818,"blurb":"Marcel Breuer's inverted-ziggurat of granite and raw concrete - its floors cantilevering outward as it rises - is one of Manhattan's boldest Brutalist landmarks and Breuer's only surviving work in the borough. Built in 1966 as the Whitney Museum's third home, it has since been a revolving door for art institutions: the Met Breuer from 2016 to 2020, then the temporary Frick Madison through March 2024. In 2023 auction house Sotheby's bought it to become its global headquarters."},{"name":"Brown Building","lat":40.730071,"lon":-73.995368,"blurb":"Now an NYU building, this was the Asch Building on March 25, 1911, when fire tore through the Triangle Shirtwaist Factory on its top three floors and killed 146 workers, most of them young immigrant women. Cruelly, the building had been marketed as fireproof - and structurally it was - but it had a single flimsy fire escape, no sprinklers, and no cap on how many people crammed each floor. The disaster galvanized workplace-safety reform; the site is now a National Historic Landmark with a memorial."},{"name":"42nd Street–Port Authority Bus Terminal station","lat":40.757308,"lon":-73.989735,"blurb":"When the IND's 42nd Street station opened in September 1932, the New York Herald Tribune hailed it as the 'largest platform in the world' - at 1,115 feet it was the longest on the Eighth Avenue Line, and building it swallowed over 4,000 tons of structural steel while several workers died in cave-ins. The new line juiced Eighth Avenue real estate by as much as 400 percent. A ghostly lower level with a single track flickered in and out of service between 1952 and 1981. Today the Times Square/Port Authority complex is the subway's busiest, moving over 65 million riders in 2019."},{"name":"Colony Club","lat":40.765128,"lon":-73.96871,"blurb":"Founded in 1903 as the first New York social club by and for women, the Colony Club drew on the fortunes of members like Anne Morgan, J.P. Morgan's daughter, and hired Stanford White to build it - though White was murdered by Harry K. Thaw months before it was finished. Actress-turned-decorator Elsie de Wolfe designed the interiors, and members threw suffrage rallies out front. Eleanor Roosevelt later resigned when the club refused to consider a Jewish candidate. At Henry Kissinger's 1973 birthday party here, four of the guest couples had been people he'd ordered wiretapped."},{"name":"West Fourth Street–Washington Square station","lat":40.731643,"lon":-74.000994,"blurb":"This maze of eight tracks stacked on two levels got the 'West' in its name for a station that never existed: planners feared riders would confuse it with 'South Fourth Street,' a transfer stop on the never-built IND Second System in Williamsburg. The Eighth Avenue upper level opened in 1932; the Sixth Avenue lower level didn't arrive until 1940, delayed because engineers had to thread it around the pre-existing Hudson & Manhattan tubes. Carving Sixth Avenue south to Church Street for the line meant demolishing dozens of buildings, including a hotel, near the station."},{"name":"Starrett–Lehigh Building","lat":40.751598,"lon":-74.006525,"blurb":"A freight terminal you could drive a truck into - literally: three freight elevators hauled entire trucks up to delivery bays on the upper floors, where Lehigh Valley Railroad boxcars, floated across the Hudson from Jersey City, were unloaded. Built in 1930-31 with ribbons of steel strip windows, it wowed critics and starred in MoMA's 1932 'Modern Architecture: International Exhibition.' Some 5,000 people worked here at its 1940s peak. Harry Helmsley snapped it up at a 1974 auction; dot-com and fashion firms later filled its vast concrete floors, and old loading areas became a billiard room and indoor golf."},{"name":"Harlem–125th Street station","lat":40.805237,"lon":-73.938911,"blurb":"When crews prepped this Harlem landmark for renovation in 1988, they found the platforms of the old open-cut station buried in the basement level. The current station opened October 15, 1897, built 30 feet higher than its predecessor atop a new steel viaduct raised so a rebuilt Harlem River bridge could clear ship traffic. The railroad had actually threatened to axe the 125th Street stop entirely after nearby property owners sued and stalled construction. Today it's the only station besides Grand Central to serve all three of Metro-North's east-of-Hudson lines."},{"name":"P. J. Clarke's","lat":40.758983,"lon":-73.96823,"blurb":"Nat King Cole crowned its bacon cheeseburger 'the Cadillac of burgers,' and Buddy Holly proposed to Maria Elena Santiago here on their first date, June 20, 1958. Johnny Mercer supposedly scrawled the torch classic 'One for My Baby' on a napkin at the bar, later apologizing to bartender Tommy Joyce for the line 'set 'em up, Joe' - he couldn't get 'Joyce' to rhyme. Open since 1884, this stubborn little holdout lost its top two floors but refused to sell out when a 47-story tower rose around it, and the Mad Men crew drank here on screen."},{"name":"Delacorte Theater","lat":40.780261,"lon":-73.968794,"blurb":"The Public Theater's free Shakespeare in the Park opened here in June 1962 with The Merchant of Venice, starring a young James Earl Jones and George C. Scott. Joseph Papp fought for the amphitheater over the objections of parks czar Robert Moses; when city money ran dry mid-build, publisher George Delacorte kicked in the last $150,000 and got his name on it. Built atop an old Croton reservoir, the theater was rebuilt in 2023-25 - for $85 million - using wood recycled from the wooden water towers that top New York apartment buildings."},{"name":"Broadway–Lafayette Street/Bleecker Street station","lat":40.725947,"lon":-73.99468,"blurb":"For more than half a century this was a subway transfer that only worked one way: riders could cross free from the downtown IRT platform to the IND starting in 1957, but the matching uptown connection wasn't finished until September 2012. The Bleecker Street half opened October 27, 1904 as one of the original 28 stations of New York's first subway - and part of its ceiling had collapsed during construction the year before, blamed on shoddy workmanship. Its landmarked interior survives from that first line, which helped spur the East Village's growth."},{"name":"The Majestic (apartment building)","lat":40.776058,"lon":-73.976648,"blurb":"One of the twin-towered Art Deco sentinels that give Central Park West its unmistakable skyline, the Majestic went up in 1930-31 to designs by Irwin S. Chanin's firm. Its 30-story towers rise from a 19-story base wrapped around an interior courtyard, trimmed with cantilevered Art Deco terraces and corner solariums made possible by floor slabs hung from a central core. Clad in tan and brown brick over a cast-stone base, it's a New York City landmark and a contributing building to the Central Park West Historic District."},{"name":"34th Street–Penn Station (IRT Broadway–Seventh Avenue Line)","lat":40.751289,"lon":-73.990362,"blurb":"Opened June 3, 1917 under the Dual Contracts, this station was a linchpin in reshaping the entire IRT. Before it, trains snaked up Broadway, jogged across 42nd Street, then turned onto Park Avenue - a route that looked like a 'Z' on the map. New Seventh Avenue and Lexington Avenue trunk lines, tied together by the 42nd Street Shuttle, straightened that into an efficient 'H,' one trunk running up Broadway and the other up Park Avenue. It's the southern terminal for late-night 3 trains and feeds straight into the LIRR, NJ Transit, and Amtrak at Penn Station."},{"name":"New Museum","lat":40.722346,"lon":-73.992841,"blurb":"Curator Marcia Tucker founded the New Museum in 1977 after leaving the art establishment behind, dedicating it to living artists 'who have not yet received significant exposure' and to bucking the stiff institutionalization of the museum world. It began in a borrowed New School space, migrated through SoHo and Chelsea, and in 2007 landed in a striking $50 million stack of off-kilter aluminum boxes on the Bowery designed by Tokyo firm SANAA. In 2003 it absorbed Rhizome, a pioneering platform for online new-media art, and admission-day crowds have chased emerging artists here ever since."},{"name":"Columbia University Irving Medical Center","lat":40.841999,"lon":-73.942001,"blurb":"The world's first academic medical center rose in the 1920s on a fittingly storied plot: Hilltop Park, the one-time home field of the New York Yankees. Philanthropist Edward Harkness donated the land and most of the money to build it as a combined medical school and Presbyterian Hospital. Long known as Columbia-Presbyterian, it was renamed in 2016 for Herbert Irving, a co-founder of the food-service giant Sysco, and his wife Florence, among its biggest benefactors. It's now the largest campus of NewYork-Presbyterian, up in Washington Heights."},{"name":"Amsterdam Houses","lat":40.772897,"lon":-73.987435,"blurb":"This 1948 Upper West Side housing project, tucked beside what became Lincoln Center, has an outsized alumni roll: CHiPs star Erik Estrada grew up here, as did pioneering female graffiti writer barbara62 and Daphne Maxwell Reid, the second Aunt Viv on The Fresh Prince of Bel-Air. Built on cleared tenement land to give residents a higher standard of living, it came with playgrounds, a nursery, gym, and clinic. When Lincoln Center opened in the 1960s the neighborhood gentrified around it while longtime tenants held on - by 2016, 70 percent of households were headed by someone over 62."},{"name":"Plast","lat":40.728995,"lon":-73.98715,"blurb":"Founded in Lviv in 1911, Plast was the first Ukrainian Scouting organization, its name taken from plastun, the old word for a Cossack scout and sentry. Founder Oleksander Tysovsky, affectionately nicknamed 'Drot,' reworked the universal Scout code for Ukrainian youth amid the upheavals of pre-WWI Austro-Hungarian Galicia. It spread fast: by 1914 there were Plast squads in every Ukrainian gymnasium in Galicia, and in Bukovyna some 800 youths formed a 'Plast Regiment' named for the Cossack hero Ivan Bohun. Stepan Bandera's uncle Osyp led a local scout group from 1912."},{"name":"125th Street","lat":40.802265,"lon":-73.9324,"blurb":"Harlem's 'Main Street,' co-named Martin Luther King Jr. Boulevard, is lined with legends: the Apollo Theater, the Hotel Theresa, the Studio Museum, and the Adam Clayton Powell Jr. State Office Building. The 1811 Commissioners' Plan singled it out as one of just 15 grand cross streets laid out a full 100 feet wide, while ordinary streets got 60. Its western end bends because that stretch was once a separate road called Manhattan Street, folded into 125th around 1920 - and the leftover original alignment was renamed La Salle Street."},{"name":"69th Regiment Armory","lat":40.741351,"lon":-73.984239,"blurb":"This was the site of American modern art's public debut: the 1913 Armory Show, where works by Duchamp and other European radicals were first shown to the American public, filled its cavernous drill hall. Completed in 1906 in the Beaux-Arts style by Hunt & Hunt, it broke with tradition as the first New York City armory not designed to look like a medieval fortress. The barrel-vaulted drill shed has since hosted basketball games and countless events, and the building remains home to the New York Army National Guard's storied 'Fighting 69th' infantry regiment."},{"name":"277 Park Avenue","lat":40.755224,"lon":-73.974181,"blurb":"Before the current 50-story tower opened in 1964, its site held a McKim, Mead & White apartment building that once housed an unusual tenant: the presidential campaign of John F. Kennedy. The land had been wrenched from Elizabeth Goelet Kip by eminent domain in the 1870s - she was forced to sell for $212,500 so Grand Central's depot could expand. The office building that replaced it is prominent enough to have its own ZIP code, 10172, and today packs in a big chunk of JPMorgan Chase's investment and commercial banking operations."},{"name":"33rd Street station (PATH)","lat":40.748538,"lon":-73.9887,"blurb":"The PATH's northern terminus was supposed to push on to Grand Central - a franchise for the extension was granted back in 1909 - but the plan quietly died, partly because the rival IRT slipped an unauthorized ventilation shaft into the very space the Hudson & Manhattan needed for its terminus. Opened November 10, 1910, the station was originally meant to sit under the Gimbels department store, but was shifted directly beneath Sixth Avenue to leave room for the northward extension that never came. It's still the end of all three PATH lines."},{"name":"Atlantic Theater Company","lat":40.743949,"lon":-74.001512,"blurb":"Playwright David Mamet and actor William H. Macy founded this Off-Broadway company in 1985 with a group of acting students and their own gospel of a technique called Practical Aesthetics. Its 199-seat mainstage sits inside the 1854 parish hall of a Chelsea Episcopal church. Small as it is, Atlantic has been a launch pad to Broadway: the Tony-winning musicals Spring Awakening, The Band's Visit, Kimberly Akimbo, and Buena Vista Social Club all took shape here first, among more than 200 plays it has staged."},{"name":"14th Street/Sixth Avenue station","lat":40.737459,"lon":-73.997068,"blurb":"Three subway lines from three different original operators - the IRT Seventh Avenue, the BMT Canarsie (L), and the IND Sixth Avenue - knot together under 14th Street here, plus a link to the PATH. There's a catch built into that link: you can walk straight through to the PATH's southbound platform, but reaching the northbound PATH means going up to the street and back down. The tangle traces to a turf fight - the Seventh Avenue and 14th Street lines were handed to the BRT in 1911 after the IRT refused to compromise on the city's Tri-borough plan."},{"name":"American Folk Art Museum","lat":40.77323,"lon":-73.981596,"blurb":"When it was chartered in 1961 as the Museum of Early American Folk Arts, this institution had no collection, no endowment, and no building - just a founding vision of taking self-taught artists seriously. Today its holdings run to roughly 7,500 objects, spanning 18th-century folk art through contemporary Art Brut by makers who never had formal training. Admission is free, and in 2025 Newsweek readers voted it America's #1 art museum. It now sits at Lincoln Square, on Columbus Avenue at 66th Street."},{"name":"Museum of the City of New York","lat":40.792506,"lon":-73.951908,"blurb":"The Museum of the City of New York was born in 1923 inside Gracie Mansion - now the mayor's residence - before space ran short and it needed a home of its own. Its red-brick, marble-trimmed neo-Georgian building on Museum Mile went up in 1929-30 to a design by Joseph Freedlander, its Fifth Avenue facade set with statues of Alexander Hamilton and DeWitt Clinton by sculptor Adolph Weinman. The 1929 Wall Street crash forced the plans to be scaled back, but the building was finally dedicated in January 1932, facing Central Park."},{"name":"52nd Street","lat":40.758799,"lon":-73.973919,"blurb":"For two decades this Midtown block was simply 'Swing Street.' After Prohibition's repeal in 1933, the clubs packed between Fifth and Seventh Avenues - Kelly's Stable, the Hickory House, the Famous Door - hosted virtually every jazz giant of the age: Billie Holiday, Art Tatum, Charlie Parker, Dizzy Gillespie, Miles Davis, Thelonious Monk. It became the single most important incubator of bebop after Harlem's Minton's Playhouse, and Monk's tune '52nd Street Theme' turned into a bebop anthem and jazz standard."},{"name":"Village East by Angelika","lat":40.730963,"lon":-73.986389,"blurb":"Now a seven-screen Angelika multiplex, this East Village movie house began in 1926 as the Louis N. Jaffe Art Theatre, a jewel of the old Yiddish Theatre District built in exuberant Moorish Revival style. It opened on November 17, 1926 with a play called The Tenth Commandment and served as a Yiddish playhouse into the 1940s before turning to off-Broadway, burlesque, and film. Both its exterior and interior are New York City landmarks - the original overhanging balcony survives intact, even as the old orchestra was carved into six screens."},{"name":"Chanin Building","lat":40.751215,"lon":-73.976705,"blurb":"Once the city's third-tallest building, its upper floors held a movie theater, observation deck, radio station, and bus terminal."},{"name":"Mount Sinai Morningside","lat":40.805235,"lon":-73.961467,"blurb":"This Morningside Heights teaching hospital opened in 1896 as St. Luke's Hospital, its pavilions designed by Ernest Flagg. Several of the original pavilions were later demolished, but the survivors are listed on the National Register of Historic Places and part of the complex is a designated New York City landmark. After decades known as St. Luke's-Roosevelt and later Mount Sinai St. Luke's, it took its current name and now serves as the main hospital for the Upper West Side and western Harlem, with a Level II trauma center and 489 beds."},{"name":"520 Park Avenue","lat":40.763888,"lon":-73.969645,"blurb":"At 781 feet, this limestone Robert A.M. Stern tower is the tallest building on the Upper East Side, developed by the Zeckendorf brothers as what Arthur Zeckendorf called the 'East Side sister' of his 15 Central Park West. Finished in 2018 and clad in the same pale limestone as Stern's other New Classical towers, it holds just 35 apartments across 64 stories, crowned by a triplex penthouse that listed for $130 million. Residents get a private movie theater, pool, wine cellars, and a garden."},{"name":"Lexington Avenue–63rd Street station","lat":40.764629,"lon":-73.966113,"blurb":"One of the deepest stations in the whole subway, this Lenox Hill stop took 20 years to open: construction began in 1969, but the 1975 fiscal crisis froze the city, and trains didn't stop here until 1989. It was built for cross-platform transfers to a Second Avenue Subway that never came, so half the station - the side meant for Second Avenue service - was sealed off behind a temporary orange brick wall and used only to store trains. When Second Avenue construction finally resumed in 2007, crews knocked down the wall and put the hidden half to work."},{"name":"Lafayette Street","lat":40.721947,"lon":-73.997456,"blurb":"This street was a real-estate coup by John Jacob Astor, who bought a market garden in 1804 for $45,000 and leased part of it to a Frenchman who ran a popular pleasure resort called Vauxhall Gardens. When the lease lapsed, Astor cut a wide three-block boulevard through the land and named it Lafayette Place, honoring the Revolutionary War hero whose triumphant 1824 return to America was still fresh - and the lots sold so briskly he made many times his money. Its grandest set piece was the 1833 marble row of Greek Revival houses New Yorkers still call Colonnade Row."},{"name":"Park Avenue Synagogue","lat":40.781116,"lon":-73.957955,"blurb":"Founded in 1882 by German Jews as the Reform 'Temple Gates of Hope,' this congregation flipped to Conservative Judaism in the 1930s to absorb Eastern European congregations. Its grand Moorish-style sanctuary on East 87th Street was dedicated on March 27, 1927, in a ceremony attended by then-mayor Jimmy Walker. A 2014-2019 renovation added prayer spaces and modern stained-glass panels designed by American artist Adolf Gottlieb."},{"name":"West Side Yard","lat":40.754801,"lon":-74.002967,"blurb":"Its eastern half now lies buried beneath the Hudson Yards skyscrapers, built on a platform over this 30-track Long Island Rail Road yard. Before it opened in 1987, rush-hour trains had to run empty, 'deadheading' out to Long Island for storage and clogging the tracks into Penn Station. It's named for state senator John D. Caemmerer, who secured $195.7 million to build it. Over the decades its air rights were eyed for a Yankees stadium, a Jets stadium, and the 2012 Olympics."},{"name":"Lexington Avenue/59th Street station","lat":40.762707,"lon":-73.96788,"blurb":"Building this two-level tunnel, with local tracks stacked above the express, was deadly work: at least 11 workers were killed in June 1913 when a section near 56th Street collapsed, and part of the upper level's roof caved in near 60th Street in January 1914, killing one more. The contractor had to underpin one of every five buildings on Lexington Avenue between 53rd and 67th Streets. Today it's the 14th-busiest station in the whole subway system."},{"name":"Life Underground","lat":40.739728,"lon":-74.002885,"blurb":"Sculptor Tom Otterness got so obsessed with this 14th Street subway commission that he delivered more than four times the 20 bronze figures he was contracted for, a series that grew past 100 pieces; his wife finally made him stop by pleading he was 'giving away our daughter's whole inheritance.' Many figures have moneybag heads, inspired by Thomas Nast's cartoons of Boss Tweed. The most famous shows a suited alligator lunging from a manhole to bite a moneybag-headed man. The project took ten years."},{"name":"Graybar Building","lat":40.752698,"lon":-73.975853,"blurb":"This Art Deco tower was built entirely on air rights above Grand Central's underground tracks, part of the 'Terminal City' complex, and its superstructure rises straight off the rails. It has its own ZIP code, 10170, one of just 41 Manhattan buildings so honored, and the public 'Graybar Passage' cuts through its ground floor from Lexington Avenue into the terminal. Named after original tenant Graybar, it opened in April 1927 and was fully leased within a year."},{"name":"110th Street","lat":40.795851,"lon":-73.946905,"blurb":"George Gershwin composed 'Rhapsody in Blue' at 501 West 110th Street, where he and his brother Ira lived from 1924 to 1929; a young Arthur Miller grew up at 45 West 110th. At Duke Ellington Circle stands a 25-foot statue of the bandleader hoisted on a grand piano by nine nude Muses. The street lends its name to Bobby Womack's gritty 'Across 110th Street,' and the original Polo Grounds once sat along it between Fifth and Sixth Avenues."},{"name":"Delancey Street","lat":40.719549,"lon":-73.991749,"blurb":"This Lower East Side artery is named for James De Lancey, chief justice and acting colonial governor of New York, whose farm once covered the area. For much of the 20th century it was the main shopping street of the heavily Jewish and Irish Lower East Side, famous for discount clothing. Landmarks include the 1929 Bowery Ballroom, the now-closed Ratner's kosher restaurant, and the Essex Street Market, built by Mayor La Guardia to clear pushcart congestion. Its western extension, Kenmare Street, is named for Kenmare, Ireland."},{"name":"Hudson Hotel","lat":40.768068,"lon":-73.984989,"blurb":"Built in 1928 by Anne Morgan, daughter of J.P. Morgan, this was originally the American Women's Association clubhouse, 1,250 rooms with a pool and gym for young women in the city. It housed Dutch soldiers in World War II, then served as headquarters for public TV station WNET, from which the MacNeil/Lehrer NewsHour was broadcast. Reborn as a 'Cheap Chic' hotel by Studio 54's Ian Schrager and designer Philippe Starck, its Hudson Bar, floored in glowing yellow glass, turned up in Gossip Girl and Sex and the City."},{"name":"Church of the Heavenly Rest","lat":40.783688,"lon":-73.958191,"blurb":"Founded in 1865 by Civil War veterans as a memorial to fallen soldiers, this Episcopal church landed its Fifth Avenue site thanks to Andrew Carnegie's widow, Louise, who sold it in 1926, having bought the lot to keep apartment houses from crowding her mansion. President Chester A. Arthur's funeral was held here in 1886, and actress Gloria Swanson's ashes were interred here in 1983. It stood in for the 'Church of the Heavenly Hope' in the 1997 film The Devil's Advocate."},{"name":"Alamo (sculpture)","lat":40.729885,"lon":-73.991018,"blurb":"Tony Rosenthal's 8-foot black steel cube, weighing about 1,800 pounds, was installed at Astor Place in 1967 as one of 25 temporary works meant to stay only six months, until locals petitioned the city to keep it. Rosenthal never intended it to spin, admitting in 2005 he'd meant to fix it in place, but it was never locked, and pushing it around became 'part of the New York experience.' Pranksters have turned it into a giant Rubik's Cube and, in 2011, the Companion Cube from the game Portal."},{"name":"One Manhattan Square","lat":40.710502,"lon":-73.991237,"blurb":"This 847-foot luxury tower looms absurdly over its Two Bridges neighbors, the next-tallest thing around being the Manhattan Bridge at roughly 336 feet, and critics likened its design to a cheese grater. Its separate, height-capped 13-story affordable building was derided as a 'poor door.' Built on a demolished Pathmark that residents fought to keep, the tower struggled to sell: even after nine-plus years and mortgage-rate buydowns, it was just 69% sold as of April 2025."},{"name":"New York Theatre Workshop","lat":40.726673,"lon":-73.99,"blurb":"This intimate 198-seat East Village house is where the megahit musical Rent was born before it moved to Broadway, along with Dirty Blonde. Founded by Stephen Graham, it has premiered new work by Tony Kushner, a former associate artistic director here, as well as Caryl Churchill and Doug Wright. The theater nicknames its stable of returning collaborators 'The Usual Suspects,' and mounts five to seven productions and over 80 staged readings a year."},{"name":"James B. Duke House","lat":40.776333,"lon":-73.963712,"blurb":"Tobacco baron James Buchanan Duke built this limestone mansion between 1909 and 1912 as a copy of the Chateau Labottiere in Bordeaux, designed by Horace Trumbauer with details by the pioneering African American architect Julian Abele. After Duke died in 1925, his widow Nanaline and his daughter, the fabled heiress Doris Duke, lived on here until donating the house to NYU in 1958. It has served as NYU's Institute of Fine Arts ever since."},{"name":"The NoMad","lat":40.74494,"lon":-73.988486,"blurb":"This hotel and restaurant were dreamed up by chef Daniel Humm and restaurateur Will Guidara of nearby Eleven Madison Park, with interiors by Jacques Garcia inspired by the Parisian apartment of his youth. The one-Michelin-star restaurant's signature dish was a whole roasted chicken for two, stuffed with foie gras and truffles. The very plan to open the NoMad prompted Danny Meyer to sell Humm and Guidara Eleven Madison Park, to avoid competing with himself. It closed in March 2021."},{"name":"Jekyll & Hyde Club","lat":40.732769,"lon":-74.00309,"blurb":"This horror-themed restaurant styled itself as a 1930s British explorers' club gone gothic, with roaming actors like Mr. Aloysius Goole the mortician and Jervis the hyperactive French butler, animatronic creatures, and restrooms hidden behind trick bookshelves. Critic Frank Bruni skewered its tomato sauce as 'red-tinged water.' Opened in 1991 in Greenwich Village, it filed for bankruptcy owing $7.5 million to creditors and shut its last door in June 2022."},{"name":"168th Street station (New York City Subway)","lat":40.840971,"lon":-73.939469,"blurb":"Workers raced to open this deep station inside the Fort George Mine Tunnel partly to serve baseball fans headed to American League Park, home of the Highlanders, the future Yankees. A train crashed into a temporary bulkhead in March 1905, sparking a fire that weakened and collapsed the tunnel roof and killed a firefighter, pushing the opening back to April 14, 1906. Its two tiny 12-by-12-foot elevators caused serious overcrowding from day one."},{"name":"225 Liberty Street","lat":40.712273,"lon":-74.015438,"blurb":"Formerly Two World Financial Center, this 44-story Cesar Pelli tower opened in 1987 and connects to the Winter Garden, a soaring glass-and-steel atrium under a 120-foot vaulted ceiling planted with sixteen 40-foot palm trees hauled in from the Mojave Desert. Debris from the collapsing Twin Towers severely damaged the building on September 11, 2001, and it stayed closed for repairs until May 2002. It was renamed when the complex became Brookfield Place in 2014."},{"name":"Delancey Street/Essex Street station","lat":40.718398,"lon":-73.987424,"blurb":"Beside the Brooklyn-bound track lies the abandoned Williamsburg Bridge Trolley Terminal, eight turning loops that carried streetcars over the bridge from 1908 until service ended in 1948. Because the BMT and IND began as rival systems, the free transfer between their platforms didn't exist until July 1, 1948. Several old exits survive as sealed staircases or emergency doors, two of them blocked by metal trapdoors at street level."},{"name":"191st Street station","lat":40.855258,"lon":-73.929398,"blurb":"At about 173 feet below the street, this is the deepest station in the entire New York City Subway. Opened on January 14, 1911 as an infill stop, its main entrance is reachable only by four elevators, plus Tunnel Street, a 1,000-foot pedestrian tunnel bored west to Broadway to overcome the neighborhood's steep, hilly terrain. Blasting for the platforms was confined to between midnight and 5 a.m. so it wouldn't interrupt subway service overhead."},{"name":"Ritz Tower","lat":40.761647,"lon":-73.970165,"blurb":"Built in 1925-26 by journalist Arthur Brisbane as a luxury apartment hotel, this 541-foot tower had no kitchen in any of its 400 units and was the tallest residential building in the city upon completion. Unable to carry the debt, Brisbane sold it in 1929 to his longtime friend William Randolph Hearst, who in turn surrendered it to his bondholders in 1938. Its retail base later held Le Pavillon, one of the first authentic French restaurants in the United States."},{"name":"34th Street–Penn Station (IND Eighth Avenue Line)","lat":40.752196,"lon":-73.99346,"blurb":"While digging this station in the late 1920s, crews hit the remnants of an old stream that had once originated at Herald Square; they diverted it into a sewer and waterproofed the mezzanine with concrete before the line could thread above Penn Station's tracks. It opened on September 10, 1932, and the new Eighth Avenue Line sent nearby real-estate values up as much as 400%. Ahead of the 2026 NBA Finals, one entrance was painted Knicks blue-and-orange and became a fan sensation."},{"name":"44 Union Square","lat":40.736224,"lon":-73.988731,"blurb":"This neo-Georgian building (1928-29) is Tammany Hall's oldest surviving headquarters, erected when the machine was at its peak with members like Governor Al Smith and Mayor Jimmy Walker, its facade inspired by Federal Hall. After Tammany's power crumbled in the 1930s, it passed to a garment workers' union, then a theater and the New York Film Academy. A 2016-2020 renovation gutted the interior and crowned it with a glass dome evoking the turtle shell of the Lenape creation story, honoring Chief Tamanend."},{"name":"East River Generating Station","lat":40.727664,"lon":-73.973965,"blurb":"Queen Marie of Romania ceremoniously switched on this plant's first 60-megawatt turbine on November 23, 1926, a single unit then capable of generating more than three times the electricity used in all of Romania. Neighbors had fought the project as a 'super-nuisance' of smoke and cinders. Nearly a century on, it still powers most of Manhattan below 36th Street and supplies over half the capacity of the entire New York City steam system."},{"name":"Doyers Street","lat":40.714448,"lon":-73.997857,"blurb":"The sharp bend in this one-block Chinatown lane became infamous as the 'Bloody Angle': in 1994 law enforcement said more people had died violently here than at any other intersection in the United States, victims of the early-1900s Tong gang wars whose frequent hatchet killings gave us the phrase 'hatchet man.' A single 1905 shooting at the nearby Chinese Theater killed three amid a packed house of 400. It's named for Dutch distiller Hendrik Doyers, and Nom Wah Tea Parlor has poured tea here since 1920."},{"name":"60 Hudson Street","lat":40.717651,"lon":-74.008289,"blurb":"Built in 1928-30 as Western Union's headquarters, this was billed as the world's largest telegraph building when it opened. Ralph Walker's Art Deco brick facade climbs through nineteen distinct hues, darker shades near the base lightening as the tower rises, over a barrel-vaulted brick lobby. Western Union moved out in 1973, but the building found a second life as a colocation center and is now one of the most important Internet hubs on the planet."},{"name":"Church of St. Vincent Ferrer","lat":40.766201,"lon":-73.964662,"blurb":"Built in 1918 by the Dominicans, this Upper East Side church wears one of the few outdoor statues of the Crucifixion on any American Catholic church, above its Lexington Avenue entrance. Inside, the Stations of the Cross are unusually rendered as oil paintings rather than carvings, two Schantz pipe organs play, and it holds the only known hanging pyx outside a museum. It has been called 'one of New York's greatest architectural adornments.'"},{"name":"Schomburg Center for Research in Black Culture","lat":40.814634,"lon":-73.940945,"blurb":"Andrew Carnegie's 1901 library gift built this Harlem branch, which opened in 1905 and became a focal point of the Harlem Renaissance, hosting the first exhibition of African-American art in Harlem in 1921. In 1926, the Carnegie Foundation paid $10,000 for the personal collection of Afro-Puerto Rican scholar Arturo Schomburg, some 5,000 objects, and donated it to the library so it would stay in Harlem. Schomburg became the first curator of his own collection in 1932."},{"name":"Robert K. Kraft Field at Lawrence A. Wien Stadium","lat":40.873241,"lon":-73.916457,"blurb":"Columbia's football stadium at the northern tip of Manhattan opened in 1984 with a loss to Harvard, and the Lions didn't win a home game here until October 8, 1988, over Princeton, ending part of a 44-game losing streak (1983-88) that was then the longest in NCAA history. The field was named for Robert Kraft, class of 1963, after a $5 million gift. In 2020 it was turned into a 288-bed COVID field hospital in a single week."},{"name":"E. V. Haughwout Building","lat":40.721808,"lon":-73.999485,"blurb":"This 1857 cast-iron SoHo emporium sold imported cut glass, silverware, and hand-painted china, drawing wealthy clients like Mary Todd Lincoln, who had official White House china painted here. On March 23, 1857 it installed the world's first successful passenger elevator, an Elisha Otis hydraulic lift that cost $300 and crept along at 0.67 feet per second. Its self-supporting cast-iron frame anticipated the steel skyscraper, and some call it the first."},{"name":"List of arches and bridges in Central Park","lat":40.767458,"lon":-73.978125,"blurb":"No two of Central Park's 36 ornamental spans are alike - Frederick Law Olmsted and Calvert Vaux's Greensward Plan called for a different design at every crossing, from Neo-Gothic cast iron to rugged rock. Seven were iron; all but one carried bridle paths, the exception being Bow Bridge over the Lake. When an 1859 cost overrun spooked commissioners about the price of stone, they approved cheaper 'rustic' log-and-stone bridges up north. The park peaked at 39 spans; three were torn out in the 1930s."},{"name":"New York City Fire Department Rescue Company 1","lat":40.760709,"lon":-73.996594,"blurb":"On 9/11, Captain Terry Hatton led 10 members of Rescue 1 into the North Tower stairwell and never came out - the company lost 11 men that day. One of the FDNY's most decorated firefighters, with 19 bravery medals including the Medal of Honor, he was nicknamed 'Capt. Man Hatton' for his encyclopedic memory of the city's buildings. His wife, a Giuliani aide, learned the day after the collapse that she was pregnant. His signature bark 'Outstanding' is painted on the rig, and West 43rd St here is now Terence S. Hatton Way."},{"name":"Little Red Lighthouse","lat":40.850255,"lon":-73.946963,"blurb":"Dwarfed beneath the George Washington Bridge, this 1921 beacon - officially Jeffrey's Hook Light - was made obsolete when the bridge's own lights came on in 1931. When the Coast Guard decommissioned it in 1948 and moved to auction it off, an outcry from children who loved the 1942 book 'The Little Red Lighthouse and the Great Gray Bridge' saved it; the deed passed to the city in 1951. It went dark for decades but was relit in 2002, and appears in the 1948 noir 'Force of Evil' and Jane Campion's 'In the Cut.'"},{"name":"Beth Israel Medical Center","lat":40.733225,"lon":-73.982443,"blurb":"Founded in 1890 by 40 Orthodox Jews who each chipped in 25 cents, Beth Israel was built for the Russian and Eastern European immigrants crowding the Lower East Side tenements - people who wanted kosher food and Yiddish-speaking doctors the older Mount Sinai uptown didn't offer. At its turn-of-the-century peak, 75% of patients were Russian-born and nearly all were poor; the hospital eventually grew to 1,368 beds. After Mount Sinai said it was losing $100 million a year, Beth Israel closed for good in April 2025."},{"name":"32 Avenue of the Americas","lat":40.719994,"lon":-74.004568,"blurb":"When it was finished in 1932, this Art Deco 'brick mountain' in Tribeca was the largest building in the world devoted to long-distance calling. Architect Ralph Walker wove textile-like motifs across the facade because AT&T described its switchboard operators as 'Weavers of Speech.' Its stepped setbacks, mandated by 1916 zoning, became an Art Deco signature; the exterior and mural-filled lobby were landmarked in 1991. It still hums as a data and communications hub - though AT&T no longer owns it."},{"name":"Hotel St. Moritz","lat":40.765162,"lon":-73.976034,"blurb":"Emery Roth designed this 1930 tower on Central Park South, whose sidewalk Cafe de la Paix was said to be New York's first. Donald Trump bought the 775-room hotel for $72 million in 1985 and flipped it three years later for $180 million to Australian billionaire Alan Bond. After a churn of owners it was gutted into the Ritz-Carlton New York, Central Park in 2002. Its ground-floor Rumpelmayer's is where Carol Burnett once spotted Marlene Dietrich, and the building turns up in Grand Theft Auto IV."},{"name":"72nd Street station (Second Avenue Subway)","lat":40.768799,"lon":-73.958424,"blurb":"A century in the making: the Second Avenue Subway was first proposed in 1919, and this station finally opened on January 1, 2017. Back in 1968 planning, critics blasted the line as a 'rich man's express' along a 'silk stocking route,' and locals protested for nearly a year before a 72nd Street stop was added in 1970. Digging began in 1972 but stalled in the 1975 fiscal crisis. The finished station is air-conditioned and waterproofed - rare in the system - and holds Vik Muniz's mosaic portraits, 'Perfect Strangers.'"},{"name":"Sheep Meadow","lat":40.771529,"lon":-73.975079,"blurb":"Central Park's designers wanted a pastoral idyll, not a military parade ground, so in 1864 they filled this meadow with 200 pedigree Southdown sheep, housed in a fanciful 1870 sheepfold by Jacob Wrey Mould. Twice a day a shepherd halted traffic to walk the flock across the drive, and the animals trimmed and fertilized the lawn. By the 1930s the inbred sheep were reportedly turning up deformed, and in 1934 Robert Moses evicted them - shipping them to Prospect Park, then the Catskills - so the sheepfold could become Tavern on the Green."},{"name":"ABC No Rio","lat":40.719366,"lon":-73.985359,"blurb":"This collective art center's odd name is salvage - the surviving letters of a burnt-out neon sign that once read 'Abogado Con Notario' (Spanish for lawyer and notary). ABC No Rio grew out of the 1979 Real Estate Show, when the artists' group Colab seized an abandoned Lower East Side building; after the city shut that down, negotiations handed them 156 Rivington Street in 1980. It hosted weekly hardcore punk matinees from 1989, a zine library, and a Food Not Bombs kitchen. The city eventually sold it the building for $1."},{"name":"Park Row","lat":40.711808,"lon":-74.006507,"blurb":"In the late 1800s this street was 'Newspaper Row,' where nearly every New York paper - including the Times - clustered to stay close to City Hall, giving rise to Printing House Square. Long before that, as Chatham Street, it hosted Pierre Lorillard's 1760 snuff factory and a tavern where Tammany's 'Martling Men' plotted on election days; it was renamed Park Row in 1886. Jacob Riis reported in 1890 that over 9,000 homeless men lodged nightly along Chatham Street and the Bowery."},{"name":"Foley Square","lat":40.714329,"lon":-74.00296,"blurb":"This civic-center plaza is named for Thomas 'Big Tom' Foley, a saloon-owning Tammany Hall boss. It sits atop the filled-in Little Collect Pond, once a city water source so polluted it was drained in 1811 after cholera and typhus outbreaks - and beside the notorious Five Points slum. Construction here unearthed an 18th-century African burial ground, now preserved as a national monument. Richard Serra's controversial 'Tilted Arc' stood in the square from 1981 until it was hauled away in 1989."},{"name":"Downtown Athletic Club","lat":40.706186,"lon":-74.01561,"blurb":"This 35-story Art Deco tower near Manhattan's southern tip was a private men's club that gave the sporting world the Heisman Trophy, named for John Heisman, the club's first athletic director. Founded in 1926, it stayed all-male until 1977. After the 9/11 attacks on the nearby World Trade Center, neighborhood blockades left the clubhouse largely cut off; the club filed for bankruptcy and shut down in 2002. The building, by Starrett & van Vleck, was later converted into condominiums."},{"name":"Fort George (New York)","lat":40.8584,"lon":-73.92994,"blurb":"The name 'Fort George' belonged to five different New York forts. The first began in 1626 as the Dutch Fort Amsterdam, then cycled through British names - Fort James, Fort William Henry, Fort Anne - before becoming Fort George in 1714; its site is now the Alexander Hamilton U.S. Custom House downtown. The fifth and last, built in 1776 in Upper Manhattan near 192nd Street, gave its name to the neighborhood - and its hilltop later hosted the Fort George Amusement Park from 1895 to 1914."},{"name":"General Theological Seminary","lat":40.74528,"lon":-74.00472,"blurb":"The Episcopal Church's oldest seminary, founded in 1817, sits on land with a Christmas pedigree: Clement Clarke Moore, who wrote 'A Visit from St. Nicholas,' donated 66 lots of his Chelsea apple orchard for the campus, and his estate's name became the neighborhood's. Under Dean Eugene Hoffman, reputedly the world's richest clergyman, the seminary rose around an Oxford-style quadrangle called the Close. Its 1888 Chapel of the Good Shepherd holds the oldest set of tubular bells in the country."},{"name":"34th Street","lat":40.747872,"lon":-73.983202,"blurb":"One of the 15 extra-wide (100-foot) crosstown streets laid out in the 1811 grid plan, 34th Street is anchored by Macy's Herald Square - the 'world's largest store' immortalized in 'Miracle on 34th Street' - where the Thanksgiving Day Parade ends each year. The Empire State Building rises from a rare ledge of solid Manhattan schist along its path. The street also passes Penn Station and Madison Square Garden, whose grand stair at the Farley Post Office echoes the lost original Penn Station."},{"name":"MacDougal Street","lat":40.732583,"lon":-73.998309,"blurb":"This Village strip was the beating heart of bohemian and Beat New York. Bob Dylan played his first city gig at Cafe Wha? (where Jimi Hendrix also cut his teeth) and later bought an apartment at No. 94; the San Remo Cafe drew James Baldwin, Allen Ginsberg, Jack Kerouac, Miles Davis and Jackson Pollock. The Comedy Cellar at No. 117 has hosted nearly every notable American comedian, and Caffe Reggio, serving since 1927, appears in 'The Godfather Part II' - JFK even stumped out front in 1959."},{"name":"Hudson River Park","lat":40.746217,"lon":-74.005184,"blurb":"Manhattan's second-largest park rose from the wreckage of Westway, the failed 1980s plan to bury an interstate along the Hudson. Its 550 acres include 400 acres of river protected as an estuarine sanctuary, strung along rebuilt shipping piers thick with history: Robert Fulton launched the pioneering steamboat Clermont from Pier 45 in 1807, the White Star Line's Titanic was due at Pier 59, and nearby Pier 54 both sent off the doomed Lusitania and received the Titanic's survivors off the Carpathia."},{"name":"IFC Center","lat":40.731224,"lon":-74.001665,"blurb":"Now an art-house cinema, this was the Waverly Theater - the original home of the midnight, audience-participation screenings of 'The Rocky Horror Picture Show,' a ritual that ran for years and spread to cities everywhere. The building actually began as an early-19th-century church. When it reopened as the IFC Center in 2005, patrons had to cross a picket line and pass a giant inflatable rat, because it opened using non-union projectionists. Today it anchors the DOC NYC documentary festival."},{"name":"Random House Tower","lat":40.76525,"lon":-73.982542,"blurb":"The office floors of this Midtown tower are the headquarters of Penguin Random House - the inspiration for its name - while the luxury Park Imperial apartments stack above; among the first residents were rapper P. Diddy and Yankees pitcher Randy Johnson. Critics say its three stepped towers look like sliding books, though the architects called them 'sliding crystals.' Two fluid tuned mass dampers on the 50th floor, walled in 16-inch concrete, quietly counter the building's sway."},{"name":"10 Hudson Yards","lat":40.752692,"lon":-74.001553,"blurb":"The first Hudson Yards tower to open (2016), 10 Hudson Yards is also the only one built on solid ground rather than the giant platform floated over the West Side rail yards. Its southern face cantilevers dramatically over the High Line's 30th Street spur, with one entrance opening directly onto the elevated park. Anchor tenant Coach (now Tapestry) took a 15-story atrium with terraces overlooking the Hudson; other tenants include L'Oreal USA and Boston Consulting Group."},{"name":"Great Lawn and Turtle Pond","lat":40.779462,"lon":-73.967941,"blurb":"The Great Lawn and Turtle Pond sit in the bowl of a former reservoir - the 1842 Croton system's Lower Reservoir - that was filled in during the early 20th century. Building it in the 1840s displaced the community of York Hill, whose residents moved to Seneca Village, itself later razed to make Central Park. Most of the turtles paddling the pond are former pets released into the park. Belvedere Castle overlooks the water from Vista Rock at the pond's west end."},{"name":"116th Street","lat":40.798945,"lon":-73.942363,"blurb":"The graceful curve where 116th Street meets Riverside Drive - framed by the twin curved facades of The Colosseum and The Paterno - is a leftover of an 1897 plan to route veterans' parades toward a park by Grant's Tomb; the park was never funded, but the curves stayed. At Broadway, Columbia's campus split the street: in 1953 the block became the pedestrian College Walk, ceded to the university for $1,000. Farther east it runs through 'Little Senegal' and past the Malcolm Shabazz Mosque, once the Lenox Casino."},{"name":"Jewish Museum","lat":40.785405,"lon":-73.957186,"blurb":"Housed in the Warburg family's Fifth Avenue chateau (donated by Frieda Warburg in 1944), the Jewish Museum grew partly from about 350 ceremonial objects that Poland shipped to New York in 1939 for safekeeping just as World War II erupted. Beyond Judaica, it became an unlikely engine of modern art: it gave Helen Frankenthaler, Kenneth Noland and Ad Reinhardt their first solo museum shows, introduced Jasper Johns in 1957, and its 1966 'Primary Structures' helped launch Minimalist scu
