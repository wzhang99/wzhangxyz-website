<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d0f12">
<title>manhattan gps watch > live</title>
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    font-style: normal;
    font-weight: 300;
    font-display: swap;
    src: url("../../fonts/ibm-plex-mono-latin-300-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Silkscreen";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("../../fonts/silkscreen-latin-400-normal.woff2") format("woff2");
  }
  :root {
    --bg: #0d0f12; --panel: #16191d; --ink: #f4f5f0; --muted: #8b9184;
    --accent: #ff6a3d; --lcd: #a8b79a;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app { height: 100%; display: flex; flex-direction: column; }

  /* status bar */
  .status {
    display: flex; align-items: center; gap: 9px; padding: 14px 18px;
    font-size: 14px; color: var(--muted); border-bottom: 1px solid #23272c;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .status .age { margin-left: auto; font-variant-numeric: tabular-nums; }

  /* main readout */
  .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; }
  .reading {
    font-family: "Silkscreen", "IBM Plex Mono", ui-monospace, monospace;
    font-weight: 400; letter-spacing: 0.02em; line-height: 1; text-align: center;
    font-size: clamp(30px, 9vw, 56px); white-space: nowrap; color: #e0243f;
    text-shadow: 0 0 14px rgba(224,36,63,0.35);
  }
  .reading .x { font-family: "IBM Plex Mono", monospace; color: #e0243f; font-weight: 300; opacity: 0.6;
    margin: 0 0.2em; text-shadow: none; }
  .reading.suburbs { font-size: clamp(24px, 7vw, 44px); letter-spacing: 0.02em; text-transform: lowercase; }
  .caption { display: none; }
  .hood {
    font-size: clamp(12px, 3.4vw, 15px); font-weight: 400; letter-spacing: 0.18em;
    text-transform: lowercase; color: var(--lcd); opacity: 0.75; text-align: center; min-height: 1.2em;
  }

  /* nearest subway + you-are-here cameo */
  .subway { display: flex; align-items: center; justify-content: center; gap: 7px; flex-wrap: wrap;
    font: 11px/1 "IBM Plex Mono", monospace; color: var(--muted); letter-spacing: 0.04em; margin-top: 4px; }
  .subway .slabel { font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #6b7168; }
  .subway .coord { font-family: "Silkscreen", monospace; font-size: 13px; color: #c9cdc2; }
  .subway .coord .x { font-family: "IBM Plex Mono", monospace; opacity: 0.5; margin: 0 0.12em; }
  .subway .arrow { display: inline-block; color: #c9cdc2; font-family: "IBM Plex Mono", monospace; }
  .bullet { display: inline-flex; width: 18px; height: 18px; border-radius: 50%; align-items: center;
    justify-content: center; font: 700 10px/1 "IBM Plex Mono", monospace; color: #fff; }
  .cameo { display: none; max-width: 34ch; text-align: center; margin-top: 6px;
    font: 11.5px/1.5 "IBM Plex Mono", monospace; color: #9fb0a2; }
  .cameo.show { display: block; }
  .cameo .ctag { display: block; color: #e0243f; letter-spacing: 0.14em; text-transform: uppercase;
    font-size: 9px; margin-bottom: 5px; opacity: 0.9; }
  .cameo .ctag .dirarrow { display: inline-block; }

  /* footer meta */
  .meta { padding: 10px 18px calc(30px + env(safe-area-inset-bottom)); font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }
  .meta b { color: #c9cdc2; font-weight: 600; }

  /* start button / overlay */
  .start {
    position: fixed; inset: 0; background: var(--bg); z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 32px;
    text-align: center;
  }
  .start h1 { font-size: 26px; margin: 0; font-weight: 800; }
  .start p { margin: 0; max-width: 30ch; color: var(--muted); line-height: 1.5; font-size: 15px; }
  .start button, .retry {
    font: inherit; font-weight: 700; font-size: 19px; color: #fff; background: var(--accent);
    border: none; border-radius: 14px; padding: 18px 40px; cursor: pointer;
  }
  .start button:active { transform: translateY(1px); }
  .hidden { display: none !important; }
  .err { color: var(--bad); font-size: 14px; max-width: 32ch; line-height: 1.5; }
  .brand { position: fixed; bottom: calc(8px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
           font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #3a3f45; }
</style>

cs designated as city landmarks."},{"name":"Japanese Peace Bell","lat":40.749421,"lon":-73.967745,"blurb":"Coins from over 60 countries and nine gold papal coins were melted together to cast this Buddhist temple bell for peace at the United Nations."},{"name":"Queen Elizabeth II September 11th Garden","lat":40.704797,"lon":-74.009335,"blurb":"Opened in 2010 by Queen Elizabeth II herself, this memorial garden honors Commonwealth victims of 9/11, later expanded to all member nations' casualties."},{"name":"Sloane Hospital for Women","lat":40.840112,"lon":-73.94116,"blurb":"Founded by Vanderbilt heirs in 1886, this Manhattan obstetrics hospital delivered Humphrey Bogart and Nancy Reagan while pioneering the Apgar score."},{"name":"Charlton–King–Vandam Historic District","lat":40.727222,"lon":-74.004722,"blurb":"Aaron Burr mapped this estate in 1797, dividing it into lots and laying out the three streets that would define the neighborhood for centuries."},{"name":"Church of the Guardian Angel","lat":40.746674,"lon":-74.005323,"blurb":"A priest summoned from Palm Sunday mass talked a gunman into surrendering during a 1939 standoff, earning a Congressional Gold Medal."},{"name":"Bust of Giuseppe Mazzini","lat":40.773009,"lon":-73.976694,"blurb":"Poet William Cullen Bryant delivered the dedication speech for this Italian-American commissioned bronze tribute in 1878."},{"name":"34th Street–Herald Square station","lat":40.749567,"lon":-73.98795,"blurb":"A terror plot to bomb the station during the 2004 Republican National Convention ended in a conviction and thirty-year prison sentence."},{"name":"One World Trade Center","lat":40.712999,"lon":-74.013189,"blurb":"Its height of 1,776 feet symbolizes the year the Declaration of Independence was signed, making the tower a numerical monument to American freedom."},{"name":"AOL","lat":40.730885,"lon":-73.991638,"blurb":"Half the CDs manufactured worldwide once carried its logo in a marketing blitz that made the disks a symbol of 1990s digital excess."},{"name":"Studio 54","lat":40.764344,"lon":-73.983779,"blurb":"Doormen at this 1970s nightclub famously rejected celebrities at the rope, including the band that wrote \"Le Freak\" after being turned away on New Year's Eve 1977."},{"name":"UNICEF","lat":40.750247,"lon":-73.969784,"blurb":"FC Barcelona became the first football club ever to sponsor a charity rather than the reverse, donating 1.5 million euros annually starting in 2006."},{"name":"Headquarters of the United Nations","lat":40.750208,"lon":-73.967225,"blurb":"In 1964, Cuban exiles fired a bazooka at the headquarters while Che Guevara was speaking, but missed their target."},{"name":"Rockefeller University","lat":40.762274,"lon":-73.955952,"blurb":"Founded by John D. Rockefeller in 1901, the biomedical institute has produced 26 Nobel laureates and pioneered the studies proving genes were made of DNA."},{"name":"One Times Square","lat":40.756212,"lon":-73.986554,"blurb":"The Times Square Ball has dropped from this neo-Gothic tower since 1908, now drawing a million spectators yearly to its New Year's Eve celebration."},{"name":"Lotte New York Palace Hotel","lat":40.757987,"lon":-73.974918,"blurb":"A bar named Trouble's Trust sits beneath the grand staircase, celebrating the trust fund that belonged to Leona Helmsley's beloved dog."},{"name":"John Golden Theatre","lat":40.75871,"lon":-73.987967,"blurb":"\"Angel Street\" became the theater's longest-running production with nearly 1,300 performances, despite expectations of failure so low only three days' playbills were ordered."},{"name":"8th Street and St. Mark's Place","lat":40.725189,"lon":-73.979587,"blurb":"In 1977, punk exploded here when Manic Panic opened on 7/7/77, drawing everyone from Cyndi Lauper to the Ramones with vibrant hair dyes and rebellious fashion."},{"name":"14th Street/Sixth Avenue station","lat":40.737459,"lon":-73.997068,"blurb":"Its 1918 opening doubled the entire IRT subway system's capacity by implementing the \"H\" system, transforming Manhattan's network into efficient trunk lines."},{"name":"Sheep Meadow","lat":40.771529,"lon":-73.975079,"blurb":"Sheep were evicted in 1934 to make room for a restaurant, after decades of grazing while a shepherd stopped traffic twice daily to move the flock."},{"name":"Jean-Georges","lat":40.76897,"lon":-73.981667,"blurb":"Formerly held three Michelin stars before dropping to two, a rare and prestigious downgrade in New York City's fiercely competitive fine-dining scene."},{"name":"Liberty Tower","lat":40.708845,"lon":-74.009384,"blurb":"Franklin D. Roosevelt's law office occupied the second floor when the building opened in 1910, years before he became U.S. president."},{"name":"53rd Street","lat":40.75537,"lon":-73.963838,"blurb":"The Ed Sullivan Theater here hosts The Late Show, where David Letterman famously used the street itself for on-air comedy segments."},{"name":"East Broadway station","lat":40.713715,"lon":-73.990173,"blurb":"Built to connect to an unfinished subway line, it contains hidden mezzanines and sealed-off platforms that were never actually constructed."},{"name":"Rector Street station (BMT Broadway Line)","lat":40.70722,"lon":-74.013342,"blurb":"This understated Financial District station closed for six weeks after 9/11, reopening October 27, 2001, amid Lower Manhattan's recovery."},{"name":"Bayard–Condict Building","lat":40.72636,"lon":-73.994999,"blurb":"Louis Sullivan's only New York building features six winged angels a previous owner allegedly insisted represent the six working days, excluding the Sabbath."},{"name":"The Actors' Temple","lat":40.761305,"lon":-73.989038,"blurb":"A Hell's Kitchen synagogue that became a spiritual home for Broadway stars like Al Jolson and Milton Berle before membership dwindled from 300 to just 30."},{"name":"Statue of Giuseppe Garibaldi","lat":40.730592,"lon":-73.996834,"blurb":"When moved in 1970, workers found an 1880s time capsule beneath it holding newspaper clippings about Garibaldi's death and the monument's dedication."},{"name":"Holy Trinity Episcopal Church","lat":40.778345,"lon":-73.949565,"blurb":"A Supreme Court case about the church hiring a British rector as pastor became one of the most cited decisions in American jurisprudence."},{"name":"The Astor","lat":40.781462,"lon":-73.981722,"blurb":"William Waldorf Astor commissioned two towers in 1901, then added a deliberately taller third tower in 1914 to accommodate luxury penthouses."},{"name":"New York University Center for Neural Science","lat":40.729161,"lon":-73.994435,"blurb":"Three National Academy of Sciences members and pioneering work in neuroeconomics make this 1989-founded center a powerhouse of neuroscience innovation."},{"name":"Fulton Street station (New York City Subway)","lat":40.709963,"lon":-74.005986,"blurb":"Built across four eras by separate companies, this Financial District hub required underpinning 89 buildings on narrow Nassau Street to prevent collapse."},{"name":"Washington Square Village","lat":40.728056,"lon":-73.997778,"blurb":"Nikola Tesla's laboratory on this site's western boundary burned down in March 1895, destroying ten years of his research."},{"name":"University Village","lat":40.726944,"lon":-73.998889,"blurb":"A Picasso sculpture originally rejected by another developer now anchors this modernist complex, while mobster Vincent Gigante called it home."},{"name":"96th Street station (IRT Broadway–Seventh Avenue Line)","lat":40.794379,"lon":-73.972,"blurb":"The 1979 cult film The Warriors set a chase scene here, though it was actually shot on the abandoned tracks at Brooklyn's Hoyt–Schermerhorn Streets."},{"name":"South Street Seaport","lat":40.705751,"lon":-74.002906,"blurb":"The first American trading ship to China sailed from here in 1784, launching commerce between the new United States and the Qing Empire."},{"name":"General Theological Seminary","lat":40.74528,"lon":-74.00472,"blurb":"Its inaccessible neo-Gothic Close has repeatedly masqueraded as fictional Hudson University in Law & Order productions."},{"name":"Weill Cornell Medicine","lat":40.764752,"lon":-73.954912,"blurb":"In 2019 a $160 million gift made tuition completely free for all qualifying students, eliminating medical-school debt for its entire student body."},{"name":"WCBS-FM","lat":40.748436,"lon":-73.985693,"blurb":"Famously switched to the automated 'Jack FM' format in 2005, only to crash in the ratings and abandon it after just two years."},{"name":"Croton Distributing Reservoir","lat":40.753435,"lon":-73.982361,"blurb":"Edgar Allan Poe strolled the public promenade atop this 50-foot granite reservoir's walls, where the main NYPL now stands."},{"name":"Saint Ann's School (Brooklyn)","lat":40.792663,"lon":-73.939811,"blurb":"A famously grade-free Brooklyn school where high schoolers design their own curriculum, boasting one of the nation's highest Ivy League enrollment rates."},{"name":"New York Studio School of Drawing, Painting and Sculpture","lat":40.732267,"lon":-73.997255,"blurb":"This Greenwich Village art school once housed the original Whitney Museum of American Art before it moved uptown."},{"name":"New York Foundling","lat":40.738936,"lon":-73.995424,"blurb":"Vigilantes in 1880s Arizona seized nineteen Catholic orphans this charity placed with Mexican American families, sparking a landmark Supreme Court custody case."},{"name":"Carrère and Hastings","lat":40.797908,"lon":-73.974426,"blurb":"John Carrère died when a streetcar hit his taxi, leaving partner Thomas Hastings to run the famed firm alone for eighteen years."},{"name":"Richard Morris Hunt Memorial","lat":40.771456,"lon":-73.967988,"blurb":"Sculptor Daniel Chester French created its bronze figures to honor the architect who designed the Metropolitan Museum's main building."},{"name":"United Palace","lat":40.846563,"lon":-73.938127,"blurb":"Televangelist Reverend Ike bought this shuttered 1930 movie palace for $600,000 in 1969 and preserved its extravagant interior as a church."},{"name":"Ladies' Mile Historic District","lat":40.74,"lon":-73.9925,"blurb":"Women could shop alone here safely in the 1880s and 1890s, a revolutionary novelty that made the district a magnet for the wealthy elite."},{"name":"Gracie Square Hospital","lat":40.769709,"lon":-73.952975,"blurb":"This psychiatric hospital counted jazz legend Thelonious Monk and singer Paul Robeson among its notable patients."},{"name":"New York Eye and Ear Infirmary","lat":40.73188,"lon":-73.984581,"blurb":"The interior of this 1820 specialty hospital doubled as the setting where Vito Corleone fights for survival in bed in The Godfather."},{"name":"Storefront for Art and Architecture","lat":40.72148,"lon":-73.997103,"blurb":"A rotating facade designed by Vito Acconci and Steven Holl in 1993 deliberately dissolves the boundary between gallery and street."},{"name":"Stonewall Inn","lat":40.733816,"lon":-74.002161,"blurb":"The 1969 riots here sparked the modern gay liberation movement, transforming a mob-run bar into an international symbol of LGBTQ resistance."},{"name":"Knickerbocker Club","lat":40.765883,"lon":-73.971432,"blurb":"Founded in 1871 by Union Club members upset about declining standards, it took three generations of Rockefellers to finally crack this aristocratic citadel."},{"name":"List of New York Public Library branches","lat":40.865712,"lon":-73.925825,"blurb":"Andrew Carnegie's philanthropy built over a dozen of these branch libraries across New York City in the early 1900s."},{"name":"Times Square Church","lat":40.762543,"lon":-73.984325,"blurb":"Founded by David Wilkerson in 1987 to serve Times Square's addicts and destitute, this Pentecostal megachurch took over a lavish Broadway theater."},{"name":"Atlantic Theater Company","lat":40.743949,"lon":-74.001512,"blurb":"Founded by David Mamet and William H. Macy in 1985, it incubated Tony-winning musicals like Spring Awakening and The Band's Visit before Broadway."},{"name":"Beacon Theatre","lat":40.78049,"lon":-73.981131,"blurb":"The Allman Brothers Band played here nearly every year from 1989 to 2014, giving their final career show on October 28, 2014, after 238 concerts."},{"name":"Courant Institute School of Mathematics, Computing, and Data Science","lat":40.728699,"lon":-73.995715,"blurb":"Richard Courant fled Nazi Germany in 1934 and built a mathematical powerhouse that has produced four Abel Prize winners and a Turing Award recipient."},{"name":"Yeshiva University Museum","lat":40.737978,"lon":-73.993831,"blurb":"Thomas Jefferson's handwritten 1818 letter denouncing antisemitism sits here alongside artifacts spanning three millennia of Jewish history."},{"name":"Dahesh Museum of Art","lat":40.725096,"lon":-74.004908,"blurb":"Founded under the pen name of a Lebanese mystic philosopher, it amassed a $30 million endowment in five years, rivaling the Guggenheim's."},{"name":"Charging Bull","lat":40.705564,"lon":-74.013446,"blurb":"Artist Arturo Di Modica illegally installed this 7,100-pound bronze bull outside the NYSE as a guerrilla-art Christmas gift in 1989."},{"name":"Bowling Green station","lat":40.704509,"lon":-74.014095,"blurb":"Its Bowling Green–South Ferry shuttle, once running two-car rush-hour service, closed in 1977, ending a 68-year-old transit connection."},{"name":"South Ferry/Whitehall Street station","lat":40.70171,"lon":-74.013149,"blurb":"Excavation uncovered a British colonial-era wall, reportedly Manhattan's oldest man-made structure still in place, plus over 250,000 artifacts."},{"name":"Statue of Walter Scott","lat":40.770141,"lon":-73.97234,"blurb":"Scottish-Americans gifted New York a bronze replica of Edinburgh's Scott Monument sculpture, complete with the writer's beloved dog Maida at his side."},{"name":"Robert Burns (Steell)","lat":40.770193,"lon":-73.972566,"blurb":"This likeness became the first Burns statue erected outside Scotland when it was gifted to New York City in 1880."},{"name":"Statue of Christopher Columbus (Central Park)","lat":40.769906,"lon":-73.972773,"blurb":"Erected in 1894 to mark Columbus's voyage, this bronze has been vandalized twice with messages challenging its subject's historical legacy."},{"name":"Equestrian statue of George Washington","lat":40.735376,"lon":-73.990695,"blurb":"This 1856 bronze depicts Washington beginning his triumphant march through Manhattan on Evacuation Day, when the British finally left New York in 1783."},{"name":"Statue of Mahatma Gandhi","lat":40.735551,"lon":-73.991325,"blurb":"Civil rights leader Bayard Rustin delivered the keynote at this statue's 1986 dedication, commemorating Gandhi's 117th birth anniversary."},{"name":"Three Dancing Maidens","lat":40.794264,"lon":-73.95195,"blurb":"Nazi plunder and an amateur researcher's global quest revealed six versions of this bronze fountain, the original perhaps still hidden in a German castle."},{"name":"86th Street station (IRT Lexington Avenue Line)","lat":40.779494,"lon":-73.955529,"blurb":"Its lower level opened in 1918 as part of the revolutionary 'H system' that split the original subway into separate east and west trunk lines."},{"name":"28th Street station (IRT Lexington Avenue Line)","lat":40.743314,"lon":-73.984075,"blurb":"Bombs exploded here in 1927, injuring passengers in an unsolved attack initially blamed on anarchists tied to the Sacco and Vanzetti case."},{"name":"28th Street station (BMT Broadway Line)","lat":40.745494,"lon":-73.988691,"blurb":"Bombs exploded at this station in 1927, injuring numerous passengers, with the perpetrator never identified and initially blamed on anarchists."},{"name":"Statue of William Shakespeare","lat":40.769799,"lon":-73.97237,"blurb":"Funded by an 1864 Julius Caesar benefit starring the three Booth brothers, including John Wilkes Booth, who would assassinate Lincoln months later."},{"name":"Indian Hunter (Ward)","lat":40.770377,"lon":-73.973152,"blurb":"Cast in bronze in 1866, it became the first sculpture by an American artist installed in Central Park, then just eleven years old."},{"name":"Statue of Fitz-Greene Halleck","lat":40.770664,"lon":-73.972137,"blurb":"President Rutherford B. Hayes unveiled this bronze memorial to poet Fitz-Greene Halleck in 1877, Central Park's first statue of an American."},{"name":"Alice in Wonderland sculpture","lat":40.775038,"lon":-73.966534,"blurb":"Sculptor Jose de Creeft modeled Alice's face on his own daughter and the Mad Hatter on philanthropist George Delacorte, who commissioned the 1959 statue for kids to climb on."},{"name":"Canal Street station (New York City Subway)","lat":40.718092,"lon":-73.999892,"blurb":"During construction through the former Collect Pond site, workers unearthed tree trunks and human bones alongside coins, silverware, and steel tools."},{"name":"Broadway–Lafayette Street/Bleecker Street station","lat":40.725947,"lon":-73.99468,"blurb":"For 72 years this was one of New York's only stations where the free transfer worked in just one direction, until finally completed in 2012."},{"name":"42nd Street–Bryant Park/Fifth Avenue station","lat":40.753743,"lon":-73.9819,"blurb":"A 1986 study identified this as the single most dangerous place to get robbed anywhere in the entire New York City Subway system."},{"name":"Grand Central–42nd Street station","lat":40.752769,"lon":-73.979189,"blurb":"On April 21, 1964, a fire destroyed an experimental automated shuttle train being tested here, burning through the wooden platforms."},{"name":"Fifth Avenue–59th Street station","lat":40.764827,"lon":-73.972675,"blurb":"Its platforms feature \"Urban Oasis,\" a 1997 mosaic depicting Central Park Zoo animals including penguins, polar bears, and monkeys."},{"name":"Harlem–148th Street station","lat":40.823712,"lon":-73.936101,"blurb":"Built in 1968 inside a preexisting rail yard, this terminal nearly closed before community protests saved it."},{"name":"163rd Street–Amsterdam Avenue station","lat":40.836945,"lon":-73.940126,"blurb":"Its original exits to 163rd Street were sealed off by the late 1980s and remain closed today."},{"name":"Rector Street station (IRT Broadway–Seventh Avenue Line)","lat":40.707363,"lon":-74.01385,"blurb":"After the September 11 attacks destroyed nearby tunnels, the station underwent a $14 million renovation before reopening in 2002."},{"name":"WTC Cortlandt station","lat":40.711432,"lon":-74.012145,"blurb":"Destroyed on September 11 and buried for seventeen years, it reopened in 2018 as a $181 million station featuring art by Ann Hamilton."},{"name":"Wall Street station (IRT Broadway–Seventh Avenue Line)","lat":40.706724,"lon":-74.009183,"blurb":"Built under a cramped 40-foot-wide street, its unusually narrow island platform forced contractors to underpin every building above quicksand-prone ground."},{"name":"Grand Street station (IND Sixth Avenue Line)","lat":40.718162,"lon":-73.993784,"blurb":"Repeated Manhattan Bridge track closures cut Brooklyn's Chinese-American riders off from Chinatown, sparking fierce community opposition to service changes."},{"name":"Broad Street station (BMT Nassau Street Line)","lat":40.706491,"lon":-74.01106,"blurb":"Construction required underpinning 89 buildings and tunneling under Federal Hall with Congressional permission to avoid destabilizing the landmark."},{"name":"West Fourth Street–Washington Square station","lat":40.731643,"lon":-74.000994,"blurb":"\"West\" was added to the name to avoid confusion with a never-built \"South Fourth Street\" station in Brooklyn."},{"name":"Second Avenue station","lat":40.723402,"lon":-73.989938,"blurb":"Its abandoned express tracks were sealed off in 1990 after becoming a shelter for homeless people near the Bowery's missions."},{"name":"Delancey Street/Essex Street station","lat":40.718398,"lon":-73.987424,"blurb":"An abandoned underground trolley terminal beneath it once carried streetcars across the Williamsburg Bridge to Brooklyn until service ended in 1948."},{"name":"47th–50th Streets–Rockefeller Center station","lat" ion (BMT Canarsie Line)","lat":40.730865,"lon":-73.981423,"blurb":"Graffiti artist Michael Stewart's 1983 arrest here became a landmark police-brutality case that reverberated through New York's art world."},{"name":"Third Avenue station (BMT Canarsie Line)","lat":40.733153,"lon":-73.986821,"blurb":"It pioneered the MTA's experimental half-height platform screen doors in 2022, a response to riders being pushed onto the tracks."},{"name":"42nd Street–Port Authority Bus Terminal station","lat":40.757308,"lon":-73.989735,"blurb":"The lower-level platform was used to film the iconic subway scene in Ghost (1990), starring Patrick Swayze and Demi Moore."},{"name":"Spring Street station (IND Eighth Avenue Line)","lat":40.72554,"lon":-74.004014,"blurb":"Chilean artist Alfredo Jaar rented every ad space here in December 1984 to display photos of impoverished gold miners beside world oil prices."},{"name":"28th Street station (IRT Broadway–Seventh Avenue Line)","lat":40.747217,"lon":-73.993362,"blurb":"A hidden speakeasy called La Noxe has operated inside the station beside a northbound staircase since October 2020."},{"name":"50th Street station (IRT Broadway–Seventh Avenue Line)","lat":40.761662,"lon":-73.983897,"blurb":"Three bystanders leapt onto the tracks in 1987 to rescue an unconscious man seconds before a train arrived, later dramatized on \"Rescue 911.\""},{"name":"Houston Street station (IRT Broadway–Seventh Avenue Line)","lat":40.728599,"lon":-74.005308,"blurb":"A 1994 renovation added \"Platform Diving,\" an underwater-themed artwork of sea creatures swimming through the subway."},{"name":"Franklin Street station (IRT Broadway–Seventh Avenue Line)","lat":40.71918,"lon":-74.006928,"blurb":"When Aretha Franklin died in 2018, the MTA added \"Respect\" stickers to this station's signs as a tribute meant to be temporary that stayed for years."},{"name":"Burnett Memorial Fountain","lat":40.793158,"lon":-73.95276,"blurb":"Depicts characters from Frances Hodgson Burnett's beloved The Secret Garden, dedicated by Mayor Fiorello LaGuardia in 1937."},{"name":"Amiable Child Monument","lat":40.814808,"lon":-73.963169,"blurb":"A poignant 1797 grave of a child who fell down a bluff, it inspired poetry and survived the city's attempt to relocate it for Grant's Tomb."},{"name":"John's of Bleecker Street","lat":40.73161,"lon":-74.003342,"blurb":"Patrons have carved their names into the wooden booths for over a century at this coal-fired brick-oven pizzeria serving since 1915."},{"name":"Mandarin Oriental","lat":40.76901,"lon":-73.982912,"blurb":"Dale Chihuly created a 2,100-pound chandelier of 683 hand-blown Waterford Crystal pieces, plus his first-ever glass garden installation."},{"name":"Strand Bookstore","lat":40.73328,"lon":-73.99094,"blurb":"Founded with just $600 in 1927, it now houses over 23 miles of books and survived the Depression thanks to a generous Stuyvesant landlord."},{"name":"Lombardi's Pizza","lat":40.721593,"lon":-73.995615,"blurb":"Founded in 1905 and long claimed as America's first pizzeria, though recent research credits Filippo Milone, not Gennaro Lombardi."},{"name":"72nd Street station (IRT Broadway–Seventh Avenue Line)","lat":40.779016,"lon":-73.981856,"blurb":"When it opened in 1904, the architecture was so unpopular that The New York Times called it 'a miserable monstrosity' and locals demanded demolition."},{"name":"66th Street–Lincoln Center station","lat":40.773277,"lon":-73.982203,"blurb":"One of the original 28 stations from the 1904 subway opening, it features mosaics by artist Nancy Spero celebrating performers."},{"name":"Tom's Restaurant","lat":40.805451,"lon":-73.965416,"blurb":"Inspired Suzanne Vega's 1987 hit 'Tom's Diner' and served as the exterior for Seinfeld's fictional Monk's Cafe throughout the show's run."},{"name":"Vietnam Veterans Plaza","lat":40.702705,"lon":-74.009765,"blurb":"Donald Trump donated $1 million and served as co-chairman of the commission that raised $2.5 million to finance this Vietnam War memorial."},{"name":"General William Jenkins Worth Monument","lat":40.742755,"lon":-73.988967,"blurb":"Columbia College undergraduates once used this granite obelisk as the launching point for their annual 'Burial of the Ancients' parade and bonfire."},{"name":"Statue of Abraham Lincoln","lat":40.736245,"lon":-73.990067,"blurb":"Henry Kirke Brown's 1870 bronze drew immediate criticism for its bizarre costume combining modern pantaloons with a Roman toga."},{"name":"Statue of the Marquis de Lafayette","lat":40.73569,"lon":-73.989989,"blurb":"Frederic Auguste Bartholdi, who sculpted this 1876 Lafayette tribute in Union Square, created the Statue of Liberty a decade later."},{"name":"77th Street station (IRT Lexington Avenue Line)","lat":40.773653,"lon":-73.959844,"blurb":"A 2003 renovation added Robert Kushner's commissioned artwork '4 Seasons Seasoned,' bringing mosaic seasonal themes to the platforms."},{"name":"Josephine Shaw Lowell Memorial Fountain","lat":40.753985,"lon":-73.984091,"blurb":"Installed in 1912, it memorializes the first woman to be honored by a major monument in New York City."},{"name":"Statue of José Bonifácio de Andrada","lat":40.753725,"lon":-73.984675,"blurb":"The Brazilian government sponsored a competition to choose the sculptor, donating $60,000 for the plaza and granite base of this 1954 monument."},{"name":"Statue of William E. Dodge","lat":40.75407,"lon":-73.983093,"blurb":"John Quincy Adams Ward's bronze tribute originally stood in Herald Square before relocating to Bryant Park in 1941."},{"name":"Bust of Johann Wolfgang von Goethe","lat":40.753219,"lon":-73.983731,"blurb":"Karl Fischer's 1832 iron-and-copper sculpture received a bronze casting when moved to Bryant Park in 1932, the centenary of Goethe's death."},{"name":"Statue of Gertrude Stein","lat":40.753278,"lon":-73.983157,"blurb":"Sculptor Jo Davidson depicted his friend Gertrude Stein as 'a sort of modern Buddha,' the bronze installed at Bryant Park in 1992."},{"n eatball empire that grew to eight locations before closing in 2026."},{"name":"Harriet Tubman Memorial","lat":40.808179,"lon":-73.952788,"blurb":"Sculptor Alison Saar depicts Tubman striding forward with roots pulling at her skirt, symbolizing the slavery she overcame, and honors the people she rescued on her hem."},{"name":"TCI College of Technology","lat":40.750536,"lon":-73.995675,"blurb":"Founded in 1909 by radio pioneer Guglielmo Marconi as a wireless institute, the for-profit college ranked fourth nationally for low-income student mobility before closing in 2017."},{"name":"Statue of George M. Cohan","lat":40.758759,"lon":-73.985146,"blurb":"Sculptor Georg Lober immortalized the Broadway legend in bronze at Times Square in 1959, decades after Cohan revolutionized American musical theater."},{"name":"New York University Stern School of Business","lat":40.728974,"lon":-73.996504,"blurb":"A $30 million gift in 1988 from alumnus Leonard N. Stern renamed the school and funded a state-of-the-art facility consolidating its graduate and undergraduate programs."},{"name":"Yonah Schimmel's Knish Bakery","lat":40.723186,"lon":-73.990131,"blurb":"No New York politician in the last 50 years has been elected without a photo op eating a knish here, according to a famous review."},{"name":"Russ & Daughters","lat":40.722583,"lon":-73.988192,"blurb":"Started by a Polish Jewish immigrant who once sold mushrooms off his shoulders, the shop renamed itself 'Russ & Daughters' in 1933 to honor his three daughters as partners."},{"name":"IBM Watson","lat":40.730111,"lon":-73.990246,"blurb":"Watson infamously answered 'What is Toronto?????' to a U.S. Cities clue on Jeopardy!, confidently guessing a Canadian city and becoming an instant meme."},{"name":"Koreatown","lat":40.747642,"lon":-73.986516,"blurb":"A Korean bookstore and restaurants opening in the 1980s sparked explosive growth that turned a garment-district block into the 'Korean Times Square.'"},{"name":"NoHo","lat":40.725875,"lon":-73.993957,"blurb":"Post-WWII loft spaces transformed a manufacturing wasteland into an artists' haven drawing luminaries like Basquiat, Mapplethorpe, and Warhol."},{"name":"Ogilvy (agency)","lat":40.76352,"lon":-73.995911,"blurb":"David Ogilvy bought an eyepatch on the way to a photo shoot, creating the iconic 'Man in the Hathaway Shirt' campaign that boosted sales by 160 percent."},{"name":"Classic Stage Company","lat":40.732723,"lon":-73.988247,"blurb":"Founded in 1967, the Off-Broadway theater has launched major stars including Peter Dinklage and Ethan Hawke while specializing in classical productions."},{"name":"Rockefeller Center Christmas Tree","lat":40.758733,"lon":-73.978637,"blurb":"During the Great Depression in 1931, construction workers spontaneously decorated a tree with cranberries and handmade garlands before the tradition became official in 1933."},{"name":"Performance Space New York","lat":40.728112,"lon":-73.984426,"blurb":"Born in an abandoned elementary school in 1979, the East Village nonprofit launched the careers of groundbreaking avant-garde performance artists and dancers."},{"name":"Umbertos Clam House","lat":40.718448,"lon":-73.997624,"blurb":"Two months after opening in 1972, gangster Joe Gallo was shot and killed here during an early-morning snack, an event Bob Dylan immortalized in his song 'Joey.'"},{"name":"National Arts Club","lat":40.737754,"lon":-73.986681,"blurb":"Founded in 1898 by a New York Times critic, the club controversially offered full membership to women from day one, decades ahead of its peers."},{"name":"Julius (restaurant)","lat":40.734536,"lon":-74.00163,"blurb":"The 1966 'Sip-In' protest here established gay people's legal right to be served alcohol in New York bars, four years before Stonewall."},{"name":"Downtown Community Television Center","lat":40.717373,"lon":-74.001273,"blurb":"Founded in 1972 by documentary filmmaker Jon Alpert and his wife Keiko Tsuno, the community media center has produced Emmy-winning documentaries."},{"name":"Writopia Lab","lat":40.784132,"lon":-73.976317,"blurb":"David Letterman's production company funds an annual festival showcasing plays written and performed by young student playwrights."},{"name":"Nintendo New York","lat":40.757976,"lon":-73.979414,"blurb":"A severely burned Game Boy that survived a Gulf War bombing and still powers on became a fixture of the store's museum, a testament to the console's durability."},{"name":"Palladium Times Square","lat":40.757645,"lon":-73.986442,"blurb":"From a movie theater to a live concert venue, the Times Square space hosted the Heisman Trophy ceremony annually from 2005 to 2019."},{"name":"Ellen's Stardust Diner","lat":40.761848,"lon":-73.983503,"blurb":"Singing waitstaff have launched Broadway careers, with alumni going on to star in shows like Wicked, The Lion King, and Jersey Boys."},{"name":"Magnet Theater","lat":40.748777,"lon":-73.995351,"blurb":"Founded in 2005 by Chicago improvisers trained under Del Close, the theater became a world epicenter for musical improvisation."},{"name":"The Quin","lat":40.764653,"lon":-73.977476,"blurb":"Street artist Blek le Rat was nearly arrested by police while stenciling on a hotel door during his 2014 artist-in-residence program here."},{"name":"Ziegfeld Theatre (1969)","lat":40.763037,"lon":-73.979833,"blurb":"The last film shown before its 2016 closure was Star Wars: The Force Awakens, ending an era of single-screen movie palaces in Manhattan."},{"name":"High School for Environmental Studies","lat":40.76788,"lon":-73.988308,"blurb":"Once a Fox Film movie studio in Hell's Kitchen, the environmental high school opened in 1992 with just 150 freshmen."},{"name":"New York Public Library for the Performing Arts","lat":40.773229,"lon":-73.984751,"blurb":"Gordon Bunshaft designed the interiors of this 1965 Lincoln Center building, where the theater forms the core and research collections form the roof."},{"name":"P. J. Clarke's","lat":40.758983,"lon":-73.96823,"blurb":"Nat King Cole called its bacon cheeseburger 'the Cadillac of burgers,' and Buddy Holly proposed to his future wife here on their first date in 1958."},{"name":"American Federation of Arts","lat":40.75278,"lon":-73.969113,"blurb":"Theodore Roosevelt and Secretary of State Elihu Root founded the organization in 1909 to democratize art by bringing exhibitions to underserved regions."},{"name":"Hotel Carter","lat":40.757358,"lon":-73.988231,"blurb":"A once-grand bus terminal with a rotating turntable, it became America's infamous \"dirtiest hotel,\" site of at least four murders since opening in 1930."},{"name":"Daniel (restaurant)","lat":40.766778,"lon":-73.967571,"blurb":"Once holding three Michelin stars, Daniel Boulud's flagship fell to a single star by 2024 despite his rep as New York's longest-reigning four-star chef."},{"name":"Statue of Alexander Hamilton (Central Park)","lat":40.781033,"lon":-73.964572,"blurb":"Hamilton's son commissioned this 1880 granite statue, modeling the founder's head on a bust by sculptor Giuseppe Ceracchi, who was later guillotined under Napoleon."},{"name":"Statue of Balto","lat":40.769961,"lon":-73.97101,"blurb":"The sled dog remains the only Central Park statue subject known to have attended its own dedication ceremony, in 1925."},{"name":"107th Infantry Memorial","lat":40.769331,"lon":-73.969557,"blurb":"The sculptor used his own hands as the model for all seven soldiers' hands, staging them advancing from a wooded thicket as if mounting a charge."},{"name":"Schinasi House","lat":40.802979,"lon":-73.96936,"blurb":"Built in 1909 for a tobacco baron, this marble mansion boasted a private tunnel to the Hudson River and water taps on its facade for easy cleaning."},{"name":"Rao's","lat":40.793923,"lon":-73.934267,"blurb":"Opened in 1896, this legendary East Harlem Italian spot is now so exclusive the New York Post calls it one of the hardest places to get into in the city."},{"name":"Skyscraper Museum","lat":40.70575,"lon":-74.017691,"blurb":"After the September 11 attacks forced its closure, this architecture museum became the first to reopen in Lower Manhattan in 2004, a symbol of recovery."},{"name":"High School of Art and Design","lat":40.759098,"lon":-73.966308,"blurb":"Founded in 1936 with orange crates for desks, this school launched Calvin Klein, Tony Bennett, Harvey Fierstein, and Art Spiegelman."},{"name":"Joe's Pub","lat":40.729197,"lon":-73.991625,"blurb":"Amy Winehouse and Adele both made their U.S. headlining concert debuts at this intimate venue before becoming global superstars."},{"name":"Westside Theatre","lat":40.759448,"lon":-73.99262,"blurb":"Built in 1890 as a German Baptist church, this Hell's Kitchen space passed through nightclubs before becoming an off-Broadway theater in 1976."},{"name":"Ray's Candy Store","lat":40.726282,"lon":-73.983546,"blurb":"An Iranian Navy deserter who swam ashore in 1963 founded it, keeping it open during the 1988 Tompkins Square riot because all the combatants were his customers."},{"name":"Bertel Thorvaldsen with the Statue of Hope","lat":40.788621,"lon":-73.956,"blurb":"Thorvaldsen sculpted this self-portrait as a plaster model in 1839 but died before carving it in marble, leaving a pupil to finish it in 1859."},{"name":"Statue of Daniel Webster","lat":40.774753,"lon":-73.974118,"blurb":"Thomas Ball's bronze was meant for Central Park's iconic Mall but grew so larger-than-life it had to be relocated to the West Drive at 72nd Street."},{"name":"Equestrian statue of José Martí (Central Park)","lat":40.766045,"lon":-73.976066,"blurb":"The Cuban hero is shown at the moment he was fatally shot in 1895 at Dos Rios, after fifteen years of exile writing in New York City."},{"name":"King Jagiello Monument","lat":40.778924,"lon":-73.96668,"blurb":"Made for the 1939 World's Fair, this bronze king was stranded in New York by the Nazi invasion of Poland, kept partly through Mayor La Guardia's advocacy."},{"name":"Equestrian statue of Simón Bolí aring on gates at the Bronx Zoo, in Central Park, in Jerusalem, and in Arkansas."},{"name":"American Academy of Dramatic Arts","lat":40.745516,"lon":-73.984776,"blurb":"Founded in 1884 by a Harvard professor, America's first acting conservatory trained generations of icons in a Stanford White-designed landmark building."},{"name":"Joie de Vivre (di Suvero)","lat":40.708967,"lon":-74.010929,"blurb":"During Occupy Wall Street in 2011, a protester scaled this seventy-foot abstract sculpture and stayed atop it for hours before police intervened."},{"name":"Non-Violence (sculpture)","lat":40.750689,"lon":-73.967585,"blurb":"Swedish artist Carl Fredrik Reutersward created this bronze gun with a knotted barrel overnight after learning of John Lennon's murder in 1980."},{"name":"Alamo (sculpture)","lat":40.729885,"lon":-73.991018,"blurb":"This beloved cube was supposed to stay only six months, but locals fought to keep it, and it still spins freely when pushed."},{"name":"J.G. Melon","lat":40.771073,"lon":-73.959371,"blurb":"A scene with Meryl Streep and Dustin Hoffman from the 1979 film Kramer vs. Kramer was shot at this iconic Upper East Side hamburger joint."},{"name":"Institute of Audio Research","lat":40.733026,"lon":-73.993771,"blurb":"Grammy-winning faculty trained students like Benny Blanco and Claudio Sanchez at this audio school that ran nearly five decades before closing in 2017."},{"name":"Caffe Reggio","lat":40.730322,"lon":-74.000362,"blurb":"Founded in 1927, this Greenwich Village coffeehouse claims to have introduced cappuccino to America and still houses its original 1902 espresso machine."},{"name":"Fanelli Cafe","lat":40.724607,"lon":-73.99875,"blurb":"Operating continuously since 1847, this SoHo institution served as a Prohibition speakeasy and became a hub of Manhattan's counterculture scene."},{"name":"Theater for the New City","lat":40.728614,"lon":-73.984789,"blurb":"An off-off-Broadway institution that premiered Sam Shepard's Pulitzer-winning Buried
