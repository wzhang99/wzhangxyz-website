lorers Club","lat":40.769954,"lon":-73.965572,"blurb":"Founded in 1904, this Manhattan club's members have carried its flag on hundreds of expeditions, from the poles to the surface of the Moon."},{"name":"Harlem–125th Street station","lat":40.805237,"lon":-73.938911,"blurb":"The original 1844 station platforms were rediscovered hidden in the basement during 1988 renovation work, buried under a century of neglect."},{"name":"Sphere Within Sphere","lat":40.750878,"lon":-73.967571,"blurb":"Arnaldo Pomodoro's bronze sphere series, created for Montreal's Expo 67, cracks open to reveal machinery inside, symbolizing an 'ideal city' of hope."},{"name":"Circle in the Square Theatre","lat":40.762248,"lon":-73.985355,"blurb":"Founded by theater novices with just $320 in 1951, it became Off-Broadway's epicenter and launched Dustin Hoffman, James Earl Jones, and Colleen Dewhurst."},{"name":"Reclining Figure (Lincoln Center)","lat":40.773183,"lon":-73.983682,"blurb":"A Parks Commissioner initially dismissed Henry Moore's massive bronze as 'junk' and wanted it hauled out of Lincoln Center."},{"name":"49th Street station (BMT Broadway Line)","lat":40.759901,"lon":-73.984139,"blurb":"Architects Philip Johnson and John Burgee redesigned the station in the early 1970s with bright orange tiles meant to feel like 'a big shopping center.'"},{"name":"34th Street–Hudson Yards station","lat":40.755913,"lon":-74.0019,"blurb":"After its delayed 2015 opening, early riders complained about signal problems and broken escalators, yet praised its cathedral-like design and climate-controlled platforms."},{"name":"Fordham University School of Law","lat":40.771553,"lon":-73.985012,"blurb":"George Clooney's character in Michael Clayton graduated from here, and a defense attorney alumnus became an internet meme during the longest Georgia trial ever."},{"name":"Gateway School","lat":40.772364,"lon":-73.987818,"blurb":"Founded in 1965 by an educator and a parent seeking help for one child, it now serves 180 students with learning disabilities."},{"name":"American Musical and Dramatic Academy","lat":40.772305,"lon":-73.987572,"blurb":"Founded in 1964 by theatre director Philip Burton, this conservatory has trained stars like Janelle Monáe, Jason Derulo, and Broadway's Mike Faist."},{"name":"Guttman Community College","lat":40.752949,"lon":-73.984011,"blurb":"Designed as a multimillion-dollar experiment in fixing what ails community colleges, its intensive admissions interviews cut 4,000 applicants to just 300 enrollees."},{"name":"303 Gallery","lat":40.747543,"lon":-74.007539,"blurb":"Lisa Spellman named it after both its original address and Alfred Stieglitz's historic Intimate Gallery, launching the careers of Christopher Wool and Robert Gober."},{"name":"Rockefeller Foundation","lat":40.750822,"lon":-73.983315,"blurb":"It bankrolled Nazi eugenics research through the 1930s, even funding the Kaiser Wilhelm Institute where Josef Mengele later conducted his infamous experiments."},{"name":"Bellerophon Taming Pegasus","lat":40.807037,"lon":-73.960564,"blurb":"Lipchitz completed this monumental bronze after his death in 1973, with his widow Yulla overseeing the final casting, making it his last artistic legacy."},{"name":"Alvin Ailey American Dance Theater","lat":40.766922,"lon":-73.986964,"blurb":"A 1970 Soviet tour meant to downplay American racism backfired when audiences gave a 23-minute standing ovation for performances celebrating Black self-determination."},{"name":"Women's Rights Pioneers Monument","lat":40.770711,"lon":-73.97239,"blurb":"Fierce pushback from Black women activists added Sojourner Truth after the original design excluded her, breaking Central Park's bronze ceiling for historical women in 2020."},{"name":"Eagles and Prey","lat":40.77251,"lon":-73.972516,"blurb":"Created in 1850 and installed in 1863, this bronze by Christophe Fratin stands as the earliest known artwork installed in any New York City park."},{"name":"The Africa Center","lat":40.796342,"lon":-73.949334,"blurb":"In the 1980s-90s, this museum revolutionized how art exhibitions could challenge Western perspectives on African culture and museum practices themselves."},{"name":"McSorley's Old Ale House","lat":40.728761,"lon":-73.989702,"blurb":"Women were legally forced in only in 1970 after a discrimination lawsuit, ending over a century of men-only service at this historic Irish saloon."},{"name":"Amster Yard","lat":40.755134,"lon":-73.970295,"blurb":"Interior designer James Amster transformed a dilapidated 1940s site into a hidden Manhattan courtyard that became a beloved gathering place for the artistic community."},{"name":"Leslie-Lohman Museum of Art","lat":40.721768,"lon":-74.003032,"blurb":"The IRS objected to the word 'gay' in its name and delayed nonprofit status for years before finally approving it in 1990."},{"name":"Trash and Vaudeville","lat":40.726642,"lon":-73.985288,"blurb":"Founded by an 18-year-old Ray Goodman in 1975, this punk emporium introduced Doc Martens to America and made the first black skinny jeans worn by the Ramones."},{"name":"Church of Our Lady of Sorrows","lat":40.719089,"lon":-73.982289,"blurb":"Built in 1867-1868, this Victorian-Romanesque church served German Catholics in Manhattan's Kleindeutschland before welcoming Italian and Hispanic immigrant communities."},{"name":"Pace Gallery","lat":40.749576,"lon":-74.004969,"blurb":"Founded by 22-year-old Arne Glimcher in 1960, the gallery's name comes from his father's nickname, 'Pacey.'"},{"name":"The New York Earth Room","lat":40.725979,"lon":-73.999754,"blurb":"A single caretaker, painter Bill Dilworth, maintained its 250 cubic yards of earth for thirty-five years until his 2024 retirement."},{"name":"Harvard Club of New York City","lat":40.755494,"lon":-73.981206,"blurb":"After a 1972 vote fell just 18 short of admitting women, legal threats over liquor licenses forced reconsideration, leading to overwhelming approval in January 1973."},{"name":"Consulate General of Poland","lat":40.749709,"lon":-73.98127,"blurb":"Poland's first U.S. diplomatic post hosted a secret WWII Polish intelligence outpost and became a Solidarity movement epicenter during the Cold War."},{"name":"Union Square Drinking Fountain","lat":40.736003,"lon":-73.99073,"blurb":"Donated by a future U.S. president's father and a wealthy businessman in 1881, this bronze fountain promoted public health as well as the virtue of charity."},{"name":"Statue of Benito Juárez","lat":40.75443,"lon":-73.984267,"blurb":"Donated by Mexico's Oaxaca state in 2002, it became Bryant Park's most recent statue and its first depicting a Mexican figure."},{"name":"Statue of John Watts","lat":40.707691,"lon":-74.012137,"blurb":"A congressman's grandson erected this bronze memorial to his grandfather in 1893 at Trinity Church Cemetery in Manhattan."},{"name":"SVB Financial Group","lat":40.742803,"lon":-73.984148,"blurb":"Founded over a poker game in 1982, this bank holding company spectacularly collapsed in March 2023 after customers withdrew 81% of deposits in just two days."},{"name":"Berry Campbell Gallery","lat":40.749949,"lon":-74.004016,"blurb":"Founded by two women who spotted a gap in Chelsea's scene, it revives overlooked abstract expressionists, particularly women and artists of color."},{"name":"Marlborough Fine Art","lat":40.749867,"lon":-74.005004,"blurb":"The gallery became notorious for defrauding Mark Rothko's estate, selling over 100 of his paintings at fraudulently low prices before a 1975 court ruling."},{"name":"Luhring Augustine Gallery","lat":40.749112,"lon":-74.005079,"blurb":"Janine Antoni's controversial 1992 work 'Gnaw' debuted here, featuring the artist transforming lard and chocolate into lipsticks through mastication."},{"name":"Lisson Gallery","lat":40.74855,"lon":-74.004474,"blurb":"Founded in 1967 by Nicholas Logsdail, this London gallery pioneered exhibiting minimalism and conceptual art before championing the New British Sculptors in the 1980s."},{"name":"Microscope Gallery","lat":40.752109,"lon":-74.002652,"blurb":"One artist's performance piece involved giving birth inside the gallery, bringing unexpected media attention to this contemporary art space."},{"name":"Kasmin Gallery","lat":40.750597,"lon":-74.002931,"blurb":"Founded by Paul Kasmin in 1989, this Manhattan gallery helped build Chelsea's art scene and now represents major estates including Jackson Pollock and Lee Krasner."},{"name":"Yancey Richardson Gallery","lat":40.747586,"lon":-74.005702,"blurb":"Founded in 1995, this fine art photography dealer represents legendary photographers like Sebastião Salgado and Robert Mapplethorpe alongside emerging artists."},{"name":"Dia Art Foundation","lat":40.747839,"lon":-74.006302,"blurb":"Spending $5 million yearly on fewer than twelve artists, it collapsed spectacularly in the 1980s when oil stocks tanked, forcing founders to sue over deaccessioned masterpieces."},{"name":"Hauser & Wirth","lat":40.747752,"lon":-74.006666,"blurb":"Founded in 1992 from an apartment, this Swiss mega-gallery now spans 15+ global locations and represents over 80 artists including the estates of Guston and Bourgeois."},{"name":"Matthew Marks Gallery","lat":40.747453,"lon":-74.00594,"blurb":"Four gallerists co-founded The Armory Show in 1994 to support younger downtown artists struggling through the 1980s recession."},{"name":"Tanya Bonakdar Gallery","lat":40.747036,"lon":-74.006291,"blurb":"Founded in 1994, this Chelsea gallery represents over thirty contemporary artists and operated a Hollywood outpost showcasing Olafur Eliasson and Tomás Saraceno."},{"name":"Hales Gallery","lat":40.746867,"lon":-74.007617,"blurb":"Paul Hedge famously split his time between running this gallery and cooking meals upstairs at the Revival Cafe when it opened in a Deptford basement in 1992."},{"name":"Paula Cooper Gallery","lat":40.747005,"lon":-74.006834,"blurb":"This pioneering SoHo gallery opened in 1968 with a benefit show featuring early works by minimalist giants like Carl Andre and Donald Judd."},{"name":"Galleria Ca' d'Oro","lat":40.746274,"lon":-74.005423,"blurb":"Four generations of Italian artists and writers built this gallery, beginning with a friend of Giorgio de Chirico and Filippo de Pisis."},{"name":"Jack Shainman Gallery","lat":40.746248,"lon":-74.006241,"blurb":"Nick Cave held the inaugural solo exhibition at the gallery's flagship Tribeca location in January 2025, following Richard Mosse's soft opening show."},{"name":"Kurimanzutto","lat":40.746271,"lon":-74.006944,"blurb":"A fruit stall in a Mexico City market hosted the gallery's first show in 1999, where artists sold conceptual works at produce-stand prices for one day."},{"name":"The 8th Floor","lat":40.738527,"lon":-73.993271,"blurb":"Founded by collectors Donald and Shelley Rubin in 2010, this Chelsea space launched a Revolutionary Cycles exhibition series focused on social justice art."},{"name":"Gabelli School of Business","lat":40.771283,"lon":-73.984563,"blurb":"Founded in 1920, this business school partnered with Peking University to launch BiMBA, once ranked by Forbes among China's most valuable programs, before closing in 2008."},{"name":"ProPublica","lat":40.725366,"lon":-74.004903,"blurb":"In 2010 it became the first online news organization to win a Pulitzer Prize, for investigating life-or-death decisions at a New Orleans hospital during Hurricane Katrina."},{"name":"Strip House","lat":40.734305,"lon":-73.993461,"blurb":"Every location features David Rockwell interiors hung with 1920s burlesque-star portraits from Studio Manasse, a wink at the steakhouse's cheeky name."},{"name":"Scarr's Pizza","lat":40.71574,"lon":-73.991569,"blurb":"The staff mills wheat daily in the basement for fermented crusts, making it New York's only pizza-by-the-slice shop grinding its own flour."},{"name":"Ford Foundation","lat":40.750006,"lon":-73.971079,"blurb":"During the Cold War it served as a CIA funding conduit, its chairman setting up a secret three-person committee just to handle the spy agency's requests."},{"name":"Instituto Cervantes","lat":40.755045,"lon":-73.970505,"blurb":"Named for Miguel de Cervantes, author of Don Quixote, this Spanish-language institute has operated in 52 countries since 1991."},{"name":"Calhoun School","lat":40.785589,"lon":-73.980593,"blurb":"Founded by Laura Jacobi in 1896, this progressive school counted Peggy Guggenheim among its early students and pioneered a distinctive open-floor design."},{"name":"Needle Threading A Button","lat":40.75417,"lon":-73.988102,"blurb":"A 1970s information kiosk got a giant needle-and-button makeover in 2023 after cellphones made physical street directories obsolete."},{"name":"New York City Ballet","lat":40.771907,"lon":-73.983761,"blurb":"Founded by George Balanchine in 1948, the company boasts the largest ballet repertoire in America, staging sixty-plus productions a year."},{"name":"Vivian Beaumont Theater","lat":40.773677,"lon":-73.984802,"blurb":"Designed by Eero Saarinen with a shape-shifting stage, it suffered such notorious acoustics and sightline problems that designers avoided it entirely."},{"name":"The Leona M. and Harry B. Helmsley Charitable Trust","lat":40.754319,"lon":-73.976066,"blurb":"The fortune of a hotelier known as the Queen of Mean now funds nearly $30 million to rebuild Israeli research facilities damaged by Iranian missiles."},{"name":"General Society of Mechanics and Tradesmen of the City of New York","lat":40.755226,"lon":-73.981402,"blurb":"Founded in 1785 by 22 craftsmen in a tavern, it offered free technical education and libraries when none existed in New York City."},{"name":"New Museum","lat":40.722346,"lon":-73.992841,"blurb":"Founded by independent curator Marcia Tucker in 1977, this Lower East Side institution championed emerging artists before they hit the mainstream."},{"name":"High School of Graphic Communication Arts","lat":40.763843,"lon":-73.990643,"blurb":"Built in 1959 with escalators, a first for NYC high schools, it features a Hans Hofmann mural and narrowly escaped closure in 2012 via arbitration."},{"name":"The Battery","lat":40.702814,"lon":-74.015775,"blurb":"Castle Clinton here processed millions of newcomers as the world's first immigration depot from 1855 to 1890, before Ellis Island ever opened."},{"name":"89th Street","lat":40.777855,"lon":-73.945675,"blurb":"Its stretch between Fifth and Madison is co-named for Fred Lebow, the founder of the New York City Marathon."},{"name":"Liberty Street","lat":40.711239,"lon":-74.014959,"blurb":"Before the Revolution it was Crown Street, renamed Liberty Street in 1793 as a symbolic break with colonial rule."},{"name":"Spruce Street","lat":40.71061,"lon":-74.004694,"blurb":"Christened George Street in 1725 to honor King George III, it was later nicknamed Little George Street before taking its current name."},{"name":"79th Street","lat":40.772859,"lon":-73.953894,"blurb":"Robert Moses built a grand multi-level interchange here in 1937 that buried the railroad, creating the graffiti-famous Freedom Tunnel."},{"name":"Avenue A","lat":40.723572,"lon":-73.985333,"blurb":"Renamed in sections for Jewish civil-liberties advocate Asser Levy, WWI Medal of Honor hero Alvin York, and, up in East Harlem, Pleasant Avenue."},{"name":"Cabrini Boulevard","lat":40.848508,"lon":-73.941221,"blurb":"Named for Frances Xavier Cabrini, the first American canonized a Roman Catholic saint, whose shrine sits right on the boulevard."},{"name":"Broadway","lat":40.720391,"lon":-74.001044,"blurb":"The 1945 V-J Day ticker-tape parade rained an astonishing 5,438 tons of paper on lower Broadway, dwarfing a typical 50-ton championship celebration."},{"name":"86th Street","lat":40.780711,"lon":-73.958453,"blurb":"Until after World War II this was German Broadway, the bustling heart of Manhattan's largely German Yorkville neighborhood."},{"name":"Delancey Street","lat":40.719549,"lon":-73.991749,"blurb":"Named for colonial governor James De Lancey, whose Loyalist farm was seized after the Revolution and later became a great Jewish and Irish shopping street."},{"name":"125th Street","lat":40.802265,"lon":-73.9324,"blurb":"Home to the legendary Apollo Theater and immortalized in the Velvet Underground's I'm Waiting for the Man as the heroin-buying corner of 125th and Lex."},{"name":"Sixth Avenue","lat":40.71812,"lon":-74.005466,"blurb":"Despite an official 1945 rename to Avenue of the Americas, New Yorkers stubbornly kept saying Sixth Avenue, by an eight-to-one margin in 1955."},{"name":"State Street","lat":40.702393,"lon":-74.013538,"blurb":"A lighthouse built as a Titanic memorial once crowned a seafarers' institute here before being salvaged and moved to South Street Seaport."},{"name":"Eleventh Avenue","lat":40.748657,"lon":-74.007123,"blurb":"Street-level freight trains killed so many pedestrians it was nicknamed Death Avenue, until an elevated railway ended the carnage in 1929."},{"name":"Broad Street","lat":40.706129,"lon":-74.011097,"blurb":"Originally the Dutch canal Heere Gracht, it was filled in 1676 after fruit vendors and Native canoes left it too cluttered for boats."},{"name":"Stanton Street","lat":40.722052,"lon":-73.990467,"blurb":"Named for George Stanton, an associate of landowner James De Lancey, it hosted Lady Gaga before her fame and appeared in 1927's The Jazz Singer."},{"name":"Broome Street","lat":40.719246,"lon":-73.993899,"blurb":"Jane Jacobs led the protests that killed Robert Moses's proposed ten-lane elevated highway, saving this historic cast-iron district."},{"name":"Greenwich Avenue","lat":40.733871,"lon":-73.999598,"blurb":"Formerly Greenwich Lane, it defies Manhattan's rigid grid by cutting diagonally through Greenwich Village from Sixth Avenue to Eighth."},{"name":"Mott Street","lat":40.719933,"lon":-73.996337,"blurb":"Its gang-controlled Cantonese Little Hong Kong stretch saw Chinatown's most violent era in the 1970s, with territorial gun battles in the streets."},{"name":"Marketfield Street","lat":40.704844,"lon":-74.012085,"blurb":"The name recalls the Dutch livestock market Marcktveldt, where Governor-General Willem Kieft opened the colony's first cattle market in 1641."},{"name":"Lenox Avenue","lat":40.820784,"lon":-73.936,"blurb":"Heart of Harlem's 1930s jazz renaissance, where Duke Ellington and other legends played some fifteen thriving clubs on a single block."},{"name":"Exchange Place","lat":40.706085,"lon":-74.010624,"blurb":"Created by 1657 as part of Dutch New Amsterdam's street plan, this financial hub was renamed in 1827 after the nearby Merchants Exchange Building."},{"name":"Dyckman Street","lat":40.865283,"lon":-73.927112,"blurb":"Named after Dutch farmer William Dyckman who owned 250+ acres, this 18th-century valley road predates Manhattan's grid and inspired multiple hip-hop references."},{"name":"57th Street","lat":40.762797,"lon":-73.973557,"blurb":"From a shantytown with 5,000 squatters in the 1860s to \"Billionaires' Row\" ultra-luxury skyscrapers, its transformation epitomizes Manhattan's relentless reinvention."},{"name":"St. Nicholas Avenue","lat":40.803848,"lon":-73.952727,"blurb":"An intoxicated pilot landed a stolen plane on this street in 1956 after betting he could fly from New Jersey to New York in fifteen minutes."},{"name":"Waverly Place","lat":40.733643,"lon":-74.001154,"blurb":"Sir Walter Scott's 1814 novel inspired its 1833 renaming from the prosaic \"Sixth Street,\" and it later housed artist Edward Hopper for fifty-four years."},{"name":"Washington Mews","lat":40.731441,"lon":-73.995665,"blurb":"Former stables transformed into artist studios housed renowned sculptors and painters like Gaston Lachaise and Paul Manship during the twentieth century."},{"name":"East Broadway","lat":40.713727,"lon":-73.998028,"blurb":"Claude Levi-Strauss watched Cantonese opera at the New Canton Theater in 1941 while serving as cultural adviser to the French Embassy."},{"name":"Wooster Street","lat":40.724215,"lon":-74.001094,"blurb":"Named after Revolutionary War general David Wooster, this SoHo street hosts the experimental Wooster Group theater company and attracts major film productions."},{"name":"133rd Street","lat":40.818622,"lon":-73.955599,"blurb":"During Prohibition, this Harlem block hosted at least 20 jazz clubs where seventeen-year-old Billie Holiday was discovered, earning its nickname \"Swing Street.\""},{"name":"59th Street","lat":40.763931,"lon":-73.972226,"blurb":"The three-block section bordering Central Park was renamed \"Central Park South\" in 1896, becoming an upscale corridor where the Plaza and other luxury hotels flourished."},{"name":"110th Street","lat":40.795851,"lon":-73.946905,"blurb":"George Gershwin composed \"Rhapsody in Blue\" at 501 West 110th Street between 1924 and 1929, making the address a landmark in American musical history."},{"name":"Dyer Avenue","lat":40.751542,"lon":-73.999374,"blurb":"Named after General George Rathbone Dyer, who chaired the Port Authority and died while the Lincoln Tunnel was under construction."},{"name":"Eighth Avenue","lat":40.755639,"lon":-73.990952,"blurb":"John Lennon was murdered outside The Dakota apartment building on Central Park West in 1980, making it one of New York's most tragic landmarks."},{"name":"Mulberry Street","lat":40.714209,"lon":-73.999576,"blurb":"Once the heart of a notorious slum called Five Points, this street transformed from \"Slaughter-house Street\" into Little Italy's vibrant cultural heart."},{"name":"Greenwich Street","lat":40.704778,"lon":-74.014967,"blurb":"Edgar Allan Poe briefly lived here but hated the neighborhood, complaining of \"dirty streets and the noise made by clam-and-catfish vendors.\""},{"name":"Hudson Street","lat":40.740274,"lon":-74.005269,"blurb":"Dylan Thomas collapsed here before dying of alcohol poisoning, and the White Horse Tavern remains a legendary bar where literary history happened."},{"name":"Thompson Street","lat":40.729056,"lon":-73.999138,"blurb":"Named for Revolutionary War Brigadier General William Thompson, this Greenwich Village-SoHo street hosted mobsters, a subway vigilante, and Frank Zappa."},{"name":"Rivington Street","lat":40.71857,"lon":-73.983375,"blurb":"Named after a spymaster who posed as a Loyalist newspaper editor while secretly feeding George Washington intelligence during the American Revolution."},{"name":"116th Street","lat":40.798945,"lon":-73.942363,"blurb":"The curved street design originated from an 1897 plan to create a grand veterans' parade terminus near Grant's Tomb, though the park was never built."},{"name":"Cherry Street","lat":40.711482,"lon":-73.987229,"blurb":"George Washington lived here in 1789 as the first U.S. President, in a mansion at 3 Cherry Street that had previously housed Continental Congress presidents."},{"name":"Bowery","lat":40.725839,"lon":-73.992058,"blurb":"From a decaying 19th-century slum to punk rock's American cradle, CBGB launched Television, the Ramones, and Blondie in the 1970s."},{"name":"Allen Street","lat":40.714065,"lon":-73.992778,"blurb":"Namesake William Henry Allen captured HMS Macedonian in the War of 1812 before dying in action at just twenty-eight."},{"name":"Cortlandt Street","lat":40.710674,"lon":-74.011872,"blurb":"Radio Row, an early electronics district born from one entrepreneur's 1921 radio shop, thrived here before the World Trade Center's construction demolished it in 1966."},{"name":"145th Street Bridge","lat":40.819615,"lon":-73.934113,"blurb":"This elegant swing bridge was designed by Alfred Pancoast Boller to accommodate growing water traffic through New York's bustling Harlem River."},{"name":"Centre Market Place","lat":40.720153,"lon":-73.997715,"blurb":"During Prohibition, gentlemen entered the Police Building's front door, gave to the \"widows and orphans fund,\" then reached Onieal's speakeasy via a cellar corridor."},{"name":"Astor Place","lat":40.729615,"lon":-73.989999,"blurb":"A violent 1849 riot erupted here over rival productions of Macbeth, leaving at least 18 dead and hundreds injured amid anti-British tensions."},{"name":"Seventh Avenue","lat":40.750676,"lon":-73.990855,"blurb":"The avenue's southern terminus was extended in 1914 to connect midtown with TriBeCa, requiring demolition of historic structures including an 1840 Methodist church."},{"name":"Sullivan Street","lat":40.729194,"lon":-74.000083,"blurb":"Revolutionary War Major General John Sullivan was honored with this street's 1799 naming, replacing its former identity as Locust Street."},{"name":"74th Street","lat":40.770973,"lon":-73.959431,"blurb":"A sawmill here in 1664 became known as \"The Kissing Bridge\" by the 1800s, famous for a secluded landscape that attracted romantic couples."},{"name":"Macombs Dam Bridge","lat":40.828045,"lon":-73.93472,"blurb":"Edward Hopper immortalized this 1895 swing bridge in a haunting 1935 painting, cementing its status as an artistic muse beyond mere infrastructure."},{"name":"50th Street","lat":40.758201,"lon":-73.9764,"blurb":"The Circle in the Square Theater, opening in 1971, was the first Broadway theater to open in 50 years, revitalizing live theater on West 50th Street."},{"name":"Fulton Street","lat":40.706747,"lon":-74.003534,"blurb":"In 1816 the street was unified and named for Robert Fulton, the steamship inventor, creating a continuous thoroughfare from Manhattan to Brooklyn via ferry."},{"name":"51st Street","lat":40.753874,"lon":-73.964199,"blurb":"Nathan Hale was possibly hanged at 351 East 51st Street after the Battle of Long Island, now an apartment complex marking a pivotal Revolutionary War site."},{"name":"Stone Street","lat":40.704048,"lon":-74.012396,"blurb":"In 1658, residents collectively funded paving it with cobblestones, making it New Amsterdam's first cobbled street."},{"name":"Ludlow Street","lat":40.722474,"lon":-73.987126,"blurb":"The Velvet Underground recorded their earliest version of \"All Tomorrow's Parties\" at 56 Ludlow in 1965, alongside Warhol superstars and avant-garde artists."},{"name":"14th Street","lat":40.729501,"lon":-73.977983,"blurb":"From Manhattan's upscale shopping mecca in the 1850s to a discount retail center by the 1970s and a car-free busway experiment, it never stopped reinventing itself."},{"name":"Canal Street","lat":40.714276,"lon":-73.989772,"blurb":"This thoroughfare was literally built atop a covered sewer that became so foul-smelling the city had to seal it shut in 1819."},{"name":"Bank Street","lat":40.736889,"lon":-74.003388,"blurb":"John Lennon and Yoko Ono lived in apartment 105 from 1971 to 1973, where they used neighbors' phones to evade FBI wiretapping."},{"name":"Riverside Drive","lat":40.816612,"lon":-73.961527,"blurb":"Frederick Law Olmsted deliberately curved this avenue to avoid sharp corners, rejecting the grid's rigid geometry for graceful serpentine elegance."},{"name":"Beaver Street","lat":40.705392,"lon":-74.008417,"blurb":"On September 8, 1664, Dutch forces marched down this street to surrender New Netherland to the English, ending Dutch colonial rule."},{"name":"Spring Street","lat":40.726128,"lon":-74.010392,"blurb":"A freshwater spring once ran through the area and now flows underground, occasionally flooding basements—the feature that gave the street its 1806 name."},{"name":"Tenth Avenue","lat":40.741096,"lon":-74.008832,"blurb":"\"Death Avenue\" earned its grim nickname from countless railroad accidents before Robert Moses' 1929 West Side Improvement eliminated grade-level crossings."},{"name":"Second Avenue","lat":40.723918,"lon":-73.990995,"blurb":"The Yiddish Theater District flourished here in the early 20th century, earning Second Avenue the nickname \"Yiddish Broadway\" or the \"Jewish Rialto.\""},{"name":"Claremont Avenue","lat":40.808691,"lon":-73.964699,"blurb":"F. Scott Fitzgerald's protagonists in The Beautiful and Damned move into an apartment here, making this short avenue a landmark of American literary fiction."},{"name":"Stuyvesant Street","lat":40.729888,"lon":-73.989305,"blurb":"One of Manhattan's rare true east-west streets, it runs diagonally against the grid and was featured in the 2005 film The Interpreter with Nicole Kidman."},{"name":"Ninth Avenue","lat":40.870791,"lon":-73.912216,"blurb":"Its 1890 renaming to Columbus Avenue north of 59th Street was an early real-estate branding move to distance the Upper West Side from gritty downtown."},{"name":"Taras Shevchenko Place","lat":40.728412,"lon":-73.990016,"blurb":"Mayor Ed Koch signed legislation renaming this East Village street after Ukrainian poet Taras Shevchenko in 1978, honoring resistance to Russian suppression."},{"name":"Vanderbilt Avenue","lat":40.752813,"lon":-73.978158,"blurb":"Named for railroad magnate Cornelius Vanderbilt, who built Grand Central Terminal, it was carved out in the late 1860s as a result of that station."},{"name":"Centre Street","lat":40.714238,"lon":-74.002751,"blurb":"The Collect Pond—the city's primary drinking water source covering 48 acres—was drained and the street grid built over it in the early 1800s."},{"name":"Shubert Alley","lat":40.758149,"lon":-73.986959,"blurb":"Actors once lined up along its western wall to audition for Broadway parts, and a theater's desirability was judged by its closeness to this alley."},{"name":"South Street","lat":40.709379,"lon":-73.994978,"blurb":"Once the epicenter of American maritime commerce—921 vessels waited to dock in a single day in 1836—before declining into Depression-era poverty."},{"name":"Weehawken Street","lat":40.732832,"lon":-74.009834,"blurb":"A colonial-era ferry landing became a produce market, then a hub for saloons and gay bars catering to \"rough trade\" by the late twentieth century."},{"name":"Pearl Street","lat":40.711129,"lon":-74.000651,"blurb":"Thomas Edison's first public power plant in the U.S. began generating electricity here on September 4, 1882."},{"name":"Bogardus Place","lat":40.859144,"lon":-73.92905,"blurb":"The Bogardus family arrived in 1633 and produced James Bogardus, who pioneered cast-iron building construction during the 1840s."},{"name":"Lafayette Street","lat":40.721947,"lon":-73.997456,"blurb":"John Jacob Astor bought a market garden in 1804, built Vauxhall Gardens there, then cut a profitable street through it named for Lafayette's 1824 return."},{"name":"Coenties Slip","lat":40.703517,"lon":-74.010424,"blurb":"This waterfront street housed groundbreaking mid-century artists like Robert Indiana and Ellsworth Kelly from the late 1950s to early 1960s."},{"name":"Vandam Street","lat":40.726678,"lon":-74.008195,"blurb":"Federal-style townhouses at numbers 23, 25, 27, and 29 reflect the block's Dutch New Amsterdam heritage, decades before the English renamed the city."},{"name":"Hester Street","lat":40.717584,"lon":-73.996271,"blurb":"Named after Hester Leisler, daughter of an executed insurrectionist, the street became the heart of Ashkenazi Jewish immigrant culture before Chinatown absorbed it."},{"name":"North Moore Street","lat":40.719832,"lon":-74.007273,"blurb":"The Ghostbusters firehouse exterior was filmed at Hook & Ladder No. 8 here, and Yoko Ono and John Lennon hosted experimental art events on this street in 1970."},{"name":"Madison Avenue","lat":40.741851,"lon":-73.987275,"blurb":"The street's name became metonymous with American advertising by the 1920s, making \"Madison Avenue\" synonymous with the entire industry itself."},{"name":"93rd Street","lat":40.780754,"lon":-73.944752,"blurb":"The Marx Brothers lived at 179 East 93rd Street, making this Upper East Side block a legendary comedy household in the early twentieth century."},{"name":"Jones Street","lat":40.732032,"lon":-74.002476,"blurb":"Bob Dylan and Suze Rotolo walked down this Greenwich Village street in the iconic winter cover photo for his 1963 album The Freewheelin' Bob Dylan."},{"name":"Lexington Avenue","lat":40.739181,"lon":-73.984999,"blurb":"Marilyn Monroe's skirt-billowing subway-grate scene from The Seven Year Itch was filmed here in 1954 before studio retakes replaced it in the final cut."},{"name":"66th Street","lat":40.764965,"lon":-73.961078,"blurb":"Lincoln Center transformed the area by demolishing the working-class San Juan Hill community during Robert Moses' 1960s urban renewal program."},{"name":"Pleasant Avenue","lat":40.794819,"lon":-73.933362,"blurb":"Once the heart of Italian Harlem, this street was notorious as headquarters for Genovese crime boss Anthony Salerno before his 1986 racketeering conviction."},{"name":"55th Street","lat":40.755982,"lon":-73.961416,"blurb":"The song \"Mony Mony\" was inspired by the Mutual of New York (MONY) Building sign at 55th and Seventh Avenue, completed in 1950."},{"name":"Park Row","lat":40.711808,"lon":-74.006507,"blurb":"In the late 1800s this street hosted \"America's preeminent press center,\" with newspapers printing over 250,000 copies daily from their headquarters here."},{"name":"Houston Street","lat":40.719327,"lon":-73.977,"blurb":"Named for William Houstoun, a Georgia delegate to the Continental Congress who married into the landowning family—not after Sam Houston, then a Tennessee teenager."},{"name":"23rd Street","lat":40.741457,"lon":-73.989367,"blurb":"The term \"23 skidoo\" allegedly originated from wind gusts off the Flatiron Building's triangular shape supposedly lifting women's skirts on this street."},{"name":"Mercer Street","lat":40.725763,"lon":-73.997662,"blurb":"Named in 1799 for a Scottish-American brigadier general who died at Princeton, partly for his strategic advice to George Washington."},{"name":"Third Avenue","lat":40.734548,"lon":-73.986276,"blurb":"The elevated line ran for 77 years before demolition, and a failed 1950s movement tried to rename the Manhattan stretch \"the Bouwerie.\""},{"name":"MacDougal Street","lat":40.732583,"lon":-73.998309,"blurb":"Its legendary coffeehouses drew Beat poets like Kerouac and Ginsberg, jazz musicians, and nearly every notable American comedian to gather here."},{"name":"54th Street","lat":40.760709,"lon":-73.974574,"blurb":"The corner of Broadway and 54th is signed \"Big Apple Corner,\" honoring writer John J. Fitz Gerald, who popularized New York's iconic nickname."},{"name":"Forsyth Street","lat":40.713412,"lon":-73.993795,"blurb":"Named in 1817 for Lt. Colonel Benjamin Forsyth, this Lower East Side street runs in the shadow of the Manhattan Bridge through Chinatown."},{"name":"Avenue B","lat":40.721774,"lon":-73.983621,"blurb":"In 1922, Fanny Brice recorded \"The Sheik of Avenue B,\" a parody that briefly made this gritty East Village street famous in American pop culture."},{"name":"Gay Street","lat":40.733611,"lon":-74.000518,"blurb":"Named for a colonial family, not sexuality, it became a heart of Manhattan's LGBT community and hosted Cyndi Lauper's \"Girls Just Want to Have Fun\" video."},{"name":"Whitehall Street","lat":40.703,"lon":-74.012986,"blurb":"Nearly three million Americans were inducted at the Army Building here before bombings by war resisters, inspiring Arlo Guthrie's \"Alice's Restaurant.\""},{"name":"47th Street","lat":40.751937,"lon":-73.967564,"blurb":"The Diamond District's bazaar-like marketplace, where deals are sealed with a Yiddish blessing and handshake, handles roughly $400 million in daily trades."},{"name":"Charles Street","lat":40.73476,"lon":-74.004064,"blurb":"A gay bar raid here in 1970 led to a man's near-fatal jump from a police precinct, sparking a 500-person protest march."},{"name":"Worth Street","lat":40.717377,"lon":-74.006894,"blurb":"Jules Naudet filmed American Airlines Flight 11 striking the World Trade Center's North Tower from the corner of Worth and Broadway on September 11, 2001."},{"name":"52nd Street","lat":40.758799,"lon":-73.973919,"blurb":"From the 1930s to 1950s, its jazz clubs hosted virtually every great musician of the era, earning it the title \"Swing Street.\""},{"name":"85th Street","lat":40.775223,"lon":-73.947571,"blurb":"Park Lane Tower's distinctive rounded corners made it the iconic opening shot of the 1970s sitcom \"The Jeffersons.\""},{"name":"Church Street and Trinity Place","lat":40.71212,"lon":-74.010037,"blurb":"An elevated railway opened here in 1878, ran sixty years, then was razed, creating a rare north-south thoroughfare from Lower Manhattan to Central Park."},{"name":"Baxter Street","lat":40.715752,"lon":-74.000462,"blurb":"Tap dance was invented by competing black and Irish dancers at a tavern at 67 Orange Street during the Five Points era."},{"name":"Chrystie Street","lat":40.715863,"lon":-73.994878,"blurb":"On June 28, 1776, Thomas Hickey was hanged here before 20,000 spectators for plotting to kill George Washington."},{"name":"Doyers Street","lat":40.714448,"lon":-73.997857,"blurb":"The \"Bloody Angle\" bend here became America's deadliest intersection, with more violent deaths than any other U.S. location during tong gang warfare."},{"name":"Maiden Lane","lat":40.705604,"lon":-74.005247,"blurb":"Thomas Jefferson's 1790 dinner here with Hamilton and Madison produced the Compromise of 1790, immortalized in Hamilton's \"The Room Where It Happens.\""},{"name":"Avenue C","lat":40.724854,"lon":-73.978289,"blurb":"It got a second official name, Loisaida Avenue, in 1987 to honor the neighborhood's Puerto Rican heritage, from a Spanglish term coined by poet Bimbo Rivas."},{"name":"Audubon Avenue","lat":40.852715,"lon":-73.929428,"blurb":"Named for naturalist John James Audubon, who owned a farm in the Washington Heights area during the nineteenth century."},{"name":"Avenue D","lat":40.719933,"lon":-73.978757,"blurb":"The Commissioners' Plan of 1811 lettered four avenues east of First Avenue A through D, making this the easternmost named avenue in the East Village."},{"name":"University Place","lat":40.732453,"lon":-73.994063,"blurb":"This short Greenwich Village thoroughfare was renamed in 1838, a year after NYU's first building opened on Washington Square."},{"name":"Orchard Street","lat":40.716286,"lon":-73.991178,"blurb":"The orchard belonged to Loyalist James DeLancey, who fled to England in 1775, leaving behind an iconic Lower East Side immigrant gateway of tenements."},{"name":"Nassau Street","lat":40.707301,"lon":-74.010593,"blurb":"Once called \"Kip Street,\" it was renamed for the Dutch House of Orange-Nassau and became the center of New York's stamp-dealing trade during the Depression."},{"name":"Park Avenue","lat":40.74672,"lon":-73.981514,"blurb":"A fatal 1902 train collision in the tunnel here prompted New York to ban steam locomotives from Manhattan, leading to electrified Grand Central Terminal."},{"name":"Fifth Avenue","lat":40.743054,"lon":-73.988494,"blurb":"Wealthy New Yorkers demolished mansions starting in 1916 to build luxury apartments, transforming \"Millionaire's Row\" into a vertical city of the ultra-rich."},{"name":"42nd Street","lat":40.752493,"lon":-73.978551,"blurb":"From the late 1950s through the 1980s it became \"the cultural center of American grindhouse theaters,\" spawning a distinctive counterculture before its revitalization."},{"name":"4th Street","lat":40.726967,"lon":-73.991266,"blurb":"West 4th Street confusingly runs north-south while intersecting West 10th, 11th, 12th, and 13th Streets, a quirk of Greenwich Village's older grid."},{"name":"Dey Street","lat":40.710722,"lon":-74.010132,"blurb":"The first transcontinental telephone call was made from 15 Dey Street, a landmark telecommunications milestone in Lower Manhattan's financial district."},{"name":"Varick Street","lat":40.729383,"lon":-74.005202,"blurb":"Heinrich Steinweg founded the first American Steinway & Sons piano factory here in 1853, launching an iconic instrument brand from a humble loft."},{"name":"Vesey Street","lat":40.711727,"lon":-74.009388,"blurb":"This east-west street was the birthplace of A&P, the supermarket chain that revolutionized American grocery shopping."},{"name":"Jacqueline Kennedy Onassis Reservoir","lat":40.78548,"lon":-73.962078,"blurb":"Jacqueline Kennedy Onassis jogged here, and the reservoir was renamed in her honor in 1994 for her role saving Grand Central Terminal."},{"name":"The Pond and Hallett Nature Sanctuary","lat":40.766265,"lon":-73.974642,"blurb":"A colorful mandarin duck dubbed \"Mandarin Patinkin\" became an international celebrity when it unexpectedly appeared at the pond in late 2018."},{"name":"Conservatory Water","lat":40.77422,"lon":-73.967125,"blurb":"E.B. White's children's novel Stuart Little immortalized this pond as the setting where a mouse-like boy sailed his toy ship."},{"name":"Roosevelt Island Tramway","lat":40.759273,"lon":-73.959181,"blurb":"A dramatic 2006 breakdown trapped 69 passengers aboard for eleven hours, requiring a helicopter rescue over the East River."},{"name":"Madison Square and Madison Square Park","lat":40.742187,"lon":-73.987872,"blurb":"Architect Stanford White was shot dead in Madison Square Garden's rooftop restaurant by a millionaire over an affair with an actress."},{"name":"Washington Square Park","lat":40.730888,"lon":-73.997593,"blurb":"More than 20,000 bodies from yellow fever epidemics rest beneath the park, buried when it served as a potter's field from 1797 to 1825."},{"name":"Chelsea Park","lat":40.749919,"lon":-74.00067,"blurb":"A French sculptor's WWI doughboy statue here, first rejected for lacking dynamism, was redesigned to mirror his own aggressive propaganda-film poster."},{"name":"Liberty Park","lat":40.71023,"lon":-74.013584,"blurb":"The iconic Sphere sculpture, damaged but recovered intact from the 9/11 rubble, now overlooks the World Trade Center site from this elevated park."},{"name":"Washington Market Park","lat":40.717029,"lon":-74.011643,"blurb":"Community activists successfully transformed a planned parking lot into a beloved neighborhood park in 1983 TriBeCa."},{"name":"West Street pedestrian bridges","lat":40.717457,"lon":-74.01296,"blurb":"The September 11 attacks destroyed one bridge and heavily damaged another, forcing temporary replacements that became semi-permanent fixtures of Lower Manhattan."},{"name":"DeWitt Clinton Park","lat":40.768201,"lon":-73.994268,"blurb":"From 1902 to 1932, children farmed individual vegetable plots here in what became New York City's first-ever community garden."},{"name":"Jackson Square Park","lat":40.739005,"lon":-74.002882,"blurb":"Two Native American footpaths aligned with the spring and fall equinox became this triangular park's foundation, shaped by celestial geography before Manhattan's grid."},{"name":"Christopher Street","lat":40.734112,"lon":-73.999427,"blurb":"The Stonewall Inn's 1969 riots sparked the modern gay rights movement, making this street an international symbol of LGBTQ+ liberation and pride."},{"name":"Zuccotti Park","lat":40.709231,"lon":-74.011254,"blurb":"Protesters against the Tea Act assembled here in 1773, and Occupy Wall Street launched its global movement from this plaza in 2011."},{"name":"Tompkins Square Park","lat":40.726472,"lon":-73.981687,"blurb":"A 1988 police riot clearing homeless encampments injured 38 people and is memorialized through annual punk rock festivals."},{"name":"Stuyvesant Cove Park","lat":40.733142,"lon":-73.973986,"blurb":"Built atop a former concrete plant's brownfield, this 1.9-acre waterfront park emerged from community opposition to a failed mixed-use development."},{"name":"Queensboro Bridge","lat":40.759709,"lon":-73.961287,"blurb":"After a similar span collapsed, one inspector studying this 1909 cantilever bridge claimed the upper deck was held on \"by its own weight and memory.\""},{"name":"Wards Island Bridge","lat":40.786639,"lon":-73.939222,"blurb":"Designed by legendary engineer Othmar Ammann, this vertical lift span opened in 1951 as a pedestrian-only crossing after decades of planning by Robert Moses."},{"name":"Willis Avenue Bridge","lat":40.802094,"lon":-73.930948,"blurb":"The original 1901 bridge was famously photographed with Jon Voight and Dustin Hoffman uarters was worth five times more than the entire company when JPMorgan bought the bankrupt firm for $10 a share in 2008."},{"name":"Daily News Building","lat":40.749745,"lon":-73.9732,"blurb":"The building's rotating globe lobby inspired Superman's Daily Planet headquarters and actually stood in for it in the 1978 film Superman."},{"name":"Park Avenue Tunnel (roadway)","lat":40.746679,"lon":-73.981622,"blurb":"Originally an open rock cut for horse-drawn trains in 1834, this tunnel hosted the climactic chase scene of the 1998 Godzilla film."},{"name":"Park Avenue Viaduct","lat":40.753269,"lon":-73.976121,"blurb":"Its Beaux-Arts arches, modeled on Paris's Pont Alexandre III, wrap elegantly around Grand Central Terminal to carry traffic over the rail tracks."},{"name":"155th Street","lat":40.832938,"lon":-73.946226,"blurb":"The 1893 viaduct carries traffic across a steep drop at Coogan's Bluff, where the Polo Grounds once hosted the Giants, Yankees, and Mets below."},{"name":"West Broadway","lat":40.720499,"lon":-74.005356,"blurb":"Once nicknamed \"Rotten Row\" for its 1830s red-light reputation, this street was systematically rebranded through renaming campaigns to improve its tarnished image."},{"name":"Henry Street","lat":40.714089,"lon":-73.983186,"blurb":"Nurses Lillian Wald and Mary Maud Brewster founded the Henry Street Settlement in 1893 to address immigrant tenement squalor on this Lower East Side street."},{"name":"Chambers Street","lat":40.717277,"lon":-74.013064,"blurb":"Named after attorney John Chambers, a prominent Trinity Church vestryman whose nephew was Founding Father John Jay."},{"name":"Albany Street","lat":40.709835,"lon":-74.015088,"blurb":"Named after a ferry dock to Albany built in 1797, making it one of Manhattan's oldest named thoroughfares with clear commercial origins."},{"name":"Essex Street","lat":40.720087,"lon":-73.987413,"blurb":"James Delancey named this Lower East Side street after the English county of Essex just before the American Revolution, intending it as part of a genteel square."},{"name":"Grand Street","lat":40.716328,"lon":-73.987954,"blurb":"Once a Revolutionary War battleground with two fortified hills, this thoroughfare later hosted Stanford White's 1893 Bowery Savings Bank."},{"name":"Fort Washington Avenue","lat":40.848715,"lon":-73.939171,"blurb":"Famous residents included Dr. Henry Kissinger and Dr. Ruth Westheimer, while the avenue passes Manhattan's highest natural point at Bennett Park."},{"name":"72nd Street","lat":40.770882,"lon":-73.963296,"blurb":"John Lennon and Yoko Ono both lived at 1 West 72nd Street in The Dakota, the iconic apartment building where Lennon was killed in 1980."},{"name":"East Side Access","lat":40.760328,"lon":-73.971277,"blurb":"Completed over a decade late at triple the budget, this rail project finally connected Long Island commuters directly to Grand Central instead of Penn Station."},{"name":"Fort Clinton (Central Park)","lat":40.795285,"lon":-73.95215,"blurb":"A War of 1812 fortification named after NYC Mayor DeWitt Clinton once protected Manhattan's northern passages alongside two companion forts at McGowan's Pass."},{"name":"Lincoln Tunnel","lat":40.759802,"lon":-74.003527,"blurb":"In 1971, circus elephants walked through the tunnel when a labor strike halted rail service to Madison Square Garden, creating an unforgettable spectacle."},{"name":"New York City Marble Cemetery","lat":40.72461,"lon":-73.988896,"blurb":"The city's second non-sectarian cemetery was built in 1831 with 258 underground marble vaults after yellow fever scared New Yorkers off shallow earthen burials."},{"name":"New York Marble Cemetery","lat":40.725632,"lon":-73.99098,"blurb":"NYC's first non-sectarian burial ground pioneered underground marble vaults to protect wealthy families from yellow fever outbreaks in 1830."},{"name":"Columbus Park","lat":40.715093,"lon":-74.000053,"blurb":"Jacob Riis helped transform the notorious Five Points slum into this park by advocating its demolition, sparking neighborhood renewal and reducing youth crime."},{"name":"Helmsley Building","lat":40.754394,"lon":-73.976103,"blurb":"Mafia boss Salvatore Maranzano was assassinated here in 1931 by hitmen sent by Lucky Luciano and Vito Genovese, ambitious underlings he'd hired to eliminate."},{"name":"225 Liberty Street","lat":40.712273,"lon":-74.015438,"blurb":"Severely damaged by debris from the collapsing Twin Towers on September 11, 2001, the building remained closed for repairs until May 2002."},{"name":"200 Liberty Street","lat":40.710633,"lon":-74.015611,"blurb":"Damaged in the September 11 attacks and closed for months, this former World Financial Center tower reopened in 2002 after extensive restoration."},{"name":"200 West Street","lat":40.714705,"lon":-74.01446,"blurb":"Goldman Sachs secured $1.65 billion in Liberty Bonds and massive tax breaks to build this gleaming headquarters, putting taxpayers on the hook."},{"name":"Woolworth Building","lat":40.712454,"lon":-74.008334,"blurb":"President Woodrow Wilson lit up the building's 1913 opening celebration by pushing a button in Washington, D.C., turning on all the lights at once."},{"name":"26 Federal Plaza","lat":40.715427,"lon":-74.004175,"blurb":"Richard Serra's steel sculpture \"Tilted Arc\" sparked such fierce controversy that its 1989 removal led directly to the Visual Artists Rights Act."},{"name":"Waldorf Astoria New York","lat":40.756502,"lon":-73.973361,"blurb":"Herbert Hoover lived in the Presidential Suite for 20 years after his wife died, making the hotel his long-term post-presidency residence."},{"name":"4 Times Square","lat":40.756011,"lon":-73.985719,"blurb":"A construction elevator collapsed onto the nearby Woodstock Hotel on July 21, 1998, killing an elderly woman and injuring twelve others."},{"name":"Bank of America Tower","lat":40.755558,"lon":-73.984715,"blurb":"Despite winning LEED Platinum certification as an eco-friendly building, it exceeded citywide emissions limits by the early 2020s, facing $2.4 million annual fines."},{"name":"Abingdon Square Park","lat":40.737268,"lon":-74.005387,"blurb":"Named after Charlotte Warren, who married the Earl of Abingdon and kept the name despite post-Revolutionary War place-name purges due to her patriotic sympathies."},{"name":"Solow Building","lat":40.763835,"lon":-73.974953,"blurb":"Its curved facade tapering from ground to 18th floor was so controversial that architects first rejected the design, which became the W.R. Grace Building instead."},{"name":"General Motors Building","lat":40.763539,"lon":-73.972251,"blurb":"A window-washing union strike left its facade so dirty that a 1969 film crew paid the union to throw eggs at it to restore authenticity."},{"name":"Lincoln Center","lat":40.772613,"lon":-73.984223,"blurb":"Over 7,000 residents and 800 businesses from the San Juan Hill neighborhood were displaced to build this gleaming performing arts complex during urban renewal."},{"name":"1095 Avenue of the Americas","lat":40.754662,"lon":-73.984801,"blurb":"Its facade was intentionally designed to resemble telephone relays, celebrating the technology it originally housed for the New York Telephone Company."},{"name":"Sherman Square","lat":40.777365,"lon":-73.98235,"blurb":"\"Needle Park\" in the 1960s-70s inspired James Mills' 1966 book and a 1971 film starring Al Pacino in his second role."},{"name":"The Langham","lat":40.750111,"lon":-73.983813,"blurb":"Opened as The Setai Fifth Avenue in 2010, rebranded twice after Hong Kong's Great Eagle Holdings purchased it for $229 million in 2012."},{"name":"Greenacre Park","lat":40.756273,"lon":-73.969285,"blurb":"A philanthropist gifted this tiny Manhattan pocket park in 1971, and it later became the subject of an influential 1980 study about public spaces."},{"name":"British Empire Building","lat":40.758581,"lon":-73.9778,"blurb":"Nine gold-leaf figures above its entrance represent the British Empire's trade commodities, crowned by a radiant sun on which the sun never sets."},{"name":"La Maison Francaise (Rockefeller Center)","lat":40.758271,"lon":-73.978026,"blurb":"Alfred Janniot's gilded bronze sculpture was unveiled in 1934 and hailed by the New York Times as \"a new Statue of Liberty on Fifth Avenue.\""},{"name":"Trump World Tower","lat":40.752551,"lon":-73.967705,"blurb":"Trump calculated the floor numbers by declaring it 900 feet high and dividing by ten, so the top floor reads 90 despite only 72 actual floors."},{"name":"Bennett Park","lat":40.85284,"lon":-73.938113,"blurb":"The highest natural point in Manhattan sits in this small Hudson Heights park, where the Continental Army delayed British troops during the Revolution in 1776."},{"name":"Isham Park","lat":40.869652,"lon":-73.919076,"blurb":"William Bradley Isham reportedly harvested the last wheat grown on Manhattan Island, some of which he sent to the 1893 Chicago World's Fair."},{"name":"St. John's Park","lat":40.721247,"lon":-74.007363,"blurb":"Once a fashionable elite enclave, this square fell from grace into an inaccessible traffic rotary when the railroad arrived in 1851."},{"name":"Duarte Square","lat":40.722543,"lon":-74.005495,"blurb":"A thirteen-foot bronze statue of Dominican founding father Juan Pablo Duarte, dedicated in 1978, anchors this triangular Hudson Square park."},{"name":"Carl Schurz Park","lat":40.775213,"lon":-73.943757,"blurb":"The climactic fight scene in Spike Lee's 2002 film 25th Hour, starring Edward Norton and Philip Seymour Hoffman, was filmed here."},{"name":"Thomas Jefferson Park","lat":40.793254,"lon":-73.935395,"blurb":"Robert Moses' parks department allegedly kept the pool cold to discourage Black swimmers, though no evidence supports the heating claim."},{"name":"Fashion Institute of Technology","lat":40.747209,"lon":-73.994979,"blurb":"In 1967, its faculty and staff won the first higher education union contract in New York State, a groundbreaking labor victory that predated similar wins nationwide."},{"name":"Port Authority Bus Terminal","lat":40.756881,"lon":-73.991708,"blurb":"George Segal's 1982 sculpture \"The Commuters\" features weary bus passengers and a salvaged clock, transforming transit anxiety into enduring public art."},{"name":"East River Park","lat":40.71863,"lon":-73.975541,"blurb":"After Hurricane Sandy flooded it in 2012, the city demolished the park entirely to raise its elevation eight to ten feet, sparking fierce community resistance."},{"name":"Trinity Cemetery","lat":40.832194,"lon":-73.946322,"blurb":"This uptown graveyard holds Major League Baseball players, a U.S. congressman, and an Army colonel who inspired characters in Milton Caniff's comic strips."},{"name":"City College of New York","lat":40.818152,"lon":-73.950039,"blurb":"Its 1950 basketball team is the only one ever to win both the NCAA and NIT championships in one year, before a point-shaving scandal tainted the feat."},{"name":"St. Nicholas Park","lat":40.817217,"lon":-73.948959,"blurb":"Alexander Hamilton's historic country home was relocated 500 feet into the park in 2008, restoring it to a piece of his original 32-acre estate."},{"name":"Columbus Circle","lat":40.768077,"lon":-73.981894,"blurb":"William Phelps Eno created the world's first true one-way traffic circle here in 1905, pioneering modern traffic control."},{"name":"Museum of Arts and Design","lat":40.767382,"lon":-73.982005,"blurb":"Its 2008 redesign sparked fierce architectural controversy, with figures like Tom Wolfe and Chuck Close debating whether the original building should be preserved."},{"name":"New York Life Building","lat":40.742747,"lon":-73.985582,"blurb":"Its gilded pyramidal roof of 25,000 gold-leaf clay tiles was painstakingly restored for the company's 150th anniversary in 1994-95 at a cost of $4.1 million."},{"name":"Metropolitan Life Insurance Company Tower","lat":40.741267,"lon":-73.987359,"blurb":"The world's tallest building from 1909 to 1913, its 26.5-foot clock face and bells played \"I Know That My Redeemer Liveth\" every fifteen minutes."},{"name":"Federal Hall","lat":40.707327,"lon":-74.010248,"blurb":"George Washington took the presidential oath on the balcony here in 1789, and a statue now marks exactly where he stood."},{"name":"Peretz Square","lat":40.722934,"lon":-73.987853,"blurb":"Named for Polish Yiddish author Isaac Leib Peretz, this square marks where the Lower East Side's irregular grid collides with the 1811 Commissioners' Plan."},{"name":"Bowling Green","lat":40.705035,"lon":-74.013663,"blurb":"Sons of Liberty toppled a 4,000-pound statue of King George III here on July 9, 1776, allegedly melting it into 42,088 patriot bullets."},{"name":"200 Madison Avenue","lat":40.748937,"lon":-73.982677,"blurb":"In the 1980s, Philippine dictator Ferdinand Marcos secretly bought the building as a gift for wife Imelda, code-named \"Midtown Cement\" in encrypted cables."},{"name":"Damrosch Park","lat":40.772321,"lon":-73.985005,"blurb":"In 2013, local residents sued to reclaim the park from events like Fashion Week, leading Lincoln Center to evict the invitation-only spectacle the next year."},{"name":"Saks Fifth Avenue flagship store","lat":40.758016,"lon":-73.976945,"blurb":"In 2007, its shoe department became the first building floor in America to receive its own ZIP code: 10022-SHOE."},{"name":"399 Park Avenue","lat":40.758983,"lon":-73.971479,"blurb":"Citigroup's world headquarters for 54 years, this skyscraper sold for a record-breaking $630 per square foot in 2002."},{"name":"660 Fifth Avenue","lat":40.760371,"lon":-73.976724,"blurb":"Its original \"666\" address invited supernatural associations, so it was rebranded \"660 Fifth Avenue\" to shed the ominous connotations."},{"name":"Rucker Park","lat":40.829198,"lon":-73.936118,"blurb":"NBA legends like Kareem Abdul-Jabbar and Julius Erving played summer streetball against amateur legends at this Harlem court during its 1960s-70s golden era."},{"name":"Riverbank State Park","lat":40.825427,"lon":-73.95652,"blurb":"Built atop a sewage treatment plant processing 125 million gallons daily, this 28-acre park features the city's largest green roof, with trees reaching 35 feet."},{"name":"Robert K. Kraft Field at Lawrence A. Wien Stadium","lat":40.873241,"lon":-73.916457,"blurb":"Columbia's football team endured a 44-game losing streak from 1983-88, then the longest in NCAA history, before finally winning here in 1988."},{"name":"Broadway Bridge","lat":40.873228,"lon":-73.911505,"blurb":"The original 1895 swing span was relocated a decade later to become the University Heights Bridge, one of NYC's most dramatically recycled pieces of infrastructure."},{"name":"Eldridge Street","lat":40.714017,"lon":-73.993926,"blurb":"Named for a War of 1812 soldier, it hosted the Eldridge Street Synagogue, one of America's first houses of worship built by Eastern European Jews."},{"name":"National September 11 Memorial & Museum","lat":40.711555,"lon":-74.01317,"blurb":"The Survivor Tree—a badly burned callery pear with one living branch recovered from the rubble—became a powerful symbol of resilience and hope."},{"name":"Random House Tower","lat":40.76525,"lon":-73.982542,"blurb":"Early tenants of its 130 luxury apartments included rap mogul P. Diddy and Yankees pitcher Randy Johnson."},{"name":"Wollman Rink","lat":40.767742,"lon":-73.97447,"blurb":"Donald Trump famously completed its 1986 renovation in four months and under budget, then claimed credit despite the city funding most work."},{"name":"Jewish Theological Seminary of America","lat":40.811908,"lon":-73.960262,"blurb":"A devastating 1966 library fire destroyed 70,000 books, yet this Conservative Judaism institution rebounded into a premier center for Jewish studies."},{"name":"Manhattan School of Music","lat":40.81252,"lon":-73.961326,"blurb":"It occupies the former home of the Institute of Musical Art—which became Juilliard before decamping to Lincoln Center."},{"name":"MetLife Building","lat":40.753518,"lon":-73.97663,"blurb":"A 1977 rooftop helicopter crash killed five people and permanently ended the building's brief airborne commuter service to JFK Airport."},{"name":"Axa Equitable Center","lat":40.761694,"lon":-73.981799,"blurb":"IBM supercomputer Deep Blue defeated world chess champion Garry Kasparov here in the famous 1997 match held in the building's auditorium."},{"name":"1540 Broadway","lat":40.758059,"lon":-73.984813,"blurb":"Completed in 1990 during a recession, it sat completely empty for three years before Bertelsmann rescued it from bankruptcy for $119 million."},{"name":"277 Park Avenue","lat":40.755224,"lon":-73.974181,"blurb":"Before a modern office tower opened here in 1964, JFK's presidential campaign operated from an apartment building designed by McKim, Mead & White."},{"name":"Paramount Plaza","lat":40.762082,"lon":-73.984656,"blurb":"It went into foreclosure just two years after opening in 1971, the first major New York City office tower to face that fate in a decade."},{"name":"Gershwin Theatre","lat":40.762329,"lon":-73.985229,"blurb":"Broadway's largest theater housed the first computerized rigging system in American commercial theater and has hosted Wicked continuously since 2003."},{"name":"599 Lexington Avenue","lat":40.757797,"lon":-73.970723,"blurb":"Designed by Edward Larrabee Barnes, this 1986 skyscraper features a Frank Stella artwork in its lobby and a major subway station entrance."},{"name":"712 Fifth Avenue","lat":40.762298,"lon":-73.975076,"blurb":"A postmodern tower preserving two landmark facades—including French glass master Rene Lalique's only documented American work—sparked fierce 1980s preservation debates."},{"name":"General Electric Building","lat":40.757083,"lon":-73.972458,"blurb":"This Art Deco tower, built for RCA but switched to General Electric mid-construction, still causes naming confusion with Rockefeller Plaza's former 'GE Building.'"},{"name":"345 Park Avenue","lat":40.757738,"lon":-73.97229,"blurb":"A 2025 mass shooting killed four people when a gunman opened fire in the lobby and on the 33rd floor before taking his own life."},{"name":"United Nations Secretariat Building","lat":40.748926,"lon":-73.968097,"blurb":"This gleaming glass tower was the first NYC skyscraper to use a glass curtain wall, fundamentally reshaping Manhattan's architectural future."},{"name":"731 Lexington Avenue","lat":40.761731,"lon":-73.967947,"blurb":"Beyonce, Brian Williams, and hedge fund manager Steven Cohen have all owned condos in this Bloomberg headquarters building's residential tower."},{"name":"One Grand Central Place","lat":40.752117,"lon":-73.97887,"blurb":"In 1956 Lawrence Wien bought a three-foot bronze model by Daniel Chester French—a sketch for the seated Lincoln Memorial statue—for his daughter."},{"name":"One Penn Plaza","lat":40.751156,"lon":-73.992229,"blurb":"More than 80 percent of the 2011 film 'Margin Call' was shot on the building's 42nd floor, recently vacated by a trading firm."},{"name":"Ann Street","lat":40.711108,"lon":-74.008209,"blurb":"P.T. Barnum's American Museum stood here from 1830, a wildly popular showplace featuring 'General Tom Thumb' and the 'Fiji Mermaid.'"},{"name":"Hotel Edison","lat":40.75964,"lon":-73.986337,"blurb":"Thomas Edison himself turned on the lights at its 1931 opening, and its ballroom later housed Broadway's Edison Theatre."},{"name":"240 East 38th Street","lat":40.747261,"lon":-73.974932,"blurb":"The hexagonal design was the first to exploit 1965 zoning changes allowing non-parallel walls, adding 2,000 extra square feet per floor."},{"name":"Manhattan Place","lat":40.745175,"lon":-73.971755,"blurb":"One of New York City's first luxury high-rise condos, it caught Donald Trump's attention and launched architect Costas Kondylis' career."},{"name":"685 First Avenue","lat":40.747393,"lon":-73.971349,"blurb":"Richard Meier abandoned his signature white palette for this all-black tower after developer Sheldon Solow asked it to match his other buildings."},{"name":"InterContinental New York Barclay Hotel","lat":40.755752,"lon":-73.973512,"blurb":"In 1945 it became the world's first hotel with a lobby bird cage where guests could bring their own birds—a quirky amenity beloved for decades."},{"name":"299 Park Avenue","lat":40.756025,"lon":-73.974183,"blurb":"It was ingeniously built over active railroad tracks without interrupting a single train, using innovative 'ladder tracks' engineering."},{"name":"245 Park Avenue","lat":40.754612,"lon":-73.974672,"blurb":"Chinese conglomerate HNA Group's $2.21 billion purchase in 2017 was one of NYC's priciest skyscraper deals before the company's bankruptcy."},{"name":"30 Rockefeller Plaza","lat":40.759007,"lon":-73.97933,"blurb":"Diego Rivera's communist mural was destroyed in 1934, replaced decades later by a sanitized 'American Progress' painting celebrating capitalism instead."},{"name":"Seagram Building","lat":40.758352,"lon":-73.971977,"blurb":"Phyllis Lambert, the 27-year-old daughter of Seagram's CEO, rejected the original design by writing her father 'NO NO NO NO NO,' then chose Mies van der Rohe."},{"name":"New York Hilton Midtown","lat":40.762454,"lon":-73.979714,"blurb":"The world's first handheld cellphone call happened outside this hotel in 1973 when Motorola's Martin Cooper phoned a Bell Labs rival to gloat."},{"name":"1301 Avenue of the Americas","lat":40.761838,"lon":-73.980117,"blurb":"JCPenney bought this former headquarters for $55 million in 1977, then abandoned it a decade later before Tishman Speyer rescued it for $353 million."},{"name":"1251 Avenue of the Americas","lat":40.760067,"lon":-73.981823,"blurb":"Despite ranking among America's 100 tallest buildings, this skyscraper is nearly invisible from the skyline, completely dwarfed by surrounding towers."},{"name":"East River Generating Station","lat":40.727664,"lon":-73.973965,"blurb":"Queen Marie of Romania ceremoniously switched on the plant's first generator in 1926, which produced more electricity than  the 1990s."},{"name":"1 Lincoln Plaza","lat":40.77165,"lon":-73.981324,"blurb":"Resident actor Nick Santino killed himself here in 2012, days after euthanizing his pit bull Rocco under building-management pressure over the dog."},{"name":"1 New York Plaza","lat":40.702195,"lon":-74.012041,"blurb":"A 1970 fire killed two when heat-sensitive elevator buttons summoned a car to the burning floor; Alan Greenspan's firm sat just across from where it started."},{"name":"Bleecker Street","lat":40.727508,"lon":-73.997832,"blurb":"Named for a banker's family farm it once ran through, this Village nightclub strip drew a PJ Harvey lyric calling it 'the street of no cheer.'"},{"name":"49 Chambers","lat":40.713968,"lon":-74.005077,"blurb":"The largest bank building in America when finished in 1912, it pioneered the 'H'-shaped floor plan and now holds 99 condos above a former banking hall."},{"name":"Zeckendorf Towers","lat":40.734665,"lon":-73.989146,"blurb":"Built on the site of the bargain department store S. Klein, its seventh floor holds New York's largest residential green roof, catching rain above the subway."},{"name":"Manhattan New York Temple","lat":40.773112,"lon":-73.981544,"blurb":"The LDS Church converted an existing meetinghouse across from Lincoln Center into this high-rise temple after local membership tripled past 42,000 in a decade."},{"name":"West 30th Street Heliport","lat":40.754999,"lon":-74.007065,"blurb":"Conceived in the 1950s to fly mail by helicopter into Midtown, this Hudson-side pad saw a Bell 206 crash into the river in 2019, its pilot rescued by a ferry."},{"name":"Grace Church","lat":40.731983,"lon":-73.990908,"blurb":"A 25-year-old James Renwick Jr. designed this Gothic Revival gem, his first major commission, from marble cut by inmates at Sing Sing prison."},{"name":"1211 Avenue of the Americas","lat":40.758672,"lon":-73.982542,"blurb":"The 'Z' of Rockefeller Center's XYZ towers, it became Rupert Murdoch's News Corp global headquarters and still houses Fox's studios and newsrooms."},{"name":"New York Marriott Marquis","lat":40.758599,"lon":-73.98626,"blurb":"Its construction razed five historic Broadway theaters amid lawsuits and protests, and its top holds The View, a revolving restaurant among the city's highest."},{"name":"Winter Garden Theatre","lat":40.761615,"lon":-73.983423,"blurb":"Adapted from a horse exchange, it staged just two shows across three decades between 1982 and 2013: Cats, then Mamma Mia!."},{"name":"Citigroup Center","lat":40.758331,"lon":-73.9699,"blurb":"Less than a year after it opened, engineers secretly strengthened it on discovering a design flaw that left the stilt-legged tower vulnerable to collapse in high winds."},{"name":"Roosevelt Hotel","lat":40.754842,"lon":-73.977188,"blurb":"Opened in 1924 with a pet kennel and an in-house doctor, this Theodore Roosevelt namesake was later owned by Pakistan International Airlines before closing in 2020."},{"name":"250 Water Street","lat":40.708233,"lon":-74.002665,"blurb":"A 19th-century thermometer factory once worked mercury on this Seaport lot, shadowing decades of stalled redevelopment now finally headed toward housing."},{"name":"3 World Trade Center","lat":40.710978,"lon":-74.011646,"blurb":"It replaces the Marriott World Trade Center hotel, which was crushed when the Twin Towers collapsed on September 11, 2001."},{"name":"Deutsche Bank Center","lat":40.768419,"lon":-73.983181,"blurb":"Its 750-foot twin towers, the tallest in the United States, rose on the cleared site of the demolished New York Coliseum convention center."},{"name":"15 William","lat":40.705385,"lon":-74.01035,"blurb":"This Financial District condo tower earned the nickname 'The Post-It Note Building' for the gold and grey brick panels staggered across its facade."},{"name":"Stuyvesant Town–Peter Cooper Village","lat":40.731722,"lon":-73.978174,"blurb":"Named for New Amsterdam's last director-general, this 11,250-apartment complex later became the largest commercial real estate default in U.S. history."},{"name":"Riverside Park","lat":40.80686,"lon":-73.968068,"blurb":"Robert Moses's 1930s West Side project buried the New York Central's riverfront rail tracks beneath this four-mile park's esplanade and playing fields."},{"name":"Cleopatra's Needle","lat":40.779636,"lon":-73.965396,"blurb":"This 3,000-year-old Egyptian obelisk inscribed for Thutmose III was gifted by Egypt's Khedive and shipped to Central Park on railroad magnate William Vanderbilt's dime."},{"name":"Elizabeth Street","lat":40.720054,"lon":-73.995195,"blurb":"Once home to the largest gathering of Sicilian speakers outside Sicily, a stretch below Canal was renamed for Danny Chen, a soldier who died after Army bullying."},{"name":"Castle Village","lat":40.853485,"lon":-73.940018,"blurb":"In 2005 the complex's 75-foot retaining wall collapsed in a landslide that buried the Henry Hudson Parkway and six parked cars, closing the highway for days."},{"name":"Hudson View Gardens","lat":40.853156,"lon":-73.939037,"blurb":"This 1920s Tudor-style 'garden community' for the middle class overlooks Bennett Park, home to the highest natural point in Manhattan."},{"name":"Marcus Garvey Park","lat":40.804486,"lon":-73.943673,"blurb":"Early Dutch settlers called its steep schist hill 'Snake Hill'; renamed for Marcus Garvey in 1973, the outcrop still forces Fifth Avenue to detour around it."},{"name":"Irish Hunger Memorial","lat":40.715142,"lon":-74.016548,"blurb":"It incorporates an authentic famine-era cottage shipped from County Mayo along with soil and stones gathered from every county in Ireland."},{"name":"26 Broadway","lat":40.705328,"lon":-74.012901,"blurb":"Standard Oil's headquarters rose on the former site of Alexander Hamilton's house, its curved facade bending to follow Broadway at Bowling Green."},{"name":"Lower East Side Preparatory High School","lat":40.720045,"lon":-73.986035,"blurb":"Born in Chinatown in 1973 to teach Chinese immigrants, it became a transfer nded by a Ukrainian women's league in 1976, it is the largest museum of Ukrainian art and culture outside Ukraine, rich in painted pysanky eggs and folk textiles."},{"name":"41 Cooper Square","lat":40.728505,"lon":-73.990256,"blurb":"Thom Mayne's angular Cooper Union engineering building has doubled as fictional corporate headquarters on Person of Interest, Limitless, and The Tomorrow People."},{"name":"Ottendorfer Public Library and Stuyvesant Polyclinic Hospital","lat":40.728916,"lon":-73.987782,"blurb":"Gifts to Manhattan's 'Little Germany' in 1884, the library was the city's second free-circulating branch and the clinic's facade bears terracotta busts of famous physicians."},{"name":"51 Astor Place","lat":40.730138,"lon":-73.99012,"blurb":"Locals nicknamed the black-glass tower 'The Death Star,' and its lobby shows off a giant red Jeff Koons rabbit sculpture."},{"name":"Winston Churchill Square","lat":40.729857,"lon":-74.00245,"blurb":"A .05-acre sliver of garden named for the British prime minister, its volunteer-tended plantings centered on an ornamental armillary sphere."},{"name":"Merchant's House Museum","lat":40.727658,"lon":-73.992344,"blurb":"The only 19th-century Manhattan home with original interior and exterior intact, it hides a secret passageway that sheltered fugitive slaves on the Underground Railroad."},{"name":"Astor Library Building","lat":40.72892,"lon":-73.99176,"blurb":"Saved from demolition in the 1960s, the old Astor Library became Joseph Papp's Public Theater, home of the New York Shakespeare Festival since 1967."},{"name":"Firehouse, Engine Company 33 and Ladder Company 9","lat":40.726979,"lon":-73.992514,"blurb":"Ten of the fourteen firefighters this house sent to the World Trade Center on September 11 were killed."},{"name":"Bouwerie Lane Theatre","lat":40.725916,"lon":-73.992379,"blurb":"A failed 1870s bank turned Off-Broadway house where Frank Langella made his debut; it later became a private mansion with a climbing wall."},{"name":"New York University Tisch School of the Arts","lat":40.729614,"lon":-73.993838,"blurb":"Home to the Martin Scorsese Institute of Global Cinematic Arts, its alumni and faculty claim 22 Academy Awards, 17 Emmys, and 12 Tonys."},{"name":"Schermerhorn Building","lat":40.7276,"lon":-73.993783,"blurb":"Designed by Henry Hardenbergh, architect of the Plaza Hotel and the Dakota, it rose on the site of the Schermerhorn family mansion."},{"name":"Puck Building","lat":40.724529,"lon":-73.995411,"blurb":"Longtime home of the satirical Puck magazine, its facade is crowned by two sculptures of Shakespeare's mischievous sprite Puck."},{"name":"St. Patrick's Old Cathedral","lat":40.723587,"lon":-73.995193,"blurb":"Built on farmland in 1809-1815, it served as New York's Catholic cathedral until the Midtown St. Patrick's opened in 1879."},{"name":"Cable Building","lat":40.725921,"lon":-73.99696,"blurb":"Stanford White designed this cable-car powerhouse; the chamber that once drove Broadway's cable line is now the Angelika Film Center."},{"name":"Village East by Angelika","lat":40.730963,"lon":-73.986389,"blurb":"Built as the Yiddish Art Theatre in the Moorish Revival style, this Yiddish Theatre District playhouse once starred Molly Picon."},{"name":"United States Post Office (Cooper Station)","lat":40.732019,"lon":-73.989703,"blurb":"Seinfeld's mailman Newman supposedly worked here; a photo of the building served as his recurring establishing shot."},{"name":"Webster Hall","lat":40.731769,"lon":-73.98909,"blurb":"Recognized as the first modern nightclub, this 1886 'hall for hire' reopened in 2019 after a $10 million renovation with a Jay-Z concert."},{"name":"Immaculate Conception Church","lat":40.730802,"lon":-73.982253,"blurb":"The parish's grand 14th Street church was demolished in the 1940s to clear the way for the Stuyvesant Town housing complex."},{"name":"E. V. Haughwout Building","lat":40.721808,"lon":-73.999485,"blurb":"Home to the world's first successful passenger elevator (Otis, 1857), and where Mary Todd Lincoln had official White House china painted."},{"name":"New Era Building","lat":40.722248,"lon":-74.000063,"blurb":"One of the few and possibly earliest Art Nouveau buildings still standing in Manhattan, crowned by a verdigris-green Parisian mansard roof."},{"name":"San Lorenzo Ruiz Chapel","lat":40.720552,"lon":-73.996302,"blurb":"Named the archdiocese's official 'Church of Filipinos' in 2005, it honored the first Filipino saint but drew as few as five worshippers before its 2017 sale."},{"name":"240 Centre Street","lat":40.720138,"lon":-73.997941,"blurb":"The NYPD's grand domed headquarters from 1909 to 1973, it was gutted and reborn in 1988 as luxury apartments called the Police Building."},{"name":"Bowery Savings Bank","lat":40.718921,"lon":-73.995192,"blurb":"Baseball Hall-of-Famer Joe DiMaggio was its pitchman from 1972 to 1992; in 1930 it was the largest bank in the United States."},{"name":"Bowery Ballroom","lat":40.720437,"lon":-73.993338,"blurb":"Rolling Stone's industry insiders named this 575-capacity venue the best club in America; it appears in the film Coyote Ugly."},{"name":"The NoMad","lat":40.74494,"lon":-73.988486,"blurb":"Its Michelin-starred restaurant's signature dish was a whole roasted chicken for two, stuffed with foie gras and truffles."},{"name":"Little Red School House","lat":40.729283,"lon":-74.001953,"blurb":"One of the city's first progressive schools, it went independent after the superintendent refused parents' money to keep it open during the Depression."},{"name":"Mills House No. 1","lat":40.728435,"lon":-74.000201,"blurb":"Built as a hotel for poor men in 1897, it packed 1,554 tiny rooms renting at 20 cents a night, meals a further 15 cents."},{"name":"Comedy Cellar","lat":40.730194,"lon":-74.000565,"blurb":"Dubbed the 'Harvard of comedy clubs,' it gave early stage time to Dave Chappelle, Louis C.K., Amy Schumer, and Jon Stewart."},{"name":"Washington Square Methodist Episcopal Church","lat":40.731476,"lon":-73.999977,"blurb":"Nicknamed 'The Peace Church' for its Vietnam War protests, it employed Paul Abels, New York City's first openly gay clergyman."},{"name":"Brown Building","lat":40.730071,"lon":-73.995368,"blurb":"Then the Asch Building, its top floors held the Triangle Shirtwaist Factory, where a 1911 fire killed 146 workers, mostly immigrant women."},{"name":"Washington Square Arch","lat":40.731235,"lon":-73.997102,"blurb":"Stanford White's marble arch marks the centennial of George Washington's 1789 inauguration and forms the southern terminus of Fifth Avenue."},{"name":"Judson Memorial Church","lat":40.730192,"lon":-73.998407,"blurb":"Designed by Stanford White with John La Farge stained glass and backed by John D. Rockefeller, it was built to reach the village's poor."},{"name":"Odd Fellows Hall","lat":40.71946,"lon":-73.998441,"blurb":"One of the city's earliest Italianate buildings, it housed the secretive Independent Order of Odd Fellows until they moved uptown in the 1880s."},{"name":"Church of the Most Holy Redeemer","lat":40.72362,"lon":-73.984244,"blurb":"Dubbed the 'German Catholic Cathedral' of Little Germany, it lost more than a dozen children to a fire at its parish school in 1883."},{"name":"Lincoln Building (Union Square, Manhattan)","lat":40.735498,"lon":-73.991881,"blurb":"Named for the Abraham Lincoln statue standing directly across Union Square, it was among architect R. H. Robertson's earliest works."},{"name":"W New York Union Square","lat":40.73658,"lon":-73.98854,"blurb":"Built in 1911 as the Germania Life Insurance headquarters, this Beaux-Arts tower with a mansard roof became a W hotel in 2000."},{"name":"44 Union Square","lat":40.736224,"lon":-73.988731,"blurb":"Tammany Hall's oldest surviving headquarters, its renovation added a glass dome shaped to honor Chief Tamanend, the political machine's namesake."},{"name":"High School for Health Professions and Human Services","lat":40.732672,"lon":-73.982579,"blurb":"The heal
