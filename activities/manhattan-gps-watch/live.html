th-careers high school occupies the old Stuyvesant High School building, running triple sessions to fit its crowded student body."},{"name":"Jefferson Market Library","lat":40.734578,"lon":-73.999147,"blurb":"Saved from demolition by public outcry, this 'mock Neuschwansteinian' former courthouse-turned-library rose where a wooden fire lookout tower once stood."},{"name":"Gunther Building (Broome Street)","lat":40.722415,"lon":-74.001858,"blurb":"A 19th-century furrier's warehouse with a curved glass corner; Lenny Kravitz was once among its resident artists and architects."},{"name":"New York City Fire Museum","lat":40.725576,"lon":-74.006935,"blurb":"Set in a 1904 firehouse, it holds 10,000 objects and a permanent memorial to the 343 FDNY members who died on September 11."},{"name":"7 Hudson Square","lat":40.726146,"lon":-74.006621,"blurb":"Disney's East Coast headquarters, its vanity address nods to WABC-TV's channel 7; it's also named the Robert A. Iger Building for the CEO."},{"name":"The Dominick","lat":40.725321,"lon":-74.005496,"blurb":"Opened as Trump SoHo, this condo-hotel skirted manufacturing zoning with a rule barring owners from living in units over 120 days a year, then dropped the Trump name in 2017."},{"name":"IFC Center","lat":40.731224,"lon":-74.001665,"blurb":"The former Waverly Theater hosted Rocky Horror Picture Show midnight showings for years, spawning the tradition citywide; its 2005 reopening drew a picket line and inflatable rat."},{"name":"Church of St. Luke in the Fields","lat":40.732415,"lon":-74.006988,"blurb":"Clement Clarke Moore laid out the complex and served as its first pastor; the parish took its \"in the Fields\" name from pastoral Greenwich Village, and Doubt was filmed here."},{"name":"Church of the Most Precious Blood","lat":40.717775,"lon":-73.998883,"blurb":"The National Shrine of San Gennaro, whose statue is paraded through Little Italy each September; in 1898 a priest's crusade against local vice earned him death threats."},{"name":"The Tombs","lat":40.716517,"lon":-74.000465,"blurb":"This Egyptian Revival jail earned the nickname \"the Tombs\" from its mastaba-like form and was written up by Charles Dickens in American Notes."},{"name":"Church of the Transfiguration, Roman Catholic","lat":40.71462,"lon":-73.999063,"blurb":"Built in 1801 for Lutherans who later converted en masse to Episcopalianism, it was rebuilt after an 1815 fire that gutted 35 homes, thanks to tobacco magnate Peter Lorillard."},{"name":"Firehouse, Hook & Ladder Company 8","lat":40.719557,"lon":-74.006619,"blurb":"Its facade is the Ghostbusters firehouse, picked because Dan Aykroyd liked the building; Steve Buscemi, a former FDNY firefighter, helped save it from closure in 2011."},{"name":"60 Hudson Street","lat":40.717651,"lon":-74.008289,"blurb":"Built as the world's largest telegraph building for Western Union, its Art Deco brick facade shifts through nineteen hues and it's now one of the planet's key Internet hubs."},{"name":"32 Avenue of the Americas","lat":40.719994,"lon":-74.004568,"blurb":"Once the world's largest building devoted to long-distance calling, this AT&T Art Deco tower still runs as a data center, its lobby murals celebrating the telephone."},{"name":"Church of the Ascension, Episcopal","lat":40.733787,"lon":-73.995751,"blurb":"President John Tyler married the much-younger Julia Gardiner here in 1844, prompting John Quincy Adams to call the couple \"the laughing-stock of the city.\""},{"name":"First Presbyterian Church","lat":40.734486,"lon":-73.995255,"blurb":"Dubbed the \"Church of Patriots\" for its Revolutionary-era congregants, this 1716 parish grew after the King repeatedly refused it a charter to protect the Church of England."},{"name":"C-Squat","lat":40.725762,"lon":-73.977947,"blurb":"An Alphabet City squat taken over in 1989 that survived paramilitary eviction attempts to become resident-owned; its storefront now houses the Museum of Reclaimed Urban Space."},{"name":"St. Brigid Roman Catholic Church","lat":40.725386,"lon":-73.980626,"blurb":"The \"Famine Church,\" built in 1848 by Irish shipwrights fleeing the Great Famine; its pastor Father Mooney was beloved chaplain to the storied \"Fighting 69th\" regiment."},{"name":"Umbrella House","lat":40.721375,"lon":-73.981075,"blurb":"A 1988 East Village squat once occupied by Native Americans as a \"survival house,\" it became a co-op and now grows food in an 820-square-foot rooftop garden."},{"name":"Blue Condominium","lat":40.718883,"lon":-73.987432,"blurb":"Bernard Tschumi's first-ever residential building and skyscraper, its blue pixelated facet-form sparked debate as a symbol of Lower East Side gentrification."},{"name":"Eldridge Street Synagogue","lat":40.714729,"lon":-73.993461,"blurb":"One of the first synagogues built by Eastern European Jews in the U.S.; its grand sanctuary was shuttered in 1954 as members dwindled, then painstakingly restored by 2007."},{"name":"United States Court of International Trade","lat":40.714842,"lon":-74.00375,"blurb":"A federal court ruling on customs and tariff disputes from anywhere in the U.S. or abroad, with no more than five of its nine judges allowed from one political party."},{"name":"Broadway–Chambers Building","lat":40.714442,"lon":-74.006465,"blurb":"Cass Gilbert's first New York building, its construction was showcased as an exhibit at the 1900 Paris Exposition; lions' and women's heads adorn its cornice."},{"name":"Lesbian, Gay, Bisexual & Transgender Community Center","lat":40.738013,"lon":-74.001058,"blurb":"ACT UP, Queer Nation, the Lesbian Avengers, and GLAAD all got their start here, and Keith Haring painted a work for its 1989 show marking Stonewall's 20th anniversary."},{"name":"New York Mercantile Exchange","lat":40.714512,"lon":-74.016854,"blurb":"The exchange whose oil and metals prices set rates the world pays kept a shrinking open-outcry \"pit\" of shouting, hand-signaling traders long after going electronic."},{"name":"The Ansonia","lat":40.780153,"lon":-73.982262,"blurb":"This Beaux-Arts pile housed opera singers, ballplayers, and a rooftop farm, plus a basement pool later home to the gay Continental Baths and swingers' club Plato's Retreat."},{"name":"Great Lawn and Turtle Pond","lat":40.779462,"lon":-73.967941,"blurb":"Built atop a drained Croton reservoir, its turtles are mostly abandoned pets, and a proposed 50,000-person crowd cap was dropped in 2008 after First Amendment protests."},{"name":"Penn South","lat":40.748095,"lon":-73.998507,"blurb":"A garment-workers'-union housing co-op dedicated by President Kennedy, built by clearing a Chelsea slum that displaced an estimated 7,500 residents."},{"name":"75 Rockefeller Plaza","lat":40.760055,"lon":-73.977653,"blurb":"Built for Standard Oil as Rockefeller Center's first fully air-conditioned tower, it housed Schrafft's, at 1,283 seats then the largest restaurant in the world."},{"name":"CBS Building","lat":40.761253,"lon":-73.978782,"blurb":"Eero Saarinen's only skyscraper, his \"simplest skyscraper statement in New York,\" nicknamed \"Black Rock\" for its dark granite; it was CBS's longtime headquarters."},{"name":"1717 Broadway","lat":40.764389,"lon":-73.982731,"blurb":"At 750 feet it's the tallest hotel in North America, stacking two Marriott brands, a Courtyard below and a Residence Inn above, in 639 rooms."},{"name":"One57","lat":40.76554,"lon":-73.979042,"blurb":"The tower that launched \"Billionaires' Row\" set a city record with a $100.5-million apartment, and its construction crane famously collapsed and dangled over 57th Street."},{"name":"United Nations General Assembly Building","lat":40.75009,"lon":-73.96768,"blurb":"Home to the 1,800-seat hall where the UN General Assembly meets; though on U.S. soil, it sits under UN jurisdiction, exempt from some local regulations."},{"name":"Sky (skyscraper)","lat":40.761554,"lon":-73.998837,"blurb":"A Hudson Yards rental tower with a Carmelo Anthony-designed basketball court and Yayoi Kusama's bronze pumpkins in its lobby, long stalled as a recession-era \"zombie project.\""},{"name":"53W53","lat":40.761788,"lon":-73.978153,"blurb":"Jean Nouvel's MoMA-adjacent supertall had its planned 1,250-foot height lopped by 200 feet after protests, and critics branded it a symbol of wealth inequality."},{"name":"Paley Park","lat":40.760344,"lon":-73.975075,"blurb":"A beloved pocket park on the former site of the Stork Club, its 20-foot waterfall pumps 1,800 gallons a minute to mask the roar of the city."},{"name":"Church of the Epiphany (Episcopal, Manhattan)","lat":40.768473,"lon":-73.952996,"blurb":"Founded in 1833 as the first church of the NY Protestant Episcopal City Mission Society; its rector Jennifer Reddall was elected Bishop of Arizona in 2018."},{"name":"111 Eighth Avenue","lat":40.741359,"lon":-74.003209,"blurb":"The \"Google Building,\" whose floors hold more square footage than the Empire State Building; Google bought it for $1.8 billion in 2010 and helped gentrify Chelsea."},{"name":"Maritime Hotel","lat":40.742436,"lon":-74.003867,"blurb":"A porthole-studded former sailors'-union building that later served as a runaway shelter and a Chinese scholars' center before becoming a nautical-themed boutique hotel."},{"name":"St. Peter's Episcopal Church","lat":40.74395,"lon":-74.001848,"blurb":"Clement Clarke Moore, who named Chelsea and designed this church, served as its warden and organist; its wrought-iron fence once fronted Trinity Church around 1790."},{"name":"Judge Building","lat":40.737042,"lon":-73.993328,"blurb":"Named for the magazine printed there, it hosted America's first doll exhibition in 1890 and Gianni Bettini's studio, which recorded the voices of Mark Twain and Sarah Bernhardt."},{"name":"Church of the Holy Communion and Buildings","lat":40.74103,"lon":-73.993709,"blurb":"A pioneering asymmetrical Gothic Revival church that became the notorious Limelight nightclub from 1983 to 2003, and later, of all things, a gym."},{"name":"St. Vincent de Paul Church","lat":40.743602,"lon":-73.993582,"blurb":"At this French parish Edith Piaf married in 1952 with Marlene Dietrich as her maid of honor; opera singer Armand Castelmary, who died onstage at the Met, was eulogized here."},{"name":"Starrett–Lehigh Building","lat":40.751598,"lon":-74.006525,"blurb":"Three freight elevators once hoisted entire trucks up to delivery bays on its upper floors, where the railroad's boxcars were unloaded."},{"name":"30 Hudson Yards","lat":40.753949,"lon":-74.000555,"blurb":"Its triangular glass-floored Edge deck juts from the 100th floor at 1,100 feet, the world's second-highest outdoor observation deck."},{"name":"Avenues: The World School","lat":40.749417,"lon":-74.003321,"blurb":"Co-founded by a former Yale president, this for-profit school counts pop musician King Princess as an alumna and starred in a gentrification documentary."},{"name":"James A. Farley Building","lat":40.751529,"lon":-73.995886,"blurb":"Its colonnade bears the \"Neither snow nor rain nor heat nor gloom of night\" postal creed, and its old mail-sorting room is now Moynihan Train Hall."},{"name":"Church of the Holy Apostles","lat":40.749225,"lon":-73.998787,"blurb":"Rumored to have been a stop on the Underground Railroad, this church later became home to a renowned soup kitchen."},{"name":"100 West 33rd Street","lat":40.749151,"lon":-73.98928,"blurb":"As the Gimbels flagship, it had the highest shoplifting rate in the world by the time the store closed in 1986."},{"name":"15 Penn Plaza","lat":40.749675,"lon":-73.990525,"blurb":"Nicknamed PENN15, the tower drew a fierce lobbying war from the Empire State Building's owners, who fought to keep it from obscuring their skyline."},{"name":"Friends Seminary","lat":40.734031,"lon":-73.985294,"blurb":"New York's oldest continuously coeducational school, founded in 1786, schooled Vera Wang, Liev Schreiber, Kyra Sedgwick, and Amanda Peet."},{"name":"St. George's Episcopal Church","lat":40.734373,"lon":-73.98497,"blurb":"It was colloquially called \"Morgan's Church\" for decades while J.P. Morgan served as senior warden and its most influential parishioner."},{"name":"Calvary Church","lat":40.738928,"lon":-73.98676,"blurb":"Designed by the architect of St. Patrick's Cathedral, it was the church of Theodore Roosevelt, born two blocks away in 1858."},{"name":"Gramercy Theatre","lat":40.739908,"lon":-73.984929,"blurb":"This former art house barred latecomers near a film's end and served coffee in the lobby before becoming a Live Nation concert venue."},{"name":"Church of the Epiphany (Roman Catholic, Manhattan)","lat":40.737114,"lon":-73.982012,"blurb":"An errant cigarette burned the original church down in 1963; a Madonna and Child rescued from the flames survives in the new church's stained glass."},{"name":"United States Post Office (Madison Square Station)","lat":40.73954,"lon":-73.983553,"blurb":"Five bronze reliefs trace communication from smoke signals to carrier pigeons, tied to a 1930s plan to fly airmail in by seaplane."},{"name":"One Madison","lat":40.740479,"lon":-73.98808,"blurb":"One of the world's slenderest towers at a 12:1 ratio, it topped out then sat unfinished for years amid bankruptcy and fraud allegations."},{"name":"Metropolitan Life North Building","lat":40.741511,"lon":-73.986487,"blurb":"Planned at 100 stories before the Great Depression froze funding, this Art Deco tower ultimately rose only 30."},{"name":"69th Regiment Armory","lat":40.741351,"lon":-73.984239,"blurb":"It hosted the 1913 Armory Show, the exhibition that first brought modern art before the American public."},{"name":"Masonic Hall","lat":40.743034,"lon":-73.992094,"blurb":"The original 1826 hall imitated Westminster Abbey's Henry VII chapel and housed what was then the largest bowling alley in the world."},{"name":"Martha Washington Hotel","lat":40.744707,"lon":-73.984457,"blurb":"It ran as a women-only hotel for 95 years, named for the first First Lady, with men barred above the ground floor."},{"name":"Church of the Transfiguration, Episcopal","lat":40.745161,"lon":-73.985825,"blurb":"The \"Little Church Around the Corner\" sheltered African Americans during the 1863 Draft Riots, its rector dispersing the mob with \"You white devils, you!\""},{"name":"American Fine Arts Society","lat":40.766233,"lon":-73.980598,"blurb":"Home of the Art Students League since 1892, it now has part of the supertall Central Park Tower built directly above it."},{"name":"Hotel St. Moritz","lat":40.765162,"lon":-73.976034,"blurb":"Donald Trump bought it for $72 million in 1985 and flipped it three years later for $180 million; it later appeared in Grand Theft Auto IV."},{"name":"Trump Parc","lat":40.765545,"lon":-73.976667,"blurb":"The former Barbizon-Plaza, built for artists with soundproof practice rooms, hosted pioneering 1950s-60s gay-rights conventions of the Mattachine Society and Daughters of Bilitis."},{"name":"JW Marriott Essex House","lat":40.766172,"lon":-73.978511,"blurb":"Soul singer Donny Hathaway fell to his death from the hotel in 1979, ruled a suicide; construction had begun a day after the 1929 Wall Street Crash."},{"name":"Calvary Baptist Church","lat":40.765112,"lon":-73.97837,"blurb":"One of the first churches with its own radio station in 1923, it received two Steinways from pianist Van Cliburn and drew worshippers Nixon and Clinton."},{"name":"Paris Theater","lat":40.763736,"lon":-73.974319,"blurb":"Marlene Dietrich cut its opening ribbon in 1948, and it is now Manhattan's last single-screen cinema, run by Netflix."},{"name":"Alwyn Court","lat":40.765879,"lon":-73.979341,"blurb":"Its facade is smothered in elaborate French Renaissance terracotta, and a Richard Haas trompe-l'oeil mural transforms its octagonal courtyard."},{"name":"Carnegie Hall","lat":40.764998,"lon":-73.979912,"blurb":"Built by industrialist Andrew Carnegie, it was saved from demolition in the 1950s by a public campaign led by violinist Isaac Stern."},{"name":"Carnegie Hall Tower","lat":40.764861,"lon":-73.979591,"blurb":"Squeezed between Carnegie Hall and the Russian Tea Room, it is only 50 feet wide, among the world's most slender skyscrapers."},{"name":"Thompson Central Park New York Hotel","lat":40.764325,"lon":-73.978476,"blurb":"It opened on a Friday the 13th, once welcomed wild animals as guests, and hides a \"world famous Burger Joint\" inside."},{"name":"Metropolitan Tower","lat":40.7648,"lon":-73.979242,"blurb":"Developer Harry Macklowe never pried the Russian Tea Room loose from its neighbor, so his black-glass triangular tower rose right beside it."},{"name":"Fifth Avenue Presbyterian Church","lat":40.762041,"lon":-73.975246,"blurb":"Here in 1884 Theodore Roosevelt buried his wife and mother on the same day; the church later sued the city to shelter homeless people on its steps."},{"name":"12 West 56th Street","lat":40.762522,"lon":-73.975533,"blurb":"This Gilded Age mansion on 56th Street's \"Bankers' Row\" has housed Argentina's consulate since 1947."},{"name":"Rockefeller Apartments","lat":40.761776,"lon":-73.976645,"blurb":"The Rockefeller family secretly assembled the site and built these apartments on land left over from constructing Rockefeller Center."},{"name":"7 West 54th Street","lat":40.761576,"lon":-73.976061,"blurb":"Home to banker Philip Lehman until 1947 and then his son, the great art collector Robert Lehman, of the Lehman Brothers dynasty."},{"name":"The Peninsula New York","lat":40.761625,"lon":-73.975418,"blurb":"Built in 1905 as the Gotham Hotel, it was sold in 1908 after repeatedly failing to secure a liquor license."},{"name":"Warwick New York Hotel","lat":40.76245,"lon":-73.978093,"blurb":"William Randolph Hearst built it to house his mistress Marion Davies on her own floor; the Beatles later stayed here on tour and Cary Grant lived here 12 years."},{"name":"1345 Avenue of the Americas","lat":40.763,"lon":-73.979054,"blurb":"From its roof in 1973, Motorola's Martin Cooper placed the world's first public handheld cellphone call, ringing his rival at Bell Labs to gloat."},{"name":"New York City Center","lat":40.763936,"lon":-73.979405,"blurb":"Built by the Shriners as the Moorish-Revival Mecca Temple, it was rescued by Mayor La Guardia as the city's first municipal performing-arts center."},{"name":"CitySpire","lat":40.764183,"lon":-73.979757,"blurb":"Soon after opening it fell into foreclosure, and its roof emitted a mysterious whistling noise that plagued neighbors for two years."},{"name":"125 West 55th Street","lat":40.763755,"lon":-73.978969,"blurb":"Developers rushed its foundation to beat a 1988 city deadline, snagging a 20% zoning bonus meant to spur development of western Midtown."},{"name":"Hearst Tower","lat":40.766574,"lon":-73.983635,"blurb":"William Randolph Hearst's 1928 six-story base waited nearly 80 years for its tower, finally crowned by Norman Foster's glass diagrid in 2006."},{"name":"Central Park Place","lat":40.767098,"lon":-73.983012,"blurb":"The NYPD's largest-ever heroin seizure, $240 million in five suitcases, was made in a 27th-floor apartment here, a tower that also housed Goldie Hawn and Al Pacino."},{"name":"Hudson Hotel","lat":40.768068,"lon":-73.984989,"blurb":"Built by J.P. Morgan's daughter as a women's clubhouse, it was reborn as a hip hotel by Studio 54's Ian Schrager and designer Philippe Starck."},{"name":"Congregation Beth Israel / West Side Jewish Center","lat":40.753215,"lon":-73.995188,"blurb":"This Orthodox synagogue rents its entire side wall for billboards, once wrapping the building in a giant 2007 ad for the film Resident Evil: Extinction."},{"name":"Church of St. Michael (34th Street, Manhattan)","lat":40.753349,"lon":-73.997337,"blurb":"A May 1892 fire destroyed much of the church and its 1862 Henry Erben organ, forcing a rebuild around the surviving 31st Street tower."},{"name":"Hotel Wolcott","lat":40.746621,"lon":-73.986705,"blurb":"Permanent residents once included Mark Twain, Edith Wharton, Isadora Duncan, and Henry Miller before it declined into a budget SRO."},{"name":"Hotel McAlpin","lat":40.749241,"lon":-73.987487,"blurb":"The largest hotel in the world when it opened in 1912, with 1,500 rooms and entire floors set aside separately for men and women."},{"name":"Metropolitan Community Church of New York","lat":40.755333,"lon":-73.997519,"blurb":"This LGBTQ church runs Sylvia's Place, an emergency shelter for homeless queer youth named for transgender activist Sylvia Rivera."},{"name":"Nelson Tower","lat":40.751506,"lon":-73.990767,"blurb":"Completed in 1931 as the tallest building in Manhattan's Garment District, it's now dwarfed by One Penn Plaza across 34th Street."},{"name":"Church of Sts. Cyril & Methodius and St. Raphael","lat":40.759017,"lon":-73.996747,"blurb":"Built in 1903 for Hell's Kitchen's poor Irish immigrants, this twin-towered church now serves as a Croatian national parish beside the Lincoln Tunnel."},{"name":"CUNY Graduate Center","lat":40.748519,"lon":-73.983639,"blurb":"Housed in the former B. Altman department store on Fifth Avenue, its faculty have included Nobel, Pulitzer, and Grammy winners."},{"name":"Greenwich Savings Bank","lat":40.751472,"lon":-73.987121,"blurb":"A 1981 bank run drained $500 million in three days; the grand hall later played the heist target in the film Going in Style."},{"name":"Engineering Societies' Building","lat":40.752475,"lon":-73.983856,"blurb":"Andrew Carnegie funded this 1907 clubhouse, uniting the mechanical, mining, and electrical engineering societies under one roof."},{"name":"Engineers' Club Building","lat":40.752672,"lon":-73.983529,"blurb":"Andrew Carnegie bankrolled it, but the Engineers' Club refused to share with the other societies, so it got its own clubhouse next door."},{"name":"Bush Tower","lat":40.754984,"lon":-73.985624,"blurb":"Its brick facade is painted with trompe-l'oeil shadows, faking vertical ribs to make the narrow Neo-Gothic tower look even taller."},{"name":"Macy's Herald Square","lat":40.750815,"lon":-73.989168,"blurb":"Macy's star logo echoes a red star its founder tattooed on himself as a teen on a Nantucket whaling ship; the flagship even has an in-store jail, Room 140."},{"name":"Million Dollar Corner","lat":40.750136,"lon":-73.988157,"blurb":"This five-story holdout sold for a record $1 million in 1911, a failed bid to stop Macy's becoming the world's largest store, which simply built around it."},{"name":"Springs Mills Building","lat":40.753448,"lon":-73.985933,"blurb":"The lobby and an 18th-floor office of this glassy Modernist tower served as sets for the 2007 Matt Damon film The Bourne Ultimatum."},{"name":"The Knickerbocker Hotel","lat":40.755243,"lon":-73.986027,"blurb":"Built by John Jacob Astor IV, this hotel housed Enrico Caruso and George M. Cohan before becoming Newsweek's home in 1940."},{"name":"New York City Fire Department Rescue Company 1","lat":40.760709,"lon":-73.996594,"blurb":"Captain Terry Hatton died on 9/11; his signature shout 'Outstanding' is painted on the rescue truck, and a nearby block is named Terence S. Hatton Way."},{"name":"Saints Kyril & Metodi Bulgarian Eastern Orthodox Diocesan Cathedral","lat":40.76544,"lon":-73.994156,"blurb":"This building passed from Lutheran to Polish Catholic to Croatian Franciscan hands before Bulgarian Orthodox worshippers bought it in 1979."},{"name":"Al Hirschfeld Theatre","lat":40.759253,"lon":-73.989201,"blurb":"The only NYC theater ever owned outright without a mortgage, it was renamed in 2003 for legendary Broadway caricaturist Al Hirschfeld."},{"name":"Film Center Building","lat":40.759916,"lon":-73.991156,"blurb":"Purpose-built in 1929 for the film trade, it held nearly 100 film vaults and offices for studios like Metro-Goldwyn-Mayer."},{"name":"Church of the Sacred Heart of Jesus","lat":40.765228,"lon":-73.990311,"blurb":"In 1966 it became the first church in the New York Archdiocese to reconfigure its interior after the Second Vatican Council."},{"name":"St. Benedict the Moor Church","lat":40.764629,"lon":-73.986356,"blurb":"The first church in NYC for Black Catholics, it's where Augustus Tolton, America's first openly Black Catholic priest, celebrated his first U.S. Mass in 1886."},{"name":"One Worldwide Plaza","lat":40.762235,"lon":-73.98695,"blurb":"This Hell's Kitchen skyscraper rises on the site of New York City's third Madison Square Garden."},{"name":"The Empire Hotel","lat":40.771336,"lon":-73.982717,"blurb":"Chuck Bass's hotel on Gossip Girl, its red neon sign inspired the one glaring into Kramer's apartment on Seinfeld."},{"name":"Fuller Building","lat":40.762344,"lon":-73.971831,"blurb":"Named for the Fuller Construction Company, builders of the Flatiron, who moved their headquarters here in 1929."},{"name":"LVMH Tower","lat":40.76267,"lon":-73.972582,"blurb":"Christian de Portzamparc's folded glass facade has been likened to a skirt falling over a bent knee and to unfolding flower petals."},{"name":"The Sherry-Netherland","lat":40.76431,"lon":-73.97253,"blurb":"A 1927 scaffolding fire burned 12 hours with flames visible from Long Island; its lobby holds carvings salvaged from the Vanderbilt mansion demolished across Fifth Avenue."},{"name":"Harold Pratt House","lat":40.762245,"lon":-73.970744,"blurb":"Home to the Council on Foreign Relations since 1945, this mansion was built for oil industrialist Harold Pratt and donated by his widow."},{"name":"Trump Park Avenue","lat":40.763238,"lon":-73.970104,"blurb":"As the Hotel Delmonico in 1964, it hosted the first Bob Dylan-Beatles meeting, where Dylan reportedly introduced the band to cannabis."},{"name":"590 Madison Avenue","lat":40.762126,"lon":-73.973033,"blurb":"Built as IBM's headquarters, this gray-green glass tower was designed as a giant prism, with a bamboo-filled public atrium at its base."},{"name":"Colony Club","lat":40.765128,"lon":-73.96871,"blurb":"The first NYC social club founded by and for women (1903); its architect Stanford White was murdered by Harry K. Thaw before it was finished."},{"name":"520 Park Avenue","lat":40.763888,"lon":-73.969645,"blurb":"This limestone Robert A.M. Stern tower, the tallest on the Upper East Side, holds a $130 million triplex penthouse."},{"name":"The Pierre","lat":40.765079,"lon":-73.971664,"blurb":"Site of the 1972 Pierre heist, 'the biggest hotel robbery ever'; it's named for Charles Pierre, a Corsican busboy turned celebrated restaurateur."},{"name":"Central Park Mall","lat":40.772585,"lon":-73.970213,"blurb":"The only formal feature in Olmsted and Vaux's naturalistic Central Park; its Naumburg Bandshell hosts the world's oldest free outdoor classical concert series."},{"name":"The Dairy","lat":40.769106,"lon":-73.973704,"blurb":"Calvert Vaux's 1871 cottage sold milk to children from cows once stabled in its basement; today it's a park visitor center."},{"name":"Our Saviour New York","lat":40.76849,"lon":-73.98633,"blurb":"Built for an English sect that expected an imminent Second Coming, it drew praise as 'no more scholarly Gothic work in New York.'"},{"name":"David Geffen Hall","lat":40.772822,"lon":-73.983017,"blurb":"Lincoln Center stripped Avery Fisher's name from the hall to resell the rights, landing a $100 million gift from David Geffen."},{"name":"David H. Koch Theater","lat":40.771792,"lon":-73.983768,"blurb":"Irving Berlin revised Annie Get Your Gun here in 1966 for its original star, Ethel Merman, amid a run of classic Broadway revivals."},{"name":"Metropolitan Opera House (Lincoln Center)","lat":40.772856,"lon":-73.984695,"blurb":"The world's largest repertory opera house was nearly built at Rockefeller Center until the 1929 crash rerouted it to Lincoln Center."},{"name":"St. Paul the Apostle Church","lat":40.769888,"lon":-73.985141,"blurb":"Partly built from gray granite salvaged from the old Croton Aqueduct, it holds interiors by Stanford White, Saint-Gaudens, and John LaFarge."},{"name":"Professional Children's School","lat":40.770384,"lon":-73.98607,"blurb":"Founded in 1914 to school child stage and vaudeville performers, its alumni include fashion designer Vera Wang."},{"name":"Civic Club / Estonian House","lat":40.745197,"lon":-73.976147,"blurb":"Built for a reformer's club fighting poverty and gambling, it's now the main center of Estonian culture on the U.S. East Coast."},{"name":"Soldiers', Sailors', Marines', Coast Guard and Airmen's Club","lat":40.747937,"lon":-73.978239,"blurb":"Co-founded by General Pershing in 1919, it lodged 2.5 million servicemembers and was once run by exiled Russian prince Serge Obolensky."},{"name":"Our Saviour Roman Catholic Church","lat":40.749234,"lon":-73.979234,"blurb":"When a pastor tore out its traditional Latin rites and icons in 2013, both Catholic and artistic communities aired their complaints."},{"name":"Church of the Incarnation, Episcopal","lat":40.748441,"lon":-73.981969,"blurb":"Eleanor Roosevelt was confirmed here, and a ramp was built so a wheelchair-bound FDR could attend his mother Sara's funeral."},{"name":"461 Fifth Avenue","lat":40.752251,"lon":-73.981339,"blurb":"Once the home of the Misses Furniss, famed for hosting musicals, the site later held a Lane Bryant store before this 1988 tower."},{"name":"10 East 40th Street","lat":40.751539,"lon":-73.981212,"blurb":"On its 2007 disconnection, it was the last building still wired to Thomas Edison's original direct-current grid in New York."},{"name":"Stavros Niarchos Foundation Library","lat":40.751704,"lon":-73.981532,"blurb":"The New York Public Library's circulating collection lives inside a former Arnold Constable department store facing Bryant Park."},{"name":"252 East 57th Street","lat":40.759084,"lon":-73.965885,"blurb":"Its curved glass facade is modeled on Alvar Aalto's 1936 vase, with interiors by a designer of homes for Mick Jagger and Tory Burch."},{"name":"Sutton 58","lat":40.758281,"lon":-73.961283,"blurb":"Neighbors fought the tower so fiercely they got the area rezoned with a height cap, shrinking Norman Foster's planned 1,000-foot design."},{"name":"River House","lat":40.754646,"lon":-73.963125,"blurb":"The co-op board famously rejected Gloria Vanderbilt, Richard Nixon, and Joan Crawford; residents once docked their yachts at its own pier."},{"name":"Beekman Tower","lat":40.753331,"lon":-73.966082,"blurb":"Built in 1928 as a hotel exclusively for college sorority women, it opened to men by the mid-1930s for lack of patronage."},{"name":"919 Third Avenue","lat":40.758889,"lon":-73.967534,"blurb":"Developers built the tower around P.J. Clarke's bar after its owner refused to sell; a fatal 1970 elevator fire spurred NYC's strict high-rise fire law."},{"name":"Japan Society","lat":40.752557,"lon":-73.968246,"blurb":"Born at a 1907 New York luncheon honoring Japanese royalty, it went dark during World War II and revived under John D. Rockefeller III."},{"name":"Beaux-Arts Apartments","lat":40.750961,"lon":-73.970358,"blurb":"Financed by stock rather than a mortgage, the twin towers dodged Depression foreclosure and proved popular among independent businesswomen."},{"name":"The Town School","lat":40.768318,"lon":-73.949778,"blurb":"Started in 1913 as Miss Hyde's School, a nursery on East 81st Street, it became the coeducational Town School after her 1936 resignation."},{"name":"Allerton 39th Street House","lat":40.749405,"lon":-73.976574,"blurb":"Opened in 1918 as a men-only club hotel, it later became a Salvation Army residence for women and is now the Pod 39 hotel."},{"name":"Jonathan W. Allen Stable","lat":40.749577,"lon":-73.976208,"blurb":"Built in 1871 as a private carriage stable with the groom's quarters upstairs, it was later rented to a sculptor by Con Edison."},{"name":"One Vanderbilt","lat":40.752979,"lon":-73.97853,"blurb":"The city's fourth-tallest building, its 1,401-foot spire tops the Summit observation deck rising right beside Grand Central Terminal."},{"name":"Lexington Hotel","lat":40.754896,"lon":-73.973022,"blurb":"Its basement once held the tropical-themed Hawaiian Room, and India's Tata Group owned the Grand Central-area hotel through the 1980s."},{"name":"569 Lexington Avenue","lat":40.756658,"lon":-73.971425,"blurb":"Manhattan's first new short-stay hotel in thirty years, Morris Lapidus's Miami Modern design was almost universally panned when it opened in 1961."},{"name":"Graybar Building","lat":40.752698,"lon":-73.975853,"blurb":"Built entirely on air rights above Grand Central's tracks, it has its own ZIP code and a public passage leading into the terminal."},{"name":"Chanin Building","lat":40.751215,"lon":-73.976705,"blurb":"Once the city's third-tallest building, its upper floors held a movie theater, observation deck, radio station, and bus terminal."},{"name":"Pershing Square Building","lat":40.751587,"lon":-73.977503,"blurb":"Critics called its design 'old-fashioned even before it was finished,' and it was pointedly left out of the AIA Guide to New York City."},{"name":"Hyatt Grand Central New York","lat":40.752045,"lon":-73.976336,"blurb":"As the derelict Commodore Hotel, it became Donald Trump's first major project, reborn with Hyatt as the Grand Hyatt in 1980."},{"name":"CBS Studio Building","lat":40.759102,"lon":-73.974054,"blurb":"Bob Dylan, Sinatra, Streisand, and Miles Davis all recorded in this former Vanderbilt guest house that became a Columbia Records studio."},{"name":"Austrian Cultural Forum New York","lat":40.759552,"lon":-73.975272,"blurb":"A vertical marvel, it rises 24 stories on a lot just 25 feet wide, its design chosen from 226 competition entries."},{"name":"Fred F. French Building","lat":40.755371,"lon":-73.978898,"blurb":"Its Art Deco crown bristles with Mesopotamian bas-reliefs and faience tiles, a splash of ancient Babylon commissioned by developer Fred French."},{"name":"Charles Scribner's Sons Building","lat":40.757345,"lon":-73.977687,"blurb":"Its Beaux-Arts facade honors printing pioneers Gutenberg, Caxton, Franklin, and Manutius above the former Scribner's Bookstore."},{"name":"Cornell Club of New York","lat":40.7543,"lon":-73.979359,"blurb":"Home to Cornell's alumni club, this former tool-company office was gifted to the university; members may use the Yale Club's squash courts."},{"name":"St. Patrick's Cathedral","lat":40.758589,"lon":-73.976296,"blurb":"The largest Gothic Revival Catholic cathedral in North America, its construction halted during the Civil War before finishing in 1878."},{"name":"Olympic Tower","lat":40.759201,"lon":-73.976073,"blurb":"Aristotle Onassis developed it and named it for his Olympic Airways; its glass facade mirrors St. Patrick's Cathedral next door."},{"name":"Cartier Building","lat":40.759456,"lon":-73.976017,"blurb":"After the Vanderbilts blocked a hotel on the corner, Morton Plant built his mansion here, then sold it to Cartier, its flagship store ever since."},{"name":"488 Madison Avenue","lat":40.758902,"lon":-73.975256,"blurb":"Nicknamed the Look Building, it was headquarters to Look magazine until the publication folded in 1971."},{"name":"Tower 49","lat":40.757243,"lon":-73.977007,"blurb":"One of the very few buildings whose official name carries a registered trademark symbol, its blue mirror-glass form wraps around a public art gallery."},{"name":"New York Biltmore Hotel","lat":40.753596,"lon":-73.978092,"blurb":"A railroad hotel wired straight into Grand Central by a basement reception room, it was gutted in 1981 despite fierce preservationist protests."},{"name":"The Yale Club of New York City","lat":40.754012,"lon":-73.977521,"blurb":"Frank Mankiewicz mocked Mayor John Lindsay as \"the only populist in history who plays squash at the Yale Club\"; it's the largest college clubhouse ever built."},{"name":"Saint Luke's Lutheran Church","lat":40.759867,"lon":-73.988683,"blurb":"A \"happy marriage\" of Gothic Revival and Art Deco on Restaurant Row, its premises now house both a theatre and a soup kitchen."},{"name":"The Whitby","lat":40.759914,"lon":-73.989639,"blurb":"Glenn Miller and Benny Goodman's tune \"Room 1411\" was named for the suite they shared here in the late 1920s."},{"name":"Todd Haimes Theatre","lat":40.757156,"lon":-73.988119,"blurb":"Its original 42nd Street building collapsed in 1997, and the Selwyn was reborn behind an illuminated steel-and-glass facade."},{"name":"Holy Cross Church","lat":40.758153,"lon":-73.991164,"blurb":"The oldest building on 42nd Street, its Father Duffy, honored at Times Square's Duffy Square, ran a 2:30 A.M. \"Printers' Mass\" for late-shift newspapermen."},{"name":"Times Square Theater","lat":40.756702,"lon":-73.987794,"blurb":"Bids from MTV, Marvel Mania and a 4D-theater company all fell through because the shuttered house had no rear entrance."},{"name":"New Victory Theater","lat":40.756559,"lon":-73.987452,"blurb":"Oscar Hammerstein I built it in 1900; it later became Minsky's Burlesque before its 1995 rebirth as New York's children's theater."},{"name":"Lyric Theatre (New York City, 1998)","lat":40.756784,"lon":-73.987465,"blurb":"Built almost from scratch, it was stitched together from salvaged pieces of the old Apollo and Lyric theaters to satisfy preservation rules."},{"name":"Empire Theatre (42nd Street)","lat":40.756706,"lon":-73.989259,"blurb":"Abbott and Costello first teamed up here in 1935; in 1998 the whole theater was rolled 168 feet west to front an AMC multiplex."},{"name":"Candler Building","lat":40.756138,"lon":-73.988188,"blurb":"Built in 1913 by Coca-Cola magnate Asa Griggs Candler; a 1980s deal leasing it to city agencies sparked a corruption investigation."},{"name":"Nederlander Theatre","lat":40.755497,"lon":-73.988302,"blurb":"The musical Rent had its long home here in Broadway's southernmost theater, which also staged Lena Horne live."},{"name":"Eleven Times Square","lat":40.756624,"lon":-73.989535,"blurb":"Built entirely on spec without a single signed lease, its retail space later became a \"Monopoly Lifesized\" attraction."},{"name":"New Amsterdam Theatre","lat":40.755968,"lon":-73.988035,"blurb":"Home to the Ziegfeld Follies from 1913 to 1927, with a now-disused rooftop theater, it is today Disney's Broadway flagship."},{"name":"330 West 42nd Street","lat":40.757507,"lon":-73.99159,"blurb":"Raymond Hood's blue-green terracotta tower was designed to blend into the sky and is now seen as an early landmark of the International Style."},{"name":"Ethel Barrymore Theatre","lat":40.760107,"lon":-73.986145,"blurb":"Built after Ethel Barrymore agreed to let the Shuberts manage her career, it's one of the few Broadway houses never sold or renamed."},{"name":"Booth Theatre","lat":40.758365,"lon":-73.987094,"blurb":"Named for actor Edwin Booth and unusually paneled in wood, it premiered For Colored Girls... and The Elephant Man."},{"name":"Broadhurst Theatre","lat":40.758272,"lon":-73.987617,"blurb":"Named for producer George Broadhurst, it has hosted Cabaret, Kiss of the Spider Woman, Les Misérables and Mamma Mia!."},{"name":"Lena Horne Theatre","lat":40.759949,"lon":-73.986985,"blurb":"Once a CBS TV studio and long named for Times critic Brooks Atkinson, it was renamed in 2022 for singer and activist Lena Horne."},{"name":"Hayes Theater","lat":40.757851,"lon":-73.987842,"blurb":"Broadway's smallest theater at 597 seats, it once served as a TV studio taping the Merv Griffin Show."},{"name":"Longacre Theatre","lat":40.760338,"lon":-73.985954,"blurb":"Co-owner Harry Frazee sold his stake in 1917 to focus on baseball; the house is named for Longacre Square, the old name of Times Square."},{"name":"Lunt-Fontanne Theatre","lat":40.759183,"lon":-73.985894,"blurb":"Originally the Globe, echoing Shakespeare's London playhouse, it was built with retractable roof and ceiling sections now sealed shut."},{"name":"Majestic Theatre (Broadway)","lat":40.758415,"lon":-73.988018,"blurb":"It housed The Phantom of the Opera from 1988 to 2023, the longest-running production in Broadway history."},{"name":"Music Box Theatre","lat":40.758873,"lon":-73.987151,"blurb":"Irving Berlin built it in 1921 to showcase his own Music Box Revue, and his estate held a stake in it until 2007."},{"name":"Richard Rodgers Theatre","lat":40.759039,"lon":-73.986743,"blurb":"Named for composer Richard Rodgers, it has launched eleven Tony-winning Best shows, from Guys and Dolls to In the Heights to Hamilton."},{"name":"Samuel J. Friedman Theatre","lat":40.76038,"lon":-73.986737,"blurb":"The former Biltmore hosted the WPA's Federal Theatre Project and sat fire-damaged and derelict after 1987 before its full revival."},{"name":"Sardi's","lat":40.757762,"lon":-73.987611,"blurb":"Its walls hold over a thousand celebrity caricatures, first drawn by a Russian refugee for free meals, and the Tony Award was dreamed up here."},{"name":"Shubert Theatre (Broadway)","lat":40.758139,"lon":-73.987256,"blurb":"Named for Sam Shubert, killed in an accident before it opened, it gave A Chorus Line and Chicago long homes on Shubert Alley."},{"name":"St. James Theatre","lat":40.75799,"lon":-73.988154,"blurb":"Original productions of Oklahoma!, The King and I, Hello, Dolly! and The Producers all premiered on its stage."},{"name":"Imperial Theatre","lat":40.759109,"lon":-73.987144,"blurb":"This Shubert house has hosted long runs of Fiddler on the Roof, Dreamgirls, Les Misérables and Billy Elliot."},{"name":"1501 Broadway","lat":40.757227,"lon":-73.986714,"blurb":"Paramount Pictures' Art Deco headquarters, crowned by a four-faced clock and illuminated globe, once held a 3,664-seat movie palace."},{"name":"Ambassador Theatre (Broadway)","lat":40.761247,"lon":-73.98499,"blurb":"Set on a diagonal to squeeze more seats onto its tiny lot, it has hosted the musical Chicago since 2003."},{"name":"Eugene O'Neill Theatre","lat":40.761086,"lon":-73.985754,"blurb":"After the Shuberts lost it to foreclosure in 1934 it hosted Tobacco Road; Neil Simon later owned it, and Book of Mormon has played since 2011."},{"name":"St. Malachy Roman Catholic Church","lat":40.761572,"lon":-73.985745,"blurb":"The theater district's \"Actors' Chapel\" hosted Rudolph Valentino's funeral and Joan Crawford's wedding, with 4 A.M. Masses for night-shift performers."},{"name":"Walter Kerr Theatre","lat":40.760681,"lon":-73.985585,"blurb":"During the 1970s this Broadway house variously served as a pornographic cinema, a vaudeville stage, a children's theater, and a warehouse for storing posters."},{"name":"Brill Building","lat":40.761128,"lon":-73.984651,"blurb":"Named for a haberdasher whose street-level store he later bought, this office block churned out many of the hits that dominated the pop charts in the early 1960s."},{"name":"Broadway Theatre (53rd Street)","lat":40.763403,"lon":-73.983374,"blurb":"One of the few Broadway theaters actually on Broadway, it opened as a movie house on Christmas Day 1924 and later hosted Evita, Les Miserables, and Miss Saigon."},{"name":"Neil Simon Theatre","lat":40.763011,"lon":-73.984525,"blurb":"Its original name 'Alvin' fused its two builders' first names, Alex and Vinton; it opened in 1927 with Gershwin's Funny Face."},{"name":"Mark Hellinger Theatre","lat":40.762598,"lon":-73.984346,"blurb":"A former Warner Bros. movie palace that premiered My Fair Lady, it has served as home to the Times Square Church congregation since 1989."},{"name":"August Wilson Theatre","lat":40.763373,"lon":-73.984193,"blurb":"Modeled on a 15th-century Tuscan villa, it opened in 1925 stocked with classrooms, a library, and a bookstore for the Theatre Guild inside."},{"name":"Algonquin Hotel","lat":40.75594,"lon":-73.982349,"blurb":"Home to the famed literary Algonquin Round Table, it keeps an official hotel cat and once handed out discounts to struggling authors."},{"name":"Hotel Metropole","lat":40.756497,"lon":-73.985396,"blurb":"The city's first hotel with running water in every room, it saw the 1912 gangland murder of Herman Rosenthal and appears in The Great Gatsby as Meyer Wolfsheim's haunt."},{"name":"Church of St. Mary the Virgin","lat":40.758358,"lon":-73.983616,"blurb":"So much incense billows through its services that this Times Square Episcopal church is affectionately nicknamed 'Smoky Mary's.'"},{"name":"James Earl Jones Theatre","lat":40.759118,"lon":-73.983077,"blurb":"Renamed in 2022, it became only the second Broadway house named for a Black theatrical figure; The Merv Griffin Show taped here from 1969 to 1972."},{"name":"30 West 44th Street","lat":40.755308,"lon":-73.981722,"blurb":"Built as the Yale Club's clubhouse in 1901, it later held wartime U.S. Maritime Service offices before becoming home to the Penn Club."},{"name":"Hudson Theatre","lat":40.757112,"lon":-73.98444,"blurb":"Its original operator, Henry B. Harris, went down with the Titanic in 1912, after which his widow Renee ran one of Broadway's oldest houses."},{"name":"Lyceum Theatre (Broadway)","lat":40.757883,"lon":-73.984494,"blurb":"The oldest continuously operating legitimate theater in New York, it hides an apartment above its lobby, now home to the Shubert Archives."},{"name":"Jacqueline Kennedy Onassis High School for International Careers","lat":40.757636,"lon":-73.983467,"blurb":"Its building once housed the Performing Arts High School that inspired the 1980 film Fame, until a 1988 fire gutted the interior."},{"name":"State University of New York College of Optometry","lat":40.754488,"lon":-73.982168,"blurb":"It traces its roots to the 1910 Columbia University School of Optometry, the first university-based optometry program in the United States."},{"name":"W. R. Grace Building","lat":40.754689,"lon":-73.982676,"blurb":"Gordon Bunshaft's swooping travertine tower drew such backlash for its odd concave shape that the company later held a contest to redesign its plaza."},{"name":"20 Times Square","lat":40.759232,"lon":-73.984077,"blurb":"Its site once held the famed Unique Recording Studios, and the tower now wears one of the world's largest video screens, a wraparound of 16 million LEDs."},{"name":"Sheraton New York Times Square Hotel","lat":40.762384,"lon":-73.981442,"blurb":"Opened by the Tisch brothers in 1962 as the Americana, its rooms had closed-circuit TV letting guests watch the ballrooms and exhibition halls."},{"name":"Radio City Music Hall","lat":40.759817,"lon":-73.979275,"blurb":"Built on a plot meant for a Metropolitan Opera house, the 'Showplace of the Nation' opened in 1932 with the world's largest auditorium and is home to the Rockettes."},{"name":"400 Madison Avenue","lat":40.756377,"lon":-73.97693,"blurb":"Barely 45 feet wide, it rises on the air rights above Grand Central's underground tracks, part of the 'Terminal City' that sprouted over the rails."},{"name":"Salmon Tower Building","lat":40.754309,"lon":-73.981814,"blurb":"The 1928 campaign to elect Herbert Hoover president was headquartered here, and The New Yorker's offices occupied the building through the 1990s."},{"name":"Belasco Theatre","lat":40.756655,"lon":-73.983792,"blurb":"Impresario David Belasco built himself a ten-room duplex penthouse atop his own theater, packed with memorabilia above its Tiffany lighting and Everett Shinn murals."},{"name":"Mount Vernon Hotel Museum","lat":40.760522,"lon":-73.959713,"blurb":"One of Manhattan's few surviving pre-1800 buildings, this 1799 carriage house became a country day-hotel where 1820s New Yorkers escaped the city's dirt and noise."},{"name":"Central Synagogue","lat":40.759586,"lon":-73.970566,"blurb":"Its Moorish Revival sanctuary, built in 1872, was gutted by fire in 1998 and painstakingly rebuilt; Angela Buchdahl became its senior rabbi in 2014."},{"name":"Ritz Tower","lat":40.761647,"lon":-73.970165,"blurb":"Built as an apartment hotel with no kitchens in any of its 400 units, it briefly belonged to William Randolph Hearst before he lost it to bondholders."},{"name":"Argosy Book Store","lat":40.762386,"lon":-73.969167,"blurb":"New York's oldest independent bookstore, it employed a young Patti Smith in 1967 and stocked books for FDR, Jackie Kennedy, and Bill Clinton."},{"name":"Allerton Hotel for Women","lat":40.760795,"lon":-73.969593,"blurb":"Built in 1923 to house hundreds of working women and shelter young girls, the Allerton chain was named for Mayflower passenger Mary Allerton."},{"name":"Trump Plaza","lat":40.763232,"lon":-73.965702,"blurb":"Its concrete was supplied by mobster Anthony 'Fat Tony' Salerno, tied to Trump through lawyer Roy Cohn; a worker died falling 33 stories during construction."},{"name":"Times Square Ball","lat":40.756132,"lon":-73.986577,"blurb":"First dropped to welcome 1908 by Times owner Adolph Ochs, the ball has gone dark only twice, in 1942 and 1943, for wartime blackouts."},{"name":"Church of St. Vincent Ferrer","lat":40.766201,"lon":-73.964662,"blurb":"Ivana Trump's 2022 funeral Mass was held here, in a church bearing one of the few outdoor Crucifixion statues on any American Catholic church."},{"name":"Kosciuszko Foundation","lat":40.76776,"lon":-73.969082,"blurb":"Named for the Polish general who fought in the American Revolution, it occupies a 1917 mansion built for a Van Alen whose Astor in-laws lived down the block."},{"name":"Church of St. John Nepomucene","lat":40.764009,"lon":-73.958317,"blurb":"Founded in 1895 by Slovak immigrants who first gathered on the Lower East Side, its parishioners organized themselves under the Society of St. Matthew."},{"name":"Belaire Apartments","lat":40.76594,"lon":-73.952408,"blurb":"A small plane crashed into the tower on October 11, 2006, and its residents have included junk-bond felon Ivan Boesky and future Pakistani president Asif Ali Zardari."},{"name":"First Hungarian Reformed Church of New York","lat":40.766116,"lon":-73.958499,"blurb":"The only church ever designed by Emery Roth, better known for his grand Central Park West apartment towers, it has anchored the Hungarian community since 1916."},{"name":"Archdiocesan Cathedral of the Holy Trinity","lat":40.769829,"lon":-73.95612,"blurb":"The largest Eastern Orthodox church in the Western Hemisphere, its cornerstone was laid by Eleanor Roosevelt in 1931."},{"name":"Trump Palace Condominiums","lat":40.767407,"lon":-73.961751,"blurb":"The tallest building on the Upper East Side for 26 years, it figured in a scheme where Fred Trump sold his $15.5 million stake to son Donald for $10,000 to dodge gift tax."},{"name":"Park East Synagogue","lat":40.766996,"lon":-73.963366,"blurb":"In 1957 Robert Briscoe, the Jewish Lord Mayor of Dublin, prayed here on Shabbos morning carrying his tallis bag; its asymmetrical twin towers are unusual for the era."},{"name":"New York School of Interior Design","lat":40.768564,"lon":-73.962464,"blurb":"The nation's college devoted exclusively to interior design, founded in 1916 on the belief that a well-designed interior 'improves human welfare.'"},{"name":"Park Avenue Armory","lat":40.767232,"lon":-73.9655,"blurb":"Its 200-by-300-foot drill hall was among NYC's largest column-free indoor spaces, with regimental rooms decorated by Louis Comfort Tiffany and Stanford White."},{"name":"Henry P. Davison House","lat":40.769128,"lon":-73.965677,"blurb":"In 2001 thieves pried the official seal of the Italian consulate right off the front door of this Park Avenue banker's mansion."},{"name":"Asia Society","lat":40.769838,"lon":-73.964291,"blurb":"Founded by John D. Rockefeller 3rd in 1956, it has been described as a participant in the Chinese Communist Party's diplomatic 'backchannel.'"},{"name":"Frick Collection","lat":40.771277,"lon":-73.967146,"blurb":"Steel baron Henry Clay Frick's Beaux-Arts mansion, now showing Vermeer, Rembrandt, Titian and Velázquez much as he bequeathed them for public view."},{"name":"St. James' Episcopal Church","lat":40.771124,"lon":-73.965381,"blurb":"It hosted the funerals of John Steinbeck, Edward R. Murrow, and Montgomery Clift, and its interior appeared in Gossip Girl."},{"name":"Gertrude Rhinelander Waldo House","lat":40.771456,"lon":-73.965415,"blurb":"The heiress who built this limestone château never moved in and refused to sell, rent, or even maintain it; Ralph Lauren later made it his flagship store."},{"name":"Temple Israel of the City of New York","lat":40.772569,"lon":-73.961848,"blurb":"Founded in 1873 as 'Hand in Hand,' Harlem's first synagogue, worshiping above a printing shop on East 125th Street."},{"name":"945 Madison Avenue","lat":40.773409,"lon":-73.963818,"blurb":"Marcel Breuer's inverted-ziggurat Brutalist landmark has housed the Whitney, the Met Breuer, the Frick, and now Sotheby's global headquarters."},{"name":"Carlyle Hotel","lat":40.774387,"lon":-73.96299,"blurb":"Named for author Thomas Carlyle, its Cafe Carlyle and Bemelmans Bar drew jazz greats like Bobby Short and a steady stream of celebrities and royalty."},{"name":"Payne Whitney House","lat":40.776561,"lon":-73.963652,"blurb":"This wedding-gift mansion took so long to build that architect Stanford White was murdered before completion; its rotunda holds a work attributed to Michelangelo."},{"name":"James B. Duke House","lat":40.776333,"lon":-73.963712,"blurb":"Tobacco baron James B. Duke's copy of a Bordeaux château, where tobacco heiress Doris Duke lived until the family donated it to NYU in 1958."},{"name":"Harry F. Sinclair House","lat":40.776708,"lon":-73.96354,"blurb":"Home to Teapot Dome oilman Harry F. Sinclair and later to descendants of Peter Stuyvesant, it's now the Ukrainian Institute of America."},{"name":"Birch Wathen Lenox School","lat":40.772472,"lon":-73.957686,"blurb":"Alumni include Barbara Walters, novelist Judith Krantz, Hope Cooke (the last Queen of Sikkim), and Murray Rothbard, founder of anarcho-capitalism."},{"name":"Eleanor Roosevelt High School","lat":40.770287,"lon":-73.95327,"blurb":"It admits just 125-to-140 students a year from over 6,000 applicants, and is often chosen over the city's specialized high schools."},{"name":"Hungarian House of New York","lat":40.776113,"lon":-73.954956,"blurb":"Its halls have welcomed Nobel physicists Edward Teller and Dennis Gábor plus Otto von Habsburg; it was bought from a German athletic club in 1966."},{"name":"Our Lady of Good Counsel Church","lat":40.780644,"lon":-73.950964,"blurb":"A little-known teenage Harry Connick Jr. served as the church pianist here from 1985 to 1987."},{"name":"Islamic Cultural Center of New York","lat":40.785471,"lon":-73.948571,"blurb":"New York's first purpose-built mosque, deliberately rotated 29 degrees off the street grid so its mihrab faces Mecca."},{"name":"St. Francis de Sales Roman Catholic Church","lat":40.786317,"lon":-73.951256,"blurb":"Actor and dancer James Cagney counted among its parishioners on the Upper East Side."},{"name":"Substation 7","lat":40.787146,"lon":-73.948379,"blurb":"This traction substation converted power to run the IRT Lexington Avenue Line from 1918 until the 1970s, beside the old Third Avenue El."},{"name":"Brick Presbyterian Church","lat":40.783733,"lon":-73.955188,"blurb":"Mark Twain's funeral was held here in 1910; the British had used the congregation's first building to jail prisoners during the Revolution."},{"name":"Church of the Heavenly Rest","lat":40.783688,"lon":-73.958191,"blurb":"Founded by Civil War veterans, it holds the ashes of actress Gloria Swanson and stood in for a church in the 1997 film The Devil's Advocate."},{"name":"Consulate General of Russia","lat":40.784507,"lon":-73.957006,"blurb":"Set in a Carrère & Hastings mansion; in 1948 Soviet teacher Oksana Kasenkina's dramatic bid for refuge from the earlier consulate became an international incident."},{"name":"Andrew Carnegie Mansion","lat":40.784289,"lon":-73.957761,"blurb":"Steel magnate Andrew Carnegie's 64-room mansion, now the Cooper-Hewitt; he split his time between here and Scotland's Skibo Castle."},{"name":"James A. Burden House","lat":40.784612,"lon":-73.957255,"blurb":"Iron heir James Burden's Warren & Wetmore mansion, with a sweeping oval staircase hall, now serves as the Convent of the Sacred Heart school."},{"name":"Otto H. Kahn House","lat":40.784757,"lon":-73.957574,"blurb":"Financier Otto Kahn's mansion had a private theater and 15 en-suite bedrooms; he split his time with Long Island's Oheka Castle."},{"name":"St. Thomas More Church","lat":40.782749,"lon":-73.956728,"blurb":"After John F. Kennedy Jr.'s 1999 plane crash, the family held his private memorial here, with Ted Kennedy delivering the eulogy and Bill Clinton attending."},{"name":"Unitarian Church of All Souls","lat":40.775326,"lon":-73.958192,"blurb":"New York's first Unitarian congregation, sparked in 1819 when William Ellery Channing preached to forty neighbors in a Lower Manhattan parlor."},{"name":"New York Society Library","lat":40.776333,"lon":-73.961451,"blurb":"New York's oldest cultural institution (1754), it served as the de facto Library of Congress and has lent books to everyone from George Washington on."},{"name":"995 Fifth Avenue","lat":40.778008,"lon":-73.962545,"blurb":"As the Stanhope Hotel, jazz legend Charlie Parker died in a suite here in 1955, in the rooms of jazz patroness Nica de Koenigswarter."},{"name":"Marymount School of New York","lat":40.779918,"lon":-73.961212,"blurb":"This girls' school occupies three Gilded Age Fifth Avenue mansions, including a former Vanderbilt estate; alumnae include the Grand Duchess of Luxembourg."},{"name":"Park Avenue Christian Church","lat":40.779488,"lon":-73.958263,"blurb":"Its Gothic sanctuary was modeled on Paris's Sainte-Chapelle and glows with a stained-glass window designed by Louis Comfort Tiffany."},{"name":"Park Avenue Synagogue","lat":40.781116,"lon":-73.957955,"blurb":"Its Moorish sanctuary was dedicated in 1927 with Mayor Jimmy Walker attending, and now displays modern stained glass by artist Adolf Gottlieb."},{"name":"Neue Galerie New York","lat":40.781219,"lon":-73.960237,"blurb":"Ronald Lauder's museum of Klimt and Schiele, born as a tribute to his late friend Serge Sabarsky, is set to merge with the Met in 2028."},{"name":"Dalton School","lat":40.781532,"lon":-73.955062,"blurb":"Jeffrey Epstein taught physics and math here in the mid-1970s; the school pioneered the individualized 'Dalton Plan' and was championed by Eleanor Roosevelt."},{"name":"George F. Baker Jr. Houses","lat":40.784896,"lon":-73.954166,"blurb":"A three-mansion Delano & Aldrich complex built for banker George F. Baker Jr.; one of its houses recently listed for nearly $18 million."},{"name":"Jewish Museum","lat":40.785405,"lon":-73.957186,"blurb":"Its collection swelled with ceremonial objects shipped from Poland in 1939 for safekeeping just as World War II broke out."},{"name":"Lucy Drexel Dahlgren House","lat":40.787705,"lon":-73.954555,"blurb":"A French-townhouse-style mansion built for Drexel heiress Lucy Wharton Drexel Dahlgren, later used for a time as a convent."},{"name":"Icahn School of Medicine at Mount Sinai","lat":40.789793,"lon":-73.953254,"blurb":"Renamed in 2012 after a $200 million gift from corporate raider Carl Icahn, it opened the first academic department of geriatrics in the United States."},{"name":"IRT Powerhouse","lat":40.771896,"lon":-73.9921,"blurb":"Designed by architect Stanford White to power New York's first subway line, it could generate more than 100,000 horsepower at its peak."},{"name":"Holy Trinity Lutheran Church","lat":40.772069,"lon":-73.97941,"blurb":"In Ghostbusters, the rampaging Stay Puft Marshmallow Man tramples this church, prompting Venkman's cry: 'Nobody steps on a church in my town!'"},{"name":"Second Church of Christ, Scientist","lat":40.773618,"lon":-73.978297,"blurb":"After a 2003 merger, the surviving congregation kept the name 'First Church' yet worships inside this Beaux-Arts building's copper-domed sanctuary."},{"name":"York Preparatory School","lat":40.774103,"lon":-73.979416,"blurb":"Lin-Manuel Miranda's adopted brother Miguel attended this for-profit school, whose uniformed 'Yorkies' were namechecked on an episode of ABC's Castle."},{"name":"Church of the Blessed Sacrament","lat":40.77711,"lon":-73.981222,"blurb":"A performing arts venue, the ArcLight Theatre, once occupied the lower level of this Upper West Side Catholic church east of Broadway."},{"name":"The Majestic (apartment building)","lat":40.776058,"lon":-73.976648,"blurb":"The Chanin brothers who built these Art Deco twin towers in 1931 lost the whole building to foreclosure just two years later."},{"name":"Rutgers Presbyterian Church","lat":40.779594,"lon":-73.982443,"blurb":"Once the denomination's largest congregation, it now flies a Black Lives Matter banner, offers gender-fluid buttons, and doesn't require members to believe in God."},{"name":"The San Remo","lat":40.778008,"lon":-73.975152,"blurb":"The first building on Central Park West to feature twin towers, it fell into receivership when the Bank of United States collapsed."},{"name":"West End Collegiate Church","lat":40.783039,"lon":-73.981554,"blurb":"Part of America's oldest continuing Protestant congregation, it became a WWII Dutch relief center visited twice by Princess Juliana of the Netherlands."},{"name":"First Baptist Church in the City of New York","lat":40.784296,"lon":-73.980237,"blurb":"Its first pastor, John Gano, left in 1776 to serve as a chaplain in General Washington's Continental Army."},{"name":"All Angels' Church","lat":40.784952,"lon":-73.979997,"blurb":"Founded to serve Seneca Village, the free Black settlement razed to build Central Park, it later became the church of author Madeleine L'Engle."},{"name":"Jewish Center","lat":40.787242,"lon":-73.973239,"blurb":"Members affectionately dub it 'the first Shul with a Pool,' America's first synagogue built as a cultural and recreational home, not just a sanctuary."},{"name":"Crenshaw Christian Center","lat":40.792064,"lon":-73.964891,"blurb":"Its 10,145-seat FaithDome was America's largest domed church; ABC's 20/20 later apologized for a misleading segment on its pastor's wealth."},{"name":"Holy Trinity Church (Upper West Side)","lat":40.785572,"lon":-73.977375,"blurb":"Built deliberately in the Byzantine style with a Guastavino-tile dome, it's called one of the finest examples of Byzantine architecture in the country."},{"name":"Church of St. Paul and St. Andrew","lat":40.788938,"lon":-73.977285,"blurb":"After being landmarked in 1981, the congregation fought to demolish its own building and lost; its Lessons and Carols later aired on CBS."},{"name":"B'nai Jeshurun","lat":40.790103,"lon":-73.976168,"blurb":"The second synagogue founded in New York, its Civil War-era rabbi Morris Raphall delivered the notorious 'Bible view of slavery' sermon defending the institution."},{"name":"St. Ignatius of Antioch Church","lat":40.789277,"lon":-73.977164,"blurb":"It was among the first parishes to welcome ordained women, including Ellen Barrett, the first openly gay woman ordained in the Episcopal Church."},{"name":"The Cornwall","lat":40.791173,"lon":-73.974806,"blurb":"Its ornate Art Nouveau cornice, dubbed 'a terra-cotta diadem,' was so prized that owners paid $600,000 in 1991 to replace it with replicas."},{"name":"Annunciation Greek Orthodox Church","lat":40.792052,"lon":-73.976026,"blurb":"Its rare stained glass may be the work of Tiffany studios or John LaFarge, father of the church's own architect."},{"name":"Soldiers' and Sailors' Monument","lat":40.792096,"lon":-73.978927,"blurb":"Modeled on Athens' Choragic Monument of Lysicrates, this Civil War memorial was dedicated on Memorial Day 1902 by President Theodore Roosevelt himself."},{"name":"Holy Name of Jesus Roman Catholic Church","lat":40.794486,"lon":-73.970639,"blurb":"Its longtime pastor, Bishop Stephen Donahue, was floated to become Archbishop of New York in 1939 before the Pope chose Francis Spellman."},{"name":"Trinity Evangelical Lutheran Church of Manhattan","lat":40.796222,"lon":-73.968075,"blurb":"The parish fought Robert Moses for a decade and won, leaving its 1908 church the only building left standing within 32 razed acres."},{"name":"St. Michael's Episcopal Church","lat":40.796356,"lon":-73.969079,"blurb":"Alexander Hamilton's widow Elizabeth Schuyler Hamilton worshipped here; the parish later sold air rights to finance restoration and enable The Ariel towers."},{"name":"Cleburne Building","lat":40.800951,"lon":-73.96851,"blurb":"It rose on the former mansion site of Isidor and Ida Straus, who perished on the Titanic; 'The Wiz' composer Charlie Smalls later lived here."},{"name":"Museum of the City of New York","lat":40.792506,"lon":-73.951908,"blurb":"Born inside Gracie Mansion in 1923, it recently exhibited a truck driver's handmade model of the city that had gone viral on TikTok."},{"name":"El Museo del Barrio","lat":40.793106,"lon":-73.951395,"blurb":"The nation's oldest museum devoted to Latino art occupies a former fire station where radical activists once burned books during the Nuyorican Movement."},{"name":"Lincoln Correctional Facility","lat":40.797758,"lon":-73.950628,"blurb":"This minimum-security prison facing Central Park held drug offenders and white-collar criminals on work release before becoming temporary housing for asylum seekers."},{"name":"Masjid Malcolm Shabazz","lat":40.801989,"lon":-73.950196,"blurb":"Malcolm X preached here as minister of Mosque No. 7; the temple was bombed in 1965 just after his assassination."},{"name":"La Marqueta","lat":40.798302,"lon":-73.943979,"blurb":"In its 1950s heyday over 500 vendors sold everything from Latin records to supplies for charms and curses beneath the Park Avenue railway viaduct."},{"name":"Church of Our Lady Queen of Angels","lat":40.795321,"lon":-73.940444,"blurb":"Built as a German national parish in 1886, this cul-de-sac church now shelters nuns who run the Fr. Solanus Soup Kitchen."},{"name":"Langston Hughes House","lat":40.807199,"lon":-73.940536,"blurb":"Langston Hughes wrote 'Montage of a Dream Deferred' and 'I Wonder as I Wander' from the top-floor workroom he kept here for twenty years."},{"name":"Hotel Theresa","lat":40.808753,"lon":-73.948928,"blurb":"Known as 'the Waldorf of Harlem' after it desegregated in 1940, it inspired the 1959 heist at the heart of Colson Whitehead's Harlem Shuffle."},{"name":"Apollo Theater","lat":40.810129,"lon":-73.949863,"blurb":"Home of the star-making Amateur Night, this former whites-only burlesque house became Harlem's premier stage for Black performers in 1934."},{"name":"Substation 219","lat":40.815701,"lon":-73.948063,"blurb":"This double-height Art Deco substation, trimmed with limestone chevrons, was built in 1932 to feed power to the subway's IND Eighth Avenue Line."},{"name":"Ivey Delph Apartments","lat":40.822089,"lon":-73.946646,"blurb":"Designed by pioneering African American architect Vertner Woodson Tandy, its Moderne facade sports curved projecting balconies with iron railings in Hamilton Heights."},{"name":"Hamilton Grange Library","lat":40.825712,"lon":-73.947997,"blurb":"One of 65 libraries Andrew Carnegie funded across New York, it was designed by the celebrated firm McKim, Mead & White in 1905."},{"name":"Grant's Tomb","lat":40.813454,"lon":-73.963051,"blurb":"Modeled on the ancient Mausoleum at Halicarnassus, this domed tomb of President Ulysses S. Grant was rescued from neglect by a campaigning college student in the 1990s."},{"name":"Studebaker Building (Columbia University)","lat":40.818349,"lon":-73.957849,"blurb":"Its blue 1912 Studebaker logo still glows near the roofline, and a later tenant here built the sirens for every NYPD vehicle from 1979 to 1989."},{"name":"Schapiro Hall","lat":40.807916,"lon":-73.965174,"blurb":"Completed in 1988, it finally let Columbia house every undergraduate on campus, and later counted author Patrick Radden Keefe among its residents."},{"name":"Butler Library","lat":40.806367,"lon":-73.963191,"blurb":"It played a haunted backdrop in 1984's Ghostbusters and guards the mantelpiece from the very room where Edgar Allan Poe penned 'The Raven.'"},{"name":"Columbia University Graduate School of Journalism","lat":40.807583,"lon":-73.96347,"blurb":"Hungarian-born press baron Joseph Pulitzer funded the world's first journalism school here, and it still administers the Pulitzer Prizes."},{"name":"Columbia Law School","lat":40.807004,"lon":-73.960275,"blurb":"Its diplomas went to presidents Theodore and Franklin Roosevelt, ten Supreme Court justices, and Moe Berg, a big-league catcher who moonlighted as a U.S. spy."},{"name":"Church of Notre Dame","lat":40.805107,"lon":-73.960367,"blurb":"By a special arrangement since 1913, water from the miraculous spring at Lourdes has been shipped here and kept continuously available to worshippers."},{"name":"Morris–Jumel Mansion","lat":40.834468,"lon":-73.93858,"blurb":"The oldest house in Manhattan, built in 1765, it served for one month in 1776 as George Washington's Revolutionary War headquarters."},{"name":"Hispanic Society of America","lat":40.833365,"lon":-73.946635,"blurb":"Despite its name it was never a learned society, yet it hoards a first edition of Don Quijote and masterworks by Velázquez, Goya, and El Greco."},{"name":"Presbyterian Hospital","lat":40.840868,"lon":-73.941456,"blurb":"Founded in 1868, it joined with Columbia to build the world's first combined medical school and hospital, the Columbia-Presbyterian Medical Center."},{"name":"Audubon Ballroom","lat":40.839236,"lon":-73.940621,"blurb":"Malcolm X was assassinated here on February 21, 1965, mid-speech at a meeting of his Organization of Afro-American Unity."},{"name":"Incarnation Children's Center","lat":40.843329,"lon":-73.9366,"blurb":"HIV-positive foster children were enrolled in antiretroviral drug trials here, sparking a contested 2005 BBC documentary, 'Guinea Pig Kids,' that the network later apologized for."},{"name":"Cary Building","lat":40.715278,"lon":-74.007963,"blurb":"Its landmark twin cast-iron facades once fronted The New York Sun, and a 1920s street widening left a 200-foot wall of plain brick exposed alongside."},{"name":"Barclay–Vesey Building","lat":40.713771,"lon":-74.012933,"blurb":"One of the first Art Deco skyscrapers, it was so battered when the Twin Towers fell that restoring it took three years and $1.4 billion."},{"name":"7 World Trade Center","lat":40.713396,"lon":-74.012077,"blurb":"The original tower collapsed hours after the Twin Towers on September 11, 2001, felled by fire and debris rather than a plane."},{"name":"90 Church Street","lat":40.712719,"lon":-74.010651,"blurb":"After 9/11 buried it in debris, postal workers here painstakingly returned individual pieces of mail dug from Ground Zero to their addressees."},{"name":"New York County Lawyers' Association Building","lat":40.711933,"lon":-74.009202,"blurb":"Woolworth Building architect Cass Gilbert designed this Georgian headquarters to deliberately complement St. Paul's Chapel across the street."},{"name":"St. Peter's Church","lat":40.712369,"lon":-74.009572,"blurb":"New York State's oldest Catholic parish, where one theory holds Billy the Kid was christened in 1859 and where saint Elizabeth Ann Seton converted."},{"name":"Transportation Building","lat":40.711993,"lon":-74.008653,"blurb":"Rising on the site of the once-grand Astor House hotel, it housed the fledgling Pace Institute, forerunner of Pace University, as an early tenant."},{"name":"St. Paul's Chapel","lat":40.711315,"lon":-74.009196,"blurb":"Manhattan's oldest surviving church, built in 1766, it emerged unscathed when the Twin Towers fell behind it, earning the nickname 'The Little Chapel That Stood.'"},{"name":"Bennett Building","lat":40.710526,"lon":-74.007731,"blurb":"Clad in the world's largest cast-iron facade, it was commissioned by newspaper heir James Gordon Bennett Jr.; a later owner, John Pettit, simply vanished in 1898."},{"name":"200 Vesey Street","lat":40.71357,"lon":-74.014881,"blurb":"Its Winter Garden shelters sixteen 40-foot palm trees hauled from the Mojave Desert; the tower once served as Lehman Brothers' world headquarters."},{"name":"City Pier A","lat":40.704412,"lon":-74.017914,"blurb":"The last masonry pier in New York, it long served as NYPD harbor police headquarters and later a fireboat station beneath its Hudson-facing clock tower."},{"name":"4 World Trade Center","lat":40.7103,"lon":-74.011962,"blurb":"The nine-story original was crushed on September 11, 2001; its 978-foot replacement now houses the Port Authority that owns the whole site."},{"name":"88 Greenwich Street","lat":40.707872,"lon":-74.014085,"blurb":"Hurricane Sandy poured some three million cubic feet of saltwater into its basement in 2012, cracking a dislodged oil tank against a ceiling beam."},{"name":"Downtown Community House","lat":40.708471,"lon":-74.014037,"blurb":"One of the last remnants of 'Little Syria,' it was built with money from the founder of Bon Ami cleaner and later became a Buddhist temple."},{"name":"W New York Downtown Hotel and Residences","lat":40.709207,"lon":-74.013668,"blurb":"A $1.5 million apartment inside was given away as the grand prize in a 2010 HGTV contest."},{"name":"Perelman Performing Arts Center","lat":40.712672,"lon":-74.012293,"blurb":"Named for billionaire Ronald Perelman, who gave $75 million, it finally rose at the World Trade Center in 2023 after nearly two decades of scrapped designs."},{"name":"St. Nicholas Greek Orthodox Church","lat":40.710143,"lon":-74.013225,"blurb":"The only house of worship destroyed on September 11, it was rebuilt by Santiago Calatrava as a luminous marble shrine echoing the Hagia Sophia."},{"name":"125 Greenwich Street","lat":40.709108,"lon":-74.012746,"blurb":"Welding sparks ignited insulation and set this Rafael Viñoly-designed residential tower's roof ablaze one March 2024 morning."},{"name":"90 West Street","lat":40.709988,"lon":-74.01425,"blurb":"Its top-floor Garret Restaurant was billed as the highest restaurant in the world, and the Gothic Cass Gilbert tower survived the 9/11 collapse next door."},{"name":"John Street Methodist Church","lat":40.70909,"lon":-74.00815,"blurb":"Home to North America's oldest Methodist congregation, its museum keeps a clock given by John Wesley himself and counts blind hymnist Fanny Crosby among past members."},{"name":"M Social Hotel New York Downtown","lat":40.71113,"lon":-74.010217,"blurb":"Its developer deliberately misspelled it 'Millenium' with one 'n' for distinctiveness; the flag that hung here on 9/11 is displayed in the lobby."},{"name":"One Liberty Plaza","lat":40.709737,"lon":-74.010857,"blurb":"It rose on the demolished Singer Building, briefly the world's tallest skyscraper, packing nearly an acre of office space onto each of its floors."},{"name":"Trinity Church","lat":40.708055,"lon":-74.012216,"blurb":"The tallest building in America until 1869, its grounds birthed Columbia University as King's College in 1754, and its parish now holds over $6 billion in real estate."},{"name":"Corbin Building","lat":40.710182,"lon":-74.009136,"blurb":"Named for a Long Island Rail Road president, this 1889 tower was later rehabilitated by the MTA and folded into the Fulton Center subway complex."},{"name":"American Surety Building","lat":40.70797,"lon":-74.011114,"blurb":"One of Manhattan's earliest steel-framed skyscrapers, it rose across from Trinity Church in 1896 as the city's second-tallest building."},{"name":"Federal Reserve Bank of New York","lat":40.708366,"lon":-74.008687,"blurb":"Custodian of the world's largest gold reserve, its vault was hailed by Popular Mechanics in 1930 as the \"World's Greatest Treasure Cave.\""},{"name":"140 Broadway","lat":40.708605,"lon":-74.010019,"blurb":"Isamu Noguchi's bright-red \"Cube\" balances on one corner outside this smooth black Gordon Bunshaft tower on a trapezoidal plot."},{"name":"Adams Express Building","lat":40.707105,"lon":-74.012824,"blurb":"A 1904 basement fire that drew twenty-four engines destroyed the Pinkerton Building on this site, yet Adams Express kept operating there."},{"name":"Cunard Building","lat":40.705777,"lon":-74.013966,"blurb":"Its opulent 185-foot Great Hall, where travelers once booked passage on Cunard ocean liners, later became a post office and now hosts Cipriani."},{"name":"Empire Building","lat":40.707483,"lon":-74.012515,"blurb":"Home of U.S. Steel from the company's 1901 founding until 1976, it's one of the earliest skyscrapers built on pneumatic caissons."},{"name":"1 Broadway","lat":40.704959,"lon":-74.014441,"blurb":"Rebuilt in Neoclassical style as headquarters of the International Mercantile Marine shipping empire and its successor United States Lines until 1979."},{"name":"New York Stock Exchange Building","lat":40.707025,"lon":-74.01121,"blurb":"Its iconic Broad Street colonnade, crowned by a pediment depicting commerce and industry, fronts a 72-foot-tall trading floor."},{"name":"Bowling Green Offices Building","lat":40.705285,"lon":-74.014242,"blurb":"Built beside the harbor in the 1890s, it filled with steamship company offices before later housing law firms."},{"name":"Downtown Athletic Club","lat":40.706186,"lon":-74.01561,"blurb":"This club issued the Heisman Trophy, named for John Heisman, its first athletic director, before closing after 9/11 blockades cut off access."},{"name":"48 Wall Street","lat":40.706486,"lon":-74.00912,"blurb":"Topped by a Federal-style cupola and an eagle statue, it was the Bank of New York's third home on a plot the bank first built on in 1797."},{"name":"Our Lady of Victory Church","lat":40.707014,"lon":-74.008716,"blurb":"Cardinal Spellman founded this \"War Memorial Church\" in 1944 as WWII victory neared, dedicating it to America's \"valiant dead.\""},{"name":"56 Pine Street","lat":40.706845,"lon":-74.008335,"blurb":"Its Romanesque facade sports flowered panels and fantastic carved heads praised as \"some of the finest Byzantine carving in New York.\""},{"name":"170–176 John Street","lat":40.705899,"lon":-74.004284,"blurb":"Erected in 1840, it's one of possibly only two granite-faced Greek Revival buildings still standing in New York City."},{"name":"120 Wall Street","lat":40.704764,"lon":-74.005949,"blurb":"This classic wedding-cake setback tower stood as the lone high-rise on the downtown East River waterfront for decades after opening in 1930."},{"name":"75 Wall Street","lat":40.705141,"lon":-74.007978,"blurb":"Built in 1987 as British bank Barclays' North American headquarters, its upper floors are now condos above a Hyatt hotel."},{"name":"1 Wall Street Court","lat":40.705195,"lon":-74.008526,"blurb":"Carved beavers crown the entrance of this flatiron-shaped tower, once home to the New York Cocoa Exchange from 1931 to 1972."},{"name":"19 Dutch","lat":40.709811,"lon":-74.007377,"blurb":"Zara founder Amancio Ortega bought this 758-foot residential tower for about $500 million in 2022."},{"name":"Ted Weiss Federal Building","lat":40.714726,"lon":-74.005142,"blurb":"Construction halted in 1991 when workers unearthed human remains, revealing the colonial-era African Burial Ground now memorialized at its base."},{"name":"Home Life Building","lat":40.713424,"lon":-74.007477,"blurb":"Expanded from 12 to 16 stories mid-construction in the 1890s, it briefly ranked among the tallest buildings in the city."},{"name":"Potter Building","lat":40.711526,"lon":-74.006513,"blurb":"Rising from the ashes of the New York World headquarters that burned in 1882, it pioneered advanced fireproofing and iron-frame construction."},{"name":"Morse Building","lat":40.711244,"lon":-74.006185,"blurb":"Developed by nephews of telegraph inventor Samuel Morse, it was among New York's tallest buildings when finished in 1880."},{"name":"Tower 270","lat":40.71428,"lon":-74.006943,"blurb":"The Manhattan Project took its name from this building, whose 18th floor held the atomic-bomb program's first headquarters in 1942."},{"name":"Daniel Patrick Moynihan United States Courthouse","lat":40.713727,"lon":-74.0008,"blurb":"The nation's second-largest federal courthouse, home to the storied SDNY, features public art by Maya Lin."},{"name":"St. James Roman Catholic Chu
