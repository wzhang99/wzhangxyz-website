rch","lat":40.712239,"lon":-73.998492,"blurb":"Future New York governor Al Smith served as an altar boy here, and the Ancient Order of Hibernians organized its first branch in the church in 1836."},{"name":"Mariner's Temple","lat":40.712968,"lon":-73.997708,"blurb":"Early Swedish Baptist leaders Anders Wiberg and John Alexis Edgren were ordained in this 1845 brownstone church with Ionic columns."},{"name":"Metropolitan Correctional Center","lat":40.713206,"lon":-74.001536,"blurb":"Dubbed the \"Guantanamo of New York,\" this jail held John Gotti, Bernie Madoff, Jeffrey Epstein, and El Chapo before closing in 2021."},{"name":"1 Police Plaza","lat":40.7122,"lon":-74.001852,"blurb":"The NYPD's inverted-pyramid brutalist headquarters houses the Real Time Crime Center and the commissioner's fabled \"Thirteenth Floor\" office."},{"name":"55 Water Street","lat":40.703227,"lon":-74.009063,"blurb":"On completion in 1972 it was the world's largest privately owned office building, and it's now owned by Alabama's state pension fund."},{"name":"Confucius Plaza","lat":40.714667,"lon":-73.996039,"blurb":"A 1974 protest here over the refusal to hire Asian construction workers—\"The Asians build the railroad; Why not Confucius Plaza\"—forced the contractor to relent."},{"name":"Sea and Land Church","lat":40.713188,"lon":-73.994766,"blurb":"Built in 1819 from Manhattan schist on Henry Rutgers' former estate, it's the second-oldest church building in New York City."},{"name":"St. Teresa Church","lat":40.713542,"lon":-73.990465,"blurb":"Said to hold the oldest working public clock in New York City, it must be hand-wound every week."},{"name":"St. Augustine's Church","lat":40.713751,"lon":-73.983184,"blurb":"Edgar Allan Poe occasionally worshipped here, and two rough galleries are traditionally thought to have been built for enslaved congregants."},{"name":"ABC No Rio","lat":40.719366,"lon":-73.985359,"blurb":"Born from a 1980 squat, this collective arts center hosted hardcore punk matinees, a zine library, and the city's Food Not Bombs."},{"name":"Stanton Street Synagogue","lat":40.720266,"lon":-73.983859,"blurb":"Congregants went to court in 2002 to block their rabbi's attempt to sell this rare tenement synagogue to an organization run by a Jesuit priest."},{"name":"Office of Chief Medical Examiner of the City of New York","lat":40.741261,"lon":-73.97475,"blurb":"Led first by pioneering examiner Charles Norris in 1918, the office still held 750 pandemic dead in refrigerated pier trailers as of May 2021."},{"name":"Kips Bay Towers","lat":40.743229,"lon":-73.975774,"blurb":"I.M. Pei designed these brutalist towers, an early demonstration of the framed-tube structure, as middle-income rentals in 1965."},{"name":"Church of the Sacred Hearts of Jesus and Mary","lat":40.743831,"lon":-73.975036,"blurb":"Its cornerstone was laid before more than five thousand Italian Catholics in 1915; the parish church has since been demolished and replaced by a chapel."},{"name":"The Corinthian","lat":40.746447,"lon":-73.972891,"blurb":"The city's largest apartment building when it opened in 1988, it rose from the former East Side Airlines Terminal and was mocked as \"a bundle of sticks.\""},{"name":"Museum of Modern Art","lat":40.761612,"lon":-73.977545,"blurb":"MoMA opened just days after the 1929 Wall Street Crash, and a 1958 fire destroyed one of its Monet paintings."},{"name":"Saint Thomas Church","lat":40.760843,"lon":-73.976282,"blurb":"It houses the Saint Thomas Choir of Men and Boys and the only church-affiliated residential choir school in the United States."},{"name":"Belvedere Castle","lat":40.779322,"lon":-73.968893,"blurb":"Since 1919 this Gothic-Romanesque folly has housed Central Park's official weather station, source of the city's benchmark temperatures; its name means \"beautiful view\" in Italian."},{"name":"Delacorte Theater","lat":40.780261,"lon":-73.968794,"blurb":"Its first free Shakespeare in the Park show in 1962 starred a young James Earl Jones and George C. Scott in \"The Merchant of Venice.\""},{"name":"Swedish Cottage Marionette Theatre","lat":40.779952,"lon":-73.970347,"blurb":"Built as Sweden's exhibit for the 1876 Centennial Exposition, this cottage caught Frederick Law Olmsted's eye and has staged marionette shows in Central Park since 1947."},{"name":"28 Liberty Street","lat":40.70785,"lon":-74.008982,"blurb":"David Rockefeller built this tower to keep Chase in Lower Manhattan; its plaza holds a sunken Japanese rock garden designed by Isamu Noguchi."},{"name":"Open Road Park","lat":40.729382,"lon":-73.982918,"blurb":"This community park sits atop the city's third Catholic cemetery, where 41,016 people were buried before the dead were disinterred and moved to Queens."},{"name":"American Radiator Building","lat":40.752833,"lon":-73.983941,"blurb":"Raymond Hood clad this 1924 tower in black brick with gold pinnacles to suggest glowing coal; it now houses the Bryant Park Hotel."},{"name":"The Fuentidueña Apse","lat":40.865146,"lon":-73.931721,"blurb":"This 12th-century Spanish church apse was dismantled into nearly 3,300 stone blocks, shipped to New York, and rebuilt inside The Cloisters."},{"name":"Frederick Douglass Houses","lat":40.796839,"lon":-73.965002,"blurb":"Singer Kelis and actor Mekhi Phifer both grew up in this Upper West Side public housing complex named for abolitionist Frederick Douglass."},{"name":"Bellevue South Park","lat":40.740039,"lon":-73.97805,"blurb":"The street built alongside it went nameless for decades, labeled simply \"A New Street\" on city maps until it was christened Mount Carmel Place in 1989."},{"name":"3 Hudson Boulevard","lat":40.75593,"lon":-74.001171,"blurb":"The MTA had to build this stalled tower's foundation itself, because a subway station sits directly beneath it."},{"name":"Five Manhattan West","lat":40.753066,"lon":-73.999509,"blurb":"The New York Daily News ran its newsroom here for 16 years; the whole brutalist slab sits atop rail tracks running out of Penn Station."},{"name":"33 Thomas Street","lat":40.716521,"lon":-74.005902,"blurb":"This windowless Brutalist tower is a reported NSA mass-surveillance hub codenamed TITANPOINTE; a 1991 switch failure here disrupted air traffic at 398 airports."},{"name":"Equitable Building","lat":40.708225,"lon":-74.010514,"blurb":"Its bulk blocked so much sunlight that it triggered New York's first zoning law, the 1916 Zoning Resolution, reshaping how every later skyscraper was built."},{"name":"Harlem Fire Watchtower","lat":40.804111,"lon":-73.943589,"blurb":"The last of 11 cast-iron fire towers, this 1857 lookout let watchmen spot blazes in Harlem's wooden buildings and ring a bell to sound the alarm."},{"name":"10 Hudson Yards","lat":40.752692,"lon":-74.001553,"blurb":"The first Hudson Yards tower finished, and the only one built on solid ground rather than the platform floated over the West Side rail yards."},{"name":"Frederick Douglass Circle","lat":40.80059,"lon":-73.958181,"blurb":"Its colored paving echoes traditional Black quilt designs and centers on a bronze Frederick Douglass, though the plaza took until 2010 to finish."},{"name":"Hudson Boulevard","lat":40.753965,"lon":-74.002231,"blurb":"Its median park is named for firebrand congresswoman Bella Abzug; one block was built decades earlier as \"Galvin Avenue\" to feed the Lincoln Tunnel."},{"name":"10 Sullivan","lat":40.724736,"lon":-74.004002,"blurb":"This wedge-shaped SoHo tower echoing the Flatiron became the subject of a bitter lawsuit between its two feuding developers over $30 million in lost profits."},{"name":"John Jay College of Criminal Justice","lat":40.770705,"lon":-73.989257,"blurb":"An enrolled FBI agent once reported his professor here for criticizing J. Edgar Hoover in class, at the only U.S. liberal-arts college devoted to criminal justice."},{"name":"MacDougal–Sullivan Gardens Historic District","lat":40.728455,"lon":-74.001277,"blurb":"In the 1920s a furniture magnate turned these run-down row houses into middle-class apartments, merging their backyards into a shared hidden garden."},{"name":"Theatre Alley","lat":40.711166,"lon":-74.007268,"blurb":"Reputedly New York's first one-way street, created to untangle horse-carriage jams at the Park Theatre, which burned down in 1848."},{"name":"Teardrop Park","lat":40.71678,"lon":-74.015619,"blurb":"Cast in shade by surrounding towers, this children's park installed giant heliostat mirrors on a rooftop to bounce sunlight down into it."},{"name":"55 Hudson Yards","lat":40.755231,"lon":-74.001762,"blurb":"This tower rose on the former site of the legendary Copacabana nightclub, which occupied the spot until 2007."},{"name":"Ralph Bunche Park","lat":40.749326,"lon":-73.969745,"blurb":"Named for Ralph Bunche, the first African American to win the Nobel Peace Prize, it became the city's first designated Peace Park in 1985."},{"name":"Rat Rock (Central Park)","lat":40.769202,"lon":-73.97781,"blurb":"Officially Umpire Rock, this Central Park boulder is nicknamed for the rats that once swarmed it and has been called \"one of America's most pathetic boulders.\""},{"name":"List of arches and bridges in Central Park","lat":40.767458,"lon":-73.978125,"blurb":"No two of Central Park's thirty-six ornamental spans are alike—each bridge and arch was given its own distinct design back in the 1860s."},{"name":"The Ramble and Lake","lat":40.776887,"lon":-73.97139,"blurb":"This 38-acre wooded \"wild garden\" of winding paths was designed to feel untamed and has long drawn both birdwatchers and gay men cruising."},{"name":"Untermyer Fountain","lat":40.794262,"lon":-73.951953,"blurb":"Its centerpiece \"Three Dancing Maidens\" shows three women circling hand in hand, dresses clinging as if perpetually caught in the fountain's spray."},{"name":"Carver Houses","lat":40.791078,"lon":-73.950368,"blurb":"Builders discovered they were constructing over Montague's Creek, a buried stream feeding Hell Gate; the project honors George Washington Carver, born into slavery."},{"name":"First Houses","lat":40.723711,"lon":-73.986263,"blurb":"Among the first public housing in the United States, it opened in 1935 to such demand that over 4,000 families applied for just 122 apartments."},{"name":"Conservatory Garden","lat":40.793677,"lon":-73.952283,"blurb":"Central Park's only formal garden rose after Robert Moses tore down the obsolete glass conservatory that gave it its name."},{"name":"Nutter's Battery","lat":40.796541,"lon":-73.952851,"blurb":"This wooded overlook was a War of 1812 gun battery, built to defend Manhattan against a British invasion sweeping down from the north."},{"name":"Clinton Houses","lat":40.791951,"lon":-73.948005,"blurb":"At a 1959 hearing, Jane Jacobs blasted the housing authority here for displacing the poor, helping spur a design that kept the city's street grid intact."},{"name":"Mount Sinai Hospital","lat":40.789742,"lon":-73.953052,"blurb":"Founded in 1852 as a hospital for Jewish immigrants and doctors barred elsewhere, it's where Crohn's disease was first described and named."},{"name":"Little Red Lighthouse","lat":40.850255,"lon":-73.946963,"blurb":"A 1948 plan to auction it off sparked an outcry from children who loved the 1942 book \"The Little Red Lighthouse,\" saving it from demolition."},{"name":"Coleman Playground","lat":40.71117,"lon":-73.993317,"blurb":"Its beloved LES Skatepark grew from a DIY spot and once hosted a Barbara Kruger installation splashing \"WANT IT. NEED IT. BUY IT.\" across the ramps."},{"name":"Division Street","lat":40.71419,"lon":-73.995462,"blurb":"Named for the boundary it marks between two clashing street-grid patterns, it now runs to a statue of Confucius at the Bowery."},{"name":"Morningside Drive","lat":40.806211,"lon":-73.959092,"blurb":"A sheer cliff in the flanking Morningside Park makes cross-streets impossible, and the drive sweeps past the apse of the Cathedral of St. John the Divine."},{"name":"Shakespeare garden","lat":40.779817,"lon":-73.96996,"blurb":"In 1631 a baronet sent a servant to Stratford for cuttings from the grapevines at Shakespeare's retirement home, though his letter never mentioned the poet."},{"name":"West Side Yard","lat":40.754801,"lon":-74.002967,"blurb":"Its eastern half now lies buried beneath the Hudson Yards skyscrapers, built on a platform over 30 active Long Island Rail Road tracks."},{"name":"West Fourth Street Courts","lat":40.731249,"lon":-74.00096,"blurb":"Nicknamed 'the Cage,' this undersized Greenwich Village court forged the bruising games of Dr. J and Anthony Mason, drawing over 100,000 spectators a summer."},{"name":"Elizabeth Street Garden","lat":40.722189,"lon":-73.994783,"blurb":"This Nolita sculpture oasis, its balustrade salvaged from a Gilded Age mansion, was fought over for years between garden defenders and affordable-housing developers."},{"name":"15 Hudson Yards","lat":40.753449,"lon":-74.003285,"blurb":"Low-income tenants sued, alleging the tower dodged the 2015 'poor door' ban by segregating them through a separate 'poor address' and 'poor floors.'"},{"name":"35 Hudson Yards","lat":40.75465,"lon":-74.002242,"blurb":"Half its condos sat unsold years after opening, and in 2025 Mori Trust paid $540 million for the building's Equinox hotel and gym floors."},{"name":"Collegiate School","lat":40.773732,"lon":-73.990663,"blurb":"Founded by Dutch colonists in 1628, it claims to be America's oldest school, a title it seized after a 1628 letter surfaced in 1982."},{"name":"Albert Capsouto Park","lat":40.722073,"lon":-74.005891,"blurb":"After 9/11 this Tribeca lot became a search-and-rescue staging area where the public left flowers; it was later renamed for a bicycling local restaurateur."},{"name":"Drumgoole Plaza","lat":40.711052,"lon":-74.004095,"blurb":"Named for a priest who aided thousands of homeless newsboys, it's furnished with benches salvaged from the 1964 New York World's Fair."},{"name":"Bridge Street","lat":40.703608,"lon":-74.013767,"blurb":"It's named for a span that once crossed a Dutch canal, the Heere Gracht, later filled in and anglicized by the English to become Broad Street."},{"name":"Elizabeth H. Berger Plaza","lat":40.706676,"lon":-74.014021,"blurb":"It sits atop Little Syria, an immigrant community razed for a tunnel, beside Edgar Street, reputedly Manhattan's shortest and once dubbed 'Tin Pot Alley.'"},{"name":"The Copper (building)","lat":40.744458,"lon":-73.971982,"blurb":"Two copper-clad towers lean toward each other and are joined mid-air by a three-story skybridge, on the site of a former Con Ed power plant."},{"name":"Mitchel Square Park","lat":40.840171,"lon":-73.940069,"blurb":"Its WWI memorial by Gertrude Vanderbilt Whitney, a wounded sailor held up by a Marine, won 1923's medal for the year's most meritorious monument."},{"name":"Bowling Green–South Ferry shuttle","lat":40.704207,"lon":-74.014512,"blurb":"This defunct subway shuttle looped on a curve so tight that only each car's center door could open, through four gaps cut in the tunnel wall."},{"name":"Dunbar Apartments","lat":40.825066,"lon":-73.938455,"blurb":"Built by John D. Rockefeller Jr. as the first large housing co-op for African Americans, it was home to explorer Matthew Henson and labor leader A. Philip Randolph."},{"name":"Beth Israel Medical Center","lat":40.733225,"lon":-73.982443,"blurb":"Founded in 1890 by 40 Orthodox Jews who each chipped in 25 cents to serve Lower East Side tenement immigrants, it finally closed in April 2025."},{"name":"Memorial Sloan Kettering Cancer Center","lat":40.764458,"lon":-73.956963,"blurb":"Founded in 1884 with backing from John Jacob Astor III, its early surgeon pioneered cancer immunotherapy and Nathaniel Hawthorne's daughter trained there."},{"name":"Lenox Hill Hospital","lat":40.773642,"lon":-73.960862,"blurb":"Founded in 1857 as the German Dispensary for immigrants, it starred in a 2020 Netflix docuseries following its neurosurgery department."},{"name":"Metropolitan Hospital Center","lat":40.785057,"lon":-73.94495,"blurb":"Frederick Wiseman shot his Emmy-winning 1969 documentary 'Hospital' inside this East Harlem hospital's emergency room."},{"name":"Mount Sinai Morningside","lat":40.805235,"lon":-73.961467,"blurb":"Built in 1896 as St. Luke's Hospital and designed by Ernest Flagg, its original landmarked pavilions still stand in Morningside Heights."},{"name":"Harlem Hospital Center","lat":40.814404,"lon":-73.938825,"blurb":"May Edward Chinn, the first African-American woman to graduate from Bellevue's medical college, became the first to intern at this Harlem hospital."},{"name":"New York City Hall","lat":40.712735,"lon":-74.006007,"blurb":"Built from 1803 to 1812, it's the oldest U.S. city hall still serving its original purpose, rising on ground that once held the city's first almshouse."},{"name":"Tweed Courthouse","lat":40.713399,"lon":-74.005542,"blurb":"'Boss' Tweed oversaw its construction, whose staggering graft, exposed in 1871, made this gaudy courthouse a lasting byword for Tammany Hall corruption."},{"name":"Madison Square Park Fountain","lat":40.741728,"lon":-73.988294,"blurb":"Begun in 1842 on the site of the Old Post Office, this granite fountain was later hauled uptown and rededicated in Madison Square Park in 1867."},{"name":"Time Landscape","lat":40.727231,"lon":-73.999451,"blurb":"Alan Sonfist's living artwork replants a pre-colonial forest on a Manhattan lot, its beeches grown from saplings taken from his favorite Bronx childhood park."},{"name":"Bow Bridge (Central Park)","lat":40.775759,"lon":-73.971768,"blurb":"Central Park's most elegant iron span was cast by Janes, Kirtland & Co., the same foundry that built the dome of the U.S. Capitol."},{"name":"Central Park Carousel","lat":40.769943,"lon":-73.975248,"blurb":"The carousel that burned here in 1950 features in 'The Catcher in the Rye'; its replacement once spun in a Coney Island trolley terminal."},{"name":"Madame Tussauds New York","lat":40.756212,"lon":-73.98845,"blurb":"Its founder began by molding death masks of guillotined French Revolution victims, which were paraded through the streets of Paris as revolutionary flags."},{"name":"Spuyten Duyvil Creek","lat":40.87364,"lon":-73.919595,"blurb":"Its name means 'Spouting Devil' for its wild currents, immortalized by Washington Irving's tale of a trumpeter who drowned trying to swim it 'in spite of the Devil.'"},{"name":"Columbus Monument","lat":40.768068,"lon":-73.981898,"blurb":"Funded by an Italian-language newspaper for Columbus's 1892 quadricentennial, its bronze ships are oddly carved as Roman galleys rather than caravels."},{"name":"USS Maine National Monument","lat":40.768247,"lon":-73.981001,"blurb":"Its gilded crowning figures were reportedly cast from bronze recovered from the guns of the USS Maine, which exploded in Havana Harbor in 1898."},{"name":"Marble Collegiate Church","lat":40.74568,"lon":-73.987141,"blurb":"Norman Vincent Peale preached 'The Power of Positive Thinking' here for 52 years, and Lucille Ball married her second husband at the church in 1961."},{"name":"220 Central Park South","lat":40.767004,"lon":-73.980573,"blurb":"Hedge-fund billionaire Kenneth Griffin paid $238 million for an apartment here in 2019, the most expensive home ever sold in the U.S. at the time."},{"name":"One Manhattan West","lat":40.752735,"lon":-73.997691,"blurb":"Because it partly overhangs active railroad tracks, its concrete core, not the ground below, carries most of the 67-story skyscraper's weight."},{"name":"Henry Street Settlement","lat":40.714075,"lon":-73.984518,"blurb":"Nurse Lillian Wald founded it in 1893 after a child led her to a bleeding mother in a tenement, launching American public health nursing."},{"name":"Herald Square","lat":40.750304,"lon":-73.987738,"blurb":"Named for a defunct newspaper, its 1895 clock features two bronze laborers nicknamed 'Stuff and Guff' who appear to ring a bell on the hour."},{"name":"The Shed (arts center)","lat":40.753278,"lon":-74.002713,"blurb":"Its telescoping outer shell rolls out on wheels to double the building's footprint, creating a vast column-free hall for large-scale performances."},{"name":"Duffy Square","lat":40.758718,"lon":-73.985101,"blurb":"Home to the TKTS booth and a statue of the 'Fighting 69th' chaplain, it was briefly dominated in 1909 by a 50-foot, eight-ton plaster statue called 'Purity.'"},{"name":"Queens–Midtown Tunnel","lat":40.74664,"lon":-73.972112,"blurb":"For 35 years the Ringling Bros. circus marched its elephants through this East River tunnel in an annual 'Animal Walk.'"},{"name":"Teachers College, Columbia University","lat":40.810273,"lon":-73.960336,"blurb":"It grew out of an 1880 'Kitchen Garden' charity and was led early on by Nicholas Murray Butler, a future Nobel Peace Prize winner."},{"name":"Sydenham Hospital","lat":40.809858,"lon":-73.953699,"blurb":"New York City's first full-service hospital to hire African-American doctors, and where blues composer W.C. Handy died of bronchial pneumonia in 1958."},{"name":"Andy Kessler Skatepark","lat":40.805059,"lon":-73.970569,"blurb":"Manhattan's first full-sized public skatepark, built in 1995-96 by skateboarder Andy Kessler with help from teenagers of Harlem and the Upper West Side."},{"name":"Millan House","lat":40.767896,"lon":-73.965127,"blurb":"John D. Rockefeller Jr. bought the land from a Baptist church for $1 million in 1929, then built this Upper East Side co-op."},{"name":"Track 61","lat":40.755924,"lon":-73.973627,"blurb":"FDR used this secret platform beneath the Waldorf Astoria to hide his paralysis, driving his armored limo off the train into a freight elevator."},{"name":"250 Vesey Street","lat":40.714005,"lon":-74.015881,"blurb":"First of Brookfield's four towers reoccupied after 9/11, when Merrill Lynch executives returned in October 2001; now home to Jane Street Capital."},{"name":"NewYork-Presbyterian Lower Manhattan Hospital","lat":40.710306,"lon":-74.004966,"blurb":"Traces its roots to the dispensary that pioneering physician Elizabeth Blackwell founded for poor women and children in 1853."},{"name":"University Heights Bridge","lat":40.863067,"lon":-73.915569,"blurb":"Built in 1895 to carry Broadway, this swing bridge was floated a mile south in 1908; its central span pivots on a masonry island midriver."},{"name":"Mount Sinai West","lat":40.769729,"lon":-73.986959,"blurb":"Opened in 1871 as Roosevelt Hospital, built entirely from the bequeathed fortune of James Henry Roosevelt, 'sublime in his benefaction.'"},{"name":"Pace University","lat":40.711118,"lon":-74.004888,"blurb":"Founded in 1906 by two brothers on a $600 loan, teaching 13 students in a rented Tribune Building classroom; now home to 'Inside the Actors Studio.'"},{"name":"Moynihan Train Hall","lat":40.751299,"lon":-73.995338,"blurb":"A $1.6 billion glass-roofed hall carved into the old Farley Post Office, named for the senator who championed it after decades of failed plans."},{"name":"Church of the Ascension, Roman Catholic","lat":40.801866,"lon":-73.966329,"blurb":"This Upper West Side church stood in as 'Trinity Church' on White Collar and appeared in the film Keeping the Faith."},{"name":"Bethesda Terrace and Fountain","lat":40.774215,"lon":-73.970859,"blurb":"Built through the Civil War, the terrace took its biblical name from the Angel of the Waters statue crowning its fountain."},{"name":"Cherry Hill Fountain","lat":40.774696,"lon":-73.972708,"blurb":"Designed in the 1860s as a watering trough for horses, it's often mistaken for the Friends opening-theme fountain (really in Burbank)."},{"name":"McKenna Square","lat":40.838349,"lon":-73.939157,"blurb":"Named for Private William McKenna, a local anti-aircraft soldier killed in the Battle of the Argonne Forest in France in 1918."},{"name":"Statue of William H. Seward","lat":40.7415,"lon":-73.988837,"blurb":"Dedicated in 1876, it is believed to be the city's first monument depicting a New York resident."},{"name":"Eternal Light Flagstaff","lat":40.742059,"lon":-73.988714,"blurb":"This WWI memorial's star is meant to burn forever; when Lindbergh laid a wreath here in 1927, the crushing crowd broke the barriers."},{"name":"Statue of David Farragut","lat":40.742764,"lon":-73.987663,"blurb":"Saint-Gaudens's first major work was so good that jealous rivals spread rumors it had secretly been made by sculptors in Paris."},{"name":"William Tecumseh Sherman (Saint-Gaudens)","lat":40.76481,"lon":-73.973062,"blurb":"Its allegorical Victory figure became the model for Liberty on the 1907 Saint-Gaudens double eagle gold coin."},{"name":"Pulitzer Fountain","lat":40.764087,"lon":-73.973579,"blurb":"Funded by a $50,000 bequest from Joseph Pulitzer, who wanted a fountain like those in Paris; its sculptor died before finishing the goddess Pomona."},{"name":"The Spiral","lat":40.75525,"lon":-73.999582,"blurb":"Outdoor gardens spiral up its entire facade; it began as the planned 1,800-foot Hudson Spire, marketed as the tallest building in the Western Hemisphere."},{"name":"601 West 29th Street","lat":40.753168,"lon":-74.004836,"blurb":"The site formerly held a studio used by the artist Jeff Koons before this residential tower rose beside the High Line."},{"name":"New York Institute of Technology","lat":40.769838,"lon":-73.982953,"blurb":"Its Computer Graphics Lab launched the founders of Pixar and Lucasfilm, making it the birthplace of entirely 3D CGI films."},{"name":"Crack Is Wack","lat":40.804735,"lon":-73.931839,"blurb":"Keith Haring painted this anti-crack mural without permission in 1986 on an abandoned handball court, in honor of his addicted studio assistant Benny."},{"name":"Le Petit Versailles","lat":40.721139,"lon":-73.981782,"blurb":"Artists built this queer community garden on a former auto chop shop in 1996; it became an activist refuge after 9/11 and the 2004 RNC protests."},{"name":"St. John's Terminal","lat":40.7282,"lon":-74.01001,"blurb":"Built in 1934 as the southern terminus of the High Line freight line, it was bought by Google in 2021 for its Hudson Square campus."},{"name":"Fulton Center","lat":40.710443,"lon":-74.008919,"blurb":"This $1.4 billion subway hub cost almost twice its original budget to untangle the tangled Fulton Street station complex."},{"name":"Titanic Memorial","lat":40.7074,"lon":-74.003861,"blurb":"A lighthouse built at Molly Brown's instigation for the Titanic dead; its time ball dropped daily at noon from 1913 to 1967 to signal ships in the harbor."},{"name":"Robert and Anne Dickey House","lat":40.7072,"lon":-74.013705,"blurb":"Dubbed 'The Indestructible Townhouse,' this 1810 Federal-style house survived subway lines, the Brooklyn-Battery Tunnel, Robert Moses, and 9/11."},{"name":"Four Continents (French)","lat":40.704476,"lon":-74.013442,"blurb":"Daniel Chester French's four marble women personify Asia, America, Europe, and Africa outside the Custom House; Asia is paired with a tiger, Africa with a lion."},{"name":"130 William","lat":40.709099,"lon":-74.006351,"blurb":"David Adjaye's hand-cast, arch-windowed tower was the fastest-selling luxury condo development in New York City in 2018 and 2019."},{"name":"Abraham Joshua Heschel School","lat":40.772418,"lon":-73.989336,"blurb":"This Jewish day school's expansion building was nicknamed the 'Weird Campus Plan'; its college-bowl team is called the Heschel Wow."},{"name":"70 Vestry","lat":40.723254,"lon":-74.011036,"blurb":"Tom Brady and Gisele Bundchen bought a $25.5 million apartment here; other residents include F1 driver Lewis Hamilton and reality star Julia Haart."},{"name":"Manhattan Bridge","lat":40.714559,"lon":-73.994477,"blurb":"The uneven weight of subway trains made it tilt to one side, forcing a reconstruction from 1982 to 2004; it was the first suspension bridge to use a Warren truss."},{"name":"Pershing Square","lat":40.751769,"lon":-73.977905,"blurb":"Named in 1919 for General John J. Pershing; a diagonal Steuben Street, honoring a Revolutionary War general, once cut across the block."},{"name":"Manhattan West","lat":40.752707,"lon":-73.998655,"blurb":"Built on a $680 million platform over Penn Station's tracks; during COVID it opened Citrovia, a garden of 16.5-foot fake lemon trees hiding scaffolding."},{"name":"520 Fifth Avenue","lat":40.754482,"lon":-73.980624,"blurb":"This supertall rises on the site of the Colored Orphans Asylum, which was burned down during the 1863 New York City draft riots."},{"name":"One High Line","lat":40.744774,"lon":-74.007546,"blurb":"Designed by BIG on a record $870-million site, its twisting towers were mocked by critics as \"two drunken figures on the verge of keeling over.\""},{"name":"262 Fifth Avenue","lat":40.745273,"lon":-73.98725,"blurb":"So absurdly slender that a Curbed critic joked its consulting architect must have been the Eberhard Faber pencil company."},{"name":"Hess triangle","lat":40.733504,"lon":-74.003064,"blurb":"A landlord's heirs tiled a defiant mosaic onto New York's smallest plot, 500 square inches, rather than surrender the scrap to the city in 1922."},{"name":"Times Square (Neuhaus)","lat":40.758485,"lon":-73.985284,"blurb":"A deliberate hum has droned up from a Times Square subway grate since 1977, a hidden sound artwork most passersby never realize is art."},{"name":"Hunter College High School","lat":40.785923,"lon":-73.954143,"blurb":"For its first 105 years it was all-girls, bearing the official name \"Hunter College High School for Intellectually Gifted Young Ladies.\""},{"name":"Stuyvesant High School","lat":40.717948,"lon":-74.013905,"blurb":"Has produced four Nobel laureates plus James Cagney, Eric Holder and Thomas Sowell, admitting under 3% of applicants by a single exam."},{"name":"United Nations International School","lat":40.736321,"lon":-73.973461,"blurb":"Founded in 1947 by UN diplomat families stumped by New York schools, it was a pilot school that awarded some of the first IB diplomas."},{"name":"High Bridge","lat":40.842429,"lon":-73.931499,"blurb":"The city's oldest bridge, it carried Croton Aqueduct water across the Harlem River from 1848, then sat shut for decades before reopening to walkers in 2015."},{"name":"Davis Center","lat":40.795965,"lon":-73.954609,"blurb":"It replaced Lasker Rink, for years the only facility in the United States that converted between an ice rink and a swimming pool."},{"name":"Seaman-Drake Arch","lat":40.870542,"lon":-73.915411,"blurb":"A marble arch modeled on Paris's Arc de Triomphe, this 1855 estate gateway now sits half-hidden behind a transmission repair shop that stores parts inside it."},{"name":"Stern College for Women","lat":40.746716,"lon":-73.97909,"blurb":"The women's college of Yeshiva University, its alumnae range from Orthodox rabbis to a writer who is also a Wiccan high priestess."},{"name":"Plaza Lafayette","lat":40.851551,"lon":-73.941591,"blurb":"This tiny trapezoidal park sits near Manhattan's highest natural point, with unobstructed views of the George Washington Bridge and the Hudson Palisades."},{"name":"FDR Drive","lat":40.749213,"lon":-73.972974,"blurb":"The riverside parkway ducks into a tunnel beneath Gracie Mansion, the New York City mayor's official residence, at 90th Street."},{"name":"1 (New York City Subway service)","lat":40.795783,"lon":-73.956685,"blurb":"From 1989 to 2005 it paired with the now-retired 9 train in skip-stop service, and it bypassed Cortlandt Street from 9/11 until 2018."},{"name":"4 (New York City Subway service)","lat":40.777797,"lon":-73.946395,"blurb":"Featured prominently in Spike Lee's 2025 film \"Highest 2 Lowest,\" it runs special downtown-only expresses for an hour after Yankee Stadium events."},{"name":"Henry Hudson Parkway","lat":40.844924,"lon":-73.936497,"blurb":"Master builder Robert Moses conjured this 1934-37 parkway, which drivers still endlessly confuse with the West Side Highway."},{"name":"Hoboken–33rd Street","lat":40.739866,"lon":-74.011319,"blurb":"Its Hoboken terminal drowned under roughly 8 feet of water when Hurricane Sandy flooded the PATH tunnels in October 2012."},{"name":"John Jay Park","lat":40.769252,"lon":-73.949638,"blurb":"Named for founding father and first Chief Justice John Jay, it opened in 1906 as a public bath house on the Upper East Side."},{"name":"The New York Times Building","lat":40.755897,"lon":-73.989714,"blurb":"Renzo Piano's newspaper tower, sheathed in heat-deflecting ceramic rods, is tied with the Chrysler Building as the city's thirteenth-tallest."},{"name":"Lever House","lat":40.759593,"lon":-73.972848,"blurb":"New York's second glass-curtain-wall skyscraper, it was nearly demolished in the 1980s before being narrowly saved as a landmark in 1982."},{"name":"Lipstick Building","lat":40.757892,"lon":-73.968866,"blurb":"Its elliptical red-granite form so resembles a lipstick tube that the nickname stuck to Philip Johnson's oval Midtown tower."},{"name":"Park Avenue Plaza","lat":40.759121,"lon":-73.973651,"blurb":"Despite its name it stands mid-block and not on Park Avenue at all, wedged behind the Racquet and Tennis Club that once threatened to build over itself."},{"name":"Harlem Meer","lat":40.796202,"lon":-73.952181,"blurb":"Its surrounding hills held War of 1812 fortifications at McGowan's Pass, and Christo's \"The Gates\" reached the man-made lake's shores in 2005."},{"name":"452 Fifth Avenue","lat":40.752052,"lon":-73.982534,"blurb":"The curving glass HSBC Tower wraps around a preserved 1902 Beaux-Arts building that once housed the Knox Hat Company."},{"name":"Silver Towers","lat":40.760681,"lon":-73.999167,"blurb":"Developed by Larry Silverstein, the twin Hell's Kitchen towers hold a 75-foot pool, the largest in any New York City residential building."},{"name":"M15 (New York City bus)","lat":40.752475,"lon":-73.972702,"blurb":"Carrying about 57,000 riders a day, it's the busiest bus route in both New York City and the entire United States."},{"name":"M72 (New York City bus)","lat":40.772998,"lon":-73.9717,"blurb":"Residents accused Donald Trump of engineering the 1998 reroute of this crosstown line to better serve his Riverside South development."},{"name":"Interstate 495 (New York)","lat":40.757657,"lon":-74.002459,"blurb":"The Long Island Expressway lent its initials to the 2001 film \"L.I.E.\" and inspired the name of reality-TV firm 495 Productions."},{"name":"Yeshiva University","lat":40.850497,"lon":-73.92926,"blurb":"Olympic gold-medal wrestler Henry Wittenberg once coached its team, at a university rooted in an 1886 Lower East Side yeshiva."},{"name":"Our Lady of Pompeii Church","lat":40.730495,"lon":-74.002867,"blurb":"Founded in 1892, this Greenwich Village parish grew from a chapel that defended Italian immigrants from usury and labor exploitation."},{"name":"Louis J. Lefkowitz Building","lat":40.715094,"lon":-74.001235,"blurb":"293 couples wed here the day same-sex marriage became legal in 2011, turning the Marriage Bureau into a monument to LGBTQ New Yorkers."},{"name":"Westbeth Artists Community","lat":40.736494,"lon":-74.009046,"blurb":"Carved out of the old Bell Telephone Laboratories, it became the world's largest artists' housing complex, with a waitlist that once stretched a decade."},{"name":"American Seamen's Friend Society Sailors' Home and Institute","lat":40.738304,"lon":-74.00933,"blurb":"This sailors' boarding house sheltered survivors of the Titanic in 1912 before becoming the Jane, a boutique hotel with rooms averaging 50 square feet."},{"name":"Grand Hotel","lat":40.747163,"lon":-73.987953,"blurb":"Oscar Wilde stayed here at least twice in 1882, when the surrounding theater district's sleazier side streets earned the nickname the 'Tenderloin.'"},{"name":"St. Bartholomew's Episcopal Church","lat":40.757214,"lon":-73.973074,"blurb":"Its triple Romanesque portal, a Vanderbilt family memorial by Stanford White, was inspired by a French church White had admired back in 1878."},{"name":"The Apthorp","lat":40.783744,"lon":-73.980884,"blurb":"William Waldorf Astor built this full-block palazzo in 1908, naming it for the colonial Apthorp Farm the site had once been part of."},{"name":"The Belnord","lat":40.78833,"lon":-73.975453,"blurb":"Hailed as the nation's largest apartment building in 1909, it later saw residents withhold rent for years protesting owner Lillian Seril's neglect."},{"name":"Cathedral of St. John the Divine","lat":40.803767,"lon":-73.961747,"blurb":"Nicknamed 'St. John the Unfinished,' North America's largest church has stood only two-thirds built since 1892, stalled by fire and unstable ground."},{"name":"Church of the Intercession","lat":40.832123,"lon":-73.945305,"blurb":"Founded on land tied to John James Audubon, it stood in for the Cloisters when Spielberg filmed 'One Hand, One Heart' here for 2021's West Side Story."},{"name":"555 Edgecombe Avenue","lat":40.833829,"lon":-73.938979,"blurb":"Paul Robeson and Count Basie both lived in this Sugar Hill tower, a hub of Black cultural life now landmarked as the Paul Robeson Residence."},{"name":"Highbridge Park","lat":40.846005,"lon":-73.93195,"blurb":"Named for the High Bridge of 1848, New York City's oldest standing bridge, beside the mansion Washington used as his headquarters in 1776."},{"name":"New York Supreme Court","lat":40.714275,"lon":-74.001569,"blurb":"New York is the only state where the 'Supreme Court' is a mere trial court; its actual court of last resort is the Court of Appeals."},{"name":"Thurgood Marshall United States Courthouse","lat":40.713662,"lon":-74.002337,"blurb":"Among the first federal skyscrapers, this Cass Gilbert tower was renamed in 2001 for Supreme Court justice Thurgood Marshall and houses the Second Circuit."},{"name":"Sara D. Roosevelt Park","lat":40.719628,"lon":-73.992597,"blurb":"Named in 1934 for FDR's mother Sara over her written objection, it covers a former African-American burial ground on the Lower East Side."},{"name":"Via 57 West","lat":40.771466,"lon":-73.993031,"blurb":"Bjarke Ingels's pyramidal 'tetrahedron' looks like a giant sailing ship from New Jersey; its name nods to the West Side Highway sloping into the city 'via 57th.'"},{"name":"Fort Tryon Park","lat":40.861978,"lon":-73.932637,"blurb":"John D. Rockefeller Jr. assembled this ridge-top park and funded the Cloisters within it, on ground where the 1776 Battle of Fort Washington was fought."},{"name":"Surrogate's Courthouse","lat":40.713583,"lon":-74.004237,"blurb":"Its fireproof steel frame was engineered to safeguard the city's paper records, and its Beaux-Arts facade bristles with 54 sculptures."},{"name":"Foley Square","lat":40.714329,"lon":-74.00296,"blurb":"Named for Tammany saloon boss 'Big Tom' Foley, the square sits atop the filled-in Collect Pond and the notorious Five Points slum."},{"name":"Stuyvesant Square","lat":40.73365,"lon":-73.984,"blurb":"A Stuyvesant heir sold this land to the city for five dollars in 1836, then sued to force it to build the promised fence, now the city's oldest cast-iron one."},{"name":"High Line","lat":40.747953,"lon":-74.003954,"blurb":"Built atop an abandoned elevated freight railway saved from demolition, this greenway took its cue from a similar elevated park in Paris."},{"name":"Museum of Jewish Heritage","lat":40.706044,"lon":-74.018603,"blurb":"Its six-sided, pyramid-roofed building was shaped to evoke the memory of the six million Jews murdered in the Holocaust."},{"name":"Tavern on the Green","lat":40.772194,"lon":-73.977565,"blurb":"Set in Central Park's former sheepfold, the restaurant opened in 1934 after Robert Moses evicted the sheep that once grazed the adjacent Sheep Meadow."},{"name":"Manhattan Country School","lat":40.786417,"lon":-73.974657,"blurb":"Founded in 1966 on Dr. King's ideals with sliding-scale tuition and a working upstate farm, the progressive school collapsed into bankruptcy and liquidation by 2025."},{"name":"Fort George (New York)","lat":40.8584,"lon":-73.92994,"blurb":"The name belonged to five different New York forts; the first, Dutch-built Fort Amsterdam of 1626, stood where Lower Manhattan's Custom House now sits."},{"name":"St. Spyridon Greek Orthodox Church","lat":40.848917,"lon":-73.93602,"blurb":"After the World Trade Center's collapse destroyed St. Nicholas Church on 9/11, its displaced parishioners worshiped in this Byzantine-revival Greek church."},{"name":"Trinity Chapel Complex","lat":40.743765,"lon":-73.989894,"blurb":"This 1855 Gothic chapel became the Saint Sava Serbian Orthodox Church in 1944, until a four-alarm fire gutted most of it on May Day 2016."},{"name":"42nd Street Shuttle","lat":40.754022,"lon":-73.982137,"blurb":"The subway's shortest ride carries over 100,000 people a day the 2,402 feet between Times Square and Grand Central in about 90 seconds."},{"name":"Plaza Hotel","lat":40.76446,"lon":-73.974492,"blurb":"Once owned by Conrad Hilton and Donald Trump, this chateau-style hotel revealed Plaza-logo tilework hidden under its lobby carpet for decades during a film shoot."},{"name":"Duke Ellington Circle","lat":40.796856,"lon":-73.949257,"blurb":"Renamed in 1995 for the jazz legend, the circle cradles a Duke Ellington memorial and, in 2019, welcomed the first new Museum Mile institution in decades."},{"name":"African Burial Ground National Monument","lat":40.714526,"lon":-74.004464,"blurb":"Federal construction uncovered over 400 skeletons here, part of a colonial cemetery that may hold up to 15,000 enslaved and free Africans."},{"name":"Vladeck Houses","lat":40.71272,"lon":-73.981799,"blurb":"This Lower East Side project honors Baruch Charney Vladeck, manager of the Yiddish Daily Forward and a founder of the Jewish Labor Committee."},{"name":"West Side Highway","lat":40.739233,"lon":-74.005231,"blurb":"Officially the Joe DiMaggio Highway, it replaced an elevated roadway so neglected it partially collapsed in 1973 and was torn down by 1989."},{"name":"East Coast Greenway","lat":40.779293,"lon":-73.943931,"blurb":"This 3,000-mile walking and cycling route runs from Maine to Florida; a 2000 relay carried a bottle of Key West seawater along it all the way to Canada."},{"name":"Worth Square","lat":40.742729,"lon":-73.988974,"blurb":"Besides Grant's Tomb, this is the only New York City monument that doubles as a mausoleum, the 1857 burial site of General William Jenkins Worth."},{"name":"Westfield World Trade Center","lat":40.710887,"lon":-74.010568,"blurb":"Its predecessor, the largest mall in 1970s New York and traversed by thousands daily, was buried beneath the Twin Towers and destroyed on September 11, 2001."},{"name":"Cooper Union","lat":40.729335,"lon":-73.989671,"blurb":"Founded by a workingman's son with less than a year of schooling who built America's first steam locomotive, it gave every admitted student free tuition until 2014."},{"name":"Brooklyn Banks","lat":40.711473,"lon":-74.002947,"blurb":"Called the Mecca of New York skateboarding, this brick-banked spot sits atop bridge vaults once used as 19th-century wine cellars and a Cold War nuclear bunker."},{"name":"Vessel (structure)","lat":40.753806,"lon":-74.002159,"blurb":"A $200 million honeycomb of 2,500 steps modeled on Indian stepwells, it repeatedly closed after suicides until glass barriers were installed in 2024."},{"name":"Grand Army Plaza","lat":40.764394,"lon":-73.973413,"blurb":"After publisher Joseph Pulitzer died in 1911, the whole plaza was redesigned around a memorial fountain topped by a bronze goddess Pomona."},{"name":"One Manhattan Square","lat":40.710502,"lon":-73.991237,"blurb":"Derided as a cheese grater with a separate 13-story 'poor door,' the luxury tower was still just 69% sold after over nine years of sales."},{"name":"Rockefeller Center","lat":40.75924,"lon":-73.980094,"blurb":"One of the greatest projects of the Great Depression, it was meant to house a new Metropolitan Opera that couldn't afford to move in."},{"name":"Inwood Hill Park","lat":40.87226,"lon":-73.925348,"blurb":"Home to Manhattan's largest surviving old-growth forest, it was inhabited for nearly 700 years by the Wecquaesgeek, who called it 'the sitting place.'"},{"name":"Thirteenth Avenue","lat":40.73994,"lon":-74.010649,"blurb":"Manhattan's westernmost avenue was literally removed, its landfill dug out so the Chelsea Piers could handle giants like the Lusitania and Titanic."},{"name":"Hudson River Park","lat":40.746217,"lon":-74.005184,"blurb":"Manhattan's second-largest park arose from the ashes of the cancelled Westway plan to bury an interstate highway along the Hudson."},{"name":"Bridge Apartments","lat":40.847654,"lon":-73.934846,"blurb":"Four towers housing 4,000 people rise directly atop the 12-lane Trans-Manhattan Expressway, plagued for decades by traffic noise and air pollution below."},{"name":"550 Madison Avenue","lat":40.761423,"lon":-73.973373,"blurb":"Philip Johnson's pink-granite tower, capped by a broken pediment likened to Chippendale furniture, went from AT&T's headquarters to Sony's American home."}];
  function bearingDeg(la1,lo1,la2,lo2){ var p1=la1*Math.PI/180,p2=la2*Math.PI/180,dl=(lo2-lo1)*Math.PI/180,
    y=Math.sin(dl)*Math.cos(p2), x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
    return (Math.atan2(y,x)*180/Math.PI+360)%360; }
  function cardinal(b){ return ["N","NE","E","SE","S","SW","W","NW"][Math.round(b/45)%8]; }
  var LM_RADIUS = 300;
  function nearestLandmark(lat,lon){ var best=null,bd=LM_RADIUS,here={lat:lat,lon:lon};
    for(var i=0;i<LANDMARKS.length;i++){ var lk=LANDMARKS[i];
      var d=haversine(here,{lat:lk.lat,lon:lk.lon});
      if(d<bd){bd=d;best=lk;} }
    if(best)best._d=bd; return best; }
  function nearestStation(st, ave){ var b=null,bd=Infinity; for(var i=0;i<STATIONS.length;i++){var s=STATIONS[i];
    var d=(st-s[0])*(st-s[0])+10.9*(ave-s[1])*(ave-s[1]); if(d<bd){bd=d;b=s;}} return b; }
  function bullets(lines){ return lines.map(function(l){
    return '<span class="bullet" style="background:'+(LINES[l]||"#666")+';color:'+(YELLOW[l]?"#111":"#fff")+'">'+l+'</span>';
  }).join(""); }
  function fmtCoord(s){ return d1(labelStreet(s[0])) + '<span class="x">×</span>' + d1(s[1]); }
  function subwayBearing(st, ave, s){ return Math.atan2(-(s[1]-ave)*3.3, s[0]-st) * 180 / Math.PI; }
  var FACTS = {
    "Battery Park City":"landfill from the World Trade Center dig. newest land in Manhattan.",
    "Financial District":"these streets follow old cow paths, not the grid. good luck.",
    "Two Bridges":"named for the Brooklyn and Manhattan bridges overhead.",
    "Tribeca":"TRIangle BElow CAnal. a realtor coined it in the 70s.",
    "Civic Center":"there's a gorgeous abandoned subway station under City Hall.",
    "Lower East Side":"once the most densely packed place on earth.",
    "Little Italy":"the San Gennaro feast has run here since 1926.",
    "Chinatown":"more bakeries per block than anywhere. get the egg tart.",
    "Nolita":"NOrth of Little ITAly. yes, they really named it that.",
    "Hudson Square":"the old printing district. now full of ad agencies.",
    "SoHo":"SOuth of HOuston. cast-iron facades and $28 salads.",
    "Alphabet City":"Avenues A, B, C, D. 'Avenue D, you're dead' no longer applies.",
    "Meatpacking District":"actual meat was packed here until about 2000.",
    "West Village":"the grid breaks. West 4th crosses West 10th somehow.",
    "Greenwich Village":"Dylan, the Beats, and $9 million townhouses.",
    "East Village":"CBGB was here. it's a clothing store now. sorry.",
    "Union Square":"the greenmarket's run since 1976. get the cider.",
    "Stuyvesant Town":"11,000 apartments built for returning WWII vets.",
    "Flatiron District":"the Flatiron is about 6 feet wide at its tip.",
    "Gramercy Park":"the last private park in NYC. you'll never get a key.",
    "Chelsea":"the High Line runs through it, on old freight rail.",
    "NoMad":"NOrth of MADison Square. another realtor acronym.",
    "Kips Bay":"named for Jacobus Kip's farm. the bay's long buried.",
    "Hudson Yards":"built on a platform over live rail tracks.",
    "Murray Hill":"finance bros and a suspicious number of dentists.",
    "Garment District":"still sews most of America's clothing samples.",
    "Times Square":"named for the New York Times, which moved out in 1913.",
    "Hell's Kitchen":"the name stuck; the reputation didn't. now it's brunch.",
    "Midtown East":"Grand Central's ceiling zodiac is painted backwards.",
    "Lincoln Square":"Lincoln Center replaced the old San Juan Hill blocks.",
    "Upper West Side":"Zabar's, strollers the size of cars, and Seinfeld.",
    "Manhattan Valley":"a real dip in the terrain. hence the name.",
    "Carnegie Hill":"named for Carnegie's mansion, now the Cooper Hewitt.",
    "Yorkville":"once German 'Kleindeutschland.' last beer hall closed 2014.",
    "Lenox Hill":"the hospital here delivered a lot of famous New Yorkers.",
    "Upper East Side":"old money, the Met, and doormen who quietly judge you.",
    "Central Park":"bigger than the principality of Monaco.",
    "Morningside Heights":"Columbia's turf. the cathedral is still unfinished.",
    "East Harlem":"El Barrio. a birthplace of salsa.",
    "Harlem":"the Apollo's amateur night launched Ella and Jimi.",
    "Hamilton Heights":"Hamilton's house, the Grange, got moved twice.",
    "Washington Heights":"the highest natural point on the island. and 'In the Heights.'",
    "Inwood":"the last old-growth forest in Manhattan is up here.",
    "Lower Manhattan":"the oldest part of the city. streets predate the grid.",
    "Midtown":"more office space than most whole cities.",
    "Uptown":"everything above 59th. it's a big place."
  };

  function haversine(a, b) {
    var R = 6371000, toRad = Math.PI / 180;
    var dLa = (b.lat - a.lat) * toRad, dLo = (b.lon - a.lon) * toRad;
    var la1 = a.lat * toRad, la2 = b.lat * toRad;
    var h = Math.sin(dLa / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  // Shrink the big readout so it always fits the screen width, whatever it says.
  function fitReading() {
    readingEl.style.fontSize = "";
    var avail = document.documentElement.clientWidth - 24;
    var w = readingEl.getBoundingClientRect().width;
    if (w > avail && w > 0) {
      var base = parseFloat(getComputedStyle(readingEl).fontSize);
      readingEl.style.fontSize = Math.max(30, base * avail / w) + "px";
    }
  }
  window.addEventListener("resize", fitReading);

  function onPosition(pos) {
    var lat = pos.coords.latitude, lon = pos.coords.longitude, acc = pos.coords.accuracy || 999;
    lastFixMs = Date.now();
    var r = reading(lat, lon);
    var g = toGrid(lat, lon);
    if (r.far) {
      readingEl.className = "reading suburbs"; readingEl.textContent = "THE SUBURBS";
      captionEl.textContent = "not manhattan"; hoodEl.textContent = "";
    } else {
      readingEl.className = "reading";
      readingEl.innerHTML = r.stTxt + ' <span class="x">×</span> ' + r.aveTxt;
      captionEl.textContent = "street × avenue"; hoodEl.textContent = r.hood || "";
    }
    // nearest subway: coordinate + arrow pointing toward the station + line bullets
    var stn = nearestStation(g.st, g.ave);
    subwayEl.innerHTML = '<span class="slabel">nearest subway</span>'
      + '<span class="arrow" style="transform:rotate(' + subwayBearing(g.st, g.ave, stn) + 'deg)">↑</span>'
      + '<span class="coord">' + fmtCoord(stn) + '</span>' + bullets(stn[2]);
    // "you are here" fun fact — deep-sourced landmark cameo if near one, else the neighborhood's fact
    var lm = r.far ? null : nearestLandmark(lat, lon);
    if (lm) {
      var deg = bearingDeg(lat, lon, lm.lat, lm.lon);
      var dm = Math.round(lm._d);
      var dtxt = dm < 950 ? dm + " m" : (dm / 1000).toFixed(1) + " km";
      cameoEl.className = "cameo show";
      cameoEl.innerHTML = '<span class="ctag"><span class="dirarrow" style="transform:rotate(' + Math.round(deg) + 'deg)">↑</span> '
        + cardinal(deg) + " · " + dtxt + " · " + lm.name + "</span>" + lm.blurb;
    } else {
      var hood = r.far ? neighborhood(g.ave, g.st) : (r.hood || neighborhood(g.ave, g.st));
      var fact = FACTS[hood] || null;
      if (fact) { cameoEl.className = "cameo show"; cameoEl.innerHTML = '<span class="ctag">▸ you are here</span>' + fact; }
      else { cameoEl.className = "cameo"; }
    }
    // signal quality
    var q = acc <= 15 ? "ok" : acc <= 40 ? "warn" : "bad";
    dot.className = "dot " + q;
    statusText.textContent = "GPS ±" + Math.round(acc) + " m" + (acc > 40 ? " · weak, seek open sky" : "");
    // movement → street odometer (north–south blocks, gated against GPS jitter)
    var here = { lat: lat, lon: lon };
    var step = prev ? haversine(prev, here) : 0;
    if (prev) totalMeters += step;
    prev = here;
    if (odoSt == null) odoSt = g.st;
    else if (step > 6) { streets += Math.abs(g.st - odoSt); odoSt = g.st; }
    var sN = Math.round(streets);
    meta.innerHTML = "<b>" + lat.toFixed(5) + ", " + lon.toFixed(5) + "</b>"
      + " &nbsp;·&nbsp; walked <b>" + sN + (sN === 1 ? " street" : " streets") + "</b>";
    fitReading();
  }

  function onError(err) {
    dot.className = "dot bad";
    var msg = err.code === 1 ? "Location permission denied. Enable it for this site in your browser settings, then reload."
            : err.code === 2 ? "Position unavailable. Move to open sky and wait a moment."
            : "GPS timed out, retrying…";
    statusText.textContent = msg;
  }

  function tickAge() {
    if (!lastFixMs) { ageEl.textContent = ""; return; }
    var s = Math.round((Date.now() - lastFixMs) / 1000);
    ageEl.textContent = s < 2 ? "just now" : s + "s ago";
    if (s > 8) dot.className = "dot warn";
  }
  setInterval(tickAge, 1000);

  async function keepAwake() {
    try { if ("wakeLock" in navigator) { wakeLock = await navigator.wakeLock.request("screen"); } } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") keepAwake(); });

  function start() {
    if (!("geolocation" in navigator)) {
      dot.className = "dot bad";
      statusText.textContent = "this browser has no GPS support";
      return;
    }
    statusText.textContent = "acquiring GPS…";
    keepAwake();
    watchId = navigator.geolocation.watchPosition(onPosition, onError,
      { enableHighAccuracy: true, maximumAge: 1500, timeout: 20000 });
  }
  // wake-lock needs a gesture, so grab it on first touch; GPS starts immediately
  document.addEventListener("pointerdown", function once() { keepAwake(); document.removeEventListener("pointerdown", once); });
  start();
})();
</script>
